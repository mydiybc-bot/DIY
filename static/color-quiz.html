function $(id) { return document.getElementById(id); }
function L() { return T[S.lang]; }
function show(id) { ['scrIntro', 'scrQ', 'scrR'].forEach(function (x) { $(x).classList.toggle('on', x === id); }); window.scrollTo(0, 0); }
function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.tm); toast.tm = setTimeout(function () { t.classList.remove('on'); }, 2200); }
function storeLabel() { return STORE_NO ? STORES[STORE_NO][S.lang === 'en' ? 1 : 0] : ''; }

function paintStatic() {
  var t = L();
  document.documentElement.lang = S.lang === 'en' ? 'en' : 'zh-Hant';
  $('btnLang').textContent = t.lang;
  $('shopName').textContent = storeLabel();
  $('tTitle').textContent = t.title; $('tLead').innerHTML = t.lead; $('btnStart').textContent = t.start; $('tNote').innerHTML = t.note;
  $('btnBack').textContent = t.back; $('tSwitch').textContent = t.sw; $('btnAgain').textContent = t.again; $('btnShare').textContent = t.share; $('tShot').textContent = t.shot;
}
function paintQ() {
  var q = QUESTIONS[S.i], t = L(), box = $('qOpts');
  $('qNo').textContent = t.qno(S.i + 1);
  $('qBar').style.width = (S.i / 6 * 100) + '%';
  $('btnBack').hidden = S.i === 0;
  $('qTitle').textContent = q[S.lang];
  box.innerHTML = '';
  q.o.forEach(function (op) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'opt' + (S.ans[S.i] === op[0] ? ' sel' : '');
    b.textContent = S.lang === 'en' ? op[2] : op[1];
    b.onclick = function () { answer(op[0], b); };
    box.appendChild(b);
  });
}
var busy = false;
function answer(c, el) {
  if (busy) return; busy = true;
  el.classList.add('sel');
  S.ans[S.i] = c;
  setTimeout(function () {
    busy = false;
    if (S.i < 5) { S.i++; paintQ(); window.scrollTo(0, 0); }
    else finish();
  }, 220);
}
function finish() {
  S.ans = S.ans.slice(0, 6);
  S.res = score(S.ans); S.shown = S.res.main;
  S.id = 'cq' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  log({ kind: 'result', main: S.res.main, sub: S.res.sub, ans: S.ans.join('') });
  paintR(); show('scrR');
}
function paintR() {
  /* 換成別的顏色時：副色改成原本測出的主色 */
  var c = S.shown, sub = c === S.res.main ? S.res.sub : S.res.main, ty = TYPES[c][S.lang], st = TYPES[sub][S.lang], t = L();
  $('rBand').style.background = 'linear-gradient(180deg,' + HEX[c] + ',rgba(255,255,255,0))';
  $('rTag').textContent = t.tag;
  $('rName').textContent = ty[0];
  $('rDesc').textContent = ty[2];
  $('rSw').innerHTML = '<div><i style="background:' + HEX[c] + '"></i>' + t.main + '・' + ty[1] + '</div><div><i style="background:' + HEX[sub] + '"></i>' + t.sub + '・' + st[1] + '</div>';
  $('rSvg').innerHTML = pipeSvg(c);
  $('rPipeT').textContent = t.pipeT; $('rPipe').textContent = ty[3];
  $('rHow').innerHTML = t.how(ty[1], st[1]).map(function (x) { return '<li>' + x + '</li>'; }).join('');
  $('rHash').textContent = HASHTAG;
  $('rShop').textContent = t.shopPre + (storeLabel() || (S.lang === 'en' ? 'DIYBC' : '自己做'));
  var pk = $('pick'); pk.innerHTML = '';
  ORDER.forEach(function (k) {
    var b = document.createElement('button'); b.type = 'button'; b.style.background = HEX[k]; b.title = TYPES[k][S.lang][1]; b.setAttribute('aria-label', TYPES[k][S.lang][0]);
    if (k === c) b.className = 'cur';
    b.onclick = function () { if (k === S.shown) return; S.shown = k; paintR(); if (k !== S.res.main) log({ kind: 'switch', main: k }); };
    pk.appendChild(b);
  });
}

/* ---------- 紀錄（送不出去不影響客人） ---------- */
function apiPost(body) {
  function direct() {
    return fetch(API, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit' }).then(function (r) { return r.json(); });
  }
  if (!PROXY) return direct();
  return fetch(PROXY, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' }, cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('proxy ' + r.status); return r.json(); })
    .then(function (d) { if (!d || d.ok === false && !d.code) throw new Error('bad'); return d; })
    .catch(function () { return direct(); });
}
function log(o) {
  var body = { action: 'quiz_log', id: S.id, kind: o.kind, main: o.main, sub: o.sub || '', ans: o.ans || '', store_no: STORE_NO, lang: S.lang, src: QS.src || 'qr', ua: (navigator.userAgent || '').slice(0, 160) };
  var n = 0;
  (function go() { apiPost(body).then(function (d) { window.__lastLog = d; }).catch(function () { if (++n < 3) setTimeout(go, 3000 * n); }); })();
}

/* ---------- 按鈕 ---------- */
$('btnLang').onclick = function () { S.lang = S.lang === 'en' ? 'zh' : 'en'; paintStatic(); if ($('scrQ').classList.contains('on')) paintQ(); if ($('scrR').classList.contains('on')) paintR(); };
$('btnStart').onclick = function () { S.i = 0; S.ans = []; paintQ(); show('scrQ'); };
$('btnBack').onclick = function () { if (S.i > 0) { S.i--; paintQ(); } };
$('btnAgain').onclick = function () { S.i = 0; S.ans = []; S.res = null; paintQ(); show('scrQ'); };
$('btnShare').onclick = function () {
  var text = L().shareText(TYPES[S.shown][S.lang][0]);
  if (navigator.share) { navigator.share({ text: text }).catch(function () {}); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(L().copied); }, function () { toast(text); });
  else toast(text);
};
paintStatic();
</script>
</body>
</html>
