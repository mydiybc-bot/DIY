<!DOCTYPE html>
<!-- 🗳 門市內部調查（2026-10-30 建）
     填寫：poll.html?p=<調查代號>（例：?p=pipingbag 擠花袋使用狀況）
     結果：poll.html?p=<調查代號>&view=result（各店最新一筆＋還沒填的店）
     題目設定在 GAS 資料庫 dim_poll，由總部「🗳 門市問卷管理」（dashboard-poll.html）新增／編輯；這頁照設定畫。
     ?preview=1：管理頁右邊的預覽（postMessage 'poll-preview' 傳題目；不讀 GAS、不送出）；&embed=1：嵌在管理頁裡，藏頁首。
     輸入框只建一次、打字不重畫（中文輸入規則），已加 IME-GUARD。 -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<script>
/* ===== IME-GUARD（2026-10-17 晚，經營者：新品申請表的搜尋框打不出中文，「全部測試、確保正常」）=====
   病因：注音／倉頡選字時，每按一個鍵瀏覽器就送一次 input；各分頁的 oninput 一收到就重畫，把正在選字的輸入框換掉。
   做法（整頁共用，不用逐一改各分頁）：
   ①選字中（compositionstart～compositionend，或事件帶 isComposing）的 input／keydown／keyup 在最外層攔下，各分頁的程式收不到
   ②選完字（compositionend）補送一次 input，各分頁照常收到「最後打好的字」
   ③window.__ime.on＝現在是否在選字；有延遲重畫的地方（例：BOM 搜尋 250ms 後重畫）重畫前先看它，選字中就不重畫 */
window.__ime=(function(){
  var st={on:false};
  function isTyping(t){return t&&(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&!/^(checkbox|radio|button|submit|file|range|color|date|time|datetime-local|month|week|hidden|image|reset)$/i.test(t.type||'')))}
  document.addEventListener('compositionstart',function(e){if(isTyping(e.target))st.on=true},true);
  document.addEventListener('compositionend',function(e){st.on=false;var t=e.target;if(!isTyping(t))return;
    setTimeout(function(){try{t.dispatchEvent(new Event('input',{bubbles:true}))}catch(_){}},0)},true);
  ['input','keydown','keyup','keypress'].forEach(function(type){
    document.addEventListener(type,function(e){if(!isTyping(e.target))return;
      if(type==='input'&&st.on&&!e.isComposing&&e.inputType&&!/Composition/.test(e.inputType))st.on=false;   /* 保險：選字被取消、沒收到 compositionend → 一般打字照常 */
      if(e.isComposing||st.on||(type!=='input'&&e.keyCode===229))e.stopImmediatePropagation()},true)});
  document.addEventListener('focusout',function(e){if(isTyping(e.target))st.on=false},true);
  window.addEventListener('blur',function(){st.on=false});
  return st;
})();
</script>
<!-- 2026-10-17 全站中文輸入保護：上面這段 IME-GUARD 與 dashboard-recipe.html 一字不差（檢查：python3 tools/check_ime_guard.py）。要改就全站一起改，不要只改一頁。 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>門市內部調查｜自己做烘焙聚樂部</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:#FFF8EC;color:#40210F;line-height:1.55;font-size:16px}
  button,input,textarea{font-family:inherit;font-size:16px}
  .top{position:sticky;top:0;z-index:5;background:#FDD35D;padding:.7rem 1rem .6rem;box-shadow:0 2px 8px rgba(64,33,15,.15)}
  .top h1{margin:0;font-size:1.2rem;font-weight:900}
  .top .sub{font-size:.85rem;opacity:.85;margin-top:.15rem}
  .dsb{font-size:12px;color:#8A6F5E;padding:.35rem 1rem;background:#FFF1D6;border-bottom:1px solid #F1E3C8}
  main{max-width:44rem;margin:0 auto;padding:1rem 1rem 6rem}
  .intro{background:#fff;border-left:5px solid #E8822B;border-radius:.6rem;padding:.8rem 1rem;margin-bottom:1rem;font-size:.95rem}
  .q{background:#fff;border:1px solid #F1E3C8;border-radius:.9rem;padding:.9rem 1rem;margin:0 0 .8rem;scroll-margin-top:5.5rem}
  .q.miss{border-color:#D9534F;box-shadow:0 0 0 3px rgba(217,83,79,.18)}
  .q.hide{display:none}
  .q h2{margin:0 0 .55rem;font-size:1.05rem}
  .q h2 .req{color:#D9534F;font-size:.85rem;margin-left:.2rem}
  .hint{font-size:.85rem;color:#8A6F5E;margin:-.3rem 0 .55rem}
  .opts{display:flex;flex-wrap:wrap;gap:.5rem}
  .opt{border:2px solid #E6D2A8;background:#FFFDF7;color:#40210F;border-radius:999px;padding:.5rem 1rem;font-weight:700;min-height:2.7rem;cursor:pointer;text-align:left}
  .opt.on{background:#FDD35D;border-color:#E8A200}
  .opt.on::before{content:'✓ ';font-weight:900}
  input[type=text],input[type=number],textarea{width:100%;border:2px solid #E6D2A8;border-radius:.6rem;padding:.6rem .75rem;background:#FFFDF7;color:#40210F}
  textarea{min-height:5.5rem;resize:vertical}
  .num{display:flex;align-items:center;gap:.5rem}.num input{max-width:12rem}.num span{font-weight:700}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #F1E3C8;padding:.7rem 1rem;display:flex;gap:.7rem;align-items:center;justify-content:center}
  .btn{border:0;border-radius:999px;background:#E8822B;color:#fff;font-weight:900;padding:.75rem 2rem;cursor:pointer;font-size:1.05rem}
  .btn[disabled]{opacity:.55;cursor:wait}
  .btn.ghost{background:#fff;color:#40210F;border:2px solid #E6D2A8}
  .msg{font-size:.9rem;color:#D9534F}
  .done{text-align:center;padding:3rem 1rem}.done .big{font-size:3rem}
  .back{display:inline-block;margin:.6rem 0;color:#8A6F5E;font-size:.9rem;text-decoration:none}
  /* 結果 */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.6rem;margin-bottom:1rem}
  .card{background:#fff;border:1px solid #F1E3C8;border-radius:.8rem;padding:.7rem .8rem}
  .card b{display:block;font-size:1.5rem}.card small{color:#8A6F5E}
  .tw{overflow-x:auto;background:#fff;border:1px solid #F1E3C8;border-radius:.8rem}
  table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:44rem}
  th,td{padding:.45rem .55rem;border-bottom:1px solid #F5EBD8;text-align:left;vertical-align:top}
  th{background:#FFF1D6;white-space:nowrap}
  tr.none td{color:#B39A88}
  .tag{display:inline-block;border-radius:999px;padding:0 .55rem;font-size:.8rem;font-weight:700}
  .t0{background:#E5F4EA;color:#2F8F5B}.t1{background:#FFF1C2;color:#8A6200}.t2{background:#FFE0CC;color:#B4530B}.t3{background:#FADBD8;color:#B03A2E}
  h3{margin:1.2rem 0 .5rem;font-size:1rem}
  body.embed .top,body.embed .dsb{display:none}
  .closed{background:#FADBD8;color:#B03A2E;border-radius:.6rem;padding:.7rem 1rem;font-weight:700;margin-bottom:1rem}
</style>
</head>
<body>
<div class="top"><h1 id="ttl">門市內部調查</h1><div class="sub" id="sub">自己做烘焙聚樂部・體驗中心</div></div>
<div class="dsb" id="dsb">讀取中…</div>
<main id="main"><p>讀取中…</p></main>

<script>
var API = 'https://script.google.com/macros/s/AKfycbxrsYaYLdXqjUeGvG8_CZ--5znw5izXr6tcgmfC0MbJ32T1KY_TS8UkVqimxS2Jajx0/exec';
var QS = (function () { var o = {}; location.search.replace(/^\?/, '').split('&').forEach(function (kv) { if (!kv) return; var i = kv.indexOf('='); o[decodeURIComponent(i < 0 ? kv : kv.slice(0, i))] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); }); return o; })();
if (QS.api) API = QS.api;
var PROXY = API.replace(/^https:\/\/script\.google\.com\/macros\/s\/(AKfycb[\w-]+)\/exec$/, '/api/gas/$1');
if (PROXY === API) PROXY = API.charAt(0) === '/' ? API : '';
var PID = QS.p || 'pipingbag';
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }

/* 讀：自家代轉 → 直連 JSONP */
function apiGet(qs) {
  function direct() {
    return new Promise(function (ok, no) {
      var name = '__pl' + Math.random().toString(36).slice(2), s = document.createElement('script'), tm = setTimeout(function () { done(); no(new Error('timeout')); }, 25000);
      function done() { clearTimeout(tm); try { delete window[name]; } catch (e) { window[name] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
      window[name] = function (d) { done(); ok(d); };
      s.src = API + '?' + qs + '&callback=' + name + '&_=' + Date.now(); s.onerror = function () { done(); no(new Error('net')); };
      document.head.appendChild(s);
    });
  }
  if (!PROXY) return direct();
  return fetch(PROXY + '?' + qs, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('proxy ' + r.status); return r.json(); }).catch(direct);
}
/* 寫：自家代轉 → 直連 */
function apiPost(body) {
  function direct() { return fetch(API, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit' }).then(function (r) { return r.json(); }); }
  if (!PROXY) return direct();
  return fetch(PROXY, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' }, cache: 'no-store' })
    .then(function (r) { if (r.status === 404) throw new Error('proxy-404'); return r.json(); }).catch(direct);
}

/* ================= 填寫 ================= */
var S = { poll: null, a: {}, id: '', busy: false, preview: false };
function newId() { return 'pl' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
function shown(f) {
  if (!f.cond) return true;
  var v = S.a[f.cond.k]; if (!v || (Array.isArray(v) && !v.length)) return false;
  var arr = Array.isArray(v) ? v : [v];
  return f.cond.vals.some(function (x) { return arr.indexOf(x) >= 0; });
}
function applyCond() {   /* 只切換顯示，不重畫輸入框 */
  S.poll.fields.forEach(function (f) { var el = $('f_' + f.k); if (el) el.classList.toggle('hide', !shown(f)); });
}
function renderForm() {
  var p = S.poll, h = (p.status === 'closed' ? '<div class="closed">這份調查已經結束收件，謝謝大家！</div>' : '') + (p.intro ? '<div class="intro">' + esc(p.intro).replace(/\n/g, '<br>') + '</div>' : '');
  p.fields.forEach(function (f) {
    h += '<section class="q" id="f_' + f.k + '"><h2>' + esc(f.title) + (f.required ? '<span class="req">＊必填</span>' : '') + '</h2>';
    if (f.hint) h += '<div class="hint">' + esc(f.hint) + '</div>';
    if (f.type === 'single' || f.type === 'multi') {
      h += '<div class="opts">' + f.options.map(function (o) { return '<button type="button" class="opt" data-k="' + f.k + '" data-v="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') + '</div>';
    } else if (f.type === 'number') {
      h += '<div class="num"><input type="number" inputmode="numeric" min="0" step="1" data-k="' + f.k + '" placeholder="例：120"><span>' + esc(f.unit || '') + '</span></div>';
    } else if (f.long) {
      h += '<textarea data-k="' + f.k + '" maxlength="' + (f.max || 500) + '"></textarea>';
    } else {
      h += '<input type="text" data-k="' + f.k + '" maxlength="' + (f.max || 200) + '">';
    }
    h += '</section>';
  });
  h += '<div class="msg" id="err"></div><a class="back" href="?p=' + encodeURIComponent(PID) + '&view=result">📊 看各店填寫結果</a>';
  $('main').innerHTML = h;
  if (!$('bar')) $('main').insertAdjacentHTML('afterend', '<div class="bar" id="bar"><button class="btn" type="button" id="send">送出</button></div>');
  if (p.status === 'closed' || S.preview) { $('send').disabled = true; $('send').textContent = S.preview ? '預覽（不會送出）' : '已結束收件'; }
  $('main').addEventListener('click', function (e) { var b = e.target.closest('.opt'); if (b) pick(b.dataset.k, b.dataset.v); });
  $('main').addEventListener('input', function (e) { var k = e.target.dataset && e.target.dataset.k; if (k) { S.a[k] = e.target.value; $('f_' + k).classList.remove('miss'); } });
  if (S.preview) return applyCond();   /* 預覽：可以點來看條件題，但不預選店、不送出 */
  var last = lsGet('pl:store');
  if (last && p.fields[0].options.indexOf(last) >= 0) pick('store', last);
  $('send').addEventListener('click', send);
  applyCond();
}
function renderFormPreview() {   /* 預覽每次整頁重畫沒關係：預覽頁沒人在打字 */
  var m = $('main').cloneNode(false); $('main').parentNode.replaceChild(m, $('main')); renderForm();
}
function pick(k, v) {
  var f = S.poll.fields.filter(function (x) { return x.k === k; })[0];
  if (f.type === 'multi') {
    var arr = S.a[k] || []; var i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); S.a[k] = arr;
  } else S.a[k] = v;
  var cur = S.a[k];
  document.querySelectorAll('.opt[data-k="' + k + '"]').forEach(function (b) { b.classList.toggle('on', Array.isArray(cur) ? cur.indexOf(b.dataset.v) >= 0 : cur === b.dataset.v); });
  $('f_' + k).classList.remove('miss');
  applyCond();
}
function send() {
  if (S.busy || S.preview || S.poll.status === 'closed') return;
  var miss = [];
  document.querySelectorAll('.q.miss').forEach(function (el) { el.classList.remove('miss'); });
  S.poll.fields.forEach(function (f) {
    if (!shown(f)) return;
    var v = S.a[f.k], ok = Array.isArray(v) ? v.length : (v != null && String(v).trim() !== '');
    if (f.type === 'number' && ok && !/^\d+$/.test(String(v).trim())) { miss.push(f); return; }
    if (f.required && !ok) miss.push(f);
  });
  if (miss.length) {
    miss.forEach(function (f) { $('f_' + f.k).classList.add('miss'); });
    $('err').textContent = '還有 ' + miss.length + ' 題沒填好：' + miss.map(function (f) { return f.title; }).join('、');
    $('f_' + miss[0].k).scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  var a = {};
  S.poll.fields.forEach(function (f) { if (shown(f)) a[f.k] = S.a[f.k] == null ? '' : S.a[f.k]; });
  S.busy = true; $('send').disabled = true; $('send').textContent = '送出中…'; $('err').textContent = '';
  apiPost({ action: 'poll_submit', p: PID, id: S.id, a: a, ua: navigator.userAgent.slice(0, 160) }).then(function (d) {
    if (!d || !d.ok) throw new Error((d && d.msg) || '送出失敗');
    lsSet('pl:store', S.a.store || '');
    $('bar').remove();
    $('main').innerHTML = '<div class="done"><div class="big">✅</div><h2>已送出，謝謝！</h2><p>' + esc(S.a.store || '') + ' 的回覆已送到體驗中心。</p>' +
      '<p><a class="back" href="?p=' + encodeURIComponent(PID) + '&view=result">📊 看各店填寫結果</a>　<a class="back" href="?p=' + encodeURIComponent(PID) + '">✏️ 再填一份（會以最新一筆為準）</a></p></div>';
    window.scrollTo(0, 0);
  }).catch(function (e) {
    S.busy = false; $('send').disabled = false; $('send').textContent = '送出';
    $('err').textContent = '沒有送出：' + (e.message || e) + '。請檢查網路後再按一次送出（填好的內容還在）。';
  });
}

/* ================= 結果 ================= */
var TAG = { '尚未遇到': 't0', '偶爾': 't1', '多次': 't2', '頻繁': 't3' };
function renderResult(d) {
  var p = d.poll, rows = d.rows || [], latest = {};
  rows.forEach(function (r) { latest[r.store] = r; });   /* 舊→新，留最後一筆 */
  var fs = p.fields.filter(function (f) { return f.k !== 'store'; });
  var done = d.stores.filter(function (s) { return latest[s[1]]; }), notyet = d.stores.filter(function (s) { return !latest[s[1]]; });
  var h = '<a class="back" href="?p=' + encodeURIComponent(PID) + '">✏️ 去填寫</a>';
  h += '<div class="cards"><div class="card"><small>已回覆</small><b>' + done.length + ' / ' + d.stores.length + '</b><small>店</small></div>';
  var stock = done.reduce(function (t, s) { return t + (Number(latest[s[1]].stock) || 0); }, 0);
  if (p.fields.some(function (f) { return f.k === 'stock'; })) h += '<div class="card"><small>已回覆店庫存合計</small><b>' + stock.toLocaleString() + '</b><small>個</small></div>';
  var ff = p.fields.filter(function (f) { return f.k === 'freq'; })[0];
  if (ff) ff.options.forEach(function (o) { var n = done.filter(function (s) { return latest[s[1]].freq === o; }).length; h += '<div class="card"><small>破損：' + esc(o) + '</small><b>' + n + '</b><small>店</small></div>'; });
  h += '</div>';
  var pf = p.fields.filter(function (f) { return f.k === 'pos'; })[0];
  if (pf) {
    h += '<h3>破損位置（有破損的店，可複選）</h3><div class="cards">';
    pf.options.forEach(function (o) { var n = done.filter(function (s) { return String(latest[s[1]].pos || '').split('|').indexOf(o) >= 0; }).length; h += '<div class="card"><small>' + esc(o) + '</small><b>' + n + '</b><small>店</small></div>'; });
    h += '</div>';
  }
  if (notyet.length) h += '<p class="msg">還沒填：' + notyet.map(function (s) { return esc(s[1]); }).join('、') + '</p>';
  h += '<h3>各店最新回覆</h3><div class="tw"><table><thead><tr><th>店別</th><th>填寫時間</th>' + fs.map(function (f) { return '<th>' + esc(f.title.replace(/（.*?）|？/g, '')) + '</th>'; }).join('') + '</tr></thead><tbody>';
  d.stores.forEach(function (s) {
    var r = latest[s[1]];
    if (!r) { h += '<tr class="none"><td>' + esc(s[1]) + '</td><td colspan="' + (fs.length + 1) + '">尚未填寫</td></tr>'; return; }
    h += '<tr><td><b>' + esc(s[1]) + '</b></td><td>' + esc(r.time) + '</td>' + fs.map(function (f) {
      var v = r[f.k]; if (f.k === 'freq' && v) return '<td><span class="tag ' + (TAG[v] || '') + '">' + esc(v) + '</span></td>';
      return '<td>' + esc(String(v == null ? '' : v).split('|').join('、')) + '</td>';
    }).join('') + '</tr>';
  });
  h += '</tbody></table></div><p class="hint" style="margin-top:.6rem">同一家店填過多次只顯示最新一筆；全部紀錄留在資料庫試算表 poll_' + esc(p.id) + ' 分頁。共 ' + rows.length + ' 筆。</p>';
  $('main').innerHTML = h;
}

/* ================= 啟動 ================= */
function start() {
  if (QS.embed) document.body.classList.add('embed');
  if (QS.preview) {   /* 管理頁預覽：題目由 postMessage 傳進來，店員看到的樣子 */
    S.preview = true; $('dsb').textContent = '預覽：不會送出';
    $('main').innerHTML = '<p>在左邊編輯題目，這裡會即時顯示店員看到的樣子。</p>';
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin || !e.data || e.data.type !== 'poll-preview') return;
      var y = window.scrollY; S.poll = e.data.poll; S.a = {}; $('ttl').textContent = '🗳 ' + (S.poll.title || '（還沒取名）');
      renderFormPreview(); window.scrollTo(0, y);
    });
    if (window.parent !== window) window.parent.postMessage({ type: 'poll-preview-ready' }, location.origin);
    return;
  }
  var isRes = QS.view === 'result';
  apiGet('action=' + (isRes ? 'poll_result' : 'poll_form') + '&p=' + encodeURIComponent(PID)).then(function (d) {
    if (!d || !d.ok) throw new Error((d && d.msg) || '讀不到調查');
    $('ttl').textContent = (isRes ? '📊 ' : '🗳 ') + d.poll.title + (isRes ? '｜結果' : '');
    document.title = d.poll.title + '｜自己做烘焙聚樂部';
    $('dsb').textContent = isRes ? '資料更新：' + d.at + '（重新整理頁面看最新）' : '資料直接送到體驗中心；同一家店可重填，以最新一筆為準';
    if (isRes) renderResult(d); else { S.poll = d.poll; S.id = newId(); renderForm(); }
  }).catch(function (e) {
    $('dsb').textContent = '讀取失敗';
    $('main').innerHTML = '<p class="msg">讀取失敗：' + esc(e.message || e) + '。請重新整理頁面，還是不行請聯絡體驗中心。</p>';
  });
}
start();
</script>
</body>
</html>
