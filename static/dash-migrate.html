<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>前往儀表板…</title>
<!--
  2026-11-08 儀表板搬到靜態網站 diybc-dash：接收舊網址（dash-handoff.html）帶過來的瀏覽器記憶，
  寫進新網址這邊（已經有的不覆蓋），再轉到原本要開的那一頁。
  安全：只接受從舊網址轉過來的（看來源網址），而且每台裝置只接收一次；要去的頁面只能是本站路徑。
-->
</head>
<body style="font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;padding:24px;color:#666">
前往儀表板…
<script>
(function () {
  var OLD = 'https://diybc-training.onrender.com';
  var FLAG = '__migrated_from_training';
  var next = '/static/hub.html';
  try {
    var o = JSON.parse(decodeURIComponent(location.hash.slice(1)));
    if (o && typeof o.next === 'string' && /^\/(?![\/\\])/.test(o.next)) next = o.next;
    var fromOld = (document.referrer || '').indexOf(OLD + '/') === 0;
    if (o && o.data && fromOld && !localStorage.getItem(FLAG)) {
      Object.keys(o.data).forEach(function (k) {
        if (localStorage.getItem(k) === null) {
          try { localStorage.setItem(k, String(o.data[k])); } catch (e) {}
        }
      });
      localStorage.setItem(FLAG, String(Date.now()));
    }
  } catch (e) { /* 內容壞掉就直接去首頁或原頁 */ }
  location.replace(next);
})();
</script>
</body>
</html>
