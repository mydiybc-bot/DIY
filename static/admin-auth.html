<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>權限管理後台｜自己做烘焙聚樂部</title>
<!-- v1.1：列表加「錯誤數／解鎖」欄（對應 GAS admin_unlock），涵蓋 pnl/monthly -->
<!-- v1.2 2026-07-30：修正過期說明文字（原稱 pnl/月會仍走 PWD_B，實際已納管） -->
<!-- v1.3 2026-10-02：加入全站共用 AUTH-CORE v2；登入／重新載入列表（admin_list，唯讀）改為慢或 404 自動補發＋開頁預熱；儲存、解鎖、改管理密碼（寫入）仍只送一次 -->
<!-- 2026-07-30 v1：10 個儀表板密碼集中管理（讀寫「權限中心」GAS／dim_auth）。
     本頁不放任何密碼；管理密碼僅存在記憶體，關頁即清。變更紀錄見 Sheet 的 auth_log 分頁。 -->
<style>
:root{--dark:#4A3228;--brown:#7B4B36;--sub:#6F4E45;--bg:#F7F1EC;--line:#E4D6CC;--red:#C43030;--green:#2D7A55}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--dark)}
header{background:var(--dark);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header a.home{color:#fff;text-decoration:none;font-weight:700;font-size:13px;white-space:nowrap}
header h1{font-size:18px;margin:0;font-weight:800}
.wrap{max-width:860px;margin:0 auto;padding:18px 14px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.hint{font-size:12px;color:var(--sub);line-height:1.6}
input,select,button{font-family:inherit;font-size:14px}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--dark)}
button{padding:8px 14px;border:none;border-radius:8px;background:var(--brown);color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
button.ghost{background:#fff;color:var(--brown);border:1px solid var(--brown)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#F1E7DF;color:var(--sub);text-align:left;padding:8px 6px;font-size:12px;white-space:nowrap}
td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:middle}
td input.pwd{width:130px}
td input.ttl{width:58px}
.eye{background:none;border:none;color:var(--sub);cursor:pointer;padding:2px 4px;font-size:14px}
.msg{font-size:12px;min-height:16px;margin-top:8px}
.msg.ok{color:var(--green)} .msg.err{color:var(--red)}
.name b{font-size:14px} .name .id{font-size:12px;color:var(--sub)}
.updated{font-size:12px;color:var(--sub);white-space:nowrap}
#panel{display:none}
@media(max-width:640px){
  .hidecol{display:none}
  td input.pwd{width:110px}
}
</style>
</head>
<body>
<header>
  <a href="hub.html" class="home">⬅ 回首頁</a>
  <h1>🔐 權限管理後台</h1>
  <span style="font-size:12px;opacity:.85">每個儀表板獨立密碼（含 P&L／月會）｜改密碼後「新登入」立即生效</span>
</header>
<div class="wrap">

  <!-- 登入 -->
  <div class="card" id="login">
    <div style="font-weight:800;margin-bottom:8px">管理密碼</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input type="password" id="admPwd" placeholder="輸入管理密碼（dim_auth 的 __admin__ 列）" style="flex:1;min-width:220px" autocomplete="new-password" name="pw-admin" data-lpignore="true" data-1p-ignore>
      <button id="loginBtn" onclick="doLogin()">登入</button>
    </div>
    <div class="msg" id="loginMsg"></div>
    <div class="hint" style="margin-top:6px">管理密碼僅暫存於本頁記憶體，重新整理或關閉即需重新輸入。</div>
  </div>

  <!-- 主面板 -->
  <div id="panel">
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
        <div style="font-weight:800">儀表板密碼一覽</div>
        <button class="ghost" onclick="loadList()">🔄 重新載入</button>
        <span class="hint">已登入者最長用到其 TTL 到期；停用（N）則新登入一律擋下。</span>
      </div>
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>儀表板</th><th>密碼</th><th>TTL(時)</th><th>啟用</th><th>錯誤數</th>
          <th class="hidecol">最後更新</th><th class="hidecol">備註</th><th></th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
      </div>
      <div class="msg" id="listMsg"></div>
    </div>

    <div class="card">
      <div style="font-weight:800;margin-bottom:8px">變更管理密碼</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input type="password" id="newAdmPwd" placeholder="新的管理密碼" style="flex:1;min-width:200px">
        <button onclick="changeAdmin()">更新管理密碼</button>
      </div>
      <div class="msg" id="admMsg"></div>
      <div class="hint" style="margin-top:6px">更新成功後，本頁會登出並要求以新密碼重新登入。</div>
    </div>

    <div class="hint">歷史紀錄（誰時候驗證成功／失敗、後台改了什麼）：見權限中心 Sheet 的 <b>auth_log</b> 分頁。<br>
    11 個儀表板皆由本後台管控（含 P&L／月會）；hub 的 PWD_A／PWD_B 已於 2026-07-30 全數移除。</div>
  </div>
</div>

<script>
/* ===== AUTH-CORE v2 BEGIN（權限中心連線核心，2026-10-02 待處理事項 1002 #3）=====
   全站 12 頁共用（hub、10 個儀表板、admin-auth），本段一字不差；要改就全部一起改，改完跑比對（見 auth-center skill）。
   ① 驗證自動重試：第 1 發 6 秒沒回 → 並行補第 2 發；14 秒再補第 3 發；某一發被 Google 回 404／伺服器錯 → 0.7 秒後補下一發。
      先回來的有效答案為準，晚到的自動丟掉；每按一次最多 3 發、最多等 32 秒。
      「密碼錯誤／已停用／查無／嘗試次數過多」是明確答案 → 立刻停，不再補發（防暴力鎖定 15 次／10 分鐘）。
   ② 預熱：閘門一出現先 ping（全站含其他分頁 90 秒只敲一次，__auth_ping_ts），8 秒沒回應或失敗再補一次。
   ③ 儲存：登入紀錄寫不進去（瀏覽器空間被暫存塞滿）→ 先刪各儀表板「可重抓的暫存」（從最大的刪起）再寫；
      還是不行 → 改存這個分頁（sessionStorage）→ 再不行只放行這一次。登入、草稿、設定一律不刪。
   緊急繞過格式不變：localStorage dash_auth_<id> = {exp}；hub_unlocked = 時間戳。 */
(function(){
  if (window.__dashAuth) return;
  var AUTH_API = 'https://script.google.com/macros/s/AKfycbyQ9LWY74Ix8VBe1gDoMdSF5eH74ratL7_f0EUUHi37IH3bXhkIJMx4WB2I-c-MLsWtLQ/exec';
  var CACHE_RE = /^(dpc:|pnlc1:)|^(pos_cache_v2|resv_pos_net_v1|resv_revisit_monthly_v1|dec_bundle_v1)$/;   /* 只列可重抓的暫存 */
  var FINAL_RE = /密碼錯誤|已停用|查無|嘗試次數過多|缺少參數|不允許|unknown action/;            /* 明確答案：不重試 */
  var PING_KEY = '__auth_ping_ts', MEM = {};
  function noop(){}
  function rid(){ return Date.now().toString(36) + Math.floor(Math.random() * 1e8).toString(36); }
  function ls(){ try { return window.localStorage || null; } catch(_){ return null; } }
  function ss(){ try { return window.sessionStorage || null; } catch(_){ return null; } }
  function get(k){
    var v = null, l = ls(), s = ss();
    try { if (l) v = l.getItem(k); } catch(_){}
    if (v == null) { try { if (s) v = s.getItem(k); } catch(_){} }
    if (v == null && Object.prototype.hasOwnProperty.call(MEM, k)) v = MEM[k];
    return v;
  }
  function del(k){
    var l = ls(), s = ss();
    try { if (l) l.removeItem(k); } catch(_){}
    try { if (s) s.removeItem(k); } catch(_){}
    delete MEM[k];
  }
  function setLocal(k, v){ var l = ls(); if (!l) return false; try { l.setItem(k, v); return true; } catch(_){ return false; } }
  function evict(k, v){   /* 空間滿：從最大的暫存刪起，每刪一筆就再試寫一次 */
    var l = ls(), list = [], i;
    if (!l) return false;
    try { for (i = 0; i < l.length; i++) { var x = l.key(i); if (x && CACHE_RE.test(x)) list.push([x, (l.getItem(x) || '').length]); } } catch(_){ return false; }
    list.sort(function(a, b){ return b[1] - a[1]; });
    for (i = 0; i < list.length; i++) {
      try { l.removeItem(list[i][0]); } catch(_){}
      if (setLocal(k, v)) return true;
    }
    return false;
  }
  function put(k, v){   /* 回傳存到哪裡：'local'／'session'／'memory' */
    var s = ss(), l;
    v = String(v);
    if (setLocal(k, v) || evict(k, v)) { try { if (s) s.removeItem(k); } catch(_){} delete MEM[k]; return 'local'; }
    try { l = ls(); if (l) l.removeItem(k); } catch(_){}
    try { if (s) { s.setItem(k, v); delete MEM[k]; return 'session'; } } catch(_){}
    MEM[k] = v; return 'memory';
  }
  function jsonp(qs, onData, onFail){   /* 送一發；回傳「收掉這一發」的函式（之後晚到的回應被吃掉，不報錯） */
    var name = '__ac' + rid(), s = document.createElement('script'), over = false;
    function end(){ if (over) return false; over = true; window[name] = noop; if (s.parentNode) s.parentNode.removeChild(s); return true; }
    window[name] = function(d){ if (end()) onData(d); };
    s.onerror = function(){ if (end()) onFail(); };
    s.src = AUTH_API + '?' + qs + '&callback=' + name;
    (document.head || document.documentElement).appendChild(s);
    return end;
  }
  function mark(){ try { var l = ls(); if (l) l.setItem(PING_KEY, String(Date.now())); } catch(_){} }
  function warm(nav){   /* nav＝馬上要換頁（hub 點卡片）：改用 keepalive，換頁後請求照樣送達 */
    var last = 0, now = Date.now(), l = ls();
    try { last = Number(l && l.getItem(PING_KEY)) || 0; } catch(_){}
    if (now - last >= 0 && now - last < 90000) return false;
    mark();
    if (nav && window.fetch) {
      try { fetch(AUTH_API + '?action=ping&callback=__acnav', { mode: 'no-cors', credentials: 'omit', keepalive: true, cache: 'no-store' }).catch(noop); return true; } catch(_){}
    }
    (function ping(k){
      var t = setTimeout(function(){ end(); if (k < 2) ping(k + 1); }, 8000);
      var end = jsonp('action=ping', function(){ clearTimeout(t); }, function(){ clearTimeout(t); if (k < 2) setTimeout(function(){ ping(k + 1); }, 2500); });
    })(1);
    return true;
  }
  function read(qs, cb, prog){   /* 唯讀請求（verify、admin_list）＝可以安全重送 */
    var t0 = Date.now(), done = false, n = 0, live = 0, ends = [], timers = [], lastErr = '';
    function finish(r){
      var i;
      if (done) return;
      done = true;
      for (i = 0; i < timers.length; i++) clearTimeout(timers[i]);
      for (i = 0; i < ends.length; i++) ends[i]();
      if (r && r.ok) mark();
      cb(r);
    }
    function fail(){
      finish({ ok: false, net: true, error: navigator.onLine === false ? '這台裝置目前沒有網路，請確認 Wi-Fi 後再按一次'
        : lastErr ? '權限中心暫時無法回應，請稍後再按一次（' + lastErr.slice(0, 60) + '）'
        : '連不上權限中心，請檢查網路後再按一次' });
    }
    function again(){
      if (n < 3 && Date.now() - t0 < 26000) timers.push(setTimeout(fire, 700));
      else if (live <= 0) fail();
    }
    function fire(){
      if (done || n >= 3) return;
      n++; live++;
      if (n > 1 && prog) { try { prog('連線較慢，自動重試中（第 ' + n + ' 次）…'); } catch(_){} }
      ends.push(jsonp(qs, function(d){
        live--;
        if (done) return;
        if (d && d.ok) return finish(d);
        if (d && (d.locked || FINAL_RE.test(String(d.error || '')))) return finish(d);
        lastErr = String((d && d.error) || lastErr);   /* 其他錯誤（GAS 例外、空回應）＝暫時性 → 補下一發 */
        again();
      }, function(){ live--; if (!done) again(); }));
    }
    fire();
    timers.push(setTimeout(fire, 6000), setTimeout(fire, 14000), setTimeout(fail, 32000));
  }
  function verify(dash, pwd, cb, prog){   /* rq＝這一次按鈕的編號，補發的幾發都一樣（現在的 GAS 不看它；日後 GAS 可用它讓同一次按鈕的錯誤密碼只算 1 次） */
    read('action=verify&dashboard=' + encodeURIComponent(dash) + '&pwd=' + encodeURIComponent(pwd) + '&rq=' + rid(), cb, prog);
  }
  window.__dashAuth = { api: AUTH_API, get: get, put: put, del: del, warm: warm, read: read, verify: verify };
})();
/* ===== AUTH-CORE v2 END ===== */
</script>
<script>
/* ★★ 部署權限中心 GAS 後，把網頁應用程式 URL 貼在下一行（見 auth_center.gs 頭部 SOP 第 7 步） ★★ */
const AUTH_API = 'https://script.google.com/macros/s/AKfycbyQ9LWY74Ix8VBe1gDoMdSF5eH74ratL7_f0EUUHi37IH3bXhkIJMx4WB2I-c-MLsWtLQ/exec';

let ADM = '';   /* 管理密碼，僅記憶體 */
let LIST = [];

function jsonp(params, timeoutMs = 45000){
  return new Promise((resolve) => {
    const cb = '__admcb' + Date.now() + Math.floor(Math.random()*1e4);
    const s = document.createElement('script');
    const to = setTimeout(() => { cleanup(); resolve({ok:false, error:'連線逾時（GAS 冷啟動可能較慢，請重試）'}); }, timeoutMs);
    function cleanup(){ clearTimeout(to); delete window[cb]; s.remove(); }
    window[cb] = (d) => { cleanup(); resolve(d); };
    s.onerror = () => { cleanup(); resolve({ok:false, error:'連線失敗，請確認 AUTH_API 已填正確部署 URL'}); };
    const qs = Object.entries(params).map(([k,v]) => k + '=' + encodeURIComponent(v)).join('&');
    s.src = AUTH_API + '?callback=' + cb + '&' + qs;
    document.head.appendChild(s);
  });
}

function setMsg(id, text, ok){
  const el = document.getElementById(id);
  el.textContent = text || '';
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}

async function doLogin(){
  const pwd = (document.getElementById('admPwd').value||'').trim();
  if(!pwd) return;
  const btn = document.getElementById('loginBtn');
  if(btn.disabled) return;   /* 2026-10-02 驗證中再按 Enter 不重送 */
  btn.disabled = true; btn.textContent = '驗證中…';
  /* 2026-10-02：讀取（admin_list）改走 AUTH-CORE 自動補發；寫入（儲存／解鎖／改管理密碼）仍用下方 jsonp 只送一次 */
  const r = await new Promise(res => window.__dashAuth.read('action=admin_list&admin_pwd=' + encodeURIComponent(pwd), res, t => setMsg('loginMsg', t, true)));
  btn.disabled = false; btn.textContent = '登入';
  if(r && r.ok){
    ADM = pwd;
    document.getElementById('login').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    renderList(r.list || []);
  } else {
    setMsg('loginMsg', (r && r.error) || '登入失敗', false);
    if(/密碼錯誤/.test((r && r.error) || '')) document.getElementById('admPwd').value = '';   /* 2026-10-02 只有密碼錯誤才清空 */
  }
}
document.getElementById('admPwd').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
/* 2026-09-03 修跨頁自動填入污染：瀏覽器可能在載入後才把別頁已存密碼填進來，分三個時點強制清空 */
(function(){ var _a = document.getElementById('admPwd'); _a.value=''; setTimeout(function(){ _a.value=''; }, 60); setTimeout(function(){ _a.value=''; }, 300); })();
window.__dashAuth.warm();   /* 2026-10-02 開頁先預熱權限中心（全站 90 秒節流） */

async function loadList(){
  setMsg('listMsg', '載入中…', true);
  const r = await new Promise(res => window.__dashAuth.read('action=admin_list&admin_pwd=' + encodeURIComponent(ADM), res, t => setMsg('listMsg', t, true)));
  if(r && r.ok){ renderList(r.list || []); setMsg('listMsg', '', true); }
  else setMsg('listMsg', (r && r.error) || '載入失敗', false);
}

function renderList(list){
  LIST = list;
  const tb = document.getElementById('tb');
  tb.innerHTML = list.map((d, i) => `
    <tr>
      <td class="name"><b>${d.name}</b><br><span class="id">${d.dashboard_id}</span></td>
      <td style="white-space:nowrap">
        <input class="pwd" type="password" id="p_${i}" value="${String(d.password).replace(/"/g,'&quot;')}">
        <button class="eye" onclick="togglePwd(${i})" title="顯示/隱藏">👁</button>
      </td>
      <td><input class="ttl" type="number" min="1" id="t_${i}" value="${d.ttl_hours}"></td>
      <td>
        <select id="e_${i}">
          <option value="Y" ${d.enabled === 'Y' ? 'selected' : ''}>Y</option>
          <option value="N" ${d.enabled === 'N' ? 'selected' : ''}>N</option>
        </select>
      </td>
      <td style="white-space:nowrap">${Number(d.fails)||0}${(Number(d.fails)||0) >= 15 ? ' 🔒' : ''}
        ${(Number(d.fails)||0) > 0 ? `<button class="ghost" style="padding:3px 8px;font-size:12px;margin-left:4px" onclick="unlockRow(${i})">解鎖</button>` : ''}
      </td>
      <td class="updated hidecol">${d.updated_at || ''}</td>
      <td class="hidecol"><span class="hint">${d.note || ''}</span></td>
      <td><button id="s_${i}" onclick="saveRow(${i})">儲存</button></td>
    </tr>`).join('');
}

function togglePwd(i){
  const el = document.getElementById('p_' + i);
  el.type = (el.type === 'password') ? 'text' : 'password';
}

async function saveRow(i){
  const d = LIST[i];
  const btn = document.getElementById('s_' + i);
  btn.disabled = true; btn.textContent = '…';
  const r = await jsonp({
    action: 'admin_set',
    admin_pwd: ADM,
    dashboard: d.dashboard_id,
    new_pwd: document.getElementById('p_' + i).value,
    ttl_hours: document.getElementById('t_' + i).value,
    enabled: document.getElementById('e_' + i).value
  });
  btn.disabled = false; btn.textContent = '儲存';
  if(r && r.ok){ setMsg('listMsg', '✅ ' + d.name + ' 已更新（' + new Date().toLocaleTimeString('zh-TW') + '）', true); loadList(); }
  else setMsg('listMsg', '❌ ' + d.name + '：' + ((r && r.error) || '更新失敗'), false);
}

async function unlockRow(i){
  const d = LIST[i];
  const r = await jsonp({action:'admin_unlock', admin_pwd:ADM, dashboard:d.dashboard_id});
  if(r && r.ok){ setMsg('listMsg', '✅ ' + d.name + ' 已解除鎖定', true); loadList(); }
  else setMsg('listMsg', (r && r.error) || '解鎖失敗', false);
}

async function changeAdmin(){
  const np = document.getElementById('newAdmPwd').value;
  if(!np){ setMsg('admMsg', '請輸入新的管理密碼', false); return; }
  const r = await jsonp({action:'admin_set', admin_pwd:ADM, dashboard:'__admin__', new_pwd:np});
  if(r && r.ok){
    setMsg('admMsg', '✅ 管理密碼已更新，請以新密碼重新登入', true);
    setTimeout(() => location.reload(), 1200);
  } else setMsg('admMsg', (r && r.error) || '更新失敗', false);
}
</script>
</body>
</html>
