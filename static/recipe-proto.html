<script>
/* ===== IME-GUARD（2026-10-17 晚，經營者：新品申請表的搜尋框打不出中文，「全部測試、確保正常」）=====
   病因：注音／倉頡選字時，每按一個鍵瀏覽器就送一次 input；各分頁的 oninput 一收到就重畫，把正在選字的輸入框換掉。
   做法（整頁共用，不用逐一改各分頁）：
   ①選字中（compositionstart～compositionend，或事件帶 isComposing）的 input／keydown／keyup 在最外層攔下，各分頁的程式收不到
   ②選完字（compositionend）補送一次 input，各分頁照常收到「最後打好的字」
   ③window.__ime.on＝現在是否在選字；有延遲重畫的地方（例：BOM 搜尋 250ms 後重畫）重畫前先看它，選字中就不重畫 */
window.__ime=(function(){
  var st={on:false};
  function isTyping(t){return t&&(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&!/^(checkbox|radio|button|submit|file|range|color|date|time|datetime-local|month|week|hidden|image|reset)$/i.test(t.type||'')))}
  document.addEventListener('compositionstart',function(e){if(isTyping(e.target))st.on=true},true);
  document.addEventListener('compositionend',function(e){st.on=false;var t=e.target;if(!isTyping(t))return;
    setTimeout(function(){try{t.dispatchEvent(new Event('input',{bubbles:true}))}catch(_){}},0)},true);
  ['input','keydown','keyup','keypress'].forEach(function(type){
    document.addEventListener(type,function(e){if(!isTyping(e.target))return;
      if(type==='input'&&st.on&&!e.isComposing&&e.inputType&&!/Composition/.test(e.inputType))st.on=false;   /* 保險：選字被取消、沒收到 compositionend → 一般打字照常 */
      if(e.isComposing||st.on||(type!=='input'&&e.keyCode===229))e.stopImmediatePropagation()},true)});
  document.addEventListener('focusout',function(e){if(isTyping(e.target))st.on=false},true);
  window.addEventListener('blur',function(){st.on=false});
  return st;
})();
</script>

/* 2026-07-30 儀表板權限閘門 v1：密碼由「權限中心」GAS 集中管理（Sheet dim_auth），每頁獨立密碼＋TTL
   2026-10-02 v2（待處理事項 1002 #3）：連線與儲存改用上方 AUTH-CORE（自動重試／預熱／空間滿不卡）。
   2026-11-18 v3（密碼重建第 2 段）：登入一次整站通行。①手上有能開這一頁的通行證 → 直接進，不問密碼 ②舊版登入紀錄／緊急繞過（dash_auth_<id> = {exp}，沒有 p 記號）效期內照舊放行

   本段各儀表板一字不差，只有 DASH_ID、DASH_NAME 兩行不同（P&L 放行旗標、食譜簽核連結也寫在這裡，依 DASH_ID 生效）。 */
(function(){
  var DASH_ID = 'tablet_i18n';
  var DASH_NAME = '平板外語食譜';   /* 與 dim_auth 的 name 欄一致 */
  var KEY = 'dash_auth_' + DASH_ID, A = window.__dashAuth;
  /* 只有食譜系統：2026-09-29 B 階段簽核連結（#sign=）不經本頁密碼，改由簽核頁用簽核人 PIN 驗證（看內容一定要 PIN）；
     簽核頁不載入其他分頁的資料，換成其他網址會整頁重新載入、重新過這道密碼 */
  if (DASH_ID === 'recipe' && /^#sign=/.test(location.hash || '')) { window.__SIGN_MODE = true; return; }
  /* 放行旗標：P&L 靠 __pnlAuthed／__pnlStartApp 決定何時開始抓資料（2026-08-12c，見該頁 autoLoginFromHub）；其他頁多一個旗標無影響 */
  function pass(){
    window['__' + DASH_ID + 'Authed'] = true;
    var f = window['__' + DASH_ID + 'StartApp'];
    if (f) { window['__' + DASH_ID + 'StartApp'] = null; f(); }
  }
  /* 有能開這一頁的通行證 → 把這一頁的登入紀錄對齊通行證（P&L、訂位、月會自己的程式還在讀這一格；p:1＝這筆是跟著通行證的，通行證沒了就不算數） */
  function live(){

    try { o = JSON.parse(A.get(KEY) || 'null'); } catch(_){}

  } catch(_){}

    d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#4A3228;display:flex;align-items:center;justify-content:center;visibility:visible';
    d.innerHTML = '<div style="background:#fff;border-radius:14px;padding:28px 26px;width:min(320px,86vw);text-align:center;font-family:system-ui">'
      + '<div style="font-size:17px;font-weight:800;color:#4A3228;margin-bottom:4px">🔐 ' + (DASH_NAME || document.title.split(/[|｜—]/)[0].trim() || '儀表板') + '</div>'
      + '<div style="font-size:12px;color:#6F4E45;margin-bottom:14px">請輸入密碼<br>登入一次，其他頁面不用再輸入</div>'
      + '<div id="agWho" style="font-size:12px;color:#8B3A2A;font-weight:700;margin:-6px 0 12px;display:none"></div>'
      + '<div style="position:relative">'
      + '<input id="agPwd" type="password" autocomplete="new-password" name="pw-' + DASH_ID + '" data-lpignore="true" data-1p-ignore style="width:100%;box-sizing:border-box;padding:10px 40px 10px 10px;border:1px solid #D8C8BE;border-radius:8px;font-size:15px">'
      + '<button type="button" id="agEye" aria-label="顯示密碼" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;font-size:16px;cursor:pointer;padding:4px;line-height:1">👁</button>'
      + '</div>'
      + '<div id="agErr" style="color:#C43030;font-size:12px;min-height:16px;margin:6px 0"></div>'
      + '<button id="agBtn" style="width:100%;padding:10px;border:none;border-radius:8px;background:#7B4B36;color:#fff;font-size:15px;font-weight:700;cursor:pointer">進入</button>'
      + '<div style="margin-top:12px"><a href="hub.html" style="font-size:12px;color:#6F4E45">⬅ 回首頁</a></div></div>';
    document.body.appendChild(d);
    var inp = document.getElementById('agPwd'), btn = document.getElementById('agBtn'), err = document.getElementById('agErr'), who = document.getElementById('agWho');
    if (me && me.n && who) { who.textContent = '目前登入的是「' + me.n + '」，這一頁要用更高一層的密碼'; who.style.display = 'block'; }
    /* 2026-09-03 修跨頁自動填入污染：瀏覽器可能在建立後才把別頁已存密碼填進來，分三個時點強制清空 */
    inp.value=''; setTimeout(function(){ inp.value=''; }, 60); setTimeout(function(){ inp.value=''; }, 300);

      inp.type = showPw ? 'text' : 'password';
      eye.textContent = showPw ? '🙈' : '👁';
      inp.focus();
    };
    var busy = false;   /* 驗證中再按 Enter／進入不重送 */
    function go(){

             改為就地拆除遮罩即可。 */
          if (d && d.parentNode) d.parentNode.removeChild(d);
          document.documentElement.style.visibility = '';
          pass();
        } else {
          var _msg = (r && r.error) || '驗證失敗';
          if (r && r.ok) {   /* 密碼是對的（已登入成那個身分），只是這一頁開不了 */
            _msg = '這是「' + (r.ident_name || '其他身分') + '」的密碼，開不了這一頁' + (r.need ? '。這一頁要用：' + r.need + ' 的密碼' : '');
            inp.value = '';
            if (who) who.style.display = 'none';
          }
          /* 2026-09-03 只在密碼錯誤時附加說明，連線失敗／逾時／已停用維持原文。
             2026-10-02 也只有密碼錯誤才清空欄位；連不上時保留密碼，直接再按一次「進入」即可 */
          else if (_msg.indexOf('密碼錯誤') > -1) { _msg += '（欄位若已被瀏覽器預填，請先清空再輸入）'; inp.value = ''; }
          err.textContent = _msg;
          btn.disabled = false; btn.textContent = '進入';
          if (eye && inp.type !== 'password') { inp.type = 'password'; eye.textContent = '👁'; }
          inp.focus();
        }
      }, function(t){ err.style.color = '#6F4E45'; err.textContent = t; });
    }
    btn.onclick = go;
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });

  }

.tctl .go{border:none;border-radius:10px;background:var(--red);color:#fff;font-weight:800;padding:9px 16px}
.tctl .left{font-weight:800;font-size:1.25em;color:var(--red);font-variant-numeric:tabular-nums}
.tctl .sm{font-size:.85em;color:var(--ink2)}
.tctl .demo{border:1px dashed var(--pur);background:#f4f2fd;color:#4a3bb0;border-radius:8px;padding:4px 10px;font-size:.78em}

/* 封面／完成 */
.cover h1{font-size:1.9em;line-height:1.25}
.cover .ck{color:var(--ink2);font-weight:700}
.cover .slist{border:2px solid var(--line);border-radius:12px;padding:6px 12px}
.cover .slist div{display:flex;justify-content:space-between;padding:3px 0;font-weight:700}
.cover .slist span{color:var(--mute);font-weight:600}
.done{align-items:center;justify-content:center;text-align:center}
.done .pres{white-space:pre-line;text-align:left;background:var(--soft);border-radius:12px;padding:12px 16px;max-width:640px;font-size:.92em}
.bigbtn{border:none;border-radius:12px;background:var(--ink);color:#fff;font-weight:800;padding:12px 26px}

/* 下方按鈕 */
#nav{flex:0 0 auto;display:flex;padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
#nav button{border:none;border-radius:12px;padding:12px 14px;font-weight:800;font-size:1em;background:var(--soft)}
#nav button+button{margin-left:8px}
#nav #prev{flex:1}#nav #next{flex:1.5;background:var(--ink);color:#fff}
#nav button:disabled{opacity:.3;cursor:default}

/* 浮層 */
.ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(20,12,8,.74);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.sheet{position:relative;background:#fff;border-radius:16px;width:100%;max-width:780px;max-height:92%;overflow:auto;padding:16px 18px;-webkit-overflow-scrolling:touch}
.sheet h3{font-size:1.15em;margin-bottom:8px;padding-right:44px}
.sheet h4{margin:14px 0 4px;font-size:1em}
.sheet p,.sheet li{font-size:.92em}.sheet ul{margin:4px 0;padding-left:1.2em}
.sheet table{border-collapse:collapse;width:100%;font-size:.92em}.sheet td,.sheet th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}.sheet th{color:var(--ink2)}
.sheet td.n{font-weight:800;white-space:nowrap}
.xb{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;border:none;background:var(--soft);font-size:18px;font-weight:800;z-index:3}
.zoomov .zin{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.zoomov video,.zoomov img{max-width:100%;max-height:100%;border-radius:10px;background:#000}
.zoomov .xb{position:fixed;right:14px;top:14px;top:calc(14px + env(safe-area-inset-top));background:#fff}
.slst .sg{font-weight:800;margin:12px 0 4px}
.slst button[data-act=go]{display:flex;width:100%;text-align:left;border:none;border-top:1px solid var(--line);background:#fff;padding:9px 6px;font-size:.95em}
.slst button[data-act=go].on{background:var(--yel2);font-weight:800}
.slst button[data-act=go] span{flex:0 0 2.2em;color:var(--mute)}
.dlg{position:fixed;left:0;top:0;right:0;bottom:0;z-index:9600;background:rgba(64,33,15,.55);display:flex;align-items:center;justify-content:center}
.dlg .box{background:#fff;border-radius:14px;padding:22px;width:340px;max-width:90vw}
.dlg input{width:100%;padding:10px;font-size:16px;border:1px solid var(--line);border-radius:8px;margin:10px 0}
.dlg button{width:100%;padding:10px;border:none;border-radius:8px;background:#7b4b36;color:#fff;font-size:16px;font-weight:700}

/* 直放或窄螢幕 */
@media (max-width:820px){
  .cols{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
  .panels,.panels.n3,.panels.n4,.panels.n5{grid-template-columns:repeat(2,minmax(0,1fr))}
  #pbar .cnt{display:none}
}

  .panels,.panels.n3,.panels.n4,.panels.n5{grid-template-columns:minmax(0,1fr)}

}

    if (mode === 'zone' && it.bowl) r.appendChild(el('span', 'lt', it.bowl));
    r.appendChild(el('span', 'nm', it.n)); r.appendChild(el('span', 'q', qtyTxt(it.q, it.u)));
    if (mode !== 'zone') r.appendChild(zoneChip(it.a));
    return r;
  }
  function vPick(pg, pi) {
    var root = el('div', 'pg pick'), sg = S.M.stages[pg.stage];
    var h = el('h2', 'ptitle', '先拿齊這一段要用的'); h.appendChild(el('small', '', sg.no + ' ' + sg.name)); root.appendChild(h);
    var flow = []; for (var k = sg.first; k <= sg.last; k++) { var p = S.M.pages[k]; if (p.kind === 'steps' && !p.promo) flow.push(p.title); }
    root.appendChild(el('div', 'flow', '這一段要做：' + flow.join(' → ')));
    var bar = el('div', 'pkbar'), cg = el('span', 'cntg'); cg.id = 'gotCnt'; bar.appendChild(cg);
    var spoon = false; each(pg.all, function (it) { if (/匙/.test(it.u)) spoon = true; });
    if (spoon && S.M.spoon) bar.appendChild(btn('', '平匙怎麼舀？', 'spoon'));
    root.appendChild(bar);
    var idx = function (it) { return pg.all.indexOf(it); };
    if (S.pick === 'zone') {
      var zs = el('div', 'zones'), ids = AREA_ORDER.slice();
      each(pg.all, function (it) { if (ids.indexOf(it.a) < 0) ids.push(it.a); });
      each(ids, function (a) {
        var its = pg.all.filter(function (it) { return it.a === a; }); if (!its.length) return;
        its.sort(function (x, y) { return (x.bowl ? 0 : 1) - (y.bowl ? 0 : 1) || (x.bowl < y.bowl ? -1 : x.bowl > y.bowl ? 1 : 0); });
        var c = el('div', 'zcard'), zh = el('div', 'zh', areaName(a)); zh.style.background = AREA_COLOR[a] || '#7a7f87';
        var img = ((S.data.areas || {})[a] || {}).img; if (img) { var b = btn('', '📍 看位置', 'zoom', abs(img)); b.setAttribute('data-k', 'i'); zh.appendChild(b); }
        c.appendChild(zh); each(its, function (it) { c.appendChild(itemRow(pi, it, idx(it), 'zone')); }); zs.appendChild(c);
      });
      root.appendChild(zs);
      if (pg.bowls.length) {
        var lg = []; each(pg.bowls, function (b) { lg.push(b.letter + '＝' + b.name + (b.items.length > 1 ? '（' + b.items.length + ' 樣裝一起）' : '')); });
        root.appendChild(el('div', 'flow', '圓圈裡的字母是要裝進哪個容器：' + lg.join('、')));
      }
    } else {
      if (pg.bowls.length) {
        root.appendChild(el('h3', 'sec', '裝這 ' + pg.bowls.length + ' 個容器'));
        var bs = el('div', 'bowls');
        each(pg.bowls, function (b) {
          var c = el('div', 'bowl'), bh = el('div', 'bh'); bh.appendChild(el('span', 'lt', b.letter));
          if (b.kind !== 'bag') { var ic = el('img'); ic.src = BACK + (b.kind === 'c2' ? '/img/cbowl.png' : '/img/pbowl.png'); ic.alt = ''; bh.appendChild(ic); }
          bh.appendChild(el('span', '', b.name)); if (b.use) bh.appendChild(el('span', 'use', b.use));
          c.appendChild(bh); each(b.items, function (it) { c.appendChild(itemRow(pi, it, idx(it), 'bowl')); }); bs.appendChild(c);
        });
        root.appendChild(bs);
      }
      if (pg.tools.length) {
        root.appendChild(el('h3', 'sec', '器具 ' + pg.tools.length + ' 樣'));
        var tl = el('div', 'tools'); each(pg.tools, function (it) { tl.appendChild(itemRow(pi, it, idx(it), 'bowl')); }); root.appendChild(tl);
      }
    }
    var merged = false; each(pg.bowls, function (b) { if (b.items.length > 1 || b.kind === 'bag') merged = true; });
    if (merged) root.appendChild(el('div', 'pnote', '原型註記：幾樣食材裝同一個容器是建議做法，還沒經主廚確認；現行平板寫的是「一種食材一個容器」。'));
    return root;
  }
  function paintGot() {
    var c = $('gotCnt'); if (!c) return; var pg = S.M.pages[S.i], n = 0;
    each(pg.all, function (it, j) { if (S.got[S.i + ':' + j]) n++; });
    c.textContent = '已拿 ' + n + '／' + pg.all.length + '（點一下打勾）';
  }

  /* ================= 封面、完成 ================= */
  function vCover(pg) {
    var root = el('div', 'pg cover'), cols = el('div', 'cols'), mb = el('div', 'mbox'), side = el('div', 'side');
    if (S.M.intro && S.M.intro.video) { var v = mkVideo(S.M.intro.video, { preload: 'metadata', controls: true }); v.muted = false; v.removeAttribute('muted'); v.src = S.M.intro.video; if (S.data.cover) v.poster = abs(S.data.cover); mb.appendChild(v); }
    else if (S.data.cover) { var im = el('img'); im.src = abs(S.data.cover); im.alt = ''; mb.appendChild(im); }
    side.appendChild(el('div', 'ck', '請確認你要做的是'));
    side.appendChild(el('h1', '', pg.title));
    side.appendChild(el('div', 'lead', '如果不是，請找服務人員協助。請先看左邊的介紹影片。'));
    var sl = el('div', 'slist');
    each(S.M.stages, function (sg) { var d = el('div', '', sg.no + ' ' + sg.name); d.appendChild(el('span', '', (sg.last - sg.first + 1) + ' 頁')); sl.appendChild(d); });
    side.appendChild(sl);
    side.appendChild(btn('bigbtn', '開始製作 ▶', 'next'));
    cols.appendChild(mb); cols.appendChild(side); root.appendChild(cols); return root;
  }
  function vDone() {
    var root = el('div', 'pg done');
    root.appendChild(el('h2', 'ptitle', '🎉 完成了！辛苦了'));
    root.appendChild(el('div', 'lead', '有任何問題，請洽服務人員。'));
    if (S.data.pres) { root.appendChild(el('h3', 'sec', '保存方式')); root.appendChild(el('div', 'pres', S.data.pres)); }
    root.appendChild(btn('bigbtn', '回到第一頁', 'stage', -1));
    return root;
  }

  /* ================= 烤箱倒數（示範功能） ================= */
  function paintTimer() {
    var d = $('tctl'), pg = S.M.pages[S.i]; if (!d || !pg.timer) return; d.innerHTML = '';
    var t = S.timer, goT = (S.M.pages[S.M.keys[pg.timer.go]] || {}).title || '下一步';
    if (t) {
      var left = Math.max(0, Math.round((t.end - Date.now()) / 1000));
      d.appendChild(el('span', 'left', left > 0 ? '⏱ ' + mmss(left) : '⏰ 時間到'));
      d.appendChild(el('span', 'sm', left > 0 ? '倒數中，可以先往下做。時間到，上方會提醒你做「' + goT + '」' : '請去做「' + goT + '」'));
      d.appendChild(btn('demo', '取消倒數', 'tstop'));
    } else {
      d.appendChild(btn('go', '⏱ 開始 ' + pg.timer.min + ' 分鐘倒數', 'tstart', pg.timer.min * 60));
      d.appendChild(el('span', 'sm', '時間到，上方會提醒你做「' + goT + '」'));
      d.appendChild(btn('demo', '示範用：改成 10 秒', 'tstart', 10));
      d.appendChild(el('span', 'pnote', '原型註記：平板自己倒數是示範功能，定案後才決定要不要取代桌上的計時器。'));
    }
  }
  function tick() {
    var t = S.timer, chip = $('tm'); if (!chip) return;
    if (!t) { chip.style.display = 'none'; return; }
    var left = Math.max(0, Math.round((t.end - Date.now()) / 1000)); chip.style.display = '';
    if (left > 0) { chip.className = 'tm'; chip.textContent = '⏱ ' + t.label + ' ' + mmss(left); }
    else { chip.className = 'tm done'; chip.textContent = '⏰ 時間到：點這裡做「' + ((S.M.pages[t.go] || {}).title || '') + '」'; }
    var l = document.querySelector('#tctl .left'); if (l) { if (left > 0) l.textContent = '⏱ ' + mmss(left); else if (l.textContent.indexOf('時間到') < 0) paintTimer(); }
  }

  /* ================= 浮層 ================= */
  function closeOv() { each(document.querySelectorAll('.ov'), function (o) { killVideos(o); o.parentNode.removeChild(o); }); }
  function sheet(title) {
    closeOv(); var o = el('div', 'ov'); o.setAttribute('data-act', 'close'); var s = el('div', 'sheet');
    s.appendChild(btn('xb', '✕', 'close')); s.appendChild(el('h3', '', title)); o.appendChild(s); document.body.appendChild(o); return s;
  }
  function zoom(src, isVideo) {
    closeOv(); var o = el('div', 'ov zoomov'); o.setAttribute('data-act', 'close'); var z = el('div', 'zin');
    if (isVideo) { var v = mkVideo(src, { preload: 'auto', loop: true, controls: true }); v.src = src; z.appendChild(v); playV(v); }
    else { var im = el('img'); im.src = src; im.alt = ''; z.appendChild(im); }
    o.appendChild(z); o.appendChild(btn('xb', '✕', 'close')); document.body.appendChild(o);
  }
  function showList() {
    var s = sheet('步驟清單'); s.className += ' slst';
    var b0 = btn(S.i === 0 ? 'on' : '', null, 'go', 0); b0.appendChild(el('span', '', '')); b0.appendChild(document.createTextNode('開始：確認品項、介紹影片')); s.appendChild(b0);
    each(S.M.stages, function (sg) {
      s.appendChild(el('div', 'sg', sg.no + ' ' + sg.name));
      for (var k = sg.first; k <= sg.last; k++) {
        var p = S.M.pages[k], b = btn(k === S.i ? 'on' : '', null, 'go', k);
        b.appendChild(el('span', '', String(k - sg.first + 1))); b.appendChild(document.createTextNode(p.kind === 'pick' ? '拿料' : p.title)); s.appendChild(b);
      }
    });
  }
  function showSpoon() {
    var g = S.M.spoon, s = sheet('平匙怎麼舀？'); if (!g) return;
    each(g.lines, function (l) { var p = el('p'); runsTo(p, l.runs); s.appendChild(p); });
    var src = g.img || g.imgs[0]; if (src) { var im = el('img'); im.src = src; im.alt = ''; im.style.cssText = 'max-width:100%;max-height:60vh;display:block;margin:0 auto'; s.appendChild(im); }
  }
  function showInfo() {
    var M = S.M, t = M.stats, s = sheet('這個原型在示範什麼');
    var add = function (tag, txt) { var e = el(tag, '', txt); s.appendChild(e); return e; };
    add('p', '「食譜簡化與新版面」專案第 2 階段的版面原型。內容直接讀門市現行的「' + (S.data.name || '') + '」，文字、用量、圖片、影片都沒有改，只改「怎麼排」。門市正式食譜沒有動。');
    add('h4', '同一支食譜，排法不同');
    var tb = el('table'), rows = [['', '門市現行', '這個原型'], ['客人要滑的頁數', t.oPages + ' 頁', t.nPages + ' 頁'], ['去拿料的次數', t.oTrips + ' 趟', t.nTrips + ' 趟'], ['要用的容器', t.oCont + ' 個', t.nCont + ' 個（合併裝碗，待主廚確認）']];
    each(rows, function (r, i) { var tr = el('tr'); each(r, function (c, j) { tr.appendChild(el(i ? 'td' : 'th', j ? 'n' : '', c)); }); tb.appendChild(tr); }); s.appendChild(tb);
    add('h4', '三種版面（上方控制列可切換）');
    var ul = el('ul'); each(['A 圖文並排：左邊大圖或影片，右邊步驟。影片一段一段自動播，點哪一段就停在那一段重播。', 'B 分鏡格：每個動作一格，圖在上、字在下，一眼看完整頁；影片一格一格輪流播。', 'C 直排：圖、字、圖、字照順序往下排，要往下捲。最接近現有後台做得出來的樣子。'], function (x) { ul.appendChild(el('li', '', x)); }); s.appendChild(ul);
    add('h4', '每種版面都有的');
    var u2 = el('ul'); each(['一頁＝做完一個小成品；同一頁裡每個動作配自己的圖或影片，順序不會顛倒。', '上方看得到五個段落做到哪裡。', '拿料頁一段只拿一趟，可以照「碗」或照「區域」看，拿了就點一下打勾。', '小教室收在下面，要看才點開；翻頁提示（請往下一頁）拿掉。', '烤箱倒數：開始後一直顯示在上方，時間到提醒去做烤熟測試（示範功能）。'], function (x) { u2.appendChild(el('li', '', x)); }); s.appendChild(u2);
    add('h4', '現有後台做不到、要另外做的');
    var u3 = el('ul'); each(['一頁放好幾段影片、各自對到步驟（現有後台一頁只能一支影片）。', '照碗分組的拿料頁與打勾（現有拿料頁固定一種食材一個容器）。', '段落進度、倒數計時、圖字並排不用捲。'], function (x) { u3.appendChild(el('li', '', x)); }); s.appendChild(u3);
    var skip = []; each(M.unused, function (x) { skip.push(x + (PROTO.dropped[x] ? '（' + PROTO.dropped[x] + '）' : '')); });
    if (skip.length) { add('h4', '沒放進流程的原始頁'); add('p', skip.join('；')); }
    if (M.spoon) add('p', '「量匙怎麼舀」改成拿料頁上的「平匙怎麼舀？」按鈕；「教學影片」「確認品項」併成第一頁。');
    if (M.miss.length) { var w = add('p', '⚠ 原始食譜有更動，下面這些在後台找不到，原型裡會少掉：' + M.miss.join('、')); w.style.color = '#b3261e'; }
    var f = add('p', '資料讀取時間：' + (S.at || '') + '　'); f.style.color = '#9a8a7f'; f.appendChild(btn('lk', '重新讀取', 'reload'));
    f.lastChild.style.cssText = 'border:1px solid #eadfd3;background:#fff;border-radius:8px;padding:2px 10px;font-size:13px';
  }

  /* ================= 換頁 ================= */
  function render() {
    stopMedia(); closeOv();
    var pg = S.M.pages[S.i], main = $('main'); main.innerHTML = '';
    var node = pg.kind === 'cover' ? vCover(pg) : pg.kind === 'pick' ? vPick(pg, S.i) : pg.kind === 'done' ? vDone() : (S.layout === 'B' ? vB(pg) : S.layout === 'C' ? vC(pg) : vA(pg));
    main.appendChild(node); main.scrollTop = 0;
    renderHdr(); paintGot(); paintTimer(); ssSet('rp:i', String(S.i));
    startMedia(pg);
  }
  function go(i) { i = Math.max(0, Math.min(S.M.pages.length - 1, i)); if (i === S.i) return; S.i = i; render(); }
  function ready(data) {
    S.data = data; S.M = build(data);
    var i = Number(ssGet('rp:i')); S.i = i > 0 && i < S.M.pages.length ? i : 0;
    shell(); renderBar(); render(); tick();
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('[data-act]'); if (!t) return;
    var a = t.getAttribute('data-act'), v = t.getAttribute('data-v');
    if (a === 'close') { if (e.target === t || t.className === 'xb') closeOv(); return; }
    if (a === 'reload') { closeOv(); load(true); return; }
    if (!S.M) return;
    if (a === 'next') go(S.i + 1);
    else if (a === 'prev') go(S.i - 1);
    else if (a === 'go') { closeOv(); go(Number(v)); }
    else if (a === 'stage') { var si = Number(v); go(si < 0 ? 0 : S.M.stages[si].first); }
    else if (a === 'lay') { S.layout = v; lsSet('rp:layout', v); renderBar(); render(); }
    else if (a === 'pk') { S.pick = v; lsSet('rp:pick', v); renderBar(); render(); }
    else if (a === 'hidebar') { S.bar = false; renderBar(); }
    else if (a === 'showbar') { S.bar = true; renderBar(); }
    else if (a === 'info') showInfo();
    else if (a === 'list') showList();
    else if (a === 'spoon') showSpoon();
    else if (a === 'zoom') { e.stopPropagation(); zoom(v, t.getAttribute('data-k') === 'v'); }
    else if (a === 'zoomimg') { e.stopPropagation(); zoom(t.getAttribute('src'), false); }
    else if (a === 'grp') { if (S.mc && S.mc.show) S.mc.show(Number(v), true); }
    else if (a === 'pan') { if (S.mc && S.mc.pan) S.mc.pan(Number(v)); }
    else if (a === 'got') { S.got[v] = !S.got[v]; t.className = 'it' + (S.got[v] ? ' got' : ''); paintGot(); }
    else if (a === 'tstart') { var pg = S.M.pages[S.i]; S.timer = { end: Date.now() + Number(v) * 1000, label: pg.timer.label, go: S.M.keys[pg.timer.go] }; paintTimer(); tick(); }
    else if (a === 'tstop') { S.timer = null; paintTimer(); tick(); }
    else if (a === 'tgo') { var tm = S.timer; if (tm && Date.now() >= tm.end) { S.timer = null; tick(); go(tm.go); } }
  });
  document.addEventListener('keydown', function (e) {
    if (!S.M || (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName))) return;
    if (e.key === 'ArrowRight') go(S.i + 1); else if (e.key === 'ArrowLeft') go(S.i - 1); else if (e.key === 'Escape') closeOv();
  });
  var tx = 0, ty = 0;
  document.addEventListener('touchstart', function (e) { var t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!S.M || document.querySelector('.ov') || !(e.target.closest && e.target.closest('#main'))) return;
    var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 45) go(S.i + (dx < 0 ? 1 : -1));
  }, { passive: true });
  var lastWide = wide(), rz = 0;
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (S.M && wide() !== lastWide) { lastWide = wide(); render(); } }, 200); });
  setInterval(tick, 500);

  function start() {
    if (S.cand) lsSet('tr:tpw', S.cand);
    var l = lsGet('rp:layout'); if (l === 'A' || l === 'B' || l === 'C') S.layout = l;
    var p = lsGet('rp:pick'); if (p === 'bowl' || p === 'zone') S.pick = p;
    load(false);
  }
  if (window.__tablet_i18nAuthed) start(); else window.__tablet_i18nStartApp = start;
})();
