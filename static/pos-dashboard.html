// v3: 標籤改由後端 discountLabels 提供（daily_discount D~I 真實欄名）；此為離線 fallback
const DISCOUNT_LABELS_FALLBACK = ['好客券','自己人$100甜點券','自己人4人同行每份$500','員工優惠7折','甜點券$100','自己人體驗7折'];
const DISCOUNT_COLORS = ['#C4412F','#D4654F','#06b6d4','#22c55e','#f59e0b','#ec4899'];

/* v19: 方案排行專用 tooltip — 顯示次數、平均讓利，並對「N折」方案反推原價與實付
   原理：N折 = 客人付原價 N0%，讓利 = 原價 ×(1−N0%) → 原價 = 平均讓利 ÷ (1−折數) */
function parseDiscRate(voucher){
  const m = String(voucher||'').match(/([0-9]{1,2})折/);
  if(!m) return null;
  const d = +m[1];
  const rate = d >= 10 ? d/100 : d/10;   // 69折→0.69、7折→0.7
  return (rate > 0 && rate < 1) ? rate : null;
}
function ProgramRankTooltip({active, payload}){
  if(!active || !payload || !payload.length) return null;
  const p = payload[0].payload || {};
  const uses = p.uses || 0;
  const avg = uses > 0 ? p.discount / uses : 0;
  const rate = parseDiscRate(p.voucher);
  const orig = (rate && avg > 0) ? avg / (1 - rate) : null;
  return (
    <div style={{background:'#fff',border:'1px solid #F0D9D5',borderRadius:8,padding:'10px 14px',fontSize:12,boxShadow:'0 4px 12px rgba(0,0,0,.08)'}}>
      <div style={{fontWeight:700,marginBottom:6}}>{p.voucher}</div>
      <div>折扣金額：{fmt.currency(p.discount)}</div>
      <div>使用次數：{fmt.number(uses)}</div>
      {uses > 0 && <div>平均讓利：{fmt.currency(Math.round(avg))} / 次</div>}
      {(p.revActual||0) > 0 && <div style={{marginTop:6,paddingTop:6,borderTop:'1px dashed #F0D9D5'}}>
        帶動營業額（實付）：{fmt.currency(Math.round(p.revActual||0))}
        {p.discount > 0 && <div>效益比：每 $1 讓利帶動實付 ${(p.revActual/p.discount).toFixed(1)}</div>}
        <div style={{color:'#6F4E45',marginTop:2}}>※用券交易之整筆金額；多券交易會重複歸屬，各方案不可加總</div>
      </div>}
      {orig && <div style={{marginTop:6,paddingTop:6,borderTop:'1px dashed #F0D9D5',color:'#C4412F'}}>
        反推原價 ≈ {fmt.currency(Math.round(orig))}<br/>
        客人實付 ≈ {fmt.currency(Math.round(orig - avg))}
      </div>}
    </div>
  );
}

function TabDiscount({rawData, dateStart, dateEnd, selRegion, selStores}){
  // v13: 分券種折扣，來源 rawData.discountByProgram（年月×店×標準方案×大類）
  const CAT_COLORS = { '行銷折扣':'#C4412F', '加價購':'#06b6d4', '非行銷折扣':'#f59e0b', '其他':'#9ca3af' };
  const dbp = rawData ? (rawData.discountByProgram || []) : [];
  const mbs = rawData ? (rawData.monthlyByStore || []) : [];

  const filt = (m)=>{
    if(dateStart && m.yearMonth < dateStart) return false;
    if(dateEnd && m.yearMonth > dateEnd) return false;
    if(selRegion && selRegion!=='全部' && m.region!==selRegion) return false;
    if(selStores && selStores.length>0 && !selStores.includes(m.store)) return false;
    return true;
  };
  // v14: 4人同行$500 為 POS 置換型，真實折扣 = 帳面折扣 − $500券佔位營收(placeholderRev)
  // v21: 後端 v19 已於 2026-07-22 源頭正名（classifyVoucher 加購餅乾 → 行銷折扣），
  //      移除 v20 前端 remap；「加購餅乾讓利」小計改以 voucher==='加購餅乾' 判定。
  // v22: 後端 v20 新增 revGross/revActual（方案帶動營業額，serial_no 去重）。
  //      毛額比照 discount 扣 placeholderRev（4人同行$500 佔位商品）；實付本來就是真收款、不扣。
  //      後端未升級 v20 時欄位為 undefined → ||0 保護，tooltip 自動隱藏該區塊。
  const fDBP = useMemo(()=>dbp.filter(filt).map(m=>({
    ...m,
    discountRaw: m.discount,
    discount: (m.discount||0) - (m.placeholderRev||0),
    revGross: (m.revGross||0) - (m.placeholderRev||0),
    revActual: (m.revActual||0)
  })),[dbp, dateStart, dateEnd, selRegion, selStores]);
  // 加購餅乾獨立小計（KPI 卡沿用「獨立看」需求）
  const cookieTotal = useMemo(()=>fDBP.reduce((s,m)=>s+(m.voucher==='加購餅乾'?(m.discount||0):0),0),[fDBP]);
  const phTotal = useMemo(()=>fDBP.reduce((s,m)=>s+(m.placeholderRev||0),0),[fDBP]);
  const fMBS = useMemo(()=>mbs.filter(filt),[mbs, dateStart, dateEnd, selRegion, selStores]);

  const totalGross = useMemo(()=>fMBS.reduce((s,m)=>s+(m.revenue_gross||0),0),[fMBS]);

  const catTotals = useMemo(()=>{
    const c={'行銷折扣':0,'加價購':0,'非行銷折扣':0,'其他':0};
    fDBP.forEach(m=>{ c[m.category]=(c[m.category]||0)+(m.discount||0); });
    return c;
  },[fDBP]);
  const mktTotal = catTotals['行銷折扣']||0;
  const allTotal = mktTotal + (catTotals['加價購']||0) + (catTotals['非行銷折扣']||0) + (catTotals['其他']||0);
  const mktRate = totalGross>0 ? (mktTotal/totalGross*100) : 0;

  const ymNum = (ym)=>{ const p=String(ym).split('-'); return (+p[0])*12+(+p[1]); };
  const maxYMnum = useMemo(()=>{ let mx=0; fDBP.forEach(m=>{ const n=ymNum(m.yearMonth); if(n>mx)mx=n; }); return mx; },[fDBP]);

  const programRank = useMemo(()=>{
    const byV={};
    fDBP.forEach(m=>{
      if(m.category!=='行銷折扣') return;
      if(!byV[m.voucher]) byV[m.voucher]={voucher:m.voucher,discount:0,uses:0,revGross:0,revActual:0,lastYM:''};
      byV[m.voucher].discount+=(m.discount||0);
      byV[m.voucher].uses+=(m.uses||0);
      byV[m.voucher].revGross+=(m.revGross||0);
      byV[m.voucher].revActual+=(m.revActual||0);
      if(m.yearMonth>byV[m.voucher].lastYM) byV[m.voucher].lastYM=m.yearMonth;
    });
    return Object.values(byV).sort((a,b)=>b.discount-a.discount);
  },[fDBP]);
  const programTop = programRank.slice(0,15);

  // v23: 方案排行三檢視 → v24: 四檢視（＋使用次數）—— 固定以「讓利前15大」為母體，換排序與條長
  //   cost=讓利成本（紅）/ rev=帶動實付營收（綠）/ roi=效益比：每$1讓利帶動實付（綠）/ uses=使用次數（青）
  //   注意：效益比＝營收含金量，非增量歸因（高比值方案的客人可能本來就會來）
  const [rankMode, setRankMode] = useState('cost');
  const RANK_MODES = [
    {k:'cost', label:'讓利成本', dk:'discount', name:'折扣金額', color:'#C4412F'},
    {k:'rev',  label:'帶動實付營收', dk:'revActual', name:'帶動實付營收', color:'#22c55e'},
    {k:'roi',  label:'效益比', dk:'roi', name:'每$1讓利帶動實付', color:'#22c55e'},
    {k:'uses', label:'使用次數', dk:'uses', name:'使用次數', color:'#06b6d4'}
  ];
  const rankCfg = RANK_MODES.find(m=>m.k===rankMode) || RANK_MODES[0];
  const programTopView = useMemo(()=>{
    const base = programTop.map(p=>({ ...p, roi: (p.discount>0 ? Math.round(p.revActual/p.discount*10)/10 : 0) }));
    return [...base].sort((a,b)=>(b[rankCfg.dk]||0)-(a[rankCfg.dk]||0));
  },[programTop, rankMode]);

  const yearCompare = useMemo(()=>{
    const byV={}, ys={};
    fDBP.forEach(m=>{
      if(m.category!=='行銷折扣') return;
      const y=String(m.yearMonth).slice(0,4); ys[y]=true;
      if(!byV[m.voucher]) byV[m.voucher]={voucher:m.voucher,total:0};
      byV[m.voucher]['y'+y]=(byV[m.voucher]['y'+y]||0)+(m.discount||0);
      byV[m.voucher].total+=(m.discount||0);
    });
    const yrs=Object.keys(ys).sort().slice(-2);
    const data=Object.values(byV).sort((a,b)=>b.total-a.total).slice(0,10);
    return {yrs, data};
  },[fDBP]);

  const rateTrend = useMemo(()=>{
    const g={}, d={};
    fMBS.forEach(m=>{ g[m.yearMonth]=(g[m.yearMonth]||0)+(m.revenue_gross||0); });
    fDBP.forEach(m=>{ if(m.category==='行銷折扣') d[m.yearMonth]=(d[m.yearMonth]||0)+(m.discount||0); });
    return Object.keys(g).sort().map(ym=>({name:ym, rate: g[ym]>0?((d[ym]||0)/g[ym]*100):0}));
  },[fMBS, fDBP]);

  const retireCandidates = useMemo(()=>{
    return programRank
      .map(p=>({...p, stale: maxYMnum>0 && (maxYMnum - ymNum(p.lastYM))>=3}))
      .filter(p=>p.stale || p.uses<=5)
      .sort((a,b)=>ymNum(a.lastYM)-ymNum(b.lastYM))
      .slice(0,12);
  },[programRank, maxYMnum]);

  const nonMkt = useMemo(()=>{
    const byV={};
    fDBP.forEach(m=>{ if(m.category!=='非行銷折扣') return; byV[m.voucher]=(byV[m.voucher]||0)+(m.discount||0); });
    return Object.keys(byV).map(k=>({voucher:k, discount:byV[k]})).sort((a,b)=>b.discount-a.discount);
  },[fDBP]);

  if(!rawData) return null;

  const catBarData = [{ name:'折扣結構',
    '行銷折扣': catTotals['行銷折扣']||0, '加價購': catTotals['加價購']||0,
    '非行銷折扣': catTotals['非行銷折扣']||0, '其他': catTotals['其他']||0 }];

  return (
    <div className="charts-grid cols-2">
      {/* KPI */}
      <div className="kpi-grid" style={{gridColumn:'1/-1',marginBottom:8}}>
        <div className="kpi-card">
          <div className="kpi-label">行銷折扣總額</div>
          <div className="kpi-value" style={{color:'#C4412F'}}>{fmt.currency(mktTotal)}</div>
          <div className="kpi-sub">{phTotal>0?'已扣 $500券佔位 '+fmt.currency(phTotal):'佔全部折扣 '+(allTotal>0?fmt.pct(mktTotal/allTotal*100):'0%')}</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">行銷折扣率</div>
          <div className="kpi-value" style={{color:'#f59e0b'}}>{fmt.pct(mktRate)}</div>
          <div className="kpi-sub">讓利 ÷ 原價總額（打折前）</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">行銷方案數</div>
          <div className="kpi-value">{programRank.length}</div>
          <div className="kpi-sub">收斂後標準方案</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">非行銷折扣</div>
          <div className="kpi-value" style={{color:'#f59e0b'}}>{fmt.currency(catTotals['非行銷折扣']||0)}</div>
          <div className="kpi-sub">含訂金等，不應算讓利</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">加購餅乾讓利</div>
          <div className="kpi-value" style={{color:'#06b6d4'}}>{fmt.currency(cookieTotal)}</div>
          <div className="kpi-sub">陪同轉化，已計入行銷折扣</div>
        </div>
      </div>

      {/* 大類占比 */}
      <div className="chart-card full-width">
        <div className="chart-title">折扣結構・大類占比</div>
        <div className="chart-subtitle">真正的行銷讓利（含加購餅乾）vs 非行銷（訂金/補償/手動）vs 其他</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={110}>
            <BarChart data={catBarData} layout="vertical" margin={{top:5,right:20,bottom:5,left:20}}>
              <XAxis type="number" stroke="#B89E97" tick={{fontSize:12}} tickFormatter={fmt.short}/>
              <YAxis type="category" dataKey="name" hide/>
              <Tooltip content={<CustomTooltip formatter={fmt.currency}/>}/>
              <Legend wrapperStyle={{fontSize:12}}/>
              <Bar dataKey="行銷折扣" stackId="c" fill={CAT_COLORS['行銷折扣']}/>
              <Bar dataKey="非行銷折扣" stackId="c" fill={CAT_COLORS['非行銷折扣']}/>
              <Bar dataKey="其他" stackId="c" fill={CAT_COLORS['其他']} radius={[0,4,4,0]}/>
            </BarChart>
          </ResponsiveContainer>
        </div>
        {/* 圖例白話註解：讓使用者一眼看懂四大類（刻意不寫死金額，隨期間/分店篩選變動仍正確） */}
        <div style={{marginTop:6,fontSize:12,color:'#6F4E45',lineHeight:1.6}}>
          <div style={{marginBottom:5}}>
            ↑ 這條 = 肚肚<b>原始折扣資料的全部</b>拆解；<b style={{color:'#C4412F'}}>只有「行銷折扣」是真讓利</b>，其餘兩塊都不該算折扣：
          </div>
          <div style={{marginBottom:2}}><span style={{display:'inline-block',width:9,height:9,borderRadius:2,background:CAT_COLORS['行銷折扣'],marginRight:6,verticalAlign:'middle'}}></span><b>行銷折扣</b>：真正的行銷讓利（券／優惠）—— <b>只有這塊算進上方「行銷折扣率」</b>。含<b>加購餅乾</b>＝把陪同客轉化為消費者的推銷讓利（2026-07 起重分類，原列「加價購」）</div>
          <div style={{marginBottom:2}}><span style={{display:'inline-block',width:9,height:9,borderRadius:2,background:CAT_COLORS['非行銷折扣'],marginRight:6,verticalAlign:'middle'}}></span><b>非行銷折扣</b>：訂金／補償／手動調整，<b>不算讓利</b>（多為預收款記錯欄）</div>
          <div><span style={{display:'inline-block',width:9,height:9,borderRadius:2,background:CAT_COLORS['其他'],marginRight:6,verticalAlign:'middle'}}></span><b>其他</b>：分類規則沒對到的零星券，金額通常極小</div>
        </div>
      </div>

      {/* 行銷折扣方案排行（v24：四鏡頭切換＋白話說明） */}
      <div className="chart-card full-width">
        <div className="chart-title">行銷折扣方案排行・{rankCfg.label}</div>
        <div className="quick-btns" style={{margin:'4px 0 8px'}}>
          {RANK_MODES.map(m=>(
            <button key={m.k} className={'quick-btn'+(rankMode===m.k?' active':'')} onClick={()=>setRankMode(m.k)}>{m.label}</button>
          ))}
        </div>
        <div className="chart-subtitle">{
          rankMode==='roi'
          ? '效益比＝每 $1 讓利帶動的實付營收（同一組讓利前 15 大方案）。這是「營收含金量」非增量歸因——高比值方案（如會員9折）的客人可能本來就會來；多券交易營收會重複歸屬'
          : rankMode==='rev'
          ? '同一組讓利前 15 大方案，改依「帶動實付營收」排序（用券交易之實際收款，serial 去重）。多券交易營收會重複歸屬，各方案不可加總'
          : rankMode==='uses'
          ? '同一組讓利前 15 大方案，改依「使用次數」排序（這張券總共被刷了幾次）'
          : '前 15 大方案（手打變體已收斂）。4人同行$500 已扣除 $500券佔位營收=真實讓利。游標懸停看次數／平均讓利／帶動實付營業額；「N折」方案自動反推原價與實付'
        }</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={480}>
            <BarChart data={programTopView} layout="vertical" margin={{left:10,right:30}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis type="number" stroke="#B89E97" tick={{fontSize:12}} tickFormatter={rankMode==='roi'?(v=>'×'+v):fmt.short}/>
              <YAxis type="category" dataKey="voucher" width={180} stroke="#B89E97" tick={{fontSize:12}}/>
              <Tooltip content={<ProgramRankTooltip/>}/>
              <Bar dataKey={rankCfg.dk} name={rankCfg.name} fill={rankCfg.color} radius={[0,4,4,0]}/>
            </BarChart>
          </ResponsiveContainer>
        </div>
        {/* v24 白話說明：帶動營業額怎麼算（刻意不寫死金額，隨期間/分店篩選變動仍正確） */}
        <div style={{marginTop:6,fontSize:12,color:'#6F4E45',lineHeight:1.6}}>
          <div><b>「帶動營業額」怎麼算（白話版）：</b>把「有用到這張券」的每一筆交易挑出來，加總<b>那整筆交易客人實際付的錢</b>（含同一單的陪同費、加購等）。</div>
          <div>・一筆交易可能同時用兩種券，同一筆錢會記在兩個方案上——所以<b>各方案的營業額不能相加</b>當總營收。</div>
          <div>・<b>效益比</b>＝帶動實付 ÷ 折扣讓利＝每讓利 1 元換回幾元實收。比值高不代表要多做（會員9折的客人多半本來就會來）；免費體驗券比值低是「拉新成本」的本質，不是做壞了。</div>
          <div>・4人同行$500 的讓利金額已扣除系統佔位商品（$500券），避免虛高。</div>
        </div>
      </div>

      {/* 方案年度對比 */}
      <div className="chart-card">
        <div className="chart-title">方案年度對比</div>
        <div className="chart-subtitle">前 10 方案 {yearCompare.yrs.join(' vs ')}（看成長/萎縮）</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={360}>
            <BarChart data={yearCompare.data} layout="vertical" margin={{left:10,right:20}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis type="number" stroke="#B89E97" tick={{fontSize:12}} tickFormatter={fmt.short}/>
              <YAxis type="category" dataKey="voucher" width={172} stroke="#B89E97" tick={{fontSize:12}}/>
              <Tooltip content={<CustomTooltip formatter={fmt.currency}/>}/>
              <Legend wrapperStyle={{fontSize:12}}/>
              {yearCompare.yrs.map((y,i)=>(
                <Bar key={y} dataKey={'y'+y} name={y+'年'} fill={i===0?'#C4412F':'#06b6d4'} radius={[0,3,3,0]}/>
              ))}
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* 行銷折扣率月趨勢 */}
      <div className="chart-card">
        <div className="chart-title">行銷折扣率・月趨勢</div>
        <div className="chart-subtitle">讓利 ÷ 原價總額（打折前）</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={360}>
            <LineChart data={rateTrend}>
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis dataKey="name" stroke="#B89E97" tick={{fontSize:12}}/>
              <YAxis stroke="#B89E97" tick={{fontSize:12}} tickFormatter={v=>v.toFixed(1)+'%'}/>
              <Tooltip content={<CustomTooltip formatter={v=>fmt.pct(v)}/>}/>
              <Line type="monotone" dataKey="rate" stroke="#C4412F" strokeWidth={2.5} dot={{r:2}} name="行銷折扣率(%)"/>
            </LineChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* 淘汰候選 */}
      <div className="chart-card">
        <div className="chart-title">淘汰候選</div>
        <div className="chart-subtitle">🔴 末月距今 ≥3 月（停用）或使用 ≤5 次</div>
        <div className="chart-body" style={{maxHeight:360,overflowY:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead><tr style={{textAlign:'left',color:'#B89E97'}}>
              <th style={{padding:'4px 6px'}}>方案</th><th style={{padding:'4px 6px',textAlign:'right'}}>折扣</th>
              <th style={{padding:'4px 6px',textAlign:'right'}}>次數</th><th style={{padding:'4px 6px'}}>末月</th>
            </tr></thead>
            <tbody>
              {retireCandidates.map((p,i)=>(
                <tr key={i} style={{borderTop:'1px solid #F0D9D5'}}>
                  <td style={{padding:'4px 6px'}}>{p.stale?'🔴 ':''}{p.voucher}</td>
                  <td style={{padding:'4px 6px',textAlign:'right'}}>{fmt.currency(p.discount)}</td>
                  <td style={{padding:'4px 6px',textAlign:'right'}}>{p.uses}</td>
                  <td style={{padding:'4px 6px'}}>{p.lastYM}</td>
                </tr>
              ))}
              {retireCandidates.length===0 && (<tr><td colSpan={4} style={{padding:'8px',color:'#B89E97'}}>無候選（所有方案皆活躍）</td></tr>)}
            </tbody>
          </table>
        </div>
      </div>

      {/* 非行銷折扣明細 */}
      <div className="chart-card">
        <div className="chart-title">非行銷折扣明細</div>
        <div className="chart-subtitle">這些不該算行銷讓利；訂金更是預收款記錯欄</div>
        <div className="chart-body" style={{maxHeight:360,overflowY:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead><tr style={{textAlign:'left',color:'#B89E97'}}>
              <th style={{padding:'4px 6px'}}>項目</th><th style={{padding:'4px 6px',textAlign:'right'}}>金額</th>
            </tr></thead>
            <tbody>
              {nonMkt.map((p,i)=>(
                <tr key={i} style={{borderTop:'1px solid #F0D9D5'}}>
                  <td style={{padding:'4px 6px'}}>{p.voucher}</td>
                  <td style={{padding:'4px 6px',textAlign:'right'}}>{fmt.currency(p.discount)}</td>
                </tr>
              ))}
              {nonMkt.length===0 && (<tr><td colSpan={2} style={{padding:'8px',color:'#B89E97'}}>無</td></tr>)}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}


/* ================================================================
   TAB 7: 生日壽星分析
   資料源：rawData.birthdayCake（年月×店×type 數量/營收）
           rawData.birthdayItems（年×加價購品項 數量/營收）
           rawData.discountByProgram（年月×店×方案，取 voucher 含「壽星」
           之行銷折扣 = 當日壽星加價換款69折，uses=使用次數、discount=折扣額）
   免費 = 我的生日蛋糕；加價購 = 其他生日蛋糕（皆主類別「生日蛋糕」）；
   69折換款 = 壽星改選一般甜點享69折（不在生日蛋糕主類別，故另取折扣資料）
   ================================================================ */
const BD_FREE = '#f59e0b';   // 免費 = 琥珀
const BD_PAID = '#06b6d4';   // 加價購 = 青
const BD_SWAP = '#C4412F';   // 69折換款 = 磚紅
const BD_YEAR_COLORS = ['#C4412F','#06b6d4','#22c55e'];

function TabBirthday({rawData, dateStart, dateEnd, selRegion, selStores}){
  const bc = (rawData && rawData.birthdayCake) ? rawData.birthdayCake : [];
  const items = (rawData && rawData.birthdayItems) ? rawData.birthdayItems : [];

  const filteredBC = useMemo(()=>bc.filter(m=>{
    if(dateStart && m.yearMonth < dateStart) return false;
    if(dateEnd && m.yearMonth > dateEnd) return false;
    if(selRegion && selRegion!=='全部' && m.region!==selRegion) return false;
    if(selStores && selStores.length>0 && !selStores.includes(m.store)) return false;
    return true;
  }),[bc, dateStart, dateEnd, selRegion, selStores]);

  // v19: 69折換款（當日壽星加價換款69折）— 來源 discountByProgram，含「壽星」的行銷折扣方案
  const dbp = (rawData && rawData.discountByProgram) ? rawData.discountByProgram : [];
  const filteredSwap = useMemo(()=>dbp.filter(m=>{
    if(m.category!=='行銷折扣') return false;
    if(String(m.voucher||'').indexOf('壽星')<0) return false;
    if(dateStart && m.yearMonth < dateStart) return false;
    if(dateEnd && m.yearMonth > dateEnd) return false;
    if(selRegion && selRegion!=='全部' && m.region!==selRegion) return false;
    if(selStores && selStores.length>0 && !selStores.includes(m.store)) return false;
    return true;
  }),[dbp, dateStart, dateEnd, selRegion, selStores]);

  const kpi = useMemo(()=>{
    let free=0, paid=0, paidRev=0;
    filteredBC.forEach(m=>{
      if(m.type==='免費') free+=(m.qty||0);
      else { paid+=(m.qty||0); paidRev+=(m.revenue||0); }
    });
    let swap=0, swapDisc=0;
    filteredSwap.forEach(m=>{ swap+=(m.uses||0); swapDisc+=(m.discount||0); });
    const total = free+paid+swap;
    // v21: 69折換款營收（推估）— 69折讓利=原價31%、實付=原價69% → 實付 = 讓利 × 69/31
    const swapRev = swapDisc * 69 / 31;
    const totalRev = paidRev + swapRev;
    return { free, paid, swap, swapDisc, swapRev, totalRev, total, paidRev,
             perHead: total>0 ? totalRev/total : 0,
             upgradeRate: total>0 ? ((paid+swap)/total*100) : 0 };
  },[filteredBC, filteredSwap]);

  const monthlyTrend = useMemo(()=>{
    const byYM={};
    const ensure=(ym)=>{ if(!byYM[ym]) byYM[ym]={name:ym, free:0, paid:0, swap:0}; return byYM[ym]; };
    filteredBC.forEach(m=>{
      const r=ensure(m.yearMonth);
      if(m.type==='免費') r.free+=(m.qty||0);
      else r.paid+=(m.qty||0);
    });
    filteredSwap.forEach(m=>{ ensure(m.yearMonth).swap+=(m.uses||0); });
    return Object.values(byYM).sort((a,b)=>a.name<b.name?-1:1);
  },[filteredBC, filteredSwap]);

  const storeData = useMemo(()=>{
    const byStore={};
    const ensure=(st)=>{ if(!byStore[st]) byStore[st]={store:st, free:0, paid:0, swap:0}; return byStore[st]; };
    filteredBC.forEach(m=>{
      const r=ensure(m.store);
      if(m.type==='免費') r.free+=(m.qty||0);
      else r.paid+=(m.qty||0);
    });
    filteredSwap.forEach(m=>{ ensure(m.store).swap+=(m.uses||0); });
    return Object.values(byStore)
      .map(s=>({...s, total:s.free+s.paid+s.swap,
                upgradeRate:(s.free+s.paid+s.swap)>0?((s.paid+s.swap)/(s.free+s.paid+s.swap)*100):0}))
      .sort((a,b)=>b.total-a.total);
  },[filteredBC, filteredSwap]);

  // 加價購品項年度對比（年為最近兩年，動態取，避免寫死年份）
  const itemYears = useMemo(()=>[...new Set(items.map(it=>+it.yr))].sort((a,b)=>a-b).slice(-2),[items]);
  const itemRank = useMemo(()=>{
    const byP={};
    items.forEach(it=>{
      const y=+it.yr;
      if(!itemYears.includes(y)) return;
      if(!byP[it.product]){ byP[it.product]={product:it.product, total:0}; itemYears.forEach(yy=>byP[it.product]['y'+yy]=0); }
      byP[it.product]['y'+y]=(byP[it.product]['y'+y]||0)+(it.qty||0);
      byP[it.product].total+=(it.qty||0);
    });
    return Object.values(byP).sort((a,b)=>b.total-a.total);
  },[items, itemYears]);

  if(!rawData) return null;

  // 後端 birthdayCake 尚未部署時的友善佔位
  if(bc.length===0){
    return (
      <div className="charts-grid">
        <div className="chart-card full-width" style={{textAlign:'center',padding:'48px 24px'}}>
          <div style={{fontSize:'2rem',marginBottom:12}}>🎂</div>
          <div className="chart-title" style={{justifyContent:'center'}}>生日壽星分析・資料準備中</div>
          <div className="chart-subtitle" style={{marginTop:8}}>
            後端 birthdayCake 聚合尚未部署，部署完成後本頁將自動顯示。
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="charts-grid cols-2">
      {/* KPI row */}
      <div className="kpi-grid" style={{gridColumn:'1/-1',marginBottom:8}}>
        <div className="kpi-card">
          <div className="kpi-label">壽星到店總數</div>
          <div className="kpi-value">{fmt.number(kpi.total)}</div>
          <div className="kpi-sub">免費＋加價購＋69折換款</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">升級率</div>
          <div className="kpi-value" style={{color:BD_PAID}}>{fmt.pct(kpi.upgradeRate)}</div>
          <div className="kpi-sub">（加價購＋69折）÷ 總數</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">免費兌換</div>
          <div className="kpi-value" style={{color:BD_FREE}}>{fmt.number(kpi.free)}</div>
          <div className="kpi-sub">我的生日蛋糕</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">加價購</div>
          <div className="kpi-value" style={{color:BD_PAID}}>{fmt.number(kpi.paid)}</div>
          <div className="kpi-sub">其他生日蛋糕</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">69折換款</div>
          <div className="kpi-value" style={{color:BD_SWAP}}>{fmt.number(kpi.swap)}</div>
          <div className="kpi-sub">折扣讓利 {fmt.currency(kpi.swapDisc)}</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">加價購營收</div>
          <div className="kpi-value" style={{color:'var(--success)'}}>{fmt.currency(kpi.paidRev)}</div>
          <div className="kpi-sub">免費款營收 = 0</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">69折換款營收（推估）</div>
          <div className="kpi-value" style={{color:BD_SWAP}}>{fmt.currency(Math.round(kpi.swapRev))}</div>
          <div className="kpi-sub">讓利 × 69/31 反推實付</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">壽星營收合計</div>
          <div className="kpi-value" style={{color:'var(--success)'}}>{fmt.currency(Math.round(kpi.totalRev))}</div>
          <div className="kpi-sub">加價購 + 69折換款（推估）</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">壽星平均消費</div>
          <div className="kpi-value">{fmt.currency(Math.round(kpi.perHead))}</div>
          <div className="kpi-sub">壽星蛋糕營收 ÷ 到店總數（含免費兌換者）｜口徑與上方全店客單價不同</div>
        </div>
      </div>

      {/* Chart 1: 月趨勢（數量） */}
      <div className="chart-card full-width">
        <div className="chart-title">月趨勢・兌換數量</div>
        <div className="chart-subtitle">免費 vs 加價購 vs 69折換款（69折以折扣使用次數計）</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={300}>
            <LineChart data={monthlyTrend}>
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis dataKey="name" stroke="#B89E97" tick={{fontSize:12}}/>
              <YAxis stroke="#B89E97" tick={{fontSize:12}} tickFormatter={fmt.short}/>
              <Tooltip content={<CustomTooltip formatter={fmt.number}/>}/>
              <Legend wrapperStyle={{fontSize:12}}/>
              <Line type="monotone" dataKey="free" name="免費" stroke={BD_FREE} strokeWidth={2.5} dot={{r:2}}/>
              <Line type="monotone" dataKey="paid" name="加價購" stroke={BD_PAID} strokeWidth={2.5} dot={{r:2}}/>
              <Line type="monotone" dataKey="swap" name="69折換款" stroke={BD_SWAP} strokeWidth={2.5} dot={{r:2}}/>
            </LineChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* Chart 2: 分店堆疊（數量） */}
      <div className="chart-card">
        <div className="chart-title">分店・兌換數量</div>
        <div className="chart-subtitle">免費＋加價購＋69折換款 堆疊，依總量降冪</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={320}>
            <BarChart data={storeData} layout="vertical">
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis type="number" stroke="#B89E97" tick={{fontSize:12}} tickFormatter={fmt.short}/>
              <YAxis type="category" dataKey="store" width={112} stroke="#B89E97" tick={{fontSize:12}}/>
              <Tooltip content={<CustomTooltip formatter={fmt.number}/>}/>
              <Legend wrapperStyle={{fontSize:12}}/>
              <Bar dataKey="free" stackId="a" name="免費" fill={BD_FREE} radius={[0,0,0,0]}/>
              <Bar dataKey="paid" stackId="a" name="加價購" fill={BD_PAID} radius={[0,0,0,0]}/>
              <Bar dataKey="swap" stackId="a" name="69折換款" fill={BD_SWAP} radius={[0,4,4,0]}/>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* Chart 3: 分店加購率 */}
      <div className="chart-card">
        <div className="chart-title">分店・升級率</div>
        <div className="chart-subtitle">（加價購＋69折換款）÷ 總數（%），看現場推升級的成效</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={320}>
            <BarChart data={[...storeData].sort((a,b)=>b.upgradeRate-a.upgradeRate)} layout="vertical">
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis type="number" stroke="#B89E97" tick={{fontSize:12}} tickFormatter={v=>v.toFixed(0)+'%'}/>
              <YAxis type="category" dataKey="store" width={112} stroke="#B89E97" tick={{fontSize:12}}/>
              <Tooltip content={<CustomTooltip formatter={v=>fmt.pct(v)}/>}/>
              <Bar dataKey="upgradeRate" name="升級率(%)" fill={BD_PAID} radius={[0,4,4,0]}/>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* Chart 4: 加價購品項年度對比 */}
      <div className="chart-card full-width">
        <div className="chart-title">加價購品項・年度對比</div>
        <div className="chart-subtitle">最近兩年各款加價購蛋糕顆數，看上新替換（不受月份/分店篩選影響）</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={320}>
            <BarChart data={itemRank} layout="vertical">
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis type="number" stroke="#B89E97" tick={{fontSize:12}} tickFormatter={fmt.short}/>
              <YAxis type="category" dataKey="product" width={116} stroke="#B89E97" tick={{fontSize:12}}/>
              <Tooltip content={<CustomTooltip formatter={fmt.number}/>}/>
              <Legend wrapperStyle={{fontSize:12}}/>
              {itemYears.map((y,i)=>(
                <Bar key={y} dataKey={'y'+y} name={y+' 年'} fill={BD_YEAR_COLORS[i%BD_YEAR_COLORS.length]} radius={[0,4,4,0]}/>
              ))}
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
