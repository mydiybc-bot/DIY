<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自己做烘焙聚樂部 — POS 銷售動態儀表板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.15.0/Recharts.min.js"></script>
<style>
/* ===== CSS Reset & Variables ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#FFF8F6;--bg-secondary:#FFF1ED;--bg-card:#FFFFFF;--bg-hover:#FFF1ED;
  --text-primary:#3D2C2A;--text-secondary:#8B6A63;--text-muted:#B89E97;
  --accent:#C4412F;--accent-light:#D4654F;--accent-dark:#A3342A;
  --success:#52B788;--warning:#F4A620;--danger:#C4412F;--info:#1E6A88;
  --border:#F0D9D5;--shadow:0 4px 24px rgba(139,106,99,0.08);
  --region-n1:#C4412F;--region-n2:#D4654F;--region-n3:#1E6A88;--region-cs:#F4A620;
  --radius:12px;--transition:all .2s ease;
}
html{font-size:14px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden}
a{color:var(--accent-light);text-decoration:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg-secondary)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ===== Layout ===== */
.app-header{background:linear-gradient(135deg,#A3342A,#C4412F,#D4654F);padding:20px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.header-inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,#FFFFFF 0%,#FFD4CC 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 4px rgba(58,12,8,.45));letter-spacing:.5px}
.brand .subtitle{font-size:.8rem;color:rgba(255,255,255,.88);text-shadow:0 1px 2px rgba(58,12,8,.4)}
.header-badge{background:var(--accent);color:#fff;font-size:.7rem;padding:2px 8px;border-radius:99px;font-weight:600}
.header-data-range{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.data-range-label{font-size:.65rem;color:#FFFFFF;text-transform:uppercase;letter-spacing:.05em}
.data-range-value{font-size:.85rem;font-weight:700;color:#FFFFFF;letter-spacing:.02em}
.data-range-sub{font-size:.65rem;color:rgba(255,255,255,.85)}

.main-content{max-width:1600px;margin:0 auto;padding:16px}
.filters-bar{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:4px;min-width:140px}
.filter-group label{font-size:.75rem;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.filter-group select,.filter-group input{background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);padding:8px 12px;border-radius:8px;font-size:.85rem;outline:none;transition:var(--transition)}
.filter-group select:focus,.filter-group input:focus{border-color:var(--accent)}
.filter-group select[multiple]{height:auto;min-height:36px}
.quick-btns{display:flex;gap:4px;flex-wrap:wrap}
.quick-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);padding:6px 10px;border-radius:6px;font-size:.75rem;cursor:pointer;transition:var(--transition);white-space:nowrap}
.quick-btn:hover,.quick-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* KPI Cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;transition:var(--transition);position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(139,106,99,0.06)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--radius) var(--radius) 0 0}
.kpi-card:nth-child(1)::before{background:var(--accent)}
.kpi-card:nth-child(2)::before{background:var(--success)}
.kpi-card:nth-child(3)::before{background:var(--warning)}
.kpi-card:nth-child(4)::before{background:var(--info)}
.kpi-card:nth-child(5)::before{background:var(--danger)}
.kpi-card:nth-child(6)::before{background:#8B6A63}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi-label{font-size:.75rem;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.kpi-value{font-size:1.6rem;font-weight:800;letter-spacing:-.5px}
.kpi-sub{font-size:.75rem;color:var(--text-muted);margin-top:2px}

/* Tabs */
.tabs-nav{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;border-bottom:1px solid var(--border)}
.tab-btn{background:transparent;border:none;color:var(--text-secondary);padding:10px 18px;font-size:.85rem;font-weight:600;cursor:pointer;transition:var(--transition);border-bottom:2px solid transparent;white-space:nowrap}
.tab-btn:hover{color:var(--text-primary)}
.tab-btn.active{color:var(--accent-light);border-bottom-color:var(--accent)}

/* Chart containers */
.charts-grid{display:grid;gap:16px}
.charts-grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr))}
.charts-grid.cols-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}
.chart-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-height:320px;display:flex;flex-direction:column;box-shadow:0 1px 4px rgba(139,106,99,0.06)}
.chart-card.full-width{grid-column:1/-1}
.chart-title{font-size:.9rem;font-weight:700;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.chart-subtitle{font-size:.72rem;color:var(--text-muted);margin-bottom:12px}
.chart-body{flex:1;min-height:0}
.chart-toggle{display:flex;gap:4px}
.chart-toggle button{background:var(--bg-primary);border:1px solid var(--border);color:var(--text-secondary);padding:3px 10px;border-radius:4px;font-size:.7rem;cursor:pointer;transition:var(--transition)}
.chart-toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Table */
.data-table-wrap{overflow:auto;max-height:500px}
.data-table{width:100%;border-collapse:separate;border-spacing:0;font-size:.8rem}
.data-table th{position:sticky;top:0;background:var(--bg-secondary);color:var(--text-secondary);font-weight:600;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
.data-table th:hover{color:var(--text-primary)}
.data-table td{padding:6px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.data-table tr:hover td{background:var(--bg-hover)}
.search-input{background:var(--bg-primary);border:1px solid var(--border);color:var(--text-primary);padding:8px 12px;border-radius:8px;font-size:.85rem;width:100%;max-width:300px;margin-bottom:8px;outline:none}
.search-input:focus{border-color:var(--accent)}

/* Heatmap */
.heatmap-grid{display:grid;gap:2px;font-size:.65rem}
.heatmap-cell{border-radius:3px;display:flex;align-items:center;justify-content:center;padding:4px 2px;color:var(--text-secondary);min-height:28px;cursor:default;transition:var(--transition)}
.heatmap-cell:hover{outline:2px solid var(--accent);z-index:1}
.heatmap-label{font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Calendar heatmap */
.cal-grid{display:flex;gap:2px;flex-wrap:wrap}
.cal-cell{width:14px;height:14px;border-radius:2px;cursor:default;transition:var(--transition)}
.cal-cell:hover{outline:1px solid var(--accent-light)}
.cal-month-label{font-size:.65rem;color:var(--text-muted);margin:4px 0 2px}

/* Loading */
.loading-overlay{position:fixed;inset:0;background:var(--bg-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
.spinner{width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:16px;color:var(--text-secondary);font-size:.9rem}
.loading-sub{color:var(--text-muted);font-size:.75rem;margin-top:4px}

/* Footer */
.app-footer{text-align:center;padding:16px;color:var(--text-muted);font-size:.75rem;border-top:1px solid var(--border);margin-top:24px}

/* Responsive */
@media(max-width:768px){
  html{font-size:12px}
  .header-inner{flex-direction:column;align-items:flex-start}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .filters-bar{flex-direction:column}
  .filter-group{width:100%}
  .charts-grid.cols-2,.charts-grid.cols-3{grid-template-columns:1fr}
}

/* Tooltip override */
.recharts-tooltip-wrapper{z-index:10!important}
.custom-tooltip{background:#FFFFFF!important;border:1px solid var(--border)!important;border-radius:8px!important;padding:10px 14px!important;box-shadow:var(--shadow)!important}
.custom-tooltip .label{font-weight:700;margin-bottom:4px;color:var(--text-primary)}
.custom-tooltip .item{font-size:.8rem;color:var(--text-secondary);display:flex;align-items:center;gap:6px;margin:2px 0}
.custom-tooltip .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/* ================================================================
   自己做烘焙聚樂部 — POS 銷售動態儀表板
   ================================================================ */
const { useState, useEffect, useMemo, useCallback, useRef } = React;
const {
  ResponsiveContainer, LineChart, Line, BarChart, Bar, AreaChart, Area,
  XAxis, YAxis, CartesianGrid, Tooltip, Legend, PieChart, Pie, Cell,
  ScatterChart, Scatter, ZAxis, ComposedChart, ReferenceLine
} = Recharts;

/* ---------- CONFIG ---------- */
// ★ 貼上你的 Apps Script Web App URL ★
const API_URL = 'https://script.google.com/macros/s/AKfycbxvD8dQdWJdaK9Ih9ZZc3PRT8rICcqbCrk5cKQY3s6zF1MmZgWL2g803zrJTBsuE3p4pQ/exec';
const BUDGET_API_URL = 'https://script.google.com/macros/s/AKfycbyF6tShTC6O4dpdDTcBSurABM_g_EIE6jAuhq7a4l10fsvk2BqdthJ-u4CTp3Z4yw4T/exec';

// POS 店名 → 店號(對 fact_budget store_id)。13 店固定,字串須與 monthlyByStore.store 完全一致
const POS_NAME_TO_STORE_ID = {
  '台中精明店':1,'台中草悟道店':2,'台北南京店':3,'台北士林店':4,
  '台南Focus店':5,'新竹文化店':6,'新北板橋店':7,'新北新店店':8,
  '桃園中壢店':9,'桃園藝文店':10,'吳寶春自己做台北信義A13店':11,
  '吳寶春自己做高雄SKM Park店':12,'台南西門店 (已歇業)':13
};

const REGION_COLORS = {
  '北一區':'#C4412F','北二區':'#D4654F','北三區':'#06b6d4','中南區':'#f59e0b','未分區':'#B89E97'
};
const CATEGORY_COLORS = [
  '#C4412F','#D4654F','#06b6d4','#22c55e','#f59e0b','#ef4444','#ec4899','#8B6A63',
  '#14b8a6','#f97316','#84cc16','#0ea5e9','#a78bfa','#fb923c','#34d399','#fbbf24'
];
const STORE_COLORS = [
  '#C4412F','#D4654F','#06b6d4','#22c55e','#f59e0b','#ef4444','#ec4899','#8B6A63',
  '#14b8a6','#f97316','#84cc16','#0ea5e9'
];

/* ---------- HELPERS ---------- */
const fmt = {
  currency: v => 'NT$ ' + (v||0).toLocaleString('zh-TW'),
  number: v => (v||0).toLocaleString('zh-TW'),
  pct: v => (v||0).toFixed(1) + '%',
  pct2: v => (v||0).toFixed(2) + '%',
  short: v => {
    if(v>=1e8) return (v/1e8).toFixed(1)+'億';
    if(v>=1e4) return (v/1e4).toFixed(0)+'萬';
    return v.toLocaleString('zh-TW');
  }
};

function getYearMonth(d){ return d ? d.substring(0,7) : '' }
function parseYM(ym){ const [y,m]=ym.split('-'); return new Date(+y,+m-1) }

function getCurrentYM(){
  const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1<10?'0':'')+(d.getMonth()+1);
}
function getLastMonthYM(){
  const d=new Date(); d.setMonth(d.getMonth()-1);
  return d.getFullYear()+'-'+(d.getMonth()+1<10?'0':'')+(d.getMonth()+1);
}
function getQuarterRange(offset=0){
  const d=new Date(); const q=Math.floor(d.getMonth()/3)+offset;
  const y=d.getFullYear()+Math.floor(q/4); const qn=((q%4)+4)%4;
  const s=y+'-'+(qn*3+1<10?'0':'')+(qn*3+1);
  const e=y+'-'+(qn*3+3<10?'0':'')+(qn*3+3);
  return [s,e];
}

/* ---------- CUSTOM TOOLTIP ---------- */
function CustomTooltip({active,payload,label,formatter}){
  if(!active||!payload?.length) return null;
  return (
    <div className="custom-tooltip">
      <div className="label">{label}</div>
      {payload.map((p,i)=>(
        <div key={i} className="item">
          <span className="dot" style={{background:p.color||p.fill}}/>
          {p.name}: {formatter?formatter(p.value):fmt.number(p.value)}
        </div>
      ))}
    </div>
  );
}

/* ================================================================
   MAIN APP
   ================================================================ */
function App(){
  const [rawData, setRawData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [activeTab, setActiveTab] = useState(0);

  // Filters
  const [dateStart, setDateStart] = useState('');
  const [dateEnd, setDateEnd] = useState('');
  const [selRegion, setSelRegion] = useState('全部');
  const [selStores, setSelStores] = useState([]);
  const [quickDate, setQuickDate] = useState('');

  /* ---------- v3: net 由後端算好（daily_discount 白名單口徑，storeCode JOIN）
     已移除前端 STORE_ID_TO_POS_NAME / applyFactDiscountToPOS / fetchFactDiscount
     後端 monthlyByStore[] 直接帶 revenue_gross / revenue_net / discount / discount_breakdown ---------- */

  /* ---------- FETCH DATA (JSONP to avoid GAS CORS redirect issue) ---------- */
  useEffect(()=>{
    setLoading(true);
    const cbName = '_gasCb_' + Date.now();
    const timeout = setTimeout(()=>{
      delete window[cbName];
      setError('API 逾時，請重新整理頁面');
      setLoading(false);
    }, 120000);
    window[cbName] = (d)=>{
      clearTimeout(timeout);
      delete window[cbName];
      try{
        // v3: net 已由後端算好，直接使用 d，不再前端覆蓋
        const finalData = d;
        setRawData(finalData);
        const yms = [...new Set(finalData.monthly.map(m=>m.yearMonth))].sort();
        if(yms.length){
          const cy = new Date().getFullYear().toString();
          const yearMonths = yms.filter(y=>y.startsWith(cy));
          setDateStart(yearMonths.length?yearMonths[0]:yms[0]);
          setDateEnd(yearMonths.length?yearMonths[yearMonths.length-1]:yms[yms.length-1]);
          setQuickDate('ytd');
        }
        setLoading(false);
      }catch(e){setError(e.message);setLoading(false);}
    };
    const script = document.createElement('script');
    script.src = API_URL + (API_URL.includes('?')?'&':'?') + 'callback=' + cbName;
    script.onerror = ()=>{
      clearTimeout(timeout);
      delete window[cbName];
      setError('API 載入失敗，請檢查網路連線');
      setLoading(false);
    };
    document.body.appendChild(script);
  },[]);

  /* ---------- QUICK DATE PRESETS ---------- */
  const applyQuickDate = useCallback((preset)=>{
    if(!rawData) return;
    setQuickDate(preset);
    const yms=[...new Set(rawData.monthly.map(m=>m.yearMonth))].sort();
    if(!yms.length) return;
    const minYM=yms[0], maxYM=yms[yms.length-1];
    const clamp=(v)=> v<minYM?minYM : v>maxYM?maxYM : v;
    const now = new Date();
    const cy = now.getFullYear();
    const cm = now.getMonth()+1;
    const cmStr = cy+'-'+(cm<10?'0':'')+cm;
    let s,e;
    switch(preset){
      case 'thisMonth': s=cmStr; e=cmStr; break;
      case 'lastMonth': {const lm=getLastMonthYM(); s=lm; e=lm;} break;
      case 'thisQ': {[s,e]=getQuarterRange(0);} break;
      case 'lastQ': {[s,e]=getQuarterRange(-1);} break;
      case 'ytd': s=cy+'-01'; e=cmStr; break;
      case 'lastYear': s=(cy-1)+'-01'; e=(cy-1)+'-12'; break;
      case 'all': s=minYM; e=maxYM; break;
      default: return;
    }
    setDateStart(clamp(s)); setDateEnd(clamp(e));
  },[rawData]);

  /* ---------- AVAILABLE MONTHS ---------- */
  const allMonths = useMemo(()=>{
    if(!rawData) return [];
    return [...new Set(rawData.monthly.map(m=>m.yearMonth))].sort();
  },[rawData]);

  /* ---------- STORE LIST (filtered by region) ---------- */
  const availableStores = useMemo(()=>{
    if(!rawData) return [];
    let stores = rawData.filters.stores;
    if(selRegion!=='全部') stores = stores.filter(s=>s.region===selRegion);
    return stores;
  },[rawData, selRegion]);

  /* ---------- FILTERED MONTHLY DATA ---------- */
  const filtered = useMemo(()=>{
    if(!rawData) return [];
    return rawData.monthly.filter(m=>{
      if(dateStart && m.yearMonth < dateStart) return false;
      if(dateEnd && m.yearMonth > dateEnd) return false;
      if(selRegion!=='全部' && m.region!==selRegion) return false;
      if(selStores.length>0 && !selStores.includes(m.store)) return false;
      return true;
    });
  },[rawData, dateStart, dateEnd, selRegion, selStores]);

  /* ---------- v2 fix: NET 營收查找表（從 monthlyByStore 取，因 monthly 細項無 net）---------- */
  const netLookup = useMemo(()=>{
    const mbs = (rawData?.monthlyByStore||[]).filter(m=>{
      if(dateStart && m.yearMonth < dateStart) return false;
      if(dateEnd && m.yearMonth > dateEnd) return false;
      if(selRegion!=='全部' && m.region!==selRegion) return false;
      if(selStores.length>0 && !selStores.includes(m.store)) return false;
      return true;
    });
    const byStore={}, byStoreMonth={};
    mbs.forEach(m=>{
      byStore[m.store]=(byStore[m.store]||0)+(m.revenue_net||0);
      byStoreMonth[m.yearMonth+'|'+m.store]=(byStoreMonth[m.yearMonth+'|'+m.store]||0)+(m.revenue_net||0);
    });
    return { byStore, byStoreMonth };
  },[rawData, dateStart, dateEnd, selRegion, selStores]);

  /* ---------- 不吃月份篩選的資料(只套區域/分店)---------- */
  /* 給 Tab2 圖4「各店陪同率趨勢」用:月份範圍固定為「去年同期再往前 2 個月」至今 */
  const monthlyByStoreNoDate = useMemo(()=>{
    if(!rawData) return [];
    // 計算月份下限:今天往回推 14 個月(去年同期 = 12 個月前,再往前 2 個月)
    const now = new Date();
    const lb = new Date(now.getFullYear(), now.getMonth()-14, 1);
    const lowerBound = lb.getFullYear()+'-'+String(lb.getMonth()+1).padStart(2,'0');
    const src = rawData.monthly.filter(m=>{
      if(m.yearMonth < lowerBound) return false;
      if(selRegion!=='全部' && m.region!==selRegion) return false;
      if(selStores.length>0 && !selStores.includes(m.store)) return false;
      return true;
    });
    const map={};
    src.forEach(m=>{
      const k=m.yearMonth+'|'+m.store;
      if(!map[k]) map[k]={ym:m.yearMonth,store:m.store,region:m.region,revenue:0,headcount:0,companionCount:0};
      const t=map[k]; t.revenue+=m.revenue; t.headcount+=m.headcount; t.companionCount+=m.companionCount;
    });
    return Object.values(map).map(t=>({...t,companionRate:t.headcount>0?(t.companionCount/t.headcount*100):0}));
  },[rawData, selRegion, selStores]);

  /* ---------- FILTERED DAILY DATA ---------- */
  const filteredDaily = useMemo(()=>{
    if(!rawData) return [];
    const startD = dateStart ? dateStart+'-01' : '';
    const endD = dateEnd ? dateEnd+'-31' : '';
    return rawData.daily.filter(d=>{
      if(startD && d.date < startD) return false;
      if(endD && d.date > endD) return false;
      return true;
    });
  },[rawData, dateStart, dateEnd]);

  /* ---------- COMPUTED KPIs ---------- */
  const kpis = useMemo(()=>{
    let totalRev=0, desserts=0, companions=0, limitedRev=0, txns=0;
    filtered.forEach(m=>{
      totalRev+=m.revenue;
      desserts+=m.dessertCount;
      companions+=m.companionCount;
      txns+=m.txnCount;
      if(m.mainCategory==='限定甜點') limitedRev+=m.revenue;
    });
    // v2 fix-1: 用篩選後 monthlyByStore 算淨營收，而非全域 rawData.kpi（補 2 作用域修正）
    const filteredMBSForKpi = (rawData?.monthlyByStore||[]).filter(m=>{
      if(dateStart && m.yearMonth < dateStart) return false;
      if(dateEnd && m.yearMonth > dateEnd) return false;
      if(selRegion && selRegion!=='全部' && m.region!==selRegion) return false;
      if(selStores && selStores.length>0 && !selStores.includes(m.store)) return false;
      return true;
    });
    const totalRevenueNet = filteredMBSForKpi.length>0
      ? filteredMBSForKpi.reduce((s,m)=>s+(m.revenue_net||0),0)
      : totalRev;
    const totalDiscount = filteredMBSForKpi.reduce((s,m)=>s+(m.discount||0),0);
    const hc = desserts + companions;
    return {
      totalRevenue: totalRev,
      totalRevenueNet: totalRevenueNet,
      totalDiscount: totalDiscount,
      headcount: hc,
      dessertCount: desserts,
      companionCount: companions,
      avgSpendPerHead: hc>0 ? Math.round(totalRevenueNet/hc) : 0,
      companionRate: hc>0 ? (companions/hc*100) : 0,
      limitedRevenue: limitedRev,
      limitedRevenueRatio: totalRev>0 ? (limitedRev/totalRev*100) : 0
    };
  },[filtered, rawData, dateStart, dateEnd, selRegion, selStores]);

  /* ---------- AGGREGATIONS FOR CHARTS ---------- */

  // Monthly totals
  const monthlyTotals = useMemo(()=>{
    const map={};
    filtered.forEach(m=>{
      if(!map[m.yearMonth]) map[m.yearMonth]={ym:m.yearMonth,revenue:0,headcount:0,dessertCount:0,companionCount:0};
      const t=map[m.yearMonth];
      t.revenue+=m.revenue; t.headcount+=m.headcount; t.dessertCount+=m.dessertCount; t.companionCount+=m.companionCount;
    });
    // net by month from netLookup.byStoreMonth
    const netByYM={};
    Object.keys(netLookup.byStoreMonth).forEach(k=>{
      const ym=k.split('|')[0];
      netByYM[ym]=(netByYM[ym]||0)+netLookup.byStoreMonth[k];
    });
    return Object.values(map).sort((a,b)=>a.ym<b.ym?-1:1).map(t=>{
      const revenueNet = netByYM[t.ym]!=null ? netByYM[t.ym] : t.revenue;
      return {
        ...t, revenueNet,
        avgSpend: t.headcount>0?Math.round(t.revenue/t.headcount):0,
        avgSpendNet: t.headcount>0?Math.round(revenueNet/t.headcount):0,
        companionRate: t.headcount>0?(t.companionCount/t.headcount*100):0
      };
    });
  },[filtered, netLookup]);

  // Monthly by store
  const monthlyByStore = useMemo(()=>{
    const map={};
    filtered.forEach(m=>{
      const k=m.yearMonth+'|'+m.store;
      if(!map[k]) map[k]={ym:m.yearMonth,store:m.store,region:m.region,revenue:0,headcount:0,dessertCount:0,companionCount:0};
      const t=map[k]; t.revenue+=m.revenue; t.headcount+=m.headcount; t.dessertCount+=m.dessertCount; t.companionCount+=m.companionCount;
    });
    return Object.values(map).map(t=>{
      const revenueNet = netLookup.byStoreMonth[t.ym+'|'+t.store] != null ? netLookup.byStoreMonth[t.ym+'|'+t.store] : t.revenue;
      return {
        ...t, revenueNet,
        avgSpend:t.headcount>0?Math.round(t.revenue/t.headcount):0,
        avgSpendNet:t.headcount>0?Math.round(revenueNet/t.headcount):0,
        companionRate:t.headcount>0?(t.companionCount/t.headcount*100):0
      };
    });
  },[filtered, netLookup]);

  // Monthly by main category
  const monthlyByCat = useMemo(()=>{
    const map={};
    filtered.forEach(m=>{
      const k=m.yearMonth+'|'+m.mainCategory;
      if(!map[k]) map[k]={ym:m.yearMonth,cat:m.mainCategory,revenue:0};
      map[k].revenue+=m.revenue;
    });
    return Object.values(map);
  },[filtered]);

  // Store totals
  const storeTotals = useMemo(()=>{
    const map={};
    filtered.forEach(m=>{
      if(!map[m.store]) map[m.store]={store:m.store,region:m.region,revenue:0,headcount:0,dessertCount:0,companionCount:0};
      const t=map[m.store]; t.revenue+=m.revenue; t.headcount+=m.headcount; t.dessertCount+=m.dessertCount; t.companionCount+=m.companionCount;
    });
    return Object.values(map).map(t=>{
      const revenueNet = netLookup.byStore[t.store] != null ? netLookup.byStore[t.store] : t.revenue;
      return {
        ...t, revenueNet,
        avgSpend:t.headcount>0?Math.round(t.revenue/t.headcount):0,
        avgSpendNet:t.headcount>0?Math.round(revenueNet/t.headcount):0,
        companionRate:t.headcount>0?(t.companionCount/t.headcount*100):0
      };
    }).sort((a,b)=>b.revenueNet-a.revenueNet);
  },[filtered, netLookup]);

  // Category totals (exclude '找不到')
  const catTotals = useMemo(()=>{
    const map={};
    filtered.forEach(m=>{
      if(m.mainCategory==='找不到') return;
      if(!map[m.mainCategory]) map[m.mainCategory]={cat:m.mainCategory,revenue:0};
      map[m.mainCategory].revenue+=m.revenue;
    });
    return Object.values(map).sort((a,b)=>b.revenue-a.revenue);
  },[filtered]);

  // Product rank (all products)
  const filteredProducts = useMemo(()=>{
    if(!rawData) return [];
    return rawData.productRank;
  },[rawData]);

  // Sub-category (limited edition) totals — based on subCategory within 限定甜點
  const subCatTotals = useMemo(()=>{
    const map={};
    filtered.forEach(m=>{
      if(m.mainCategory!=='限定甜點') return;
      const label = (!m.subCategory || m.subCategory==='無' || m.subCategory==='找不到') ? '其他限定' : m.subCategory;
      if(!map[label]) map[label]={name:label,revenue:0};
      map[label].revenue+=m.revenue;
    });
    return Object.values(map).sort((a,b)=>b.revenue-a.revenue);
  },[filtered]);

  // Monthly limited vs regular — based on mainCategory==='限定甜點'
  const monthlyLimitedVsRegular = useMemo(()=>{
    const map={};
    filtered.forEach(m=>{
      if(!map[m.yearMonth]) map[m.yearMonth]={ym:m.yearMonth,limited:0,regular:0};
      if(m.mainCategory==='限定甜點') map[m.yearMonth].limited+=m.revenue;
      else map[m.yearMonth].regular+=m.revenue;
    });
    return Object.values(map).sort((a,b)=>a.ym<b.ym?-1:1);
  },[filtered]);

  // Price bands (from raw data)
  const priceBands = useMemo(()=>rawData?.priceBands||[],[rawData]);

  // Unique stores in filtered data
  const storesInData = useMemo(()=>{
    return [...new Set(filtered.map(m=>m.store))].sort();
  },[filtered]);

  /* ---------- LOADING / ERROR ---------- */
  if(loading) return (
    <div className="loading-overlay">
      <div className="spinner"/>
      <div className="loading-text">正在載入儀表板資料…</div>
      <div className="loading-sub">從 Google Sheets 取得預聚合摘要</div>
    </div>
  );
  if(error) return (
    <div className="loading-overlay">
      <div style={{color:REGION_COLORS['中南區'],fontSize:'2rem',marginBottom:12}}>⚠</div>
      <div className="loading-text" style={{color:'var(--danger)'}}>載入失敗</div>
      <div className="loading-sub">{error}</div>
      <button onClick={()=>window.location.reload()} style={{marginTop:16,padding:'8px 24px',background:'var(--accent)',color:'#fff',border:'none',borderRadius:8,cursor:'pointer'}}>重試</button>
    </div>
  );

  const tabs = ['目標達成','營收趨勢','分店比較','品項分析','客單價分析','季節&活動','折扣分析','生日壽星'];

  return (
    <div>
      {/* HEADER */}
      <header className="app-header">
        <div className="header-inner">
          <div className="brand">
            <div>
              <h1>🧁 自己做烘焙聚樂部</h1>
              <div className="subtitle">POS 銷售動態儀表板 — {rawData.filters.stores.filter(s=>!s.closed).length} 家門市</div>
            </div>
            <span className="header-badge">LIVE</span>
            <a href="hub.html" style={{display:'inline-flex',alignItems:'center',gap:'6px',background:'rgba(255,255,255,.2)',border:'1px solid rgba(255,255,255,.35)',borderRadius:'20px',padding:'6px 16px',fontSize:'13px',fontWeight:600,color:'white',textDecoration:'none',whiteSpace:'nowrap',marginLeft:'12px'}}>⬅ 回首頁</a>
          </div>
          {(() => {
            const yms = [...new Set(rawData.monthly.map(m=>m.yearMonth))].sort();
            if(!yms.length) return null;
            const start = yms[0];
            const end = yms[yms.length-1];
            const months = yms.length;
            const fmtYM = ym => {
              const [y,m] = ym.split('-');
              return y+'年'+parseInt(m)+'月';
            };
            const lastUpdated = rawData.lastUpdated
              ? new Date(rawData.lastUpdated).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})
              : '—';
            return (
              <div className="header-data-range">
                <div className="data-range-label">📅 資料有效期間</div>
                <div className="data-range-value">{fmtYM(start)} ～ {fmtYM(end)}</div>
                <div className="data-range-sub">共 {months} 個月｜最後更新 {lastUpdated}</div>
              </div>
            );
          })()}
        </div>
      </header>

      <div className="main-content">
        {/* FILTERS */}
        <div className="filters-bar">
          <div className="filter-group">
            <label>起始月份</label>
            <select value={dateStart} onChange={e=>{setDateStart(e.target.value);setQuickDate('')}}>
              {allMonths.map(m=><option key={m} value={m}>{m}</option>)}
            </select>
          </div>
          <div className="filter-group">
            <label>結束月份</label>
            <select value={dateEnd} onChange={e=>{setDateEnd(e.target.value);setQuickDate('')}}>
              {allMonths.map(m=><option key={m} value={m}>{m}</option>)}
            </select>
          </div>
          <div className="filter-group">
            <label>快速選擇</label>
            <div className="quick-btns">
              {[['thisMonth','本月'],['lastMonth','上月'],['thisQ','本季'],['lastQ','上季'],['ytd','今年至今'],['lastYear','去年'],['all','全部']].map(([k,l])=>(
                <button key={k} className={'quick-btn'+(quickDate===k?' active':'')} onClick={()=>applyQuickDate(k)}>{l}</button>
              ))}
            </div>
          </div>
          <div className="filter-group">
            <label>區域</label>
            <select value={selRegion} onChange={e=>{setSelRegion(e.target.value);setSelStores([])}}>
              <option value="全部">全部區域</option>
              {rawData.filters.regions.map(r=><option key={r} value={r}>{r}</option>)}
            </select>
          </div>
          <div className="filter-group">
            <label>分店</label>
            <select multiple value={selStores} onChange={e=>{
              const opts=[...e.target.selectedOptions].map(o=>o.value);
              setSelStores(opts);
            }} style={{minHeight:60}}>
              {availableStores.map(s=><option key={s.name} value={s.name}>{s.name}{s.closed?' (已歇業)':''}</option>)}
            </select>
          </div>
        </div>

        {/* KPI CARDS */}
        <div className="kpi-grid">
          <div className="kpi-card">
            <div className="kpi-label">淨營收（已扣折扣）</div>
            <div className="kpi-value" style={{color:'var(--accent-light)'}}>{fmt.currency(kpis.totalRevenueNet)}</div>
            <div className="kpi-sub">{monthlyTotals.length} 個月份</div>
          </div>
          <div className="kpi-card">
            <div className="kpi-label">來客數</div>
            <div className="kpi-value" style={{color:'var(--success)'}}>{fmt.number(kpis.headcount)}</div>
            <div className="kpi-sub">甜點 {fmt.number(kpis.dessertCount)} + 陪同 {fmt.number(kpis.companionCount)}</div>
          </div>
          <div className="kpi-card">
            <div className="kpi-label">客單價</div>
            <div className="kpi-value" style={{color:'var(--warning)'}}>{fmt.currency(kpis.avgSpendPerHead)}</div>
            <div className="kpi-sub">淨營收 ÷ 來客數</div>
          </div>
          <div className="kpi-card">
            <div className="kpi-label">陪同率</div>
            <div className="kpi-value" style={{color:'var(--info)'}}>{fmt.pct(kpis.companionRate)}</div>
            <div className="kpi-sub">陪同 ÷ 總來客</div>
          </div>
          <div className="kpi-card">
            <div className="kpi-label">甜點銷售數</div>
            <div className="kpi-value" style={{color:'var(--danger)'}}>{fmt.number(kpis.dessertCount)}</div>
            <div className="kpi-sub">甜點品項列數合計</div>
          </div>
          <div className="kpi-card">
            <div className="kpi-label">限定甜點營收佔比</div>
            <div className="kpi-value" style={{color:'#8B6A63'}}>{fmt.pct(kpis.limitedRevenueRatio)}</div>
            <div className="kpi-sub">限定甜點 {fmt.currency(kpis.limitedRevenue)}</div>
          </div>
        </div>

        {/* TABS */}
        <div className="tabs-nav">
          {tabs.map((t,i)=>(
            <button key={i} className={'tab-btn'+(activeTab===i?' active':'')} onClick={()=>setActiveTab(i)}>{t}</button>
          ))}
        </div>

        {/* TAB CONTENT */}
        {activeTab===0 && <TabTarget monthlyByStore={monthlyByStore} storesInData={storesInData} dateStart={dateStart} dateEnd={dateEnd} selRegion={selRegion} selStores={selStores}/>}
        {activeTab===1 && <TabRevenue monthlyTotals={monthlyTotals} monthlyByStore={monthlyByStore} monthlyByCat={monthlyByCat} storesInData={storesInData} catTotals={catTotals} rawData={rawData} dateStart={dateStart} dateEnd={dateEnd} selRegion={selRegion} selStores={selStores}/>}
        {activeTab===2 && <TabStoreCompare storeTotals={storeTotals} monthlyByStore={monthlyByStore} monthlyByStoreNoDate={monthlyByStoreNoDate} storesInData={storesInData} rawData={rawData} dateStart={dateStart} dateEnd={dateEnd} selRegion={selRegion} selStores={selStores}/>}
        {activeTab===3 && <TabProductAnalysis catTotals={catTotals} filteredProducts={filteredProducts}/>}
        {activeTab===4 && <TabAvgSpend priceBands={priceBands} storeTotals={storeTotals} monthlyByStore={monthlyByStore} storesInData={storesInData} overallAvg={kpis.avgSpendPerHead}/>}
        {activeTab===5 && <TabSeasonal data={rawData}/>}
        {activeTab===6 && <TabDiscount rawData={rawData} dateStart={dateStart} dateEnd={dateEnd} selRegion={selRegion} selStores={selStores}/>}
        {activeTab===7 && <TabBirthday rawData={rawData} dateStart={dateStart} dateEnd={dateEnd} selRegion={selRegion} selStores={selStores}/>}
      </div>

      {/* FOOTER */}
      <footer className="app-footer">
        <div>最後更新時間：{rawData.lastUpdated ? new Date(rawData.lastUpdated).toLocaleString('zh-TW') : '—'}</div>
        <div>資料筆數：{fmt.number(rawData.totalRows)} 筆 | 快取 TTL 1 小時</div>
        <div style={{marginTop:4}}>© 自己做烘焙聚樂部 POS Dashboard</div>
      </footer>
    </div>
  );
}

/* ================================================================
   TAB 0: 目標達成（各店逐月營收目標 vs 實際淨營收）
   - 目標來源:預算 GAS get_store_monthly_budget(store_id × month)
   - 實際來源:POS 自己的 monthlyByStore.revenueNet(同源)
   - join key:店號(POS店名→POS_NAME_TO_STORE_ID→預算 store id)
   ================================================================ */
function TabTarget({monthlyByStore, storesInData, dateStart, dateEnd, selRegion, selStores}){
  const [budgetData, setBudgetData] = React.useState(null);
  const [bLoading, setBLoading] = React.useState(true);
  const [bError, setBError] = React.useState(null);

  // 載入各店逐月目標(JSONP,與主程式同模式)
  React.useEffect(()=>{
    setBLoading(true);
    const cbName = '_budgetCb_' + Date.now();
    const timeout = setTimeout(()=>{ delete window[cbName]; setBError('目標資料載入逾時'); setBLoading(false); }, 30000);
    window[cbName] = (d)=>{
      clearTimeout(timeout); delete window[cbName];
      if(d && d.error){ setBError('目標 API:'+d.error); setBLoading(false); return; }
      setBudgetData(d); setBLoading(false);
    };
    const script = document.createElement('script');
    script.src = BUDGET_API_URL + '?action=get_store_monthly_budget&callback=' + cbName;
    script.onerror = ()=>{ clearTimeout(timeout); delete window[cbName]; setBError('目標 API 載入失敗'); setBLoading(false); };
    document.body.appendChild(script);
  },[]);

  // 目標查找表:storeId -> { 'YYYY-MM' -> budget }
  const budgetLookup = React.useMemo(()=>{
    const lk={};
    if(!budgetData || !budgetData.stores) return lk;
    budgetData.stores.forEach(s=>{
      lk[s.id]={};
      (s.monthly||[]).forEach(m=>{ lk[s.id][m.month]=m.budget; });
    });
    return lk;
  },[budgetData]);

  // 實際淨營收(已吃篩選的 monthlyByStore) join 目標,逐月合計
  const { series, totalTarget, totalActual, missStores } = React.useMemo(()=>{
    const agg={};          // ym -> {target, actual}
    const miss={};
    (monthlyByStore||[]).forEach(m=>{
      const sid = POS_NAME_TO_STORE_ID[m.store];
      if(!sid){ miss[m.store]=true; return; }
      if(!agg[m.ym]) agg[m.ym]={ym:m.ym,target:0,actual:0};
      agg[m.ym].actual += (m.revenueNet!=null?m.revenueNet:m.revenue)||0;
      const t = budgetLookup[sid] ? budgetLookup[sid][m.ym] : null;
      if(t!=null) agg[m.ym].target += t;
    });
    const ser = Object.values(agg).sort((a,b)=>a.ym<b.ym?-1:1).map(r=>({
      name:r.ym, 目標:r.target, 實際:r.actual,
      達成率: r.target>0 ? Math.round(r.actual/r.target*1000)/10 : 0
    }));
    const tt = ser.reduce((s,r)=>s+r.目標,0);
    const ta = ser.reduce((s,r)=>s+r.實際,0);
    return { series:ser, totalTarget:tt, totalActual:ta, missStores:Object.keys(miss) };
  },[monthlyByStore, budgetLookup]);

  // 各店達成率(整個篩選區間合計)
  const storeRows = React.useMemo(()=>{
    const byStore={};
    (monthlyByStore||[]).forEach(m=>{
      const sid = POS_NAME_TO_STORE_ID[m.store];
      if(!byStore[m.store]) byStore[m.store]={store:m.store,sid:sid,target:0,actual:0};
      byStore[m.store].actual += (m.revenueNet!=null?m.revenueNet:m.revenue)||0;
      const t = (sid && budgetLookup[sid]) ? budgetLookup[sid][m.ym] : null;
      if(t!=null) byStore[m.store].target += t;
    });
    return Object.values(byStore).map(r=>({
      ...r, pct: r.target>0 ? Math.round(r.actual/r.target*1000)/10 : null,
      diff: r.actual - r.target
    })).sort((a,b)=>(b.pct||-1)-(a.pct||-1));
  },[monthlyByStore, budgetLookup]);

  // 開發期警告:join miss 的店印到 console 方便抓漏
  React.useEffect(()=>{
    if(missStores.length) console.warn('[目標達成] 以下 POS 店名對不到店號,請檢查 POS_NAME_TO_STORE_ID:', missStores);
  },[missStores]);

  if(bLoading) return <div style={{padding:40,textAlign:'center',color:'#B89E97'}}>載入目標資料中…</div>;
  if(bError) return <div style={{padding:40,textAlign:'center',color:'var(--danger)'}}>{bError}</div>;

  const overallPct = totalTarget>0 ? (totalActual/totalTarget*100) : 0;
  const pctColor = p => p>=100 ? '#22c55e' : p>=90 ? '#f59e0b' : '#C4412F';

  return (
    <div className="charts-grid cols-2">
      {/* KPI 列 */}
      <div className="chart-card full-width" style={{display:'flex',gap:24,flexWrap:'wrap',alignItems:'center',justifyContent:'space-around'}}>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:'.8rem',color:'#B89E97'}}>區間目標合計</div>
          <div style={{fontSize:'1.6rem',fontWeight:800,color:'#8B6A63'}}>{fmt.currency(totalTarget)}</div>
        </div>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:'.8rem',color:'#B89E97'}}>實際淨營收合計</div>
          <div style={{fontSize:'1.6rem',fontWeight:800,color:'var(--accent-light)'}}>{fmt.currency(totalActual)}</div>
        </div>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:'.8rem',color:'#B89E97'}}>整體達成率</div>
          <div style={{fontSize:'1.6rem',fontWeight:800,color:pctColor(overallPct)}}>{fmt.pct(overallPct)}</div>
        </div>
      </div>

      {/* 1. 逐月 目標 vs 實際(柱) + 達成率(線) */}
      <div className="chart-card full-width">
        <div className="chart-title"><span>逐月目標達成（全店合計）</span></div>
        <div className="chart-subtitle">柱狀=目標 vs 實際淨營收 / 折線=達成率</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={320}>
            <ComposedChart data={series}>
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis dataKey="name" stroke="#B89E97" tick={{fontSize:11}}/>
              <YAxis yAxisId="left" stroke="#B89E97" tick={{fontSize:10}} tickFormatter={fmt.short}/>
              <YAxis yAxisId="right" orientation="right" stroke="#f59e0b" tick={{fontSize:10}} tickFormatter={v=>v+'%'}/>
              <Tooltip content={<CustomTooltip formatter={fmt.currency}/>}/>
              <Legend wrapperStyle={{fontSize:11}}/>
              <Bar yAxisId="left" dataKey="目標" fill="#8B6A63" opacity={0.55} name="目標" radius={[4,4,0,0]}/>
              <Bar yAxisId="left" dataKey="實際" fill="#C4412F" opacity={0.85} name="實際淨營收" radius={[4,4,0,0]}/>
              <Line yAxisId="right" type="monotone" dataKey="達成率" stroke="#f59e0b" strokeWidth={2.5} dot={{r:3}} name="達成率(%)"/>

}

function TabRevenue({monthlyTotals, monthlyByStore, monthlyByCat, storesInData, catTotals, rawData, dateStart, dateEnd, selRegion, selStores}){

  // Revenue line chart data (v2: adds net revenue line from monthlyByStore API data)
  const revenueLineData = useMemo(()=>{
    // Build net revenue totals by yearMonth from rawData.monthlyByStore
    const mbs = rawData?.monthlyByStore || [];
    const filteredMBS = mbs.filter(m=>{
      if(dateStart && m.yearMonth < dateStart) return false;
      if(dateEnd && m.yearMonth > dateEnd) return false;
      if(selRegion && selRegion!=='全部' && m.region!==selRegion) return false;
      if(selStores && selStores.length>0 && !selStores.includes(m.store)) return false;
      return true;
    });
    const netByYM={};
    filteredMBS.forEach(m=>{
      netByYM[m.yearMonth]=(netByYM[m.yearMonth]||0)+(m.revenue_net||0);
    });

    if(viewMode==='total') return monthlyTotals.map(t=>({name:t.ym,revenue:t.revenue,revenueNet:netByYM[t.ym]||0}));
    // By store: pivot（v2 改用 net 淨營收）
    const yms = [...new Set(monthlyByStore.map(m=>m.ym))].sort();
    const stores = [...new Set(monthlyByStore.map(m=>m.store))];
    return yms.map(ym=>{
      const row={name:ym};
      stores.forEach(s=>{
        const found = monthlyByStore.find(m=>m.ym===ym&&m.store===s);

function TabStoreCompare({storeTotals, monthlyByStore, monthlyByStoreNoDate, storesInData, rawData, dateStart, dateEnd, selRegion, selStores}){
  // 圖1-3:各店比較,X 軸 = 12 家店,沿用 storeTotals(吃篩選器)
  // 依營收排序,讓三張圖門市順序一致
  // v2: add revenueNet from rawData.monthlyByStore
  const storeData = useMemo(()=>{
    const mbs = rawData?.monthlyByStore || [];
    const filteredMBS = mbs.filter(m=>{
      if(dateStart && m.yearMonth < dateStart) return false;
      if(dateEnd && m.yearMonth > dateEnd) return false;
      if(selRegion && selRegion!=='全部' && m.region!==selRegion) return false;
      if(selStores && selStores.length>0 && !selStores.includes(m.store)) return false;
      return true;
    });
    const netByStore={};
    filteredMBS.forEach(m=>{ netByStore[m.store]=(netByStore[m.store]||0)+(m.revenue_net||0); });
    return [...storeTotals].sort((a,b)=>b.revenueNet-a.revenueNet).map(s=>{
      const revenueNet = netByStore[s.store]!=null ? netByStore[s.store] : s.revenue;
      return {...s, revenueNet, avgSpendNet: s.headcount>0?Math.round(revenueNet/s.headcount):0};
    });
  },[storeTotals, rawData, dateStart, dateEnd, selRegion, selStores]);

  // 圖4:各店陪同率趨勢,X 軸 = 月份,pivot monthlyByStoreNoDate(不吃月份篩選)
  const companionTrend = useMemo(()=>{
    const yms=[...new Set(monthlyByStoreNoDate.map(m=>m.ym))].sort();
    const stores=[...new Set(monthlyByStoreNoDate.map(m=>m.store))];
    const data = yms.map(ym=>{
      const row={name:ym.substring(2)};
      stores.forEach(s=>{
        const f=monthlyByStoreNoDate.find(m=>m.ym===ym&&m.store===s);
        row[s]=f?Number(f.companionRate.toFixed(1)):null;
      });
      return row;
    });
    return {data, stores};
  },[monthlyByStoreNoDate]);

  return (
    <div className="charts-grid cols-2">
      {/* 1. 各店:營收 vs 來客數 */}
      <div className="chart-card">
        <div className="chart-title">各店：淨營收 vs 來客數</div>
        <div className="chart-subtitle">柱狀=淨營收（已扣折扣）/ 折線=來客數</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={300}>
            <ComposedChart data={storeData}>
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis dataKey="store" stroke="#B89E97" tick={{fontSize:9,angle:-30,textAnchor:'end'}} height={80}/>
              <YAxis yAxisId="left" stroke="#C4412F" tick={{fontSize:10}} tickFormatter={fmt.short}/>
              <YAxis yAxisId="right" orientation="right" stroke="#22c55e" tick={{fontSize:10}} tickFormatter={fmt.short}/>
              <Tooltip content={<CustomTooltip formatter={v=>fmt.number(v)}/>}/>
              <Legend wrapperStyle={{fontSize:11}}/>
              <Bar yAxisId="left" dataKey="revenueNet" fill="#C4412F" opacity={0.75} name="淨營收" radius={[4,4,0,0]}/>
              <Line yAxisId="right" type="monotone" dataKey="headcount" stroke="#22c55e" strokeWidth={2.5} dot={{r:3}} name="來客數"/>
            </ComposedChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* 2. 各店:營收 vs 客單價 */}
      <div className="chart-card">
        <div className="chart-title">各店：淨營收 vs 淨客單價</div>
        <div className="chart-subtitle">柱狀=淨營收 / 折線=淨客單價（皆已扣折扣）</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={300}>
            <ComposedChart data={storeData}>
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis dataKey="store" stroke="#B89E97" tick={{fontSize:9,angle:-30,textAnchor:'end'}} height={80}/>
              <YAxis yAxisId="left" stroke="#C4412F" tick={{fontSize:10}} tickFormatter={fmt.short}/>
              <YAxis yAxisId="right" orientation="right" stroke="#f59e0b" tick={{fontSize:10}} tickFormatter={v=>'$'+fmt.short(v)}/>

              <Bar yAxisId="left" dataKey="revenueNet" fill="#C4412F" opacity={0.75} name="淨營收" radius={[4,4,0,0]}/>
              <Line yAxisId="right" type="monotone" dataKey="avgSpendNet" stroke="#f59e0b" strokeWidth={2.5} dot={{r:3}} name="淨客單價"/>
            </ComposedChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* 3. 各店:來客數 vs 客單價 */}

      {/* 4. 各店陪同率趨勢(月份固定:去年同期再往前 2 個月至今)*/}
      <div className="chart-card">
        <div className="chart-title">各店陪同率趨勢</div>
        <div className="chart-subtitle">月份範圍：去年同期再往前 2 個月～本月（不受上方月份篩選影響）</div>

          <ResponsiveContainer width="100%" height={300}>

              {companionTrend.stores.map((s,i)=>(

/* ================================================================
   TAB 3: 品項分析
   ================================================================ */
function TabProductAnalysis({catTotals, filteredProducts}){
  const [rankMode, setRankMode] = useState('revenue'); // revenue | qty
  const [searchTerm, setSearchTerm] = useState('');
  const [sortCol, setSortCol] = useState('totalRevenue');
  const [sortDir, setSortDir] = useState('desc');

  const top20 = useMemo(()=>{
    const sorted = [...filteredProducts].sort((a,b)=>rankMode==='revenue'?b.totalRevenue-a.totalRevenue:b.totalQty-a.totalQty);
    return sorted.slice(0,20).reverse(); // reverse for horizontal bar
  },[filteredProducts, rankMode]);

  const tableData = useMemo(()=>{
    let data = filteredProducts;
    if(searchTerm){
      const term = searchTerm.toLowerCase();
      data = data.filter(p=>p.product.toLowerCase().includes(term)||p.mainCategory.toLowerCase().includes(term)||p.subCategory.toLowerCase().includes(term));
    }
    data = [...data].sort((a,b)=>{
      const av=a[sortCol], bv=b[sortCol];
      if(typeof av==='string') return sortDir==='asc'?av.localeCompare(bv):bv.localeCompare(av);
      return sortDir==='asc'?av-bv:bv-av;
    });
    return data.slice(0,100);
  },[filteredProducts, searchTerm, sortCol, sortDir]);

  function handleSort(col){ if(sortCol===col) setSortDir(d=>d==='asc'?'desc':'asc'); else { setSortCol(col); setSortDir('desc'); } }
  const sortIcon = (col)=> sortCol===col ? (sortDir==='asc'?' ▲':' ▼') : '';

  return (
    <div className="charts-grid cols-2">
      {/* Disclaimer */}
      <div style={{gridColumn:'1/-1',padding:'8px 14px',background:'#fffbeb',border:'1px solid #fde68a',borderRadius:8}}>

          <ResponsiveContainer width="100%" height={300}>
            <PieChart>
              <Pie data={catTotals} dataKey="revenue" nameKey="cat" cx="50%" cy="50%" innerRadius={60} outerRadius={110} paddingAngle={2} label={({cat,percent})=>`${cat} ${(percent*100).toFixed(0)}%`} labelLine={true} style={{fontSize:10}}>
                {catTotals.map((c,i)=><Cell key={i} fill={CATEGORY_COLORS[i%CATEGORY_COLORS.length]}/>)}
              </Pie>
              <Tooltip content={<CustomTooltip formatter={fmt.currency}/>}/>
            </PieChart>
          </ResponsiveContainer>
        </div>

function TabAvgSpend({priceBands, storeTotals, monthlyByStore, storesInData, overallAvg}){
  // Store avg spend monthly
  const storeMonthlyAvg = useMemo(()=>{
    const yms=[...new Set(monthlyByStore.map(m=>m.ym))].sort();
    const stores=[...new Set(monthlyByStore.map(m=>m.store))];
    // Aggregate by store+month
    const map={};
    monthlyByStore.forEach(m=>{
      const k=m.ym+'|'+m.store;
      if(!map[k]) map[k]={ym:m.ym,store:m.store,revenue:0,headcount:0};
      map[k].revenue+=(m.revenueNet!=null?m.revenueNet:m.revenue); map[k].headcount+=m.headcount;
    });
    return {
      data: yms.map(ym=>{
        const row={name:ym};
        stores.forEach(s=>{
          const f=map[ym+'|'+s];
          row[s]=f&&f.headcount>0?Math.round(f.revenue/f.headcount):0;
        });
        return row;
      }),
      stores
    };
  },[monthlyByStore]);

  return (
    <div className="charts-grid cols-2">
      {/* 1. Price band histogram */}
      <div className="chart-card">
        <div className="chart-title">甜點單價分布</div>
        <div className="chart-subtitle">5 個價格帶</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={280}>
            <BarChart data={priceBands}>
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis dataKey="band" stroke="#B89E97" tick={{fontSize:11}}/>
              <YAxis stroke="#B89E97" tick={{fontSize:10}} tickFormatter={fmt.short}/>
              <Tooltip content={<CustomTooltip formatter={fmt.number}/>}/>
              <Bar dataKey="count" name="數量" fill="#D4654F" radius={[4,4,0,0]}/>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* 2. Store avg spend bar + overall avg line */}
      <div className="chart-card">
        <div className="chart-title">各店淨客單價</div>
        <div className="chart-subtitle">已扣折扣 ｜ 虛線＝全店平均 {fmt.currency(overallAvg)}</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={280}>
            <ComposedChart data={storeTotals}>
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis dataKey="store" stroke="#B89E97" tick={{fontSize:9,angle:-30,textAnchor:'end'}} height={80}/>
              <YAxis stroke="#B89E97" tick={{fontSize:10}} tickFormatter={v=>'$'+fmt.short(v)}/>
              <Tooltip content={<CustomTooltip formatter={fmt.currency}/>}/>
              <Bar dataKey="avgSpendNet" name="淨客單價" radius={[4,4,0,0]}>
                {storeTotals.map((s,i)=><Cell key={i} fill={REGION_COLORS[s.region]||'#B89E97'}/>)}
              </Bar>
              <ReferenceLine y={overallAvg} stroke="#ef4444" strokeDasharray="5 5" label={{value:'全店平均',fill:'#ef4444',fontSize:11}}/>
            </ComposedChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* 3. Store avg spend monthly trend */}
      <div className="chart-card full-width">
        <div className="chart-title">各店淨客單價月趨勢</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={320}>
            <LineChart data={storeMonthlyAvg.data}>
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis dataKey="name" stroke="#B89E97" tick={{fontSize:10}}/>
              <YAxis stroke="#B89E97" tick={{fontSize:10}} tickFormatter={v=>'$'+fmt.short(v)}/>
              <Tooltip content={<CustomTooltip formatter={fmt.currency}/>}/>
              <Legend wrapperStyle={{fontSize:10}}/>

function TabSeasonal({ data }) {
  if (!data || !data.seasonal || !data.seasonal.campaigns) {
    return <div style={{ padding: 24, color: '#9ca3af' }}>限定甜點檔期資料載入中…</div>;
  }

  const { campaigns } = data.seasonal;
  const today = new Date().toISOString().slice(0, 10);

  const featured = React.useMemo(() => {
    const ongoing = campaigns.find(c => c.ongoing);
    if (ongoing) return ongoing;
    const past = campaigns
      .filter(c => c.dateRange.end < today)
      .sort((a, b) => b.dateRange.end.localeCompare(a.dateRange.end));
    return past[0] || campaigns[0] || null;
  }, [campaigns, today]);

  const fmtMoney = (n) => 'NT$ ' + Math.round(n).toLocaleString();
  const fmtNum = (n) => Math.round(n).toLocaleString();
  const yoyColor = (y) => y === null ? '#9ca3af' : y > 0 ? '#16a34a' : '#dc2626';
  const yoyText = (y) => y === null ? '—' : (y > 0 ? '+' : '') + (y * 100).toFixed(1) + '%';

  // spotlight 可切換:點「其他檔期」小卡時,spotlight 換成該檔期
  // selectedCampaignKey = null 時顯示 featured(預設最近活動)
  const [selectedCampaignKey, setSelectedCampaignKey] = React.useState(null);
  const displayCampaign = React.useMemo(() => {
    if (selectedCampaignKey) {
      const found = campaigns.find(c => c.key === selectedCampaignKey);
      if (found) return found;
    }
    return featured;
  }, [selectedCampaignKey, campaigns, featured]);
  const isManualSelect = selectedCampaignKey && displayCampaign && displayCampaign.key !== (featured && featured.key);

  // 全活動排行榜:點活動列展開品項明細,可同時展開多個比較
  const [expandedKeys, setExpandedKeys] = React.useState(() => new Set());
  const toggleExpanded = (key) => {
    setExpandedKeys(prev => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 28, padding: '8px 0' }}>

      {/* 標題 */}
      <div>
        <h2 style={{ margin: 0, fontSize: 22, fontWeight: 700, color: '#1f2937' }}>
          🎂 限定甜點檔期分析
        </h2>
        <p style={{ margin: '4px 0 0', fontSize: 13, color: '#6b7280' }}>
          自動辨識所有「YYYY 活動名」次類別（節日 + 主題活動），共 {campaigns.length} 個檔期 · 與去年同檔期比較
        </p>
        {/* v2 fix-2: 補 3 折扣免責聲明（選項 A，不動 GAS） */}
        <div style={{marginTop:10,padding:'8px 12px',background:'#fffbeb',border:'1px solid #fde68a',borderRadius:8,fontSize:12,color:'#92400e'}}>
          ※ 季節活動營收為含折扣金額（Gross）。
        </div>
      </div>

      {/* 最近活動 spotlight */}
      <div>
        <h3 style={{ fontSize: 17, fontWeight: 600, color: '#1f2937', marginBottom: 12 }}>
          📊 最近活動
        </h3>

        {displayCampaign && (
          <div style={{
            background: 'linear-gradient(135deg, #fef3e2 0%, #ffedd5 100%)',
            padding: 24, borderRadius: 12, marginBottom: 16,
            border: '1px solid #fed7aa'
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 16 }}>
              <div>
                <div style={{ fontSize: 12, color: '#92400e', fontWeight: 600, letterSpacing: 1 }}>
                  {isManualSelect ? '📋 檢視檔期' : (displayCampaign.ongoing ? '🔴 進行中' : '🕐 最近檔期')}
                </div>

            )}
          </div>
        )}

        {/* 其他檔期小卡 */}
{campaigns.length > 1 && (() => {
  const otherCampaigns = [...campaigns]
    .sort((a, b) => b.dateRange.end.localeCompare(a.dateRange.end));
  const SHOW_DEFAULT = 6;

  return (

      <div style={{ fontSize: 13, color: '#6b7280', marginBottom: 8 }}>其他檔期（點卡片切換上方分析）</div>

  );
})()}
      </div>

      {/* 全活動排行榜 */}

          <span style={{ fontSize: 12, color: '#9ca3af', marginLeft: 8, fontWeight: 400 }}>

// v3: 標籤改由後端 discountLabels 提供（daily_discount D~I 真實欄名）；此為離線 fallback
const DISCOUNT_LABELS_FALLBACK = ['好客券','自己人$100甜點券','自己人4人同行每份$500','員工優惠7折','甜點券$100','自己人體驗7折'];
const DISCOUNT_COLORS = ['#C4412F','#D4654F','#06b6d4','#22c55e','#f59e0b','#ec4899'];

function TabDiscount({rawData, dateStart, dateEnd, selRegion, selStores}){
  // v3: 券種標籤以後端 discountLabels 為準（daily_discount D~I 真實欄名），離線時用 fallback
  const DISCOUNT_LABELS = (rawData && rawData.discountLabels && rawData.discountLabels.length===6)
    ? rawData.discountLabels : DISCOUNT_LABELS_FALLBACK;
  // v2 fix-3: hooks before conditional return (Rules of Hooks)
  // Filter monthlyByStore
  const mbs = rawData ? rawData.monthlyByStore || [] : [];
  const filteredMBS = useMemo(()=>mbs.filter(m=>{
    if(dateStart && m.yearMonth < dateStart) return false;
    if(dateEnd && m.yearMonth > dateEnd) return false;
    if(selRegion && selRegion!=='全部' && m.region!==selRegion) return false;
    if(selStores && selStores.length>0 && !selStores.includes(m.store)) return false;
    return true;
  }),[mbs, dateStart, dateEnd, selRegion, selStores]);

  // KPI calcs
  const totalDiscount = useMemo(()=>filteredMBS.reduce((s,m)=>s+(m.discount||0),0),[filteredMBS]);
  const totalGross = useMemo(()=>filteredMBS.reduce((s,m)=>s+(m.revenue_gross||0),0),[filteredMBS]);
  const discountRate = totalGross>0 ? (totalDiscount/totalGross*100) : 0;

  // Monthly stacked by discount type
  const monthlyDiscountData = useMemo(()=>{
    const byYM={};
    filteredMBS.forEach(m=>{
      if(!byYM[m.yearMonth]) { byYM[m.yearMonth]={name:m.yearMonth}; DISCOUNT_LABELS.forEach((_,i)=>byYM[m.yearMonth]['d'+i]=0); }
      const db = m.discount_breakdown || [];
      db.forEach((v,i)=>{ byYM[m.yearMonth]['d'+i]=(byYM[m.yearMonth]['d'+i]||0)+v; });
    });
    return Object.values(byYM).sort((a,b)=>a.name<b.name?-1:1);
  },[filteredMBS]);

  // Store discount ranking
  const storeDiscountData = useMemo(()=>{
    const byStore={};
    filteredMBS.forEach(m=>{
      if(!byStore[m.store]) byStore[m.store]={store:m.store,discount:0,revenue_gross:0};
      byStore[m.store].discount+=(m.discount||0);
      byStore[m.store].revenue_gross+=(m.revenue_gross||0);
    });
    return Object.values(byStore)
      .map(s=>({...s, discountRate:s.revenue_gross>0?(s.discount/s.revenue_gross*100):0}))
      .sort((a,b)=>b.discount-a.discount);
  },[filteredMBS]);

  // Monthly discount rate trend
  const discountRateTrend = useMemo(()=>{
    const byYM={};
    filteredMBS.forEach(m=>{
      if(!byYM[m.yearMonth]) byYM[m.yearMonth]={name:m.yearMonth,discount:0,gross:0};
      byYM[m.yearMonth].discount+=(m.discount||0);
      byYM[m.yearMonth].gross+=(m.revenue_gross||0);
    });
    return Object.values(byYM).sort((a,b)=>a.name<b.name?-1:1).map(t=>({
      ...t, rate: t.gross>0?(t.discount/t.gross*100):0
    }));
  },[filteredMBS]);

  // guard after all hooks
  if(!rawData) return null;

  return (
    <div className="charts-grid cols-2">
      {/* KPI row */}
      <div className="kpi-grid" style={{gridColumn:'1/-1',marginBottom:8}}>
        <div className="kpi-card">
          <div className="kpi-label">篩選範圍折扣總額</div>
          <div className="kpi-value" style={{color:'#ef4444'}}>{fmt.currency(totalDiscount)}</div>
          <div className="kpi-sub">SUM monthlyByStore.discount</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">折扣率</div>
          <div className="kpi-value" style={{color:'#f59e0b'}}>{fmt.pct(discountRate)}</div>
          <div className="kpi-sub">折扣 ÷ 含折扣營收</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">含折扣營收 (Gross)</div>
          <div className="kpi-value" style={{color:'var(--text-secondary)'}}>{fmt.currency(totalGross)}</div>
          <div className="kpi-sub">SUM revenue_gross</div>
        </div>
      </div>

      {/* Chart 1: Monthly stacked discount by type */}
      <div className="chart-card full-width">
        <div className="chart-title">各月折扣結構（券種堆疊）</div>
        <div className="chart-subtitle">按券種分拆月折扣金額</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={300}>
            <AreaChart data={monthlyDiscountData}>
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis dataKey="name" stroke="#B89E97" tick={{fontSize:10}}/>
              <YAxis stroke="#B89E97" tick={{fontSize:10}} tickFormatter={fmt.short}/>
              <Tooltip content={<CustomTooltip formatter={fmt.currency}/>}/>
              <Legend wrapperStyle={{fontSize:11}}/>
              {DISCOUNT_LABELS.map((label,i)=>(
                <Area key={i} type="monotone" dataKey={'d'+i} stackId="1" name={label}
                  fill={DISCOUNT_COLORS[i]} stroke={DISCOUNT_COLORS[i]} fillOpacity={0.75}/>
              ))}
            </AreaChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* Chart 2: Store discount ranking */}
      <div className="chart-card">
        <div className="chart-title">各店折扣金額排名</div>
        <div className="chart-subtitle">降冪排列</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={300}>
            <BarChart data={storeDiscountData} layout="vertical">
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis type="number" stroke="#B89E97" tick={{fontSize:10}} tickFormatter={fmt.short}/>
              <YAxis type="category" dataKey="store" width={90} stroke="#B89E97" tick={{fontSize:9}}/>
              <Tooltip content={<CustomTooltip formatter={fmt.currency}/>}/>
              <Bar dataKey="discount" name="折扣金額" fill="#ef4444" radius={[0,4,4,0]}/>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* Chart 3: Monthly discount rate trend */}
      <div className="chart-card">
        <div className="chart-title">折扣率月趨勢</div>
        <div className="chart-subtitle">折扣 ÷ 含折扣營收（%）</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={300}>
            <LineChart data={discountRateTrend}>
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis dataKey="name" stroke="#B89E97" tick={{fontSize:10}}/>
              <YAxis stroke="#B89E97" tick={{fontSize:10}} tickFormatter={v=>v.toFixed(1)+'%'}/>
              <Tooltip content={<CustomTooltip formatter={v=>fmt.pct(v)}/>}/>
              <Line type="monotone" dataKey="rate" stroke="#ef4444" strokeWidth={2.5} dot={{r:3}} name="折扣率(%)"/>
            </LineChart>
          </ResponsiveContainer>
        </div>
      </div>
    </div>
  );
}


/* ================================================================
   TAB 7: 生日壽星分析
   資料源：rawData.birthdayCake（年月×店×type 數量/營收）
           rawData.birthdayItems（年×加價購品項 數量/營收）
   免費 = 我的生日蛋糕；加價購 = 其他生日蛋糕（皆主類別「生日蛋糕」）
   ================================================================ */
const BD_FREE = '#f59e0b';   // 免費 = 琥珀
const BD_PAID = '#06b6d4';   // 加價購 = 青
const BD_YEAR_COLORS = ['#C4412F','#06b6d4','#22c55e'];

function TabBirthday({rawData, dateStart, dateEnd, selRegion, selStores}){
  const bc = (rawData && rawData.birthdayCake) ? rawData.birthdayCake : [];
  const items = (rawData && rawData.birthdayItems) ? rawData.birthdayItems : [];

  const filteredBC = useMemo(()=>bc.filter(m=>{
    if(dateStart && m.yearMonth < dateStart) return false;
    if(dateEnd && m.yearMonth > dateEnd) return false;
    if(selRegion && selRegion!=='全部' && m.region!==selRegion) return false;
    if(selStores && selStores.length>0 && !selStores.includes(m.store)) return false;
    return true;
  }),[bc, dateStart, dateEnd, selRegion, selStores]);

  const kpi = useMemo(()=>{
    let free=0, paid=0, paidRev=0;
    filteredBC.forEach(m=>{
      if(m.type==='免費') free+=(m.qty||0);
      else { paid+=(m.qty||0); paidRev+=(m.revenue||0); }
    });
    const total = free+paid;
    return { free, paid, total, paidRev, upgradeRate: total>0 ? (paid/total*100) : 0 };
  },[filteredBC]);

  const monthlyTrend = useMemo(()=>{
    const byYM={};
    filteredBC.forEach(m=>{
      if(!byYM[m.yearMonth]) byYM[m.yearMonth]={name:m.yearMonth, free:0, paid:0};
      if(m.type==='免費') byYM[m.yearMonth].free+=(m.qty||0);
      else byYM[m.yearMonth].paid+=(m.qty||0);
    });
    return Object.values(byYM).sort((a,b)=>a.name<b.name?-1:1);
  },[filteredBC]);

  const storeData = useMemo(()=>{
    const byStore={};
    filteredBC.forEach(m=>{
      if(!byStore[m.store]) byStore[m.store]={store:m.store, free:0, paid:0};
      if(m.type==='免費') byStore[m.store].free+=(m.qty||0);
      else byStore[m.store].paid+=(m.qty||0);
    });
    return Object.values(byStore)
      .map(s=>({...s, total:s.free+s.paid, upgradeRate:(s.free+s.paid)>0?(s.paid/(s.free+s.paid)*100):0}))
      .sort((a,b)=>b.total-a.total);
  },[filteredBC]);

  // 加價購品項年度對比（年為最近兩年，動態取，避免寫死年份）
  const itemYears = useMemo(()=>[...new Set(items.map(it=>+it.yr))].sort((a,b)=>a-b).slice(-2),[items]);
  const itemRank = useMemo(()=>{
    const byP={};
    items.forEach(it=>{
      const y=+it.yr;
      if(!itemYears.includes(y)) return;
      if(!byP[it.product]){ byP[it.product]={product:it.product, total:0}; itemYears.forEach(yy=>byP[it.product]['y'+yy]=0); }
      byP[it.product]['y'+y]=(byP[it.product]['y'+y]||0)+(it.qty||0);
      byP[it.product].total+=(it.qty||0);
    });
    return Object.values(byP).sort((a,b)=>b.total-a.total);
  },[items, itemYears]);

  if(!rawData) return null;

  // 後端 birthdayCake 尚未部署時的友善佔位
  if(bc.length===0){
    return (
      <div className="charts-grid">
        <div className="chart-card full-width" style={{textAlign:'center',padding:'48px 24px'}}>
          <div style={{fontSize:'2rem',marginBottom:12}}>🎂</div>
          <div className="chart-title" style={{justifyContent:'center'}}>生日壽星分析・資料準備中</div>
          <div className="chart-subtitle" style={{marginTop:8}}>
            後端 birthdayCake 聚合尚未部署，部署完成後本頁將自動顯示。
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="charts-grid cols-2">
      {/* KPI row */}
      <div className="kpi-grid" style={{gridColumn:'1/-1',marginBottom:8}}>
        <div className="kpi-card">
          <div className="kpi-label">壽星到店總數</div>
          <div className="kpi-value">{fmt.number(kpi.total)}</div>
          <div className="kpi-sub">免費 + 加價購 顆數</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">加購率</div>
          <div className="kpi-value" style={{color:BD_PAID}}>{fmt.pct(kpi.upgradeRate)}</div>
          <div className="kpi-sub">加價購 ÷ 總數</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">免費兌換</div>
          <div className="kpi-value" style={{color:BD_FREE}}>{fmt.number(kpi.free)}</div>
          <div className="kpi-sub">我的生日蛋糕</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">加價購</div>
          <div className="kpi-value" style={{color:BD_PAID}}>{fmt.number(kpi.paid)}</div>
          <div className="kpi-sub">其他生日蛋糕</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">加價購營收</div>
          <div className="kpi-value" style={{color:'var(--success)'}}>{fmt.currency(kpi.paidRev)}</div>
          <div className="kpi-sub">免費款營收 = 0</div>
        </div>
      </div>

      {/* Chart 1: 月趨勢（數量） */}
      <div className="chart-card full-width">
        <div className="chart-title">月趨勢・兌換數量</div>
        <div className="chart-subtitle">免費 vs 加價購 顆數（看淡旺季）</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={300}>
            <LineChart data={monthlyTrend}>
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis dataKey="name" stroke="#B89E97" tick={{fontSize:10}}/>
              <YAxis stroke="#B89E97" tick={{fontSize:10}} tickFormatter={fmt.short}/>
              <Tooltip content={<CustomTooltip formatter={fmt.number}/>}/>
              <Legend wrapperStyle={{fontSize:11}}/>
              <Line type="monotone" dataKey="free" name="免費" stroke={BD_FREE} strokeWidth={2.5} dot={{r:2}}/>
              <Line type="monotone" dataKey="paid" name="加價購" stroke={BD_PAID} strokeWidth={2.5} dot={{r:2}}/>
            </LineChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* Chart 2: 分店堆疊（數量） */}
      <div className="chart-card">
        <div className="chart-title">分店・兌換數量</div>
        <div className="chart-subtitle">免費 + 加價購 堆疊，依總量降冪</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={320}>
            <BarChart data={storeData} layout="vertical">
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis type="number" stroke="#B89E97" tick={{fontSize:10}} tickFormatter={fmt.short}/>
              <YAxis type="category" dataKey="store" width={90} stroke="#B89E97" tick={{fontSize:9}}/>
              <Tooltip content={<CustomTooltip formatter={fmt.number}/>}/>
              <Legend wrapperStyle={{fontSize:11}}/>
              <Bar dataKey="free" stackId="a" name="免費" fill={BD_FREE} radius={[0,0,0,0]}/>
              <Bar dataKey="paid" stackId="a" name="加價購" fill={BD_PAID} radius={[0,4,4,0]}/>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* Chart 3: 分店加購率 */}
      <div className="chart-card">
        <div className="chart-title">分店・加購率</div>
        <div className="chart-subtitle">加價購 ÷ 總數（%），看現場推升級的成效</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={320}>
            <BarChart data={[...storeData].sort((a,b)=>b.upgradeRate-a.upgradeRate)} layout="vertical">
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis type="number" stroke="#B89E97" tick={{fontSize:10}} tickFormatter={v=>v.toFixed(0)+'%'}/>
              <YAxis type="category" dataKey="store" width={90} stroke="#B89E97" tick={{fontSize:9}}/>
              <Tooltip content={<CustomTooltip formatter={v=>fmt.pct(v)}/>}/>
              <Bar dataKey="upgradeRate" name="加購率(%)" fill={BD_PAID} radius={[0,4,4,0]}/>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* Chart 4: 加價購品項年度對比 */}
      <div className="chart-card full-width">
        <div className="chart-title">加價購品項・年度對比</div>
        <div className="chart-subtitle">最近兩年各款加價購蛋糕顆數，看上新替換（不受月份/分店篩選影響）</div>
        <div className="chart-body">
          <ResponsiveContainer width="100%" height={320}>
            <BarChart data={itemRank} layout="vertical">
              <CartesianGrid strokeDasharray="3 3" stroke="#F0D9D5"/>
              <XAxis type="number" stroke="#B89E97" tick={{fontSize:10}} tickFormatter={fmt.short}/>
              <YAxis type="category" dataKey="product" width={90} stroke="#B89E97" tick={{fontSize:10}}/>
              <Tooltip content={<CustomTooltip formatter={fmt.number}/>}/>
              <Legend wrapperStyle={{fontSize:11}}/>
              {itemYears.map((y,i)=>(
                <Bar key={y} dataKey={'y'+y} name={y+' 年'} fill={BD_YEAR_COLORS[i%BD_YEAR_COLORS.length]} radius={[0,4,4,0]}/>
              ))}
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
