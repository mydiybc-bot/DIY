<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>前往儀表板…</title>
<!--
  2026-11-08 儀表板搬到靜態網站 diybc-dash：舊網址（diybc-training）上的儀表板網頁一律由伺服器回這一頁。
  這一頁只在「舊網址」上執行：
  1. 這台裝置第一次經過時，把舊網址這邊瀏覽器記住的東西（儀表板密碼效期、這台是哪家門市、
     還沒送出的草稿、偏好設定等）一起帶到新網址（dash-migrate.html），新網址那邊已經有的不覆蓋；
     暫存資料（cache 類，新網址會自己重抓）不帶。
  2. 之後再經過就直接轉到新網址同一頁（網址後面的參數、# 後面的部分都照帶）。
-->
</head>
<body style="font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;padding:24px;color:#666">
前往儀表板…
<script>
(function () {
  var NEW = 'https://diybc-dash.onrender.com';
  var FLAG = '__moved_to_dash';
  var MAX_FRAGMENT = 1500000;                 // 網址 # 後面的長度上限（Chrome 整個網址上限約 2MB）
  var SKIP = /cache|bundle|raw_v1|spoonSpec|camps|_live|hub_stat|__auth_ping/i;   // 暫存資料，新網址會自己重抓
  var rest = location.pathname + location.search + location.hash;
  if (location.origin === NEW) { location.replace(NEW + '/static/hub.html'); return; }
  var target = NEW + rest;
  try {
    if (!localStorage.getItem(FLAG)) {
      var items = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i), v = localStorage.getItem(k);
        if (k === FLAG || v == null || SKIP.test(k)) continue;
        items.push([k, v]);
      }
      items.sort(function (a, b) { return a[1].length - b[1].length; });   // 小的先放，太大放不下的才捨棄
      var data = {}, payload = '', n = 0;
      for (var j = 0; j < items.length; j++) {
        data[items[j][0]] = items[j][1];
        var p = encodeURIComponent(JSON.stringify({ v: 1, next: rest, data: data }));
        if (p.length > MAX_FRAGMENT) { delete data[items[j][0]]; continue; }
        payload = p; n++;
      }
      localStorage.setItem(FLAG, String(Date.now()));
      if (n > 0) { location.replace(NEW + '/static/dash-migrate.html#' + payload); return; }
    }
  } catch (e) { /* 讀不到瀏覽器儲存（私密模式等）就直接轉 */ }
  location.replace(target);
})();
</script>
<noscript><a href="https://diybc-dash.onrender.com/static/hub.html">點這裡前往儀表板新網址</a></noscript>
</body>
</html>
