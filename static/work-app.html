<script>
/* ===== IME-GUARD（2026-10-17 晚，經營者：新品申請表的搜尋框打不出中文，「全部測試、確保正常」）=====
   病因：注音／倉頡選字時，每按一個鍵瀏覽器就送一次 input；各分頁的 oninput 一收到就重畫，把正在選字的輸入框換掉。
   做法（整頁共用，不用逐一改各分頁）：
   ①選字中（compositionstart～compositionend，或事件帶 isComposing）的 input／keydown／keyup 在最外層攔下，各分頁的程式收不到
   ②選完字（compositionend）補送一次 input，各分頁照常收到「最後打好的字」
   ③window.__ime.on＝現在是否在選字；有延遲重畫的地方（例：BOM 搜尋 250ms 後重畫）重畫前先看它，選字中就不重畫 */
window.__ime=(function(){
  var st={on:false};
  function isTyping(t){return t&&(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&!/^(checkbox|radio|button|submit|file|range|color|date|time|datetime-local|month|week|hidden|image|reset)$/i.test(t.type||'')))}
  document.addEventListener('compositionstart',function(e){if(isTyping(e.target))st.on=true},true);
  document.addEventListener('compositionend',function(e){st.on=false;var t=e.target;if(!isTyping(t))return;
    setTimeout(function(){try{t.dispatchEvent(new Event('input',{bubbles:true}))}catch(_){}},0)},true);
  ['input','keydown','keyup','keypress'].forEach(function(type){
    document.addEventListener(type,function(e){if(!isTyping(e.target))return;
      if(type==='input'&&st.on&&!e.isComposing&&e.inputType&&!/Composition/.test(e.inputType))st.on=false;   /* 保險：選字被取消、沒收到 compositionend → 一般打字照常 */
      if(e.isComposing||st.on||(type!=='input'&&e.keyCode===229))e.stopImmediatePropagation()},true)});
  document.addEventListener('focusout',function(e){if(isTyping(e.target))st.on=false},true);
  window.addEventListener('blur',function(){st.on=false});
  return st;
})();
</script>

<!-- 名單管理（體驗中心） -->
<div id="vAdmin" class="sheet">
  <header><div class="wrap row"><button class="back" data-close>‹ 返回</button><h2>⚙︎ 名單管理</h2></div></header>
  <div class="wrap adm" id="aBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ===== 設定 ===== */
var API_PROD = 'https://script.google.com/macros/s/AKfycbz1cOKkrsLOoLMHbXYgPuFPEsFqUjTqQavSYQsFq7VhTZqR65ivkR1jeIbgxttIJIVd/exec';
var API = (function(){ try { var u = new URLSearchParams(location.search).get('annapi'); if (u && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return u; } catch(_){} return API_PROD; })();
var K_AUTH = 'wa_auth_v1', K_TAB = 'wa_tab', K_INST = 'wa_inst_off', K_CACHE = 'wa_cache_v1', K_META = 'wa_meta_v1';
var IMP_LABEL = { '★':'一般', '★★':'重要', '★★★':'緊急' };
var ATT_MAX = 10;
var STORES = [[1,'精明'],[2,'草悟道'],[3,'南京'],[4,'士林'],[5,'Focus'],[6,'新竹'],[7,'板橋'],[8,'新店'],[9,'中壢'],[10,'藝文'],[11,'A13'],[12,'SKM']];
var MAX_FILES = 5, MAX_FILE = 10*1024*1024, MAX_TOTAL = 20*1024*1024;
var EXT = ['jpg','jpeg','png','gif','webp','heic','pdf','doc','docx','xls','xlsx','ppt','pptx','txt','csv','mp4','mov','m4a','mp3'];

/* ===== 小工具 ===== */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function lsGet(k){ try { return localStorage.getItem(k); } catch(_){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(_){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(_){} }
function toast(t, ms){ var el=$('toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){ el.style.display='none'; }, ms||2200); }
function rq(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function today(){ var d=new Date(Date.now()+8*3600e3); return d.toISOString().slice(0,10); }
function call(body, ms){
  var ctl = window.AbortController ? new AbortController() : null, t = ctl ? setTimeout(function(){ ctl.abort(); }, ms||45000) : 0;
  return fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body), signal: ctl?ctl.signal:undefined, cache:'no-store' })
    .then(function(r){ return r.text(); })
    .then(function(t){ var j; try { j = JSON.parse(t); } catch(e){ throw new Error('伺服器忙碌，請再試一次'); } if (!j.ok) { var e2 = new Error(j.msg||'失敗'); e2.code=j.code; throw e2; } return j.data; })
    .catch(function(e){ if (e && e.name==='AbortError') throw new Error('連線逾時，請再試一次'); if (e && /Failed to fetch|Load failed|NetworkError/i.test(e.message||'')) throw new Error('網路不穩，請再試一次'); throw e; })
    .finally(function(){ if (t) clearTimeout(t); });
}

/* ===== 狀態 ===== */
var S = { auth:null, rows:[], tab:'mine', open:null, editing:null, loadedAt:0, files:[], meta:null, tg:null, efiles:[], edel:[], imp:'★' };
try { S.meta = JSON.parse(lsGet(K_META)||'null'); } catch(_){ S.meta=null; }
try { S.auth = JSON.parse(lsGet(K_AUTH)||'null'); } catch(_){ S.auth=null; }
S.tab = lsGet(K_TAB) || 'mine';

/* ===== 登入：①選單位＋密碼 → ②從名單選名字（名單＝104 班表／體驗中心維護的名單）===== */
var lgSel = null, lgPend = null, lgPick = '';
function renderLogin(){
  var h = STORES.map(function(s){ return '<button data-s="'+s[0]+'">'+s[0]+'號店<small>'+esc(s[1])+'</small></button>'; }).join('') +
    '<button class="hq" data-s="hq">🏢 體驗中心</button><button class="hq" data-s="dc">📦 出貨中心</button>';
  $('lgStores').innerHTML = h;
  var last = S.auth || null;
  if (last) { lgSel = String(last.as); $('lgName').value = last.name || ''; lgPick = last.name || ''; }
  $('lgStep2').classList.add('hide'); $('lgGo').classList.remove('hide');
  markStore();
  installBanner('instL');
}
function markStore(){
  [].forEach.call($('lgStores').querySelectorAll('button'), function(b){ b.classList.toggle('on', b.getAttribute('data-s')===lgSel); });
  $('lgPwLabel').textContent = lgSel==='hq' ? '體驗中心密碼（和決策中心同一組）' : (lgSel==='dc' ? '出貨中心密碼' : '店密碼（和決策中心同一組）');
}
$('lgStores').addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b) return; lgSel=b.getAttribute('data-s'); markStore(); $('lgStep2').classList.add('hide'); $('lgGo').classList.remove('hide'); $('lgPw').focus(); });
$('lgGo').addEventListener('click', doLogin);
$('lgPw').addEventListener('keydown', function(e){ if (e.key==='Enter' && !e.isComposing) doLogin(); });
function unitPeople(meta, as){
  if (!meta) return [];
  if (as==='hq' || as==='dc') return (meta.staff && meta.staff[as] || []).map(function(x){ return { name:x.name, role:x.role||'' }; });
  return (meta.stores && meta.stores[as] || []).map(function(x){ return { name:x.name, role:x.role||'' }; });
}
function doLogin(){
  var pw=$('lgPw').value.trim();
  if (!lgSel) return $('lgMsg').textContent='請先選幾號店、體驗中心或出貨中心';
  if (!pw) return $('lgMsg').textContent='請輸入密碼';
  $('lgMsg').textContent='確認中…'; $('lgGo').disabled=true;
  call({ action:'appAuth', as:lgSel, pw:pw }, 60000).then(function(d){
    lgPend = { as:String(d.as), label:d.label, hq:!!d.hq, pw:pw };
    if (d.meta) { S.meta = d.meta; lsSet(K_META, JSON.stringify(d.meta)); }
    var ppl = unitPeople(S.meta, lgPend.as);
    $('lgNames').innerHTML = ppl.length ? ppl.map(function(x){ return '<button type="button" data-n="'+esc(x.name)+'"'+(x.name===lgPick?' class="on"':'')+'>'+esc(x.name)+(x.role?'<small>'+esc(x.role)+'</small>':'')+'</button>'; }).join('') : '<div class="msg">這個單位還沒有名單，請在下面填名字</div>';
    $('lgStep2').classList.remove('hide'); $('lgGo').classList.add('hide'); $('lgMsg').textContent='';
  }).catch(function(e){ $('lgMsg').textContent = e.message; }).finally(function(){ $('lgGo').disabled=false; });
}
$('lgNames').addEventListener('click', function(e){ var b=e.target.closest('[data-n]'); if(!b) return; lgPick=b.getAttribute('data-n'); $('lgName').value=''; [].forEach.call($('lgNames').querySelectorAll('button'), function(x){ x.classList.toggle('on', x===b); }); });
$('lgName').addEventListener('input', function(){ if ($('lgName').value.trim()) { lgPick=''; [].forEach.call($('lgNames').querySelectorAll('button'), function(x){ x.classList.remove('on'); }); } });
$('lgOk').addEventListener('click', function(){
  var name = ($('lgName').value.replace(/\s+/g,' ').trim() || lgPick || '').slice(0,20);
  if (!lgPend) return;
  if (!name) return $('lgMsg').textContent='請點你的名字，或在下面填名字';
  S.auth = { as:lgPend.as, label:lgPend.label, hq:lgPend.hq, pw:lgPend.pw, name:name };
  lsSet(K_AUTH, JSON.stringify(S.auth)); $('lgPw').value=''; $('lgMsg').textContent=''; lgPend=null;
  showList(); load(true);
});
function logout(){
  if (!confirm('要登出嗎？（這支手機也會停止收通知）')) return;
  disablePush();
  var keep = S.auth ? { as:S.auth.as, name:S.auth.name } : null;
  lsDel(K_AUTH); S.auth = keep; showLogin(); S.auth = null; updateBadge();
}
function authFail(e){
  if (e && e.code==='auth') { toast('密碼可能已更換，請重新登入', 3500); var keep=S.auth; lsDel(K_AUTH); S.auth=keep?{as:keep.as,name:keep.name}:null; showLogin(); S.auth=null; return true; }
  return false;
}
function showLogin(){ closeSheets(); $('vList').classList.add('hide'); $('vLogin').classList.remove('hide'); renderLogin(); }
function showList(){ $('vLogin').classList.add('hide'); $('vList').classList.remove('hide');
  $('meBox').innerHTML = '<div>'+esc(S.auth.name)+'</div><div>'+esc(S.auth.label)+' · <a href="#" id="lo" style="color:#FFD678">登出</a></div>';
  $('lo').onclick = function(e){ e.preventDefault(); logout(); };
  markTab(); installBanner('instB'); renderDock(); setSection(S.sec || lsGet(K_SEC) || 'work'); badgeTip();
}
/* 名單（104 班表＋群組）：打開時背景更新一次 */
function loadMeta(){
  if (!S.auth || !S.auth.pw) return Promise.resolve();
  return call({ action:'appMeta', as:S.auth.as, pw:S.auth.pw }, 60000).then(function(d){ S.meta=d; lsSet(K_META, JSON.stringify(d)); renderList(); if (S.open) { var w=byId(S.open); if (w) renderDetail(w); } }).catch(function(e){ authFail(e); });
}

/* ===== 讀資料 ===== */
function load(force){
  if (!force && Date.now()-S.loadedAt < 30000) return Promise.resolve();
  if (!S.rows.length) { try { var c = JSON.parse(lsGet(K_CACHE)||'null'); if (c && c.rows) { S.rows=fixRows(c.rows); renderList(); $('listMsg').textContent='顯示 '+ago(c.at)+'的資料，更新中…'; } } catch(_){} }
  else $('listMsg').textContent='更新中…';
  $('listMsg').classList.remove('err');
  return call({ action:'appWork' }, 40000).then(function(d){
    S.rows = fixRows(d.rows); S.loadedAt = Date.now(); S.days = d.days;
    try { lsSet(K_CACHE, JSON.stringify({ at:Date.now(), rows:S.rows })); } catch(_){}
    $('listMsg').textContent = '';
    renderList();
    if (S.open) { var w = byId(S.open); if (w) renderDetail(w); }
  }).catch(function(e){ $('listMsg').textContent = '讀取失敗：'+e.message+'（點右上 ↻ 重試）'; $('listMsg').classList.add('err'); });
}
/* NUEIP 搬來的標題／內文有雙重跳脫（畫面出現 &amp;），顯示前轉回一層；資料不改 */
function deEnt(x){ return String(x==null?'':x).replace(/&(amp|lt|gt|quot|#39);/g, function(m,k){ return {amp:'&',lt:'<',gt:'>',quot:'"','#39':"'"}[k]; }); }
function fixRows(rows){ (rows||[]).forEach(function(w){ w.item=deEnt(w.item); w.owner=deEnt(w.owner); w.text=deEnt(w.text); }); return rows||[]; }
function ago(t){ var m=Math.round((Date.now()-t)/60000); return m<1?'剛剛':(m<60?m+' 分鐘前':Math.round(m/60)+' 小時前'); }
function byId(id){ for (var i=0;i<S.rows.length;i++) if (S.rows[i].work_id===id) return S.rows[i]; return null; }

/* ===== 判斷：交辦對象、誰回了 =====
   交辦對象只記位置（全體店長／門市／群組／人），打開時才對名單 → 換店長、群組加新人都不用重發。
   舊工作（沒有 targets）照 owner 文字推回來。 */
function owners(w){ return String(w.owner||'').split(/[、,，;；\/\s]+/).map(function(x){ return x.trim(); }).filter(Boolean); }
function storeOfRole(r){ var m = String(r||'').match(/^(\d{1,2})號店/); return m ? Number(m[1]) : 0; }
function nameMatch(a,b){ a=String(a||'').trim(); b=String(b||'').trim(); if (!a||!b) return false; if (a===b) return true; return (a.length>=2 && b.indexOf(a)>=0) || (b.length>=2 && a.indexOf(b)>=0); }
function groupsMeta(){ return (S.meta && S.meta.groups) || {}; }
function openStores(){ return (S.meta && S.meta.open && S.meta.open.length) ? S.meta.open : STORES.map(function(s){ return s[0]; }); }
function targetsOf(w){
  if (w.targets && typeof w.targets==='object') return { all:!!w.targets.all, stores:w.targets.stores||[], groups:w.targets.groups||[], people:w.targets.people||[] };
  var t = { all:false, stores:[], groups:[], people:[] }, G = groupsMeta();
  owners(w).forEach(function(o){
    var m = o.match(/^(\d{1,2})(號店|店)$/);
    if (o==='全體店長') t.all = true; else if (m) t.stores.push(Number(m[1])); else if (G[o]) t.groups.push(o); else t.people.push(o);
  });
  return t;
}
/* 回覆單位：全體店長／門市＝以「店」算（看留言身分 N號店）；群組＝目前名單的每個人；人＝那個人 */
function units(w){
  var t = targetsOf(w), G = groupsMeta(), list = [], seen = {};
  function addStore(n){ if (seen['s'+n]) return; seen['s'+n]=1; list.push({ who:n+'號店', store:n }); }
  function addName(n, g){ if (seen['p'+n]) return; seen['p'+n]=1; list.push({ who:n, name:n, grp:g||'' }); }
  if (t.all) openStores().forEach(addStore);
  t.stores.forEach(addStore);
  t.groups.forEach(function(g){ (G[g]||[]).forEach(function(n){ addName(n, g); }); });
  t.people.forEach(function(n){ addName(n); });
  return list;
}
function replyStatus(w){
  var ds = (w.discuss || []).filter(function(d){ return !/系統紀錄/.test(d.role||''); });
  var after = String(w.created_at||'').slice(0,10) || '';
  var mine = ds.filter(function(d){ return !after || String(d.ts||'').slice(0,10) >= after; });
  return units(w).map(function(u){
    var ok = u.store ? mine.some(function(d){ return storeOfRole(d.role)===u.store; }) : mine.some(function(d){ return nameMatch(d.author,u.name); });
    return { who:u.who, ok:ok };
  });
}
function isMine(w){
  var a=S.auth; if (!a) return false;
  var t = targetsOf(w), G = groupsMeta(), st = Number(a.as)||0;
  if (st && t.all) return true;
  if (st && t.stores.indexOf(st)>=0) return true;
  if (t.people.some(function(n){ return nameMatch(n, a.name); })) return true;
  if (t.groups.some(function(g){ return (G[g]||[]).some(function(n){ return nameMatch(n, a.name); }); })) return true;
  return false;
}
function isSent(w){ var a=S.auth; if (!a) return false; return String(w.creator_store||'')===String(a.as); }
function canEdit(w){ var a=S.auth; return !!a && (a.hq || String(w.creator_store||'')===String(a.as)); }
/* ===== 待處理數字（經營者 2026-11-26：「被指定處理的人員，如何知道有工作清單需要處理，我希望 APP 上面出現數字」）=====
   待處理＝交辦給我（或我的店）＋還沒完成、沒暫停＋交辦後我還沒回覆（店的工作＝這家店任何人回過就算）。
   顯示在：功能列「工作清單」、分頁「交辦給我」、清單卡片「待你回覆」、網頁標題，以及桌面圖示（支援的手機／電腦）。 */
function repliedByMe(w){
  var a=S.auth, st=Number(a.as)||0, after=String(w.created_at||'').slice(0,10);
  return (w.discuss||[]).some(function(d){
    if (/系統紀錄/.test(d.role||'')) return false;
    if (after && String(d.ts||'').slice(0,10) < after) return false;
    return (st && storeOfRole(d.role)===st) || nameMatch(d.author, a.name);
  });
}
function isPending(w){ return !!S.auth && isMine(w) && w.progress!=='已完成' && w.progress!=='暫停' && !repliedByMe(w); }
function pendingCount(){ return S.auth ? S.rows.filter(isPending).length : 0; }
function updateBadge(){
  var n = pendingCount(), t = n>99 ? '99+' : String(n);
  ['bMine','bdg_work'].forEach(function(id){ var el=$(id); if (!el) return; el.textContent=t; el.classList.toggle('hide', !n); });
  document.title = (n ? '('+t+') ' : '') + '自己做 | 自己做烘焙聚樂部';
  try { if (navigator.setAppBadge) { if (n) navigator.setAppBadge(n).catch(function(){}); else navigator.clearAppBadge().catch(function(){}); } } catch(_){}
  if (!updateBadge._tip) { updateBadge._tip=1; badgeTip(); }
}
/* ===== 推播通知（2026-11-26 晚）=====
   開啟後：有交辦給你的新工作、轉給你、有人回覆、每天 09:30 快到期 → 手機跳通知，桌面圖示顯示待處理件數（推播帶 n）。
   iPhone：要先加到主畫面才能開（iOS 規定）；Android／電腦 Chrome：瀏覽器裡就能開。
   手機訂閱（endpoint）存在工作清單 GAS dim_app_push；金鑰從 /api/push/key 拿（diybc-dash 轉給 diybc-training）。 */
function pushOK(){ return ('serviceWorker' in navigator) && ('PushManager' in window) && window.Notification; }
function urlB64(b){ var p='='.repeat((4-b.length%4)%4), s=atob((b+p).replace(/-/g,'+').replace(/_/g,'/')), a=new Uint8Array(s.length); for (var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
function pushKey(){ return fetch('/api/push/key', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' }).then(function(r){ return r.json(); }).then(function(j){ if (!j.ok) throw new Error(j.msg||'拿不到通知金鑰'); return j.key; }); }
function ensureSub(force){
  if (!pushOK() || !S.auth || !S.auth.pw || Notification.permission!=='granted') return Promise.resolve(null);
  return navigator.serviceWorker.ready.then(function(reg){
    return reg.pushManager.getSubscription().then(function(sub){
      return sub || pushKey().then(function(k){ return reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlB64(k) }); });
    });
  }).then(function(sub){
    var j = sub.toJSON(), mark = j.endpoint+'|'+S.auth.as+'|'+S.auth.name;
    if (!force && lsGet('wa_push_sync')===mark) return sub;
    return call(authBody({ action:'appPushSub', sub:{ endpoint:j.endpoint, keys:j.keys }, ua:navigator.userAgent.slice(0,120) })).then(function(){ lsSet('wa_push_sync', mark); return sub; });
  });
}
function enablePush(){
  var el=$('badgeTip');
  Notification.requestPermission().then(function(p){
    if (p!=='granted') { if (el) el.innerHTML='<div class="inst"><div>通知沒有開成。要開的話：手機「設定」→ 通知 → 找到「自己做」或瀏覽器 → 允許通知。</div></div>'; return; }
    if (el) el.innerHTML='<div class="msg">開啟中…</div>';
    return ensureSub(true).then(function(sub){
      return call(authBody({ action:'appPushTest', endpoint:sub.toJSON().endpoint })).then(function(){ toast('通知已開啟，應該會收到一則測試通知', 3500); });
    }).catch(function(e){ if (!authFail(e)) alert('開啟通知時出錯：'+e.message+'\n（通知可能已開啟，可按「測試通知」再試）'); }).finally(function(){ badgeTip(); });
  });
}
/* 測試通知（2026-11-26 晚：經營者 Android 手機收不到推播 → 分兩步找原因）
   ① 手機自己跳一則（不經伺服器）：失敗＝手機把「自己做」或 Chrome 的通知關了
   ② 伺服器送一則：①成功但②10 秒內沒跳＝手機省電／背景限制擋住推播 */
function pushDiag(){
  var m=$('pushDiagMsg'), steps=[];
  function show(){ m.innerHTML = steps.join('<br>'); }
  m.textContent='測試中…';
  navigator.serviceWorker.ready.then(function(reg){
    return reg.showNotification('① 手機自己跳的測試通知', { body:'看到這則＝手機允許「自己做」顯示通知', tag:'diag1', icon:'work-app/icon-192.png' })

/* 照片先縮到長邊 1600、JPEG 0.85（手機原圖 3～5MB，上傳慢）；縮不了（HEIC 等）就傳原檔 */
function shrink(file){
  return new Promise(function(res){
    if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 600*1024) return res(file);
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var s = Math.min(1, 1600/Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function(b){ if (!b || b.size >= file.size) return res(file); var n = file.name.replace(/\.[^.]+$/,'')+'.jpg'; try { res(new File([b], n, { type:'image/jpeg' })); } catch(_){ b.name=n; res(b); } }, 'image/jpeg', 0.85);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

  else if (k.indexOf('g:')===0) { var g=k.slice(2), i=t.groups.indexOf(g); if (i>=0) t.groups.splice(i,1); else t.groups.push(g); }
  renderTg();
});
$('eStores').addEventListener('click', function(e){ var b=e.target.closest('[data-s]'); if(!b) return; var n=Number(b.getAttribute('data-s')), t=S.tg, i=t.stores.indexOf(n); if (i>=0) t.stores.splice(i,1); else t.stores.push(n); t.stores.sort(function(a,b){return a-b;}); renderTg(); });
$('eSel').addEventListener('click', function(e){ var a=e.target.closest('[data-del]'); if(!a) return; e.preventDefault(); S.tg.people.splice(Number(a.getAttribute('data-del')),1); renderTg(); renderPres(); });
/* 人員名單：門市（104 班表）＋體驗中心＋出貨中心＋群組成員 */
function allPeople(){
  var m=S.meta||{}, out=[], seen={};
  function add(n, where){ if (!n || seen[n]) return; seen[n]=1; out.push({ name:n, where:where }); }
  (m.staff&&m.staff.hq||[]).forEach(function(x){ add(x.name,'體驗中心'); });
  (m.staff&&m.staff.dc||[]).forEach(function(x){ add(x.name,'出貨中心'); });
  STORES.forEach(function(s){ (m.stores&&m.stores[s[0]]||[]).forEach(function(x){ add(x.name, s[0]+'店 '+s[1]+(x.role&&/資深|店長/.test(x.role)?'・'+x.role:'')); }); });
  Object.keys(m.groups||{}).forEach(function(g){ (m.groups[g]||[]).forEach(function(n){ add(n, g); }); });
  return out;
}
var pqT=0;
$('ePq').addEventListener('input', function(){ clearTimeout(pqT); pqT=setTimeout(function(){ if (window.__ime && __ime.on) return; renderPres(); }, 150); });
$('ePq').addEventListener('compositionend', function(){ clearTimeout(pqT); pqT=setTimeout(renderPres, 50); });
function renderPres(){
  var q=$('ePq').value.trim(), t=S.tg, list=allPeople();
  var qs = q.replace(/號?店$/,'店');
  var res = q ? list.filter(function(x){ return x.name.indexOf(q)>=0 || x.where.indexOf(qs)>=0; }) : list.slice(0,0);
  var html = res.slice(0,40).map(function(x){ var on=t.people.indexOf(x.name)>=0; return '<button type="button" data-p="'+esc(x.name)+'"'+(on?' class="on"':'')+'><span>'+(on?'✓ ':'')+esc(x.name)+'</span><small>'+esc(x.where)+'</small></button>'; }).join('');
  if (q && !list.some(function(x){ return x.name===q; }) && q.length>=2 && q.length<=10 && !/店$/.test(q)) html += '<button type="button" data-p="'+esc(q)+'"><span>＋ 加入「'+esc(q)+'」</span><small>名單上沒有</small></button>';
  $('ePres').innerHTML = html || (q ? '<div class="msg">找不到</div>' : '<div class="msg">打名字或「3店」搜尋</div>');
}
$('ePres').addEventListener('click', function(e){ var b=e.target.closest('[data-p]'); if(!b) return; var n=b.getAttribute('data-p'), t=S.tg, i=t.people.indexOf(n); if (i>=0) t.people.splice(i,1); else t.people.push(n); renderTg(); renderPres(); });
/* 附件（新選的＋原有的；原有的按 ✕＝存檔時刪） */
function renderEFiles(){
  var w = S.editing ? byId(S.editing) : null, old = (w && w.att && w.att.files) || [];
  var h = old.filter(function(f){ return S.edel.indexOf(f.aid)<0; }).map(function(f){ return '<div><span>'+fileIcon(f.mime,f.name)+' '+esc(f.name)+'</span><a href="#" data-odel="'+esc(f.aid)+'">✕ 拿掉</a></div>'; }).join('') +
          S.efiles.map(function(f,i){ return '<div><span>🆕 '+esc(f.name)+'（'+fmtSize(f.size)+'）</span><a href="#" data-ndel="'+i+'">✕</a></div>'; }).join('');
  $('eFiles').innerHTML = h;
}
function eFileCount(){ var w = S.editing ? byId(S.editing) : null, old = (w && w.att && w.att.files) || []; return old.filter(function(f){ return S.edel.indexOf(f.aid)<0; }).length + S.efiles.length; }
$('eFile').addEventListener('change', function(e){
  var arr=[].slice.call(e.target.files||[]); e.target.value=''; $('eMsg').textContent='';
  Promise.all(arr.map(shrink)).then(function(fs){
    fs.forEach(function(f){
      var ext=(String(f.name).match(/\.([A-Za-z0-9]{1,5})$/)||[])[1]; ext=ext?ext.toLowerCase():'';
      if (EXT.indexOf(ext)<0) { $('eMsg').textContent='「'+f.name+'」的檔案類型不收'; return; }
      if (f.size > MAX_FILE) { $('eMsg').textContent='「'+f.name+'」超過 10MB'; return; }
      if (eFileCount() >= ATT_MAX) { $('eMsg').textContent='每件工作最多 '+ATT_MAX+' 個附件'; return; }
      S.efiles.push(f);
    });
    renderEFiles();
  });
});
$('eFiles').addEventListener('click', function(e){
  var a=e.target.closest('[data-odel]'), b=e.target.closest('[data-ndel]'); if (!a && !b) return; e.preventDefault();
  if (a) S.edel.push(a.getAttribute('data-odel')); else S.efiles.splice(Number(b.getAttribute('data-ndel')),1);
  renderEFiles();
});
function openEdit(w){
  S.editing = w ? w.work_id : null; S.efiles=[]; S.edel=[]; S.showStores=false; S.showPeople=false;
  var t = w ? targetsOf(w) : { all:false, stores:[], groups:[], people:[] };
  S.tg = { all:!!t.all, stores:t.stores.slice(), groups:t.groups.slice(), people:t.people.slice() };
  S.imp = w ? (w.importance||'★') : '★';
  $('eHead').textContent = w ? '修改工作' : '發工作';
  $('eWho').textContent = w ? ('交辦人：'+(w.creator||'')+'・交辦日 '+(w.date||String(w.created_at||'').slice(0,10))) : ('交辦人：'+S.auth.name+'（'+S.auth.label+'）・交辦日 '+today());
  $('eItem').value = w ? w.item : '';
  $('eDue').value = w ? (w.due_date||'') : '';
  $('eProg').value = w ? (w.progress||'未開始') : '未開始';
  $('eProgBox').classList.toggle('hide', !w);
  var rich = w && w.src !== 'app' && /<(img|table|a |span|b>|strong|font)/i.test(String(w.html||''));
  $('eTextBox').classList.toggle('hide', !!rich);
  $('eText').value = w ? (w.text||'') : '';
  $('eAttNote').value = (w && w.att && w.att.note) || '';
  $('ePq').value=''; renderPres();
  $('eNote').textContent = rich ? '這件的內容有圖片或格式，請到電腦版修改內容；這裡只改其他欄位。' : '';
  renderImp(); renderTg(); renderEFiles();
  $('eMsg').textContent=''; $('eSave').textContent = w ? '儲存' : '送出';
  $('vEdit').classList.add('on'); $('vEdit').scrollTop=0;
  history.pushState({ v:'e' }, '', location.hash || '#new');
  if (!w) setTimeout(function(){ $('eItem').focus(); }, 50);
}
/* 工作先存 → 附件一個一個傳（失敗只影響那一個）→ 拿掉的附件 */
function uploadAll(id, files, done){
  var ok=0, bad=[];
  return files.reduce(function(p, f, i){
    return p.then(function(){
      $('eMsg').textContent='上傳附件 '+(i+1)+'/'+files.length+'：'+f.name;
      return b64(f).then(function(d){ return call(authBody({ action:'appWorkUpload', work_id:id, fname:f.name, mime:f.type||'application/octet-stream', b64:d }), 120000); })
        .then(function(){ ok++; }).catch(function(e){ if (authFail(e)) throw e; bad.push(f.name+'（'+e.message+'）'); });
    });
  }, Promise.resolve()).then(function(){ return { ok:ok, bad:bad }; });
}
$('eSave').addEventListener('click', function(){
  var item=$('eItem').value.replace(/\s+/g,' ').trim(), t=S.tg;
  if (!item) { $('eMsg').textContent='請填工作項目'; return; }
  if (!$('eDue').value) { $('eMsg').textContent='請選完成期限'; return; }
  if (!t.all && !t.stores.length && !t.groups.length && !t.people.length) { $('eMsg').textContent='請選交辦對象'; return; }
  var w = S.editing ? byId(S.editing) : null;
  var work = { item:item, due_date:$('eDue').value, importance:S.imp, progress: w ? $('eProg').value : '未開始', targets:{ all:t.all?1:0, stores:t.stores, groups:t.groups, people:t.people }, att_note:$('eAttNote').value.trim() };
  if (!$('eTextBox').classList.contains('hide')) work.text = $('eText').value;
  if (w) { work.work_id = w.work_id; work.base_updated = w.updated_at; }
  var files = S.efiles.slice(), dels = S.edel.slice(), id = null;
  $('eSave').disabled=true; $('eMsg').textContent='送出中…';
  call(authBody({ action:'appWorkSave', work:work }))
  .then(function(d){ id = d.work_id; return uploadAll(id, files); })
  .then(function(r){
    return dels.reduce(function(p, aid){ return p.then(function(){ return call(authBody({ action:'appWorkAttDel', work_id:id, aid:aid })).catch(function(e){ r.bad.push('拿掉附件失敗（'+e.message+'）'); }); }); }, Promise.resolve()).then(function(){ return r; });
  })
  .then(function(r){
    $('eMsg').textContent=''; $('vEdit').classList.remove('on');
    if (r.bad.length) alert('工作已'+(w?'儲存':'發出')+'，但這些附件沒成功，請到工作頁按「修改」再補：\n'+r.bad.join('\n')); else toast(w?'已儲存':'已發出');
    return load(true).then(function(){ if (w) { history.back(); } else { history.replaceState(null,'',location.pathname+location.search); openWork(id); setTimeout(function(){ toast('要通知大家，按「📤 用 LINE 通知」', 3500); }, 2300); } });
  })
  .catch(function(e){ if (!authFail(e)) $('eMsg').textContent='沒有成功：'+e.message; if (id && !w) { S.editing=id; } })
  .finally(function(){ $('eSave').disabled=false; });
});

/* ===== 名單管理（體驗中心）：群組名單、體驗中心／出貨中心人員；門市名單＝104 班表（只能看）===== */
$('btnAdmin').addEventListener('click', openAdmin);
function openAdmin(){
  var m=S.meta||{}, G=m.groups||{};
  var h = '<div class="msg">門市人員每天從 104 班表自動更新（這個月＋下個月有排班的人）。人員異動只要 104 班表排好，這裡就會跟著變。</div>'+
    '<h3>👥 群組</h3><div class="msg">一行一個群組；名字用頓號「、」分開。整行刪掉＝刪除群組。交辦給群組的工作，加進來的新人馬上看得到。</div>'+
    '<textarea id="aGroups" rows="5">'+esc(Object.keys(G).map(function(g){ return g+'：'+G[g].join('、'); }).join('\n'))+'</textarea>'+
    '<h3>🏢 體驗中心人員</h3><textarea id="aHq">'+esc(((m.staff&&m.staff.hq)||[]).map(function(x){return x.name;}).join('、'))+'</textarea>'+
    '<h3>📦 出貨中心人員</h3><textarea id="aDc">'+esc(((m.staff&&m.staff.dc)||[]).map(function(x){return x.name;}).join('、'))+'</textarea>'+
    '<div class="btns"><button class="btn" id="aSave">儲存</button></div><div class="msg err" id="aMsg"></div>'+
    '<h3>🏪 門市名單（104 班表，'+esc((m.months||[]).join('、'))+'）</h3>'+
    STORES.map(function(s){ var l=(m.stores&&m.stores[s[0]])||[]; return '<div class="card" style="margin:6px 0;padding:8px 12px"><b>'+s[0]+'號店 '+esc(s[1])+'</b>（'+l.length+' 人）<div class="msg" style="margin:2px 0 0">'+esc(l.map(function(x){ return x.name+(x.role&&/資深|店長/.test(x.role)?'★':''); }).join('、'))+'</div></div>'; }).join('')+
    '<div class="msg">★＝資深體驗管理師。名單最後更新：'+esc(m.rosterAt||'')+'（每 6 小時重讀一次）</div><div style="height:30px"></div>';
  $('aBody').innerHTML = h;
  $('vAdmin').classList.add('on'); $('vAdmin').scrollTop=0;
  history.pushState({ v:'a' }, '', '#admin');
  $('aSave').onclick = saveAdmin;
}
function splitNames(s){ return String(s||'').split(/[、,，;；\s\n]+/).map(function(x){ return x.trim(); }).filter(Boolean); }
function saveAdmin(){
  var m=S.meta||{}, G=m.groups||{}, want={}, msg=$('aMsg');
  $('aGroups').value.split(/\n/).forEach(function(line){ var mm=line.match(/^\s*([^：:]+)[：:](.*)$/); if (mm) want[mm[1].trim()]=splitNames(mm[2]); });
  var jobs=[];
  Object.keys(want).forEach(function(g){ if (JSON.stringify(want[g])!==JSON.stringify(G[g]||[])) jobs.push({ action:'appGroupSave', group:g, members:want[g] }); });
  Object.keys(G).forEach(function(g){ if (!want[g]) jobs.push({ action:'appGroupSave', group:g, members:[] }); });
  [['hq','aHq'],['dc','aDc']].forEach(function(u){ var cur=((m.staff&&m.staff[u[0]])||[]).map(function(x){return x.name;}), nw=splitNames($(u[1]).value); if (JSON.stringify(cur)!==JSON.stringify(nw)) jobs.push({ action:'appStaffSave', unit:u[0], members:nw }); });
  if (!jobs.length) { msg.textContent='沒有改動'; return; }
  $('aSave').disabled=true; msg.textContent='儲存中…';
  jobs.reduce(function(p, j){ return p.then(function(){ return call(authBody(j)).then(function(d){ if (d && d.meta) { S.meta=d.meta; lsSet(K_META, JSON.stringify(d.meta)); } }); }); }, Promise.resolve())
  .then(function(){ msg.textContent=''; toast('已儲存'); renderList(); history.back(); })
  .catch(function(e){ if (!authFail(e)) msg.textContent='沒有成功：'+e.message; })
  .finally(function(){ var b=$('aSave'); if (b) b.disabled=false; });
}

/* ===== 上一頁／關閉 ===== */
function closeSheets(){ $('vDetail').classList.remove('on'); $('vEdit').classList.remove('on'); $('vAdmin').classList.remove('on'); S.open=null; }
document.addEventListener('click', function(e){ if (e.target.closest('[data-close]')) { if (history.state && history.state.v) history.back(); else { closeSheets(); history.replaceState(null,'',location.pathname+location.search); } } });
window.addEventListener('popstate', function(){
  if ($('vEdit').classList.contains('on')) { $('vEdit').classList.remove('on'); return; }
  if ($('vAdmin').classList.contains('on')) { $('vAdmin').classList.remove('on'); return; }
  var m = String(location.hash).match(/^#w=(.+)$/);
  if (m) { var id = decodeURIComponent(m[1]); if (byId(id)) { openWork(id, true); return; } }
  closeSheets();
});
document.addEventListener('visibilitychange', function(){ if (document.visibilityState==='visible' && S.auth && S.auth.pw) load(false); });

/* ===== 安裝到主畫面 ===== */
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredPrompt = e; installBanner('instB'); installBanner('instL'); });
function standalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
function installBanner(id){
  var el = $(id); if (!el) return; el.innerHTML='';
  if (standalone() || lsGet(K_INST)) return;
  var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  var inApp = /Line\/|FBAN|FBAV|Instagram/i.test(ua);
  var t;
  if (inApp) t = '要裝到手機主畫面：請先點右上「⋯」→ 用'+(ios?' Safari ':'瀏覽器')+'開啟，再照提示加到主畫面。';
  else if (ios) t = '裝到主畫面：點 Safari 下方的「分享」<b>⬆︎</b> →「加入主畫面」→「新增」。之後從桌面的「自己做」圖示打開。';
  else if (deferredPrompt) t = '可以把「自己做」裝到手機主畫面，像 App 一樣打開。 <button class="btn" id="'+id+'Go" style="padding:6px 12px;font-size:14px;margin-top:6px">安裝</button>';
  else if (/Android/i.test(ua)) t = '裝到主畫面：點 Chrome 右上「⋮」→「加到主畫面」或「安裝應用程式」。';
  else return;
  el.innerHTML = '<div class="inst"><div>📲 '+t+'</div><button class="x" aria-label="不再顯示">×</button></div>';
  el.querySelector('.x').onclick = function(){ lsSet(K_INST,'1'); el.innerHTML=''; };
  var g = $(id+'Go'); if (g) g.onclick = function(){ deferredPrompt.prompt(); deferredPrompt.userChoice.then(function(){ deferredPrompt=null; el.innerHTML=''; }); };
}
if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('work-app-sw.js', { scope:'./work-app' }).catch(function(){}); }); }

/* ===== 功能列：之後新功能在 FEATURES 加一格 =====
   work＝本頁原生；其他＝同站頁面裝進 iframe（同網域，App 可以幫它帶單位、藏「回首頁」）。 */
var FEATURES = [
  { k:'work', t:'工作清單', i:'📋' },
  { k:'fee',  t:'費用申請', i:'🏢', src:'hq-apply.html', prep: prepFee, hide:'.mt-header' }
];
var K_SEC = 'wa_sec', frames = {};
/* 費用申請記的單位（hqapply_unit）＝「3店 台北南京」這種名稱；沒選過就照 App 登入的店帶入（9、10 店費用申請沒有，就不帶） */
function prepFee(){
  if (!S.auth || lsGet('hqapply_unit')) return;
  var u = S.auth.hq ? '體驗中心' : ({1:'1店 台中精明',2:'2店 台中草悟道',3:'3店 台北南京',4:'4店 台北士林',5:'5店 台南Focus',6:'6店 新竹文化',7:'7店 新北板橋',8:'8店 新北新店',11:'11店 台北信義',12:'12店 高雄SKM Park'})[S.auth.as];
  if (u) lsSet('hqapply_unit', u);
  if (S.auth.name && !lsGet('hqapply_who')) lsSet('hqapply_who', S.auth.name);
}
function renderDock(){
  $('dock').innerHTML = FEATURES.map(function(f){ return '<button data-k="'+f.k+'"><span class="i">'+f.i+'</span>'+esc(f.t)+'<span class="bdg hide" id="bdg_'+f.k+'"></span></button>'; }).join('');
  updateBadge();
}
$('dock').addEventListener('click', function(e){ var b=e.target.closest('[data-k]'); if (b) setSection(b.getAttribute('data-k')); });
function fitFrame(){
  var el=$('secFrame'); if (el.classList.contains('hide')) return;
  el.style.top = document.querySelector('#vList header.top').offsetHeight+'px';
  el.style.bottom = $('dock').offsetHeight+'px';
}
window.addEventListener('resize', fitFrame);
function setSection(k){
  var f = FEATURES.filter(function(x){ return x.k===k; })[0] || FEATURES[0]; k = f.k; S.sec = k; lsSet(K_SEC, k);
  [].forEach.call($('dock').querySelectorAll('button'), function(b){ b.classList.toggle('on', b.getAttribute('data-k')===k); });
  var isWork = k==='work';
  $('secTitle').textContent = f.i+' '+f.t;
  ['tabs','btnNew','btnRef'].forEach(function(id){ $(id).classList.toggle('hide', !isWork); });
  $('btnAdmin').classList.toggle('hide', !(isWork && S.auth && S.auth.hq));
  document.querySelector('#vList > .wrap').classList.toggle('hide', !isWork);
  $('secFrame').classList.toggle('hide', isWork);
  if (!isWork) {
    Object.keys(frames).forEach(function(x){ frames[x].style.display = x===k ? 'block' : 'none'; });
    if (!frames[k]) {
      if (f.prep) f.prep();
      $('frameLd').style.display='flex';
      var fr = document.createElement('iframe'); fr.src = f.src; fr.title = f.t; fr.setAttribute('allow','camera');
      fr.addEventListener('load', function(){
        $('frameLd').style.display='none';
        try { if (f.hide) { var st = fr.contentDocument.createElement('style'); st.textContent = f.hide+'{display:none!important}'; fr.contentDocument.head.appendChild(st); } } catch(_){}
      });
      frames[k] = fr; $('secFrame').appendChild(fr);
    } else $('frameLd').style.display='none';
    fitFrame();
  } else window.scrollTo(0,0);
}

/* ===== 啟動 ===== */
(function(){
  try { fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ action:'ping' }), cache:'no-store' }).catch(function(){}); } catch(_){}
  if (!S.auth || !S.auth.pw) { showLogin(); return; }
  showList();
  var m = String(location.hash).match(/^#w=(.+)$/), deep = m ? decodeURIComponent(m[1]) : '';
  setSection(deep ? 'work' : (/^#fee$/.test(location.hash) ? 'fee' : (lsGet(K_SEC) || 'work')));
  if (deep) history.replaceState(null,'',location.pathname+location.search);
  loadMeta();
  load(true).then(function(){ if (deep) { history.pushState(null,'',location.pathname+location.search); openWork(deep); } });
})();
