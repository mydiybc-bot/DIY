/* ===== IME-GUARD（2026-10-17 晚，經營者：新品申請表的搜尋框打不出中文，「全部測試、確保正常」）=====
   病因：注音／倉頡選字時，每按一個鍵瀏覽器就送一次 input；各分頁的 oninput 一收到就重畫，把正在選字的輸入框換掉。
   做法（整頁共用，不用逐一改各分頁）：
   ①選字中（compositionstart～compositionend，或事件帶 isComposing）的 input／keydown／keyup 在最外層攔下，各分頁的程式收不到
   ②選完字（compositionend）補送一次 input，各分頁照常收到「最後打好的字」
   ③window.__ime.on＝現在是否在選字；有延遲重畫的地方（例：BOM 搜尋 250ms 後重畫）重畫前先看它，選字中就不重畫 */
window.__ime=(function(){
  var st={on:false};
  function isTyping(t){return t&&(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&!/^(checkbox|radio|button|submit|file|range|color|date|time|datetime-local|month|week|hidden|image|reset)$/i.test(t.type||'')))}
  document.addEventListener('compositionstart',function(e){if(isTyping(e.target))st.on=true},true);
  document.addEventListener('compositionend',function(e){st.on=false;var t=e.target;if(!isTyping(t))return;
    setTimeout(function(){try{t.dispatchEvent(new Event('input',{bubbles:true}))}catch(_){}},0)},true);
  ['input','keydown','keyup','keypress'].forEach(function(type){
    document.addEventListener(type,function(e){if(!isTyping(e.target))return;
      if(type==='input'&&st.on&&!e.isComposing&&e.inputType&&!/Composition/.test(e.inputType))st.on=false;   /* 保險：選字被取消、沒收到 compositionend → 一般打字照常 */
      if(e.isComposing||st.on||(type!=='input'&&e.keyCode===229))e.stopImmediatePropagation()},true)});
  document.addEventListener('focusout',function(e){if(isTyping(e.target))st.on=false},true);
  window.addEventListener('blur',function(){st.on=false});
  return st;
})();
</script>

      「密碼錯誤／已停用／查無／嘗試次數過多」是明確答案 → 立刻停，不再補發（防暴力鎖定 15 次／10 分鐘）。

      還是不行 → 改存這個分頁（sessionStorage）→ 再不行只放行這一次。登入、草稿、設定一律不刪。

      Chrome 同時登入多個 Google 帳號時，<script>（JSONP）一定帶 cookie → Google 轉到 /macros/u/1/… 回 503 → 登入失敗。
      權限中心回的是 callback({...})（有 CORS），剝掉外層取 JSON；fetch 本身出錯（CORS 被擋、網路）才改走原本的 JSONP。

(function(){
  if (window.__dashAuth) return;
  var AUTH_API = 'https://script.google.com/macros/s/AKfycbyQ9LWY74Ix8VBe1gDoMdSF5eH74ratL7_f0EUUHi37IH3bXhkIJMx4WB2I-c-MLsWtLQ/exec';

  var FINAL_RE = /密碼錯誤|已停用|查無|嘗試次數過多|缺少參數|不允許|unknown action/;            /* 明確答案：不重試 */
  var PING_KEY = '__auth_ping_ts', MEM = {};
  function noop(){}
  function rid(){ return Date.now().toString(36) + Math.floor(Math.random() * 1e8).toString(36); }
  function ls(){ try { return window.localStorage || null; } catch(_){ return null; } }
  function ss(){ try { return window.sessionStorage || null; } catch(_){ return null; } }
  function get(k){
    var v = null, l = ls(), s = ss();
    try { if (l) v = l.getItem(k); } catch(_){}
    if (v == null) { try { if (s) v = s.getItem(k); } catch(_){} }
    if (v == null && Object.prototype.hasOwnProperty.call(MEM, k)) v = MEM[k];
    return v;

  function del(k){
    var l = ls(), s = ss();
    try { if (l) l.removeItem(k); } catch(_){}
    try { if (s) s.removeItem(k); } catch(_){}
    delete MEM[k];

  function setLocal(k, v){ var l = ls(); if (!l) return false; try { l.setItem(k, v); return true; } catch(_){ return false; } }
  function evict(k, v){   /* 空間滿：從最大的暫存刪起，每刪一筆就再試寫一次 */
    var l = ls(), list = [], i;
    if (!l) return false;
    try { for (i = 0; i < l.length; i++) { var x = l.key(i); if (x && CACHE_RE.test(x)) list.push([x, (l.getItem(x) || '').length]); } } catch(_){ return false; }
    list.sort(function(a, b){ return b[1] - a[1]; });
    for (i = 0; i < list.length; i++) {
      try { l.removeItem(list[i][0]); } catch(_){}
      if (setLocal(k, v)) return true;
    }
    return false;
  }

    var s = ss(), l;

    try { l = ls(); if (l) l.removeItem(k); } catch(_){}
    try { if (s) { s.setItem(k, v); delete MEM[k]; return 'session'; } } catch(_){}

  function jsonp(qs, onData, onFail){   /* 送一發；回傳「收掉這一發」的函式（之後晚到的回應被吃掉，不報錯） */

    s.src = AUTH_API + '?' + qs + '&callback=' + name;
    (document.head || document.documentElement).appendChild(s);
    return end;
  }
  function parse(t){   /* 權限中心一律回 callback(...)（不帶 callback 參數時名字就是 callback）→ 剝掉外層；日後改回純 JSON 也吃 */
    var m = /^\s*[\w$.]+\(([\s\S]*)\)\s*;?\s*$/.exec(t);
    return JSON.parse(m ? m[1] : t);
  }

    var over = false, ac = null, endJ = null;
    function end(){ if (over) return false; over = true; if (ac) { try { ac.abort(); } catch(_){} } if (endJ) endJ(); return true; }

      .then(function(r){

          try { d = parse(t); } catch(_){ if (end()) give(onFail); return; }   /* 回的是 HTML 錯誤頁 */
          if (end()) give(onData, d);
        });

      .catch(function(){   /* fetch 本身失敗（CORS 被擋、網路、錯誤頁沒帶 CORS 標頭）→ 這一發改走 JSONP */
        if (over) return;
        endJ = jsonp(qs, function(d){ if (end()) onData(d); }, function(){ if (end()) onFail(); });
      });
    return end;
  }
  function mark(){ try { var l = ls(); if (l) l.setItem(PING_KEY, String(Date.now())); } catch(_){} }
  function warm(nav){   /* nav＝馬上要換頁（hub 點卡片）：改用 keepalive，換頁後請求照樣送達 */

    }

  }

      var i;
      if (done) return;
      done = true;
      for (i = 0; i < timers.length; i++) clearTimeout(timers[i]);
      for (i = 0; i < ends.length; i++) ends[i]();

    }
    function again(){
      if (n < 3 && Date.now() - t0 < 26000) timers.push(setTimeout(fire, 700));
      else if (live <= 0) fail();
    }
    function fire(){
      if (done || n >= 3) return;
      n++; live++;
      if (n > 1 && prog) { try { prog('連線較慢，自動重試中（第 ' + n + ' 次）…'); } catch(_){} }

    }
    fire();
    timers.push(setTimeout(fire, 6000), setTimeout(fire, 14000), setTimeout(fail, 32000));
  }

/* ===== AUTH-CORE v2 END ===== */

function lsp(k, v){ try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(_){} }
function shortOf(id){ for (var i = 0; i < STORES.length; i++) if (STORES[i][0] === id) return STORES[i][1]; return id + ' 號'; }
function readAuth(){ try { var o = JSON.parse(lsg(AK) || 'null'); return (o && o.pw && o.exp > Date.now() && (o.role === 'hq' || (o.role === 'store' && o.sid >= 1 && o.sid <= 12))) ? o : null; } catch(_){ return null; } }
function dashOf(role, sid){ return role === 'hq' ? 'task_hq' : 'store_' + sid; }
function parseHash(){ var h = String(location.hash || '').replace(/^#/, ''), i = h.indexOf('&'); return { t: i < 0 ? h : h.slice(0, i), sub: i < 0 ? '' : h.slice(i + 1) }; }

/* ---------- 登入 ---------- */
function showPick(msg){
  document.title = '自己做決策中心｜登入';
  $hdr.style.display = $main.style.display = 'none'; $login.style.display = '';
  $login.innerHTML = '<h1>📋 自己做決策中心</h1><p>你是哪裡的？選一次，這台裝置會記住</p>' +
    '<button class="hqb" data-r="hq">🏢 總部（經營者・區主管）</button>' +
    ZONES.map(function(z){ return '<div class="zn">' + z[0] + '</div><div class="pk">' + z[1].map(function(id){ return '<button data-r="s' + id + '">' + id + ' ' + esc(shortOf(id)) + '</button>'; }).join('') + '</div>'; }).join('') +
    '<div class="msg">' + esc(msg || '') + '</div>';
  $login.querySelectorAll('[data-r]').forEach(function(b){ b.onclick = function(){ var r = b.getAttribute('data-r'); lsp(LK, r); showPw(r, ''); }; });
}
function showPw(r, msg){
  var hq = r === 'hq', sid = hq ? 0 : Number(r.slice(1));
  document.title = '自己做決策中心｜' + (hq ? '總部' : shortOf(sid) + '店');
  $hdr.style.display = $main.style.display = 'none'; $login.style.display = '';
  $login.innerHTML = '<h1>🔒 ' + (hq ? '🏢 總部' : sid + ' ' + esc(shortOf(sid)) + '店') + '</h1><p>' + (hq ? '輸入總部密碼' : '輸入店密碼') + '</p>' +
    '<div class="pw"><input id="pw" type="password" autocomplete="new-password" name="pw-dc-' + esc(r) + '" data-lpignore="true" data-1p-ignore placeholder="密碼"><button type="button" class="eye" id="eye" aria-label="顯示密碼">👁</button></div>' +
    '<button class="go" id="go">進去</button><div class="msg" id="lm">' + esc(msg || '') + '</div>' +
    '<button class="lk" id="chg">不是這裡？換身分</button><div><a href="hub.html" class="lk" style="display:inline-block">⬅ 回首頁</a></div>';
  var $pw = document.getElementById('pw'), $go = document.getElementById('go'), $m = document.getElementById('lm'), busy = false;
  $pw.value = ''; setTimeout(function(){ $pw.value = ''; $pw.focus(); }, 80);
  document.getElementById('eye').onclick = function(){ var s = $pw.type === 'password'; $pw.type = s ? 'text' : 'password'; this.textContent = s ? '🙈' : '👁'; $pw.focus(); };
  document.getElementById('chg').onclick = function(){ lsp(LK, null); showPick(''); };
  $pw.onkeydown = function(e){ if (e.key === 'Enter') $go.click(); };
  A.warm();
  $go.onclick = function(){
    var v = $pw.value.trim(); if (!v || busy) return;
    busy = true; $go.disabled = true; $go.textContent = '確認中…'; $m.className = 'msg'; $m.textContent = '';
    A.verify(dashOf(hq ? 'hq' : 'store', sid), v, function(res){
      busy = false; $go.disabled = false; $go.textContent = '進去';
      if (res && res.ok) return loginOk(hq ? 'hq' : 'store', sid, v, res.ttl_hours);
      var e = (res && res.error) || '驗證失敗';
      if (e.indexOf('密碼錯誤') > -1) { e = '密碼不對，再試一次'; $pw.value = ''; }
      $m.className = 'msg'; $m.textContent = e; $pw.focus();
    }, function(t){ $m.className = 'msg info'; $m.textContent = t; });
  };
}
function loginOk(role, sid, pw, ttl){
  var h = Number(ttl) || (role === 'hq' ? 12 : 720);
  AU = { role: role, sid: role === 'hq' ? 0 : sid, pw: pw, exp: Date.now() + h * 3600e3 };
  lsp(AK, JSON.stringify(AU)); lsp(LK, role === 'hq' ? 'hq' : 's' + sid);
  if (role === 'store') { lsp('st_sid', String(sid)); lsp('st_pw_' + sid, pw); }   /* 跟原「門市今日」同一份，舊書籤也通 */
  start();
}
/* 原「門市今日」平板上存過店密碼 → 自動換成這裡的登入（不用重輸） */
function migrate(sid, cb){
  var pw = lsg('st_pw_' + sid); if (!pw) return cb(false);
  $login.style.display = ''; $login.innerHTML = '<h1>📋 自己做決策中心</h1><p>⏳ 正在用這台裝置記住的店密碼登入…</p>';
  A.verify('store_' + sid, pw, function(res){ if (res && res.ok) { loginOk('store', sid, pw, res.ttl_hours); cb(true); } else { lsp('st_pw_' + sid, null); cb(false); } });
}

/* ---------- 主畫面 ---------- */
function visTabs(){ return TABS.filter(function(t){ return AU.role === 'hq' || !t.hq; }); }
function start(){
  $login.style.display = 'none'; $hdr.style.display = ''; $main.style.display = '';
  var hq = AU.role === 'hq';
  if (hq) { var q = Number(new URLSearchParams(location.search).get('s')) || Number(lsg(HSK)) || 3; SID = (q >= 1 && q <= 12) ? q : 3; }
  else SID = AU.sid;
  document.getElementById('who').textContent = hq ? '🏢 總部' : '🏪 ' + SID + ' ' + shortOf(SID) + '店';
  document.title = '自己做決策中心｜' + (hq ? '總部' : shortOf(SID) + '店');
  var sel = document.getElementById('sidSel');
  sel.innerHTML = STORES.map(function(s){ return '<option value="' + s[0] + '"' + (s[0] === SID ? ' selected' : '') + '>看 ' + s[0] + ' ' + esc(s[1]) + '店</option>'; }).join('');
  sel.onchange = function(){ SID = Number(sel.value); lsp(HSK, String(SID)); ['today', 'sm'].forEach(drop); show(CUR, '', true); };
  $tabs.innerHTML = visTabs().map(function(t){ return '<button class="tab" role="tab" data-k="' + t.k + '">' + t.t + '</button>'; }).join('');
  $tabs.querySelectorAll('[data-k]').forEach(function(b){ b.onclick = function(){ show(b.getAttribute('data-k'), ''); }; });
  sizeHdr();
  var h = parseHash();
  if (h.t === 'mg') show('hq', 'mg');
  else if (visTabs().some(function(t){ return t.k === h.t; })) show(h.t, h.sub);
  else show(hq ? 'hq' : 'today', '');
}
function drop(k){ var f = FR[k]; if (f) { f.remove(); delete FR[k]; } }
function show(k, sub, keepHash){
  var t = visTabs().filter(function(x){ return x.k === k; })[0]; if (!t) t = visTabs()[0];
  CUR = t.k;
  $tabs.querySelectorAll('[data-k]').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-k') === CUR); });
  document.getElementById('sidSel').style.display = (AU.role === 'hq' && t.store) ? '' : 'none';
  sizeHdr();
  if (sub && FR[CUR]) drop(CUR);   /* 指定子頁（某則公告、魔導師頁）＝重新打開 */
  if (!FR[CUR]) {
    var f = document.createElement('iframe');
    f.src = t.src(sub); f.title = t.t; f.setAttribute('data-k', CUR);
    $main.appendChild(f); FR[CUR] = f;
  }
  Object.keys(FR).forEach(function(x){ FR[x].classList.toggle('on', x === CUR); });
  if (!keepHash) { try { history.replaceState(null, '', location.pathname + location.search + '#' + CUR + (sub ? '&' + sub : '')); } catch(_){} }
}
function sizeHdr(){ document.documentElement.style.setProperty('--hh', $hdr.offsetHeight + 'px'); }
window.addEventListener('resize', sizeHdr);
window.addEventListener('hashchange', function(){ if (!AU) return; var h = parseHash(); if (h.t === 'mg') show('hq', 'mg', true); else if (h.t && h.t !== CUR) show(h.t, h.sub, true); });
function logout(){ lsp(AK, null); if (AU && AU.role === 'store') { lsp('st_pw_' + AU.sid, null); lsp('st_cache_' + AU.sid, null); } AU = null; Object.keys(FR).forEach(drop); try { history.replaceState(null, '', location.pathname); } catch(_){} showPick(''); }
document.getElementById('home').onclick = function(){ location.href = 'hub.html'; };
document.getElementById('out').onclick = function(){ if (confirm('登出這台裝置？下次要重新輸密碼')) logout(); };

/* 給裡面各分頁用（同網域）：拿身分、切分頁、密碼失效時叫回登入畫面 */
window.DC = {
  auth: function(){ return readAuth(); },
  sid: function(){ return SID; },
  go: function(k, sub){ show(k, sub || ''); },
  relogin: function(msg){ var r = AU ? (AU.role === 'hq' ? 'hq' : 's' + AU.sid) : ''; lsp(AK, null); AU = null; Object.keys(FR).forEach(drop); if (r) showPw(r, msg || '密碼已更換或過期，請重新輸入'); else showPick(msg); }
};

/* ---------- 開始 ---------- */
(function(){
  AU = readAuth();
  if (AU) return start();
  var qs = Number(new URLSearchParams(location.search).get('s'));
  var last = lsg(LK) || '';
  if (qs >= 1 && qs <= 12) last = 's' + qs;
  if (/^s(?:[1-9]|1[0-2])$/.test(last)) return migrate(Number(last.slice(1)), function(ok){ if (!ok) showPw(last, ''); });
  if (last === 'hq') return showPw('hq', '');
  showPick('');
})();
})();
</script>
