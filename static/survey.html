/* ===== IME-GUARD（2026-10-17 晚，經營者：新品申請表的搜尋框打不出中文，「全部測試、確保正常」）=====
   病因：注音／倉頡選字時，每按一個鍵瀏覽器就送一次 input；各分頁的 oninput 一收到就重畫，把正在選字的輸入框換掉。
   做法（整頁共用，不用逐一改各分頁）：
   ①選字中（compositionstart～compositionend，或事件帶 isComposing）的 input／keydown／keyup 在最外層攔下，各分頁的程式收不到
   ②選完字（compositionend）補送一次 input，各分頁照常收到「最後打好的字」
   ③window.__ime.on＝現在是否在選字；有延遲重畫的地方（例：BOM 搜尋 250ms 後重畫）重畫前先看它，選字中就不重畫 */
window.__ime=(function(){
  var st={on:false};
  function isTyping(t){return t&&(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&!/^(checkbox|radio|button|submit|file|range|color|date|time|datetime-local|month|week|hidden|image|reset)$/i.test(t.type||'')))}
  document.addEventListener('compositionstart',function(e){if(isTyping(e.target))st.on=true},true);
  document.addEventListener('compositionend',function(e){st.on=false;var t=e.target;if(!isTyping(t))return;
    setTimeout(function(){try{t.dispatchEvent(new Event('input',{bubbles:true}))}catch(_){}},0)},true);
  ['input','keydown','keyup','keypress'].forEach(function(type){
    document.addEventListener(type,function(e){if(!isTyping(e.target))return;
      if(type==='input'&&st.on&&!e.isComposing&&e.inputType&&!/Composition/.test(e.inputType))st.on=false;   /* 保險：選字被取消、沒收到 compositionend → 一般打字照常 */
      if(e.isComposing||st.on||(type!=='input'&&e.keyCode===229))e.stopImmediatePropagation()},true)});
  document.addEventListener('focusout',function(e){if(isTyping(e.target))st.on=false},true);
  window.addEventListener('blur',function(){st.on=false});
  return st;
})();
</script>

<script>
/* ===== 📝 顧客體驗問卷（2026-10-28 建）=====
   題目：先用頁內 FALLBACK_Q（＝GAS dim_question 的種子）立刻畫出來，背景再向 GAS 讀最新題目；客人還沒作答才換成新題目。
   作答：只改按鈕的 class 與進度條，不重畫題目；留言框只建一次（中文輸入規則）。
   送出：先走自家伺服器代轉（/api/gas/<部署ID>，手機／平板登什麼 Google 帳號都不會被擋），失敗再直連 GAS；都失敗就暫存 localStorage sv:queue，之後自動補送。 */
var SV_API = 'https://script.google.com/macros/s/AKfycbxrsYaYLdXqjUeGvG8_CZ--5znw5izXr6tcgmfC0MbJ32T1KY_TS8UkVqimxS2Jajx0/exec';
var QS = (function () { var o = {}; location.search.replace(/^\?/, '').split('&').forEach(function (kv) { if (!kv) return; var i = kv.indexOf('='); var k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i)), v = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); o[k] = v; }); return o; })();
if (QS.api) SV_API = QS.api;   /* 本機模擬：?api=/api */
var PROXY = /^https:\/\/script\.google\.com\/macros\/s\/(AKfycb[\w-]+)\/exec$/.test(SV_API) ? SV_API.replace(/^https:\/\/script\.google\.com\/macros\/s\/(AKfycb[\w-]+)\/exec$/, '/api/gas/$1') : (SV_API.charAt(0) === '/' ? SV_API : '');
var STORES = [[3, '台北南京'], [4, '台北士林'], [11, '吳寶春自己做（台北信義A13）'], [7, '新北板橋'], [8, '新北新店'], [9, '桃園中壢'], [10, '桃園藝文'], [6, '新竹文化'], [1, '台中精明'], [2, '台中草悟道'], [5, '台南Focus'], [12, '吳寶春自己做（高雄SKM Park）']];
/* 備用題目＝gas/survey/Code.gs seedQuestions_ 一模一樣（GAS 讀不到時用這份；GAS 讀到就以 GAS 為準） */
var FALLBACK_Q = [
  { qid: 'q1', type: 'single', title: '您今日體驗的分店是？', options: STORES.map(function (s) { return s[1]; }), required: true },
  { qid: 'q2', type: 'single', title: '請問這是您「一年內」第幾次來做甜點呢？（不限店別）', options: ['第1次', '第2次', '第3次', '第4次', '第5次以上'], required: true },
  { qid: 'q3', type: 'single', title: '請問您入座後，服務人員的解說：', options: ['清楚明瞭，我知道接下來該如何完成甜點製作', '解說太簡短，讓我不知該如何開始', '解說太冗長，根本聽不懂說什麼'], required: true, cond: { qid: 'q2', vals: ['第1次'] } },
  { qid: 'q4', type: 'single', title: '您今天選這款甜點時，第一個考慮的是？', options: ['外型', '價格', '口味', '不容易失敗', '易分享', '可否當生日蛋糕', '看過別人分享', '現在流行', '當季限定', '店內熱銷品', '其他'], required: true },
  { qid: 'q5', type: 'single', title: '您這次來的原因是？', options: ['重要的人生日', '自己生日', '情侶約會', '朋友聚會', '家人同樂', '喜歡烘焙', '送禮', '其他'], required: true },
  { qid: 'q6', type: 'single', title: '您是否滿意今天使用的平板教學影片？', options: ['是', '否'], required: true },
  { qid: 'q7', type: 'single', title: '您是否滿意今天店內的環境？', options: ['是', '否'], required: true },
  { qid: 'q8', type: 'single', title: '您是否滿意今天服務人員的服務？', options: ['是', '否'], required: true },
  { qid: 'q9', type: 'single', title: '在整體消費過程中，服務人員是否有提供您任何的協助？', options: ['是', '否'], required: true },
  { qid: 'q10', type: 'multi', title: '服務人員協助您的地方是？（可複選）', options: ['報到時熱情問候', '協助甜點品項的選擇', '製作過程時的協助，如補救、教學、設備使用、蛋糕抹面、找食材／器模具…', '給予讚美鼓勵', '其他'], required: true, cond: { qid: 'q9', vals: ['是'] } },
  { qid: 'q11', type: 'multi', title: '您今天做的甜點是？（可複選）', options: ['乳酪類（名字有乳酪，包含巴斯克、提拉米蘇）', '慕斯類', '蛋糕類', '塔派類', '點心類', '餅乾類', '麵包類'], required: true },
  { qid: 'q12', type: 'single', title: '您今天的甜點有製作成功嗎？', options: ['是', '否'], required: true },
  { qid: 'q13', type: 'single', title: '您今天製作甜點的時間？', options: ['2 小時（含）以內', '2～2.5 小時（含）', '2.5～3 小時（含）', '3 小時以上'], required: true },
  { qid: 'q14', type: 'single', title: '您會推薦其他人來嗎？', options: ['會', '不會'], required: true },
  { qid: 'q15', type: 'single', title: '請問您的年齡？', options: ['14 歲以下', '15～19 歲', '20～24 歲', '25～29 歲', '30～34 歲', '35～39 歲', '40～44 歲', '45～49 歲', '50 歲以上'], required: true },
  { qid: 'q16', type: 'single', title: '請問您是透過哪個途徑得知自己做呢？', options: ['自己做官方FB', '自己做官方IG', '自己做官方Line', '朋友IG/FB分享', '親朋好友介紹', 'Line社群', '廣告', 'Google搜尋', '部落客介紹', '我是老朋友'], required: true },

];

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { } }
function uuid() { try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) { } return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }); }

/* ---------- 狀態 ---------- */
var S = { q: FALLBACK_Q, a: {}, touched: false, t0: 0, id: uuid(), busy: false, cdTimer: null };
var recipe = QS.recipe || QS.r || '', src = QS.src || 'tablet', lang = QS.lang || 'zh';
var preStore = (function () {
  var v = QS.preview === '1' ? '' : (QS.store || lsGet('sv:store')); if (!v) return '';
  for (var i = 0; i < STORES.length; i++) if (String(STORES[i][0]) === String(v) || STORES[i][1] === v) return STORES[i][1];
  return '';
})();
if (recipe) { $('recipeTag').textContent = '今天做的：' + recipe; $('recipeTag').hidden = false; }

/* ---------- 畫題目（只在開頁、或 GAS 回新題目且客人還沒作答時） ---------- */
function render() {
  var h = '';
  S.q.forEach(function (q, i) {
    h += '<section class="q ' + (q.type === 'multi' ? 'multi' : '') + '" id="q_' + esc(q.qid) + '" data-qid="' + esc(q.qid) + '" data-type="' + esc(q.type) + '"' + (q.cond ? ' hidden' : '') + '>';
    h += '<h2><span class="n">' + (i + 1) + '</span><span>' + esc(q.title) + (q.required ? '<span class="req">＊</span>' : '') + (q.type === 'multi' ? '<span class="sub">可以選好幾個</span>' : '') + '</span></h2>';
    if (q.type === 'text') h += '<textarea data-qid="' + esc(q.qid) + '" maxlength="500" placeholder="想說什麼都可以：好吃、好玩、哪裡可以更好…"></textarea><div class="cnt"><span id="cnt_' + esc(q.qid) + '">0</span> / 500</div>';
    else { h += '<div class="opts">'; q.options.forEach(function (o) { h += '<button type="button" class="opt" data-qid="' + esc(q.qid) + '" data-v="' + esc(o) + '">' + esc(o) + '</button>'; }); h += '</div>'; }
    h += '</section>';
  });
  $('qs').innerHTML = h;
  S.a = {};
  if (preStore && S.q.some(function (q) { return q.qid === 'q1'; })) { pick('q1', preStore, true); }
  applyCond(); progress();
}
/* 條件題：前一題選了特定答案才出現（SurveyCake 6.0 的 q3、q10）；藏起來的題答案清掉、不算進度、不送出 */
function shown(q) {
  if (!q.cond) return true;
  var v = S.a[q.cond.qid]; if (v == null || v === '') return false;
  var arr = Array.isArray(v) ? v : [String(v)];
  return q.cond.vals.some(function (x) { return arr.indexOf(x) >= 0; });
}
function applyCond() {
  var n = 0;
  S.q.forEach(function (q) {
    var sec = $('q_' + q.qid); if (!sec) return;
    var on = shown(q);
    if (!on && !sec.hidden) {
      delete S.a[q.qid];
      sec.querySelectorAll('.opt.on').forEach(function (b) { b.classList.remove('on'); });
      var ta = sec.querySelector('textarea'); if (ta) ta.value = '';
      sec.classList.remove('ok', 'miss');
    }
    sec.hidden = !on;
    if (on) { n++; var el = sec.querySelector('h2 .n'); if (el) el.textContent = n; }
  });
}
/* 作答：只改按鈕 class，不重畫 */
function pick(qid, v, silent) {
  var sec = $('q_' + qid); if (!sec) return;
  var q = S.q.filter(function (x) { return x.qid === qid; })[0]; if (!q) return;
  if (!silent && !S.t0) S.t0 = Date.now();
  if (!silent) S.touched = true;
  var btns = sec.querySelectorAll('.opt');
  if (q.type === 'multi') {
    var arr = S.a[qid] || []; var k = arr.indexOf(v);
    if (k >= 0) arr.splice(k, 1); else arr.push(v);
    S.a[qid] = arr;
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', arr.indexOf(btns[i].getAttribute('data-v')) >= 0);
    sec.classList.toggle('ok', arr.length > 0);
  } else {
    S.a[qid] = v;
    for (var j = 0; j < btns.length; j++) btns[j].classList.toggle('on', btns[j].getAttribute('data-v') === v);
    sec.classList.add('ok');
  }
  sec.classList.remove('miss');
  applyCond(); progress();
  /* 選完單選題自動帶到下一題（留言題不帶；跳過藏起來的條件題） */
  if (!silent && q.type === 'single') { var nx = sec.nextElementSibling; while (nx && nx.hidden) nx = nx.nextElementSibling; if (nx && nx.classList.contains('q') && !nx.classList.contains('ok')) setTimeout(function () { nx.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 120); }
}
function progress() {
  var need = S.q.filter(function (q) { return q.required && shown(q); }), done = 0;
  need.forEach(function (q) { var v = S.a[q.qid]; if (q.type === 'multi' ? (v && v.length) : (v && String(v).trim())) done++; });
  $('progBar').style.width = (need.length ? Math.round(done / need.length * 100) : 100) + '%';
  $('progTxt').textContent = done >= need.length ? '全部填好了，請按右下角「送出問卷」' : '已完成 ' + done + ' / ' + need.length + ' 題';
  if (done >= need.length && $('hint').className === 'hint bad') { $('hint').className = 'hint'; $('hint').textContent = '都填好了，請按「送出問卷」'; }
}
$('qs').addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('.opt'); if (!b) return;
  pick(b.getAttribute('data-qid'), b.getAttribute('data-v'));
});
$('qs').addEventListener('input', function (e) {
  var t = e.target; if (!t || t.tagName !== 'TEXTAREA') return;
  if (window.__ime && __ime.on) return;   /* 選字中不動 */
  var qid = t.getAttribute('data-qid'); S.a[qid] = t.value; S.touched = true; if (!S.t0) S.t0 = Date.now();
  var c = $('cnt_' + qid); if (c) c.textContent = t.value.length;
  var sec = $('q_' + qid); if (sec) { sec.classList.toggle('ok', !!t.value.trim()); sec.classList.remove('miss'); }
  progress();
});

/* ---------- 題目：GAS 最新版（背景）---------- */
function applyForm(d) {
  if (!d || !d.ok || !Array.isArray(d.questions) || !d.questions.length) return;
  var qs = d.questions.map(function (q) { var o = { qid: q.qid, type: q.type, title: q.title, options: q.options || [], required: !!q.required }; if (q.cond && q.cond.qid) o.cond = { qid: q.cond.qid, vals: q.cond.vals || [] }; return o; });
  if (JSON.stringify(qs) === JSON.stringify(S.q)) return;
  if (S.touched) { S.pendingQ = qs; return; }   /* 客人作答中不換題；送出後下一位才用新題目 */
  S.q = qs; render();
}
function loadForm() {
  try { var c = JSON.parse(lsGet('sv:form') || 'null'); if (c && c.at && Date.now() - c.at < 864e5 && c.d) applyForm(c.d); } catch (e) { }
  apiGet('form').then(function (d) { if (d && d.ok) { lsSet('sv:form', JSON.stringify({ at: Date.now(), d: { ok: true, questions: d.questions } })); applyForm(d); } }).catch(function () { });
}
/* 讀：代轉 → 直連 JSONP */
function apiGet(action) {
  function direct() {
    return new Promise(function (ok, no) {
      var name = '__sv' + Math.random().toString(36).slice(2), s = document.createElement('script'), tm = setTimeout(function () { done(); no(new Error('timeout')); }, 25000);
      function done() { clearTimeout(tm); try { delete window[name]; } catch (e) { window[name] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
      window[name] = function (d) { done(); ok(d); };
      s.src = SV_API + (SV_API.indexOf('?') < 0 ? '?' : '&') + 'action=' + action + '&callback=' + name + '&_=' + Date.now(); s.onerror = function () { done(); no(new Error('net')); };
      document.head.appendChild(s);
    });
  }
  if (!PROXY) return direct();
  var ac = ('AbortController' in window) ? new AbortController() : null, tm = setTimeout(function () { if (ac) ac.abort(); }, 12000);
  return fetch(PROXY + (PROXY.indexOf('?') < 0 ? '?' : '&') + 'action=' + action, ac ? { signal: ac.signal, cache: 'no-store' } : { cache: 'no-store' })
    .then(function (r) { clearTimeout(tm); if (!r.ok) throw new Error('proxy ' + r.status); return r.json(); })
    .catch(function () { clearTimeout(tm); return direct(); });
}
/* 寫：代轉 → 直連 */
function apiPost(body) {
  function direct() {
    var ac = ('AbortController' in window) ? new AbortController() : null, tm = setTimeout(function () { if (ac) ac.abort(); }, 30000);
    return fetch(SV_API, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ac ? ac.signal : undefined, credentials: 'omit' })
      .then(function (r) { clearTimeout(tm); return r.json(); });
  }
  if (!PROXY) return direct();
  var ac = ('AbortController' in window) ? new AbortController() : null, tm = setTimeout(function () { if (ac) ac.abort(); }, 20000);
  return fetch(PROXY, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' }, signal: ac ? ac.signal : undefined, cache: 'no-store' })
    .then(function (r) { clearTimeout(tm); if (r.status === 404) throw new Error('proxy-404'); return r.json(); })
    .catch(function () { clearTimeout(tm); return direct(); });
}

/* ---------- 送出 ---------- */
function validate() {
  var miss = [];
  S.q.forEach(function (q) { if (!q.required || !shown(q)) return; var v = S.a[q.qid]; var ok = q.type === 'multi' ? (v && v.length) : (v && String(v).trim()); if (!ok) miss.push(q.qid); });
  document.querySelectorAll('.q.miss').forEach(function (el) { el.classList.remove('miss'); });
  miss.forEach(function (qid) { var el = $('q_' + qid); if (el) el.classList.add('miss'); });
  return miss;
}
function payload() {
  var a = {}; S.q.forEach(function (q) { if (!shown(q)) return; var v = S.a[q.qid]; if (q.type === 'multi') a[q.qid] = v || []; else a[q.qid] = v == null ? '' : String(v); });
  return { action: 'submit', id: S.id, a: a, recipe: recipe, src: src, lang: lang, sec: S.t0 ? Math.round((Date.now() - S.t0) / 1000) : 0, ua: (navigator.userAgent || '').slice(0, 160) };
}
/* 送出（2026-10-28 改）：按下送出 → 先存進這台平板的待送清單（sv:queue）→ 立刻顯示感謝畫面 → 背景一筆一筆送。
   客人不用等伺服器；送失敗自動重試，網路斷了等恢復再送；同一份有固定編號，重送也不會重複算。 */
function qLoad() { var q = []; try { q = JSON.parse(lsGet('sv:queue') || '[]'); } catch (e) { q = []; } return q.map(function (x) { return x && x.b ? x : { b: x, at: Date.now() }; }); }
function qSave(q) { if (q.length > 300) q = q.slice(-300); if (q.length) lsSet('sv:queue', JSON.stringify(q)); else lsDel('sv:queue'); }
function queuePush(body) { var q = qLoad(); q.push({ b: body, at: Date.now() }); qSave(q); }
function netbar() { var q = qLoad(); $('netbar').classList.toggle('on', q.length > 0 && Date.now() - q[0].at > 120000); }   /* 卡超過 2 分鐘才提示，平常背景送不打擾 */
var flushing = false, flushTimer = null;
function queueFlush() {
  if (flushing) return;
  var q = qLoad(); netbar();
  if (!q.length) return;
  flushing = true;
  apiPost(q[0].b).then(function (r) {
    flushing = false;
    var done = r && (r.ok || r.code === 'missing' || r.code === 'input');   /* 成功／重複，或資料本身有問題（重送也不會過）→ 拿掉 */
    if (done) { var q2 = qLoad(); if (q2.length && q2[0].b && q2[0].b.id === q[0].b.id) q2.shift(); qSave(q2); netbar(); if (q2.length) setTimeout(queueFlush, 300); return; }
    retryLater();
  }).catch(function () { flushing = false; retryLater(); });
}
function retryLater() { clearTimeout(flushTimer); var q = qLoad(); netbar(); if (!q.length) return; var age = Date.now() - q[0].at; flushTimer = setTimeout(queueFlush, age < 120000 ? 5000 : 30000); }
$('btnSubmit').onclick = function () {
  if (S.busy) return;
  var miss = validate();
  if (miss.length) {
    $('hint').className = 'hint bad'; $('hint').textContent = '還有 ' + miss.length + ' 題沒回答，請往上看紅框的題目';
    var el = $('q_' + miss[0]); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  S.busy = true; var btn = $('btnSubmit'); btn.disabled = true;
  queuePush(payload());
  finish(true);
  queueFlush();
};
function finish(sent) {
  if (S.a.q1) lsSet('sv:store', S.a.q1);
  $('doneMsg').textContent = sent ? '您的意見會直接送到體驗中心，幫助我們把每一次的體驗做得更好。期待下次再見！' : '您的意見已經記在這台平板上，網路恢復後會自動送到體驗中心。期待下次再見！';
  $('done').hidden = false;
  var left = 60; $('doneCd').textContent = left + ' 秒後自動回到問卷（給下一位客人）';
  clearInterval(S.cdTimer);
  S.cdTimer = setInterval(function () { left--; $('doneCd').textContent = left + ' 秒後自動回到問卷（給下一位客人）'; if (left <= 0) reset(); }, 1000);
}
function reset() {
  clearInterval(S.cdTimer); S.cdTimer = null;
  S.a = {}; S.touched = false; S.t0 = 0; S.id = uuid(); S.busy = false;
  if (S.pendingQ) { S.q = S.pendingQ; S.pendingQ = null; }
  preStore = lsGet('sv:store') || preStore;
  var btn = $('btnSubmit'); btn.disabled = false; btn.textContent = '送出問卷';
  $('hint').className = 'hint'; $('hint').textContent = '感謝您今天來做甜點，請花 1 分鐘告訴我們您的感受 🙏';
  $('done').hidden = true; render(); window.scrollTo(0, 0);
}
$('btnAgain').onclick = reset;

/* 預覽模式（?preview=1，給儀表板「✏️ 編輯題目」嵌在旁邊）：題目由儀表板用 postMessage 傳進來；不讀 GAS、不送出、不記店別 */
if (QS.preview === '1') {
  render();
  var pb = $('btnSubmit'); pb.textContent = '預覽中（不會送出）';
  pb.onclick = function () { var miss = validate(); $('hint').className = miss.length ? 'hint bad' : 'hint'; $('hint').textContent = miss.length ? '預覽：還有 ' + miss.length + ' 題沒回答（客人會看到這個提示）' : '預覽：全部填好了，客人按下去就會看到感謝畫面'; };
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d || d.type !== 'sv-preview' || !Array.isArray(d.questions)) return;
    var y = window.scrollY;
    S.q = d.questions.filter(function (q) { return q.enabled !== false; }).map(function (q) { var o = { qid: q.qid, type: q.type, title: q.title || '（還沒寫題目）', options: q.type === 'text' ? [] : (q.options || []).filter(Boolean), required: !!q.required }; if (q.cond && q.cond.qid) o.cond = { qid: q.cond.qid, vals: q.cond.vals || [] }; return o; });
    S.touched = false; render(); window.scrollTo(0, y);
    if (d.focus) { var el = $('q_' + d.focus); if (el && !el.hidden) el.scrollIntoView({ block: 'center' }); }
  });
  if (window.parent !== window) window.parent.postMessage({ type: 'sv-preview-ready' }, '*');
} else {
render(); loadForm(); queueFlush();
setInterval(queueFlush, 60000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) queueFlush(); });
}
window.addEventListener('online', queueFlush);
</script>
</body>
</html>
