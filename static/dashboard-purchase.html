<!-- 2026-09-01 v 批（盤點頁）：①卡片移除品類標籤，改以分區內「品類分隔列」呈現 ②分區內排序 品類(食材→耗材→器具→模具)→店別自訂順序→品名 ③包材耗材區併入烘烤區（autoZone 耗材→烘烤區；Sheet 殘留的「包材耗材區」由 zoneAlias 對映，不動資料）④新籤「🏬 出貨中心」（廠商含出貨中心）⑤新籤「💤 零需求」：訂貨點/標配 0 的品項移出「全部」、不計進度與未盤；訂貨單「本輪未盤點 N 項」同步排除。計算層 rowFor 零改動。 -->
<!-- 2026-07-27 盤點體驗改版（純前端）：①移除 需關注/接近/久未盤 快篩與燈號/推估/未盤點估算標籤（estOnHand/invLight/invTag 保留備用）②搜尋拆二：品項 datalist 可點選＋廠商下拉，AND 疊加 ③盤點 session：延續/新的一週彈窗、localStorage invSession_/invDraft_（草稿防遺失，不動 Sheet 歷史）、進度條、本次未盤快篩、下一個未盤浮動鈕 ④分區可收合(invZC_)、控制列 sticky、輸入框 42px/16px 防 iOS 縮放 ⑤儲存盤點後清草稿並跳訂貨單。 -->
<!-- 2026-07-27 店長自助調整基準值：盤點頁/訂貨單頁每列「⚙ 調整」→ 對話框輸入本店實際週用量（採購單位），永久寫回 dim_store_par。寫哪欄依品項型態自動判定：POS推算品項→權數(=目標÷POS推算)、備品→手動週用量、器具模具→標配數量。同時 post type:'plog' 寫軌跡（需 GAS 端 handler，未部署時靜默忽略）。新增總部/經營者「🧾 參數軌跡」分頁讀 fact_param_log，變動≥20%橘、≥50%紅。依經營者決策：不設上下限護欄。 -->
<!-- 2026-07-27 寫入回讀驗證（修 Cowork 驗收發現之資料遺失風險）：post 為 no-cors，opaque response 一律 resolve，原本送出即 clearDraft，GAS 失敗時店長草稿會靜默消失。改為送出後回讀 fact_inventory（cache-bust，2/4/6 秒三次重試），比對「Sheet 現有量＝送出值」相符才清草稿並跳訂貨單；不符或連線失敗則保留草稿、不跳頁、顯示紅色警示要求重按。判準用值不用時間戳以避開時鐘偏差。同批：onHand placeholder 0→未填。 -->
<!-- 2026-07-27 店別參數頁調整：①「啟用」核取方塊改為勾選即 post 存檔（原本只改本機狀態，未按「存」會靜默丟失，且該品項已從盤點頁消失造成誤判）②店品名／順序兩欄改為僅總部可見（店長端隱藏，資料與邏輯保留）③店廠商欄加 placeholder 顯示總部主檔廠商，店長只在改用別家盤商時才需填寫。 -->
<!-- 2026-07-27 盤點/訂貨單兩項修正：①「儲存盤點」改為固定底部操作列（.savebar），隨時可按，並即時顯示待送出筆數與本次進度；原畫面最底 toolbar 移除，加 .padbot 佔位避免遮擋。②訂貨單只列「本輪已盤點」的品項（countedForOrder：無盤點紀錄→排除；已開啟盤點輪次→需本輪盤過），未盤不再被當成庫存 0 而全數建議採購；頁首顯示「N 項本輪未盤點，未列入」提示，orderText 同步過濾。 -->
<!-- 2026-07-27 參數寫入回讀驗證（修 Cowork 二次驗收發現：同一靜默失敗缺陷存在於 param 寫入路徑）：新增 postParam() 為寫參數唯一入口，送出後回讀 dim_store_par 逐欄比對（2/4/6 秒三次重試），不符即推進 ST.writeWarn，由 render() 於所有分頁頂端顯示紅色橫幅提示「數值是暫時的，重新整理會恢復原值，請重做一次」。涵蓋 ⚙調整基準值、店別參數「存」、啟用勾選三處。fetchInvRows 一般化為 fetchFresh(sheetName)。註：post() 全域改為可讀回應需 GAS 端配合重新部署，未納入本批。 -->
<!-- 2026-07-27 寫入狀態回饋：原本只有失敗會提示、成功靜默，且 post() 的「已送出」語意誤導。改為 postParam 改用 silent post，並以 PSTATE 追蹤逐欄確認結果；店別參數「存」鈕三段式（存／確認中…／✓已存綠／⚠重試紅），完成時 toast 明確報「已確認寫入」或「有 N 項未寫入」；⚙調整與啟用勾選同樣給成功回饋；編輯欄位即清除舊狀態。 -->
<!-- 2026-07-27 UI 即時性修正：savePRow 抽為具名函式並以 refreshPstBtn 做 targeted DOM 更新（按下「存」立即顯示「確認中…」、改值立即回到「存」），避免整頁重繪；render() 加入捲動位置保留，解決 439 列參數頁重繪跳回頂端。 -->
<!-- 2026-07-27 內容量規格顯示：盤點頁列(📦 970 g／罐)、輸入框下方(1 罐=970g)、建議採購頁列、調整對話框 四處標示 packQty，供店長換算參考；packQty<=0 或器具模具不顯示。 -->
<!-- 2026-07-27 用量對帳分頁（唯讀診斷，總部/經營者）：新增「🔍 用量對帳」分頁，比對 AGG.avg4（系統近4週均）與 dim_store_par.手動週用量（門市基準），為 BOM 單層展開偏差建立基準線。純前端唯讀：不寫任何 Sheet、不新增網路請求、不改引擎。含四段判讀分類、差異比中位數、0.45–0.55 集中度、廠商中位數表、模式B 貼上 TSV 覆蓋基準、匯出 TSV（含 BOM 頭）。既有函式零改動，僅 TABS_BY_ROLE/tabLabel/render 分派/wire() 末端四處掛載。 -->
<!-- 2026-09-06 av 批：①EXPIRE_GRACE_DAYS 7→14 ②新增「🧹 清尾貨」狀態（skuTail／tailItems／tailManual）：最後有效日已過但在寬限期內 → liveItems 排除（訂貨單／建議／總覽／檔期備貨不列）、盤點頁另立籤、建議固定 0、卡片可填「仍需補」→ orderEdit → 訂貨單標清尾貨・手動 ③主檔頁清尾貨徽章 ④過季說明文字改用 EXPIRE_GRACE_DAYS。計算引擎零改動。 -->
<!-- 2026-09-05 at 批：①matchQ 搜尋加「類別」（盤點／建議／店別參數／主檔四頁共用） ②總部分頁隱藏「建議採購」「用量對帳」（viewSuggest／viewRecon 函式保留，TABS_BY_ROLE 加回即恢復） ③三處指向建議頁的說明文字改指訂貨單 -->
<style>
  :root{--blue:#2E7D32;--blue2:#3a8f3f;--bg:#f4f6f9;--card:#fff;--line:#e3e8ef;--ink:#1f2937;--mut:#6b7280;
        --food:#2e7d32;--cons:#b8860b;--tool:#6a1b9a;--mold:#c62828;--new:#0d6e6e;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  .wrap{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:24px}
  header{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;padding:10px 14px}
  .h-top{display:flex;align-items:center;gap:8px}.h-top .logo{font-size:20px}.h-top h1{font-size:16px;margin:0;font-weight:700;flex:1}
  header .home{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:8px;transition:background .15s;white-space:nowrap}
  header .home:hover{background:rgba(255,255,255,.32)}
  /* 資料狀態列（2026-07-30 全站 UI 慣例） */
  .dsb{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 16px;padding:9px 14px;border-radius:10px;font-size:13px;line-height:1.55;border:1px solid}
  .dsb b{font-weight:800;white-space:nowrap}
  .dsb-auto{background:#EFF7EF;border-color:#C9E3CA;color:#2F5D33}
  .dsb-warn{background:#FFF4E5;border-color:#F0B35A;color:#8A5A00}
  .dsb-info{margin-left:auto;border:none;background:none;color:inherit;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:underline;white-space:nowrap}
  .dsb-sop{display:none;flex-basis:100%;background:rgba(255,255,255,.78);border-radius:8px;padding:10px 14px;margin-top:4px;color:#4A3A30;font-size:13px}
  .dsb-sop.open{display:block}
  .dsb-sop ol{margin:0;padding-left:20px}
  .dsb-sop li{margin:3px 0}
  @media(max-width:600px){.dsb-info{margin-left:0}}
  .wrap > .dsb{margin:12px 10px 14px}
  .selrow{display:flex;gap:8px;margin-top:8px}
  select{flex:1;padding:7px 8px;border-radius:8px;border:1px solid #cbd5e1;font-size:14px;background:#fff;color:var(--ink)}
  .tabs{display:flex;gap:4px;overflow-x:auto;background:#1e5a22;padding:6px 8px;position:sticky;top:84px;z-index:19}
  .tab{flex:0 0 auto;padding:7px 11px;border-radius:18px;color:#cfeacd;font-size:13px;white-space:nowrap;cursor:pointer;border:1px solid transparent}
  .tab.on{background:#fff;color:var(--blue);font-weight:700}
  main{padding:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .muted{color:var(--mut);font-size:13px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{padding:5px 11px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer}
  .chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
  .seg div{padding:5px 9px;font-size:12.5px;cursor:pointer;color:var(--blue);white-space:nowrap}.seg div.on{background:var(--blue);color:#fff}
  .vh{display:flex;align-items:center;gap:8px;margin:14px 2px 6px}.vh .vn{font-weight:700;color:var(--blue)}.vh .vl{flex:1;height:1px;background:var(--line)}
  .row{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:none}
  .nm{flex:1;min-width:0}.nm b{font-weight:600}
  .badge{display:inline-block;font-size:12px;padding:1px 6px;border-radius:8px;color:#fff;margin-right:5px;vertical-align:1px}
  .badge.clk{cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.5) inset}

  .b-食材{background:var(--food)} .b-耗材{background:var(--cons)} .b-器具{background:var(--tool)} .b-模具{background:var(--mold)}
  .sub{font-size:12px;color:var(--mut);margin-top:2px}
  .sug{text-align:right;min-width:92px}.sug .big{font-weight:800;font-size:17px}.sug .big.zero{color:var(--mut);font-weight:600}.sug .u{font-size:12px;color:var(--mut)}
  .why{cursor:pointer;color:var(--blue2);font-size:12px;margin-top:2px;user-select:none}
  .reason{background:#f3faf3;border:1px dashed #bfe0bf;border-radius:8px;padding:8px;margin:6px 0 2px;font-size:12.5px;line-height:1.75;color:#2c3b2c}.reason b{color:var(--blue)}
  .banner{background:#eef7ef;border:1px solid #bfe0c0;border-radius:10px;padding:8px 10px;font-size:12.5px;color:#1e4d22;margin-bottom:10px;line-height:1.6}
  input[type=number],input[type=text]{padding:7px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  input[type=number]{width:84px;text-align:right}input.sm{width:62px}input.tx{width:96px;text-align:left}
  input[type=date]{width:auto;min-width:150px}input[type=file]{width:auto;min-width:180px}
  .ipt-lbl{font-size:12px;color:var(--mut);margin-right:2px}
.okbtn{font-size:12px;padding:3px 8px;border-color:#9fd3a3;color:#2E7D32}.okbtn.on{background:#e8f5e9;border-color:#2E7D32;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{color:var(--mut);font-weight:600;font-size:12px;white-space:nowrap}td input,td select{font-size:13px}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}.btn.sm{padding:5px 10px;font-size:13px}
  .btn.del{background:#fff;color:var(--mold);border:1px solid #f0c2c2;padding:4px 9px;font-size:12px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .summary{display:flex;gap:10px;flex-wrap:wrap}
  .stat{flex:1;min-width:110px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .stat .n{font-size:22px;font-weight:800;color:var(--blue)}.stat .l{font-size:12px;color:var(--mut)}
  .pill{font-size:12px;padding:2px 8px;border-radius:10px;background:#eef6ef;color:var(--blue);border:1px solid #cfe6cf}
  .tagnew{font-size:12px;background:#e3f4f4;color:var(--new);border:1px solid #b9e2e2;border-radius:8px;padding:1px 7px;margin-left:4px}
  .tagsg{font-size:12px;background:#fdecea;color:#c62828;border:1px solid #f5b5ae;border-radius:8px;padding:1px 7px;margin-left:4px;white-space:nowrap}
  .lock{font-size:12px;color:#b26a00;background:#fff7e6;border:1px solid #ffe1a8;border-radius:8px;padding:2px 7px}
  .own{font-size:12px;color:#1b6b3a;background:#eaf7ee;border:1px solid #b6e3c6;border-radius:8px;padding:2px 7px}
  .barbg{background:#eef1f5;border-radius:6px;overflow:hidden;flex:1;height:10px}.bar{height:10px;border-radius:6px;background:var(--blue)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;z-index:50}.toast.on{opacity:.95}
  .note{font-size:12px;color:var(--mut);margin:2px 0 10px;line-height:1.6}.right{text-align:right}.ck{width:18px;height:18px}.excl{opacity:.85}
  .loading{padding:40px;text-align:center;color:var(--mut)}
  /* ===== 2026-07-27 盤點體驗改版 ===== */
  .stickyctl{position:sticky;top:120px;z-index:15;background:var(--bg);padding:6px 2px 2px;margin:0 -2px}

  .modal{background:#fff;border-radius:14px;padding:18px;max-width:430px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .mopt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;cursor:pointer}

  .chip{min-height:32px;display:inline-flex;align-items:center}
  .zhead{cursor:pointer;user-select:none}

<script>
/* 2026-07-30 儀表板權限閘門 v1：密碼由「權限中心」GAS 集中管理（Sheet dim_auth），每頁獨立密碼＋TTL */
(function(){
  var DASH_ID = 'purchase';
  var DASH_NAME = '採購系統';   /* 與 dim_auth 的 name 欄一致 */
  var AUTH_API = 'https://script.google.com/macros/s/AKfycbyQ9LWY74Ix8VBe1gDoMdSF5eH74ratL7_f0EUUHi37IH3bXhkIJMx4WB2I-c-MLsWtLQ/exec';
  var KEY = 'dash_auth_' + DASH_ID;
  try {
    var o = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (o && o.exp && Date.now() < o.exp) return;      /* 效期內 → 放行 */
    localStorage.removeItem(KEY);
  } catch(_){}
  document.documentElement.style.visibility = 'hidden';
  /* 2026-08-05 效能：閘門顯示的同時先 ping 預熱權限中心 GAS，使用者輸完密碼時引擎已暖機，verify 由 3-8 秒降到 <1 秒 */
  (function warmup(){
    var pn = '__agwarm' + Date.now();
    var ps = document.createElement('script');
    window[pn] = function(){ try { delete window[pn]; } catch(_){} if (ps.parentNode) ps.parentNode.removeChild(ps); };
    ps.onerror = window[pn];
    ps.src = AUTH_API + '?action=ping&callback=' + pn;
    document.head.appendChild(ps);
  })();
  function verify(pwd, cb){
    var name = '__agcb' + Date.now();
    var s = document.createElement('script');
    var to = setTimeout(function(){ done({ok:false, error:'連線逾時，請重試（GAS 冷啟動可能較慢）'}); }, 30000);
    function done(d){ clearTimeout(to); delete window[name]; if (s.parentNode) s.parentNode.removeChild(s); cb(d); }
    window[name] = done;
    s.onerror = function(){ done({ok:false, error:'連線失敗，請重試'}); };
    s.src = AUTH_API + '?action=verify&callback=' + name + '&dashboard=' + encodeURIComponent(DASH_ID) + '&pwd=' + encodeURIComponent(pwd);
    document.head.appendChild(s);
  }
  function show(){
    var d = document.createElement('div');
    d.id = 'authGate';
    d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#4A3228;display:flex;align-items:center;justify-content:center;visibility:visible';
    d.innerHTML = '<div style="background:#fff;border-radius:14px;padding:28px 26px;width:min(320px,86vw);text-align:center;font-family:system-ui">'
      + '<div style="font-size:17px;font-weight:800;color:#4A3228;margin-bottom:4px">🔐 ' + (DASH_NAME || document.title.split(/[|｜—]/)[0].trim() || '儀表板') + '</div>'
      + '<div style="font-size:12px;color:#6F4E45;margin-bottom:14px">請輸入本儀表板密碼</div>'
      + '<div style="position:relative">'
      + '<input id="agPwd" type="password" autocomplete="current-password" style="width:100%;box-sizing:border-box;padding:10px 40px 10px 10px;border:1px solid #D8C8BE;border-radius:8px;font-size:15px">'
      + '<button type="button" id="agEye" aria-label="顯示密碼" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;font-size:16px;cursor:pointer;padding:4px;line-height:1">👁</button>'
      + '</div>'
      + '<div id="agErr" style="color:#C43030;font-size:12px;min-height:16px;margin:6px 0"></div>'
      + '<button id="agBtn" style="width:100%;padding:10px;border:none;border-radius:8px;background:#7B4B36;color:#fff;font-size:15px;font-weight:700;cursor:pointer">進入</button>'
      + '<div style="margin-top:12px"><a href="hub.html" style="font-size:12px;color:#6F4E45">⬅ 回首頁</a></div></div>';
    document.body.appendChild(d);
    var inp = document.getElementById('agPwd'), btn = document.getElementById('agBtn'), err = document.getElementById('agErr');
    var eye = document.getElementById('agEye');
    if (eye) eye.onclick = function(){
      var showPw = inp.type === 'password';
      inp.type = showPw ? 'text' : 'password';
      eye.textContent = showPw ? '🙈' : '👁';
      inp.focus();
    };
    function go(){
      var v = inp.value; if (!v) return;
      btn.disabled = true; btn.textContent = '驗證中…';
      verify(v, function(r){
        if (r && r.ok) {
          try { localStorage.setItem(KEY, JSON.stringify({ exp: Date.now() + (Number(r.ttl_hours) || 12) * 3600 * 1000 })); } catch(_){}
          /* 2026-08-05 效能：比照 POS 08-03 修法，不再 location.reload()。
             頁面在輸入密碼期間已於遮罩後完成資料載入與渲染，重整會全部重跑（多等 5-15 秒），
             改為就地拆除遮罩即可。 */
          if (d && d.parentNode) d.parentNode.removeChild(d);
          document.documentElement.style.visibility = '';
        } else {
          err.textContent = (r && r.error) || '驗證失敗';
          btn.disabled = false; btn.textContent = '進入';
          inp.value = '';
          if (eye && inp.type !== 'password') { inp.type = 'password'; eye.textContent = '👁'; }
          inp.focus();
        }
      });
    }
    btn.onclick = go;
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });
    setTimeout(function(){ inp.focus(); }, 150);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show);
  else show();
})();
</script>

<script>
/* ===== 設定 ===== */
var SHEET_ID='1EyDihj4LPok_dvv3ZkAzDhsHqs7kDi5RTCXPF5Lt1ao';
var MONTH_SHEET_ID='19tG-AMYtiZPTYQcz85TGiGS2G4M5U1gZw9Mab2UFFU0'; // agg_usage_month 獨立檔（BOM 本已近儲存格上限）

/* ===== 引擎（與試用版同，已驗證） ===== */
function ceilDiv(a,b){return b>0?Math.ceil(a/b-1e-9):0;}
function num(x){return (x===null||x===undefined||x===""||isNaN(+x))?0:+x;}
function reorderPoint(f,w,cyc,lead,safe){return num(f)*(w||1)*((cyc||1)+num(lead)/7)+num(safe);}
function computeRow(sku,p){p=p||{};var onHand=num(p.onHand),dur=(p.parMode!=null?!!p.parMode:(sku.cat==="器具"||sku.cat==="模具")),suggested,rp=null,basis;
  if(dur){var parBase=num(p.par),ni=num(p.newitem),par=Math.max(parBase,ni),br=num(p.breakage);suggested=Math.max(0,par+br-onHand);basis={mode:"par",par:par,parBase:parBase,newitem:ni,breakage:br,onHand:onHand};}
  else{rp=reorderPoint(p.forecastWeekly,p.weight,p.orderCycleWeeks,p.leadDays,p.safety)+num(p.booking)+num(p.newitem);suggested=Math.max(0,rp-onHand);
    basis={mode:"forecast",manual:!!p.manual,forecastWeekly:num(p.forecastWeekly),weight:(p.weight||1),coverageWeeks:(p.orderCycleWeeks||1)+num(p.leadDays)/7,safety:num(p.safety),booking:num(p.booking),newitem:num(p.newitem),reorderPoint:rp,onHand:onHand};}
  var pq=(p.packQty==null?num(sku.packQty):num(p.packQty));   // p.packQty＝bundle 帶入的生效內容量（店覆蓋優先）
  var packs=pq>0?ceilDiv(suggested,pq):Math.round(suggested);
  return{suggested:Math.round(suggested),reorderPoint:rp==null?null:Math.round(rp),packs:packs,isDurable:dur,basis:basis};}

/* ===== 資料（bootstrap 由 gviz 載入） ===== */
var SKUS=[],STORES=[],AGG={},PARAM={},INV={},SIDX={},SFACT={low:0.8,high:1.2},UNITCONV=[],CONTAINER={},DIRTY={},BOOKAGG={},DESSERTS=[],BOOKINGS=[],USAGED={},ORDERS=[],FLOWST="",EVENTS=[],NEWAGG={},REFP={};

var SKU={}; // sku_id -> sku

/* ── 資料源讀取（2026-08-31 t 批）────────────────────────────────────────
   Google Sheet 被人貼資料／跑腳本時會整份鎖住重算，gviz 可能十幾分鐘不回應。
   舊行為：等 20 秒 → 靜默回 [] → 畫面像「沒資料」，店長無法分辨是沒貨還是壞了。
   新行為：讀成功 → 存一份到瀏覽器（localStorage）；讀失敗／逾時 → 改用上次成功的那份，
           並在頁面上方亮橘色警示列說明「資料源忙碌中、顯示的是幾點的資料」。
   回傳陣列可能帶兩個標記：rows.__cached＝快取時間戳（用的是舊資料）／rows.__failed＝true（連舊資料都沒有）。
   呼叫端不需要改；需要區分來源的（如 loadAnalDims）自己看標記。 */
var GV={bad:{},TIMEOUT:20000,MAXCACHE:1500000,MAXQ:40};
function gvHash(str){var h=0;for(var i=0;i<str.length;i++){h=((h<<5)-h+str.charCodeAt(i))|0;}return (h>>>0).toString(36);}
function gvcGet(key){try{var t=localStorage.getItem("dpc:"+key);if(!t)return null;var o=JSON.parse(t);if(!o||!o.d)return null;return o;}catch(e){return null;}}
function gvcSet(key,rows){
  try{var t=JSON.stringify({t:Date.now(),d:rows});if(t.length>GV.MAXCACHE)return;
    try{localStorage.setItem("dpc:"+key,t);}catch(e1){gvcEvict(true);try{localStorage.setItem("dpc:"+key,t);}catch(e2){}}
    if(key.indexOf("gq:")===0)gvcEvict(false);
  }catch(e){}}
function gvcEvict(hard){ /* 查詢快取只留最近 MAXQ 筆；hard＝空間不足時砍一半 */
  try{var ks=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("dpc:gq:")===0)ks.push(k);}
    var lim=hard?Math.floor(GV.MAXQ/2):GV.MAXQ;if(ks.length<=lim)return;
    ks.sort(function(a,b){var ta=0,tb=0;try{ta=JSON.parse(localStorage.getItem(a)).t||0;}catch(e){}try{tb=JSON.parse(localStorage.getItem(b)).t||0;}catch(e){}return ta-tb;});
    ks.slice(0,ks.length-lim).forEach(function(k){localStorage.removeItem(k);});
  }catch(e){}}
function gvBanner(){
  var el=document.getElementById("gvWarn");if(!el)return;
  var ks=Object.keys(GV.bad);if(!ks.length){el.style.display="none";el.innerHTML="";return;}
  var oldest=null,noCache=0;ks.forEach(function(k){var b=GV.bad[k];if(b.cached){if(oldest===null||b.cached<oldest)oldest=b.cached;}else noCache++;});
  function hm(t){var d=new Date(t);return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
  var msg;
  if(noCache===0)msg='<b>⚠️ 資料源忙碌中</b><span>Google Sheet 可能正在重算（有人貼資料或跑腳本）。目前顯示的是 <b>'+hm(oldest)+'</b> 讀到的資料，數字可能不是最新；稍後重新整理即可更新。</span>';
  else if(oldest===null)msg='<b>⚠️ 資料源沒有回應</b><span>Google Sheet 可能正在重算（有人貼資料或跑腳本），而且這台裝置沒有先前的資料可用。請等幾分鐘後重新整理；若持續超過 30 分鐘請通知總部。</span>';
  else msg='<b>⚠️ 資料源忙碌中</b><span>部分資料改用 <b>'+hm(oldest)+'</b> 的舊資料，另有 '+noCache+' 張表完全讀不到。請等幾分鐘後重新整理。</span>';
  el.innerHTML=msg;el.style.display="";
}
function gvCore(url,key,tag){
  var p=fetch(url).then(function(r){return r.text();}).then(function(t){
    var j=JSON.parse(t.substring(t.indexOf('{'),t.lastIndexOf('}')+1));
    var cols=((j.table&&j.table.cols)||[]).map(function(c){return (c.label||c.id);});
    var rows=((j.table&&j.table.rows)||[]).map(function(r){var o={};(r.c||[]).forEach(function(c,i){o[cols[i]]=c?c.v:null;});return o;});
    gvcSet(key,rows);return {ok:true,rows:rows};
  }).catch(function(e){console.warn('gviz '+tag+' 失敗',e);return {ok:false};});
  var to=new Promise(function(res){setTimeout(function(){res({ok:false,timeout:true});},GV.TIMEOUT);});
  return Promise.race([p,to]).then(function(r){
    if(r.ok){delete GV.bad[key];gvBanner();return r.rows;}
    var c=gvcGet(key);var rows;
    if(c){rows=c.d;rows.__cached=c.t;GV.bad[key]={cached:c.t,tag:tag};}
    else{rows=[];rows.__failed=true;GV.bad[key]={cached:false,tag:tag};}
    console.warn('gviz '+tag+(r.timeout?' 逾時':' 失敗')+(c?'，改用 '+new Date(c.t).toLocaleString()+' 的快取':'，且無快取'));
    gvBanner();return rows;
  });
}
/* ===== 2026-09-05 ap 批：分檔第二步（讀寫分離） =====
   BOM 本（SHEET_ID）＝真相，有公式、POS 每天寫、會被重算鎖住；儀表板專用檔（DASH_ID）＝零公式、人永遠不開、只有 GAS 寫。

var DASH_ID='1FF7lW3JINR0-Id7MMYSRkoRzA1BYdqktO94NbzAFYG0';
var BOM_ONLY={"POS資料":1,"BOM表":1};
function readIdOf(sheetName){return BOM_ONLY[sheetName]?SHEET_ID:DASH_ID;}
function gviz(sheetName){
  var rid=readIdOf(sheetName);
  var url='https://docs.google.com/spreadsheets/d/'+rid+'/gviz/tq?tqx=out:json&headers=1&sheet='+encodeURIComponent(sheetName);
  return gvCore(url,"gv:"+rid+":"+sheetName,sheetName);

function gvizQ(sheetName,tq,ssid){
  var id=ssid||readIdOf(sheetName);
  var url='https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:json&headers=1&sheet='+encodeURIComponent(sheetName)+'&tq='+encodeURIComponent(tq);
  return gvCore(url,"gq:"+id+":"+sheetName+":"+gvHash(tq),sheetName);
}

var VERIFY_DELAYS=[2000,4000,6000];
function fetchFresh(sheetName){

  return fetch(url).then(function(r){return r.text();}).then(function(t){
    var j=JSON.parse(t.substring(t.indexOf('{'),t.lastIndexOf('}')+1));
    var cols=((j.table&&j.table.cols)||[]).map(function(c){return (c.label||c.id);});
    return ((j.table&&j.table.rows)||[]).map(function(r){var o={};(r.c||[]).forEach(function(c,i){o[cols[i]]=c?c.v:null;});return o;});});}

/* 參數寫入回讀：post() 為 no-cors，成功與否無法從回應判斷，必須回讀 dim_store_par 確認。
   失敗時不靜默——推進 ST.writeWarn，由 render() 統一顯示紅色橫幅。 */
function verifyParam(store,skuId,label,expected,attempt,cb){
  var d=VERIFY_DELAYS[Math.min(attempt,VERIFY_DELAYS.length-1)];
  setTimeout(function(){
    fetchFresh('dim_store_par').then(function(rows){
      var hit=null;
      rows.forEach(function(r){if(String(r["店號"])===String(store)&&String(r["sku_id"])===String(skuId))hit=r;});
      var ok=false;
      if(hit){var cur=hit[label];
        if(label==="使用中")ok=(toBool(cur)===toBool(expected));
        else if(label==="盤點分區"||label==="店品名"||label==="店廠商")ok=(String(cur==null?"":cur).trim()===String(expected==null?"":expected).trim());
        else ok=(Math.abs(num(cur)-num(expected))<1e-6);}
      if(ok){pruneWarn(store,skuId,label);if(cb)cb(true);render();return;}
      if(attempt<VERIFY_DELAYS.length-1){verifyParam(store,skuId,label,expected,attempt+1,cb);return;}
      pushWarn(store,skuId,label,expected);if(cb)cb(false);render();
    }).catch(function(){
      if(attempt<VERIFY_DELAYS.length-1){verifyParam(store,skuId,label,expected,attempt+1,cb);return;}
      pushWarn(store,skuId,label,expected);if(cb)cb(false);render();});
  },d);}

function pruneWarn(store,skuId,label){
  if(!ST.writeWarn||!ST.writeWarn.length)return;var k=warnKey(store,skuId,label);
  ST.writeWarn=ST.writeWarn.filter(function(w){return w.k!==k;});}

function postParam(store,skuId,fields,cb){     // 寫參數的唯一入口：送出＋逐欄回讀驗證

function verifySave(store,expect,attempt,btn){

  var u=m.unit||'',per=(portions>0)?(qty/portions):0;

function parseBookingCsv(buf){var txt="";
  try{txt=new TextDecoder("utf-8",{fatal:false}).decode(buf);}catch(e){txt="";}
  if((txt.match(/\uFFFD/g)||[]).length>2){try{txt=new TextDecoder("big5").decode(buf);}catch(e){}}
  txt=txt.replace(/^\uFEFF/,"");
  var rows=[];txt.split(/\r?\n/).forEach(function(ln){ln=ln.trim();if(!ln)return;var c=ln.split(",");
    var ds=(c[0]||"").trim(),q=(c[1]||"").trim(),no=c.slice(2).join(",").trim();
    rows.push({dessert:ds,qty:q,note:no});});
  if(rows.length&&isNaN(+rows[0].qty))rows.shift(); // 表頭自動跳過
  rows.forEach(function(r){r.qty=+r.qty;
    if(!r.dessert)r.err="無甜點名";
    else if(DESSERTS.indexOf(r.dessert)<0)r.err="甜點不在清單";
    else if(!(r.qty>0))r.err="數量需>0";});
  return rows;}

    html+='<tr><td>'+u.item+(sk?'':' <span class="muted" title="主檔找不到此品名">（未對應）</span>')+warn+'</td><td>1 '+u.unit+'</td><td>'+(ed?'<input class="sm" style="width:70px" type="number" step="0.01" data-cvi="'+i+'" value="'+u.amt+'">':'<b>'+u.amt+'</b>')+'</td><td>'+u.base+'</td>'+(ed?'<td>'+(CONV_API?'<button class="btn sm ghost" data-cvdel="'+i+'" title="刪除這列換算">🗑</button>':'<span class="muted" title="尚未部署 diybc-conv-api">—</span>')+'</td>':'')+'</tr>';});

/* 2026-08-19 單價參考層：主檔頁「單價參考」儲存格。
   裁定 B：僅提醒首字為 🔴/⚠ 顯示圖示，中性說明（銷售報表實際成交價/商品目錄價/查無等）只進 title。
   裁定 D：價格年份空白不顯示徽章。 */
function refCellM(s,ed){var rp=REFP[s.id];
  if(!rp)return '<td class="muted" style="font-size:12px">—</td>';
  var w=String(rp.warn||'').trim();
  var icon=w.indexOf('🔴')===0?'🔴 ':(w.indexOf('⚠')===0?'⚠ ':'');
  var tt=w.replace(/"/g,'&quot;');
  var parts=[];
  if(rp.sug!=null){
    var seg='<b>建議 $'+rp.sug+'</b>';
    if(rp.yr)seg+=' <span class="badge" style="background:#8A6E63">'+rp.yr+'</span>';
    if(ed)seg+=(num(s.price)===rp.sug?' <span class="muted" style="font-size:12px">＝目前單價</span>':' <button class="btn sm" data-applysug="'+s.id+'">套用</button>');
    parts.push(seg);
    if(rp.cost!=null&&rp.gm!=null){var neg=rp.gm<0;
      parts.push('<span style="font-size:12px;color:'+(neg?'#C0392B':'#6F4E45')+(neg?';font-weight:700':'')+'">成本 $'+rp.cost+' ・ 毛利 '+rp.gm+'%</span>');}
  }
  if(rp.y5!=null&&(rp.lm!=null||rp.y6!=null)){
    var nowP=(rp.lm!=null?rp.lm:rp.y6);
    var c=rp.chg!=null?rp.chg:(rp.y5>0?Math.round((nowP-rp.y5)/rp.y5*1000)/10:null);
    parts.push('<span style="font-size:12px;color:#6F4E45">2025 $'+rp.y5+' → 今 $'+nowP+(c!=null?'（'+(c>0?'+':'')+c+'%）':'')+'</span>');
  }
  if(!parts.length)return '<td class="muted" style="font-size:12px" title="'+tt+'">'+(icon?icon.trim():'—')+'</td>';
  return '<td style="font-size:12px;min-width:150px" title="'+tt+'">'+icon+parts.join('<br>')+'</td>';
}
/* 2026-09-03 y 批 ①：新增品項的編號改自動流水號（不必開 Sheet 查）。
   規則＝看同品類別現有 sku_id 最常見的英文前綴，取該前綴最大號 +1，補到同樣位數；撞號自動往後跳。 */
function nextSkuId(cat){
  var pfx={},maxN={},wid={};
  SKUS.forEach(function(s){var m=String(s.id||"").match(/^([A-Za-z]+)(\d+)$/);if(!m)return;
    var pp=m[1].toUpperCase(),nn=+m[2];
    if(s.cat===cat)pfx[pp]=(pfx[pp]||0)+1;
    if(!(maxN[pp]>=nn))maxN[pp]=nn;
    if(!(wid[pp]>=m[2].length))wid[pp]=m[2].length;});
  var best="",bc=-1;Object.keys(pfx).forEach(function(pp){if(pfx[pp]>bc){bc=pfx[pp];best=pp;}});
  if(!best)best=({"食材":"F","耗材":"C","器具":"T","模具":"T"})[cat]||"X";
  var w=wid[best]||3,n=(maxN[best]||0)+1,id="";
  for(var i=0;i<9999;i++){var t=String(n+i);while(t.length<w)t="0"+t;id=best+t;if(!SKU[id])break;}
  return id;}

  return "";}

/* ===== 2026-08-29 r 批：搜尋框中文輸入法（IME）與焦點還原統一處理 =====
   問題① 每打一個字就 render() 全頁重繪，注音/拼音「組字中」的輸入框被抽換 → 組字被中斷，中文永遠打不出來（只有英數進得去）
   問題② 焦點還原靠 ST.xxQF 旗標；下單紀錄的 onblur 會在 innerHTML 抽換瞬間把旗標清掉 → 打完第一個字就失焦，第二個字打不進去
   解法   組字期間不重繪（compositionend 才送出）＋焦點還原改記「送出前焦點所在的 id 與游標位置」，不再依賴旗標
   注意   QF 由 qSubmit 在 render() 之前寫入、由下一輪 bindQ 取用，wire() 結尾一律清空避免殘留搶焦點 */
var QF=null;
function qSubmit(el,apply){
  if(el.__last===el.value)return;           /* 同值不重繪：compositionend 與其後的 input 只送一次 */
  el.__last=el.value;
  var p=null;try{p=el.selectionStart;}catch(e){}
  QF={id:el.id,pos:p};
  apply(el.value);
}
function bindQ(el,apply){
  if(!el)return;
  el.__last=el.value;                       /* 綁定時對齊現值：重繪後補發的同值 input 不會再送一次 */
  el.addEventListener("compositionstart",function(){el.__ime=1;});
  el.addEventListener("compositionend",function(){el.__ime=0;qSubmit(el,apply);});
  el.oninput=function(e){
    if(el.__ime||(e&&e.isComposing))return; /* 組字中只讓輸入法自己顯示，不重繪 */
    qSubmit(el,apply);
  };
  if(QF&&QF.id&&QF.id===el.id){
    var p=QF.pos;QF=null;
    try{el.focus();if(p==null)p=el.value.length;el.setSelectionRange(p,p);}catch(e2){}
  }
}

function shStoreIds(){return STORES.map(function(x){return String(x.id);}).filter(function(id){return id!=="13";});}
function shEsc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function shN(n){return (Math.round((+n||0)*100)/100).toLocaleString("zh-Hant-TW");}
function shM(n){return "NT$"+Math.round(+n||0).toLocaleString("zh-Hant-TW");}
function loadShist(st){
  st=String(st);
  if(SHIST[st])return Promise.resolve(SHIST[st]);
  if(SHLOAD[st])return SHLOAD[st];
  SHLOAD[st]=gvizQ("fact_shopline","select A,B,C,D,E,F,G where A="+Number(st),MONTH_SHEET_ID).then(function(rs){
    var rows=rs.map(function(r){
      var d=gvDate(r["日期"]);
      return {st:st,date:d?ymd(d):String(r["日期"]||"").slice(0,10),ord:String(r["訂單號碼"]||""),name:String(r["品項"]||""),cat:String(r["分類"]||""),qty:num(r["數量"]),price:num(r["單價"])};
    }).filter(function(r){return r.date&&r.ord;});
    rows.sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
    SHIST[st]=rows;delete SHLOAD[st];return rows;
  });
  return SHLOAD[st];
}
/* ===== 2026-09-04 al 批 ②：全店模式 =====
   經營者需求：採購大平台除了逐店，還要能一次看全公司。
   作法＝把 12 店各自的 loadShist 併起來（Promise.all），不另外做一支「整張表無 where」的查詢：
     · 每店各自逾時、各自進 localStorage 快取（單店約幾百 KB，整表會超過 1.5MB 快取上限直接不存）
     · 已經看過的店是現成的，不重抓

   排除 13 號店（已歇業，與 bootstrap 同規則）。 */
function loadShistAll(){
  if(SHIST.ALL)return Promise.resolve(SHIST.ALL);
  if(SHLOAD.ALL)return SHLOAD.ALL;
  var ids=shStoreIds();
  SHLOAD.ALL=Promise.all(ids.map(function(id){return loadShist(id).catch(function(){return [];});})).then(function(arr){
    var rows=[];arr.forEach(function(a){if(a&&a.length)rows=rows.concat(a);});
    rows.sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
    SHIST.ALL=rows;delete SHLOAD.ALL;return rows;
  }).catch(function(){delete SHLOAD.ALL;SHIST.ALL=[];return [];});
  return SHLOAD.ALL;
}
function shScopeRows(){return ST.shAll?(SHIST.ALL||[]):(SHIST[String(ST.storeId)]||[]);}
function shRows(){
  var all=shScopeRows();

    var d=new Date(all[all.length-1].date+"T00:00:00");d.setMonth(d.getMonth()-(+ST.shPer)+1);d.setDate(1);f=ymd(d);

  var q=(ST.shoQ||"").toLowerCase();
  return all.filter(function(r){
    if(f&&r.date<f)return false;

  });
}

    if(open){h+='<tr><td colspan="'+(allMode?6:5)+'" style="background:#fffdf2;padding:4px 10px"><table style="font-size:12.5px">';
      g.forEach(function(r){h+='<tr><td>'+shEsc(r.name)+' <span class="muted">'+shEsc(r.cat)+'</span></td><td style="text-align:right">'+shN(r.qty)+'</td><td style="text-align:right">@'+shN(r.price)+'</td><td style="text-align:right">'+shM(r.qty*r.price)+'</td></tr>';});
      h+='</table></td></tr>';}
  });
  h+='</tbody></table>';
  if(keys.length>PG){h+='<div style="margin-top:8px">'
    +(ST.shPage>0?'<button class="btn ghost sm" data-shpg="-1">← 較新</button> ':'')
    +'<span class="muted">第 '+(ST.shPage*PG+1)+'–'+Math.min((ST.shPage+1)*PG,keys.length)+' ／ '+keys.length+' 張</span>'
    +(ST.shPage<tp-1?' <button class="btn ghost sm" data-shpg="1">較舊 →</button>':'')+'</div>';}
  return h;
}

/* 2026-09-04 al 批 ②：把採購參考的計算抽成純函式，讓「全店模式」可以逐店各算一次再彙總。
   單店模式的呼叫參數與舊版完全相同（mxD／wf 一樣由該店最後一筆日期推出）⇒ 輸出逐值不變。 */
function shAdvCalc(all,q,mxD,wf){
  if(!all||!all.length)return [];
  /* 未訂天數以「資料截止日」計，不用今天：每月才貼一次資料，用今天會把最近幾天已訂但還沒貼進來的品項誤報成 ⚠️ */
  function dd(a,b){return Math.round((b-a)/86400000);}
  function D(x){return new Date(x+"T00:00:00");}
  function nk(o){var c=0;for(var k in o)c++;return c;}
  var m={};
  all.forEach(function(r){
    if(q&&r.name.toLowerCase().indexOf(q)<0)return;
    var e=m[r.name]=m[r.name]||{cat:r.cat,hdays:{},hfirst:"9999",hlast:"",pqty:0,pords:{},pdays:{},pfirst:"9999",plast:""};
    e.hdays[r.date]=1;if(r.date<e.hfirst)e.hfirst=r.date;if(r.date>e.hlast)e.hlast=r.date;
    if(!wf||r.date>=wf){e.pqty+=r.qty;e.pords[r.ord]=1;e.pdays[r.date]=1;if(r.date<e.pfirst)e.pfirst=r.date;if(r.date>e.plast)e.plast=r.date;}
  });
  var list=Object.keys(m).map(function(n){
    var e=m[n],pc=nk(e.pords),pdc=nk(e.pdays),hdc=nk(e.hdays);
    var since=dd(D(e.hlast),mxD);
    var itv=pdc>=2?dd(D(e.pfirst),D(e.plast))/(pdc-1):null;
    var hitv=hdc>=2?dd(D(e.hfirst),D(e.hlast))/(hdc-1):null;
    var cov0=(wf&&wf>e.hfirst)?wf:e.hfirst;
    var months=Math.max(1,(dd(D(cov0),mxD)+1)/30.4);
    var mavg=pc?e.pqty/months:null;
    var thr=itv?Math.round(itv*1.5):null;
    var due=false,stx;
    if(pc===0){
      if(hdc>=3&&hitv&&since>hitv*1.5){due=true;stx='<span class="shdue">⚠️ 期間內未下單</span> <span class="muted">（歷史約每 '+Math.round(hitv)+' 天訂一次）</span>';}
      else stx='<span class="muted">期間內未下單</span>';
    }else if(pdc>=3&&itv){
      if(since>itv*1.5){due=true;stx='<span class="shdue">⚠️ 超過 '+thr+' 天未訂</span>';}
      else stx='<span class="shok">✓ 正常</span> <span class="muted">（'+thr+' 天內）</span>';
    }else stx='<span class="muted">資料少</span>';
    return {name:n,cat:e.cat,pqty:e.pqty,cnt:pc,itv:itv,last:e.hlast,since:since,mavg:mavg,due:due,stx:stx,inPer:pc>0};
  });
  list=list.filter(function(e){return e.inPer||e.due;});  /* 期間內沒訂且歷史不足以判斷的不列（純雜訊），切「全部歷史」可見 */
  return list;}
function shAdvView(){
  /* 2026-08-31 t 批 混合口徑：月均量／下單次數／平均週期＝期間內資料（跟上方篩選）；上次下單／距今＝全歷史。
     期間內沒下單但歷史有的品項仍列出（那正是該補的訊號）。 */
  var all=SHIST[String(ST.storeId)]||[],q=(ST.shoQ||"").toLowerCase();
  if(!all.length)return '<div class="muted">此店沒有大平台下單紀錄。</div>';
  var mxD=new Date(all[all.length-1].date+"T00:00:00");
  var wf=null;
  if(ST.shPer!=="all"){var d0=new Date(all[all.length-1].date+"T00:00:00");d0.setMonth(d0.getMonth()-(+ST.shPer)+1);d0.setDate(1);wf=ymd(d0);}
  var list=shAdvCalc(all,q,mxD,wf);
  if(!list.length)return '<div class="muted">沒有符合的品項。</div>';
  list.sort(function(a,b){if(a.due!==b.due)return a.due?-1:1;if(a.inPer!==b.inPer)return a.inPer?-1:1;return (b.pqty-a.pqty)||(b.since-a.since);});
  var perLbl=ST.shPer==="all"?"全部歷史":"近 "+ST.shPer+" 個月";
  var h='<table><thead><tr><th>品項</th><th style="text-align:right">月均量</th><th style="text-align:right">下單次數</th><th style="text-align:right">平均週期(天)</th><th>上次下單</th><th style="text-align:right">未訂天數</th><th>狀態</th></tr></thead><tbody>';
  list.forEach(function(e){
    h+='<tr><td>'+shEsc(e.name)+' <span class="muted">'+shEsc(e.cat)+'</span></td><td style="text-align:right">'+(e.mavg==null?'–':e.mavg.toFixed(1))+'</td><td style="text-align:right">'+e.cnt+'</td><td style="text-align:right">'+(e.itv?Math.round(e.itv):'–')+'</td><td>'+e.last+'</td><td style="text-align:right">'+e.since+'</td><td>'+e.stx+'</td></tr>';});
  return h+'</tbody></table><div class="muted" style="margin-top:6px">月均量／下單次數／平均週期＝<b>'+perLbl+'</b>內的資料（月均量＝期間內數量÷涵蓋月數，新品從首次下單起算；平均週期＝期間內下單日之間的平均間隔）；上次下單＝全部歷史；未訂天數＝上次下單到<b>資料截止日 '+ymd(mxD)+'</b> 的天數（資料每月更新，不以今天計）。⚠️＝未訂天數超過平均週期的 1.5 倍，可能該補了；「期間內未下單」＝這段期間沒訂過、但以前常訂。期間內沒訂且以前也少訂的品項不列，切「全部歷史」可見。本頁看的是「向出貨中心下單」的行為紀錄，與訂貨單的 POS 用量推估互補；實際下單請以盤點庫存與訂貨單為準。</div>';
}
/* 2026-09-04 al 批 ②：全店版採購參考。
   ⚠️ 跨店直接算「平均週期」是沒有意義的——12 家店各自照自己的節奏下單，把 12 條時間軸混在一起會算出假的短週期。
   所以全店模式改成：月均量／下單次數＝全公司合計；週期與逾期改成「逐店各算一次，再回報有幾家店逾常態週期」。

function shAdvAllView(){

    h+='<tr><td>'+shEsc(e.name)+' <span class="muted">'+shEsc(e.cat)+'</span></td><td style="text-align:right">'+(e.mavg?e.mavg.toFixed(1):'–')+'</td><td style="text-align:right">'+e.cnt+'</td><td style="text-align:right">'+e.nst+' 店</td><td>'+e.last+'</td><td style="text-align:right">'+e.since+'</td><td>'+stx+'</td></tr>';});
  return h+'</tbody></table><div class="muted" style="margin-top:6px"><b>全店模式</b>：月均量／下單次數＝12 店合計（'+perLbl+'）；下單店數＝這段期間有訂過的門市數；未訂天數＝<b>全公司</b>最近一次下單到資料截止日 '+ymd(mxD)+' 的天數。'
    +'<b>「各店狀態」是逐店各算一次</b>——每家店拿自己的下單間隔比自己的歷史平均，超過 1.5 倍才標 ⚠️。'
    +'<b>刻意不提供「全公司平均下單週期」</b>：12 店各自的節奏混在一起會算出假的短週期，看了會做錯決定。要看單店細節請切回「本店」。</div>';
}

/* ===== 2026-09-05 aq 批：出貨中心每週上傳訂單報表 → 月檔 fact_shopline =====
   經營者需求：出貨中心人員在「採購大平台」直接上傳 Shopline 匯出報表，各店下單紀錄就更新，不用再每月給 Chat 做 TSV 貼。
   流程：選檔（.xls/.xlsx/.csv）→ 前端用 SheetJS 解析（cdnjs 動態載入）→ 找含「訂單號碼」與「商品名稱」的表頭列 →
         每列：店號＝收件人正則 (\d+)店；品項＝商品名稱＋（選項? 「｜選項」）；分類＝儲位編號；單價＝商品原價 或 訂單小計÷數量；
         訂單狀態含「取消」者排除 → 預覽（筆數／訂單數／日期範圍／各店筆數／歸不了戶的收件人）→ 確認上傳 →
         POST type:"shopline"（依訂單號碼切塊，每塊 ≤ SHUP_CHUNK 列）→ GAS 以「訂單號碼」為單位整張覆蓋 → 清 SHIST 快取重讀。
   為什麼是覆蓋不是追加：每週報表跟上週重疊，追加會重複計算；同單改量／取消也要跟著更新。
   與 q 批「同單同品多行合法、前端不去重」相容：覆蓋是整張訂單一起換，行數照原檔。 */
var SHUP=null,SHUP_CHUNK=600,SHUP_XLSX='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function shUploadCard(){
  var u=SHUP||{};
  var h='<div class="card" style="border:1px dashed #b8860b;background:#fffdf5"><div style="font-weight:700;font-size:15px">📤 上傳出貨中心訂單報表（每週）</div>'
    +'<div class="sub muted" style="margin:4px 0 8px">Shopline 匯出的訂單報表（含「訂單號碼／訂單日期／收件人／商品名稱／數量」欄），.xls／.xlsx／.csv 都可以。同一張訂單以訂單號碼為準<b>整張覆蓋</b>，重複上傳不會重複計算。收件人要含「N店」才歸得了戶。</div>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><input type="file" id="shUpFile" accept=".xls,.xlsx,.xlsm,.csv">'
    +(u.stage==="parsing"?'<span class="muted">解析中…</span>':'')+(u.stage==="uploading"?'<span class="muted">上傳中… '+(u.done||0)+'/'+(u.total||0)+' 筆</span>':'')+'</div>';
  if(u.err)h+='<div class="note" style="background:#fdecea;color:#B3261E;margin-top:8px">⚠️ '+shEsc(u.err)+'</div>';
  if(u.stage==="preview"&&u.rows){
    var st={};u.rows.forEach(function(r){st[r[0]]=(st[r[0]]||0)+1;});
    h+='<div class="note" style="margin-top:8px"><b>預覽</b>　'+fmt(u.rows.length)+' 筆　｜　'+fmt(u.orders)+' 張訂單　｜　'+u.dmin+' ～ '+u.dmax
      +(u.cancelled?'　｜　已排除取消 '+u.cancelled+' 筆':'')+'<br><span class="muted">各店：'+Object.keys(st).sort(function(a,b){return (+a)-(+b);}).map(function(k){return k+'店 '+st[k];}).join('、')+'</span>'
      +(u.unmapped.length?'<br><span style="color:#B45309">⚠️ 歸不了戶（收件人沒有「N店」）：'+u.unmapped.slice(0,8).map(shEsc).join('、')+(u.unmapped.length>8?' …共 '+u.unmapped.length+' 種':'')+'，這些列不會上傳</span>':'')
      +'</div><div style="margin-top:8px"><button class="btn" id="shUpGo">確認上傳 '+fmt(u.rows.length)+' 筆</button> <button class="btn" id="shUpCancel" style="background:#eee;color:#333">取消</button></div>';
  }
  if(u.stage==="done")h+='<div class="note" style="background:#eef8ee;margin-top:8px">✅ 已上傳 '+fmt(u.total)+' 筆（'+fmt(u.orders)+' 張訂單）'+(u.verified===true?'，已回讀確認':(u.verified===false?'，<span style="color:#B45309">回讀尚未看到，請 1 分鐘後重新整理確認</span>':''))+'。頁面資料已重新載入。</div>';
  return h+'</div>';}
function shLoadXlsx(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  return new Promise(function(res,rej){var s=document.createElement('script');s.src=SHUP_XLSX;s.onload=function(){res(window.XLSX);};s.onerror=function(){rej(new Error('無法載入解析元件（網路？）'));};document.head.appendChild(s);});}
/* 純函式：aoa（array of arrays，第一列不一定是表頭）→ {rows:[[店號,日期,訂單號碼,品項,分類,數量,單價]…], orders, dmin, dmax, cancelled, unmapped:[收件人…]} */
function shParseAoa(aoa){
  var hi=-1,H={};
  for(var i=0;i<Math.min(aoa.length,30);i++){var cells=(aoa[i]||[]).map(function(x){return String(x==null?'':x).replace(/\s+/g,'');});
    if(cells.indexOf('訂單號碼')>=0&&cells.indexOf('商品名稱')>=0){hi=i;cells.forEach(function(c,j){if(c&&H[c]==null)H[c]=j;});break;}}
  if(hi<0)throw new Error('找不到表頭列（需同時有「訂單號碼」與「商品名稱」）');
  function col(){for(var k=0;k<arguments.length;k++){if(H[arguments[k]]!=null)return H[arguments[k]];}return -1;}
  var cO=col('訂單號碼'),cD=col('訂單日期','日期'),cR=col('收件人','收件人姓名','分店'),cN=col('商品名稱','品項'),cV=col('選項','商品選項'),cC=col('儲位編號','分類'),cP=col('商品原價','單價'),cQ=col('數量'),cS=col('訂單小計','小計'),cSt=col('訂單狀態','狀態');
  if(cD<0||cR<0||cQ<0)throw new Error('缺少必要欄位：'+[cD<0?'訂單日期':'',cR<0?'收件人':'',cQ<0?'數量':''].filter(Boolean).join('、'));
  var rows=[],orders={},dmin='',dmax='',cancelled=0,unmapped={};
  for(var r=hi+1;r<aoa.length;r++){var a=aoa[r]||[];
    var ord=String(a[cO]==null?'':a[cO]).trim(); if(!ord)continue;
    if(cSt>=0&&/取消/.test(String(a[cSt]||''))){cancelled++;continue;}
    var rcp=String(a[cR]==null?'':a[cR]).trim(),m=rcp.match(/(\d{1,2})\s*[號号]?\s*店/);
    if(!m){unmapped[rcp||'（空白）']=1;continue;}
    var stn=String(+m[1]);
    var d=shCellDate(a[cD]); if(!d)continue; var ds=ymd(d);
    var name=String(a[cN]==null?'':a[cN]).trim(),opt=cV>=0?String(a[cV]==null?'':a[cV]).trim():'';
    if(!name)continue; var item=opt?(name+'｜'+opt):name;
    var qty=num(a[cQ]); var price=cP>=0?num(a[cP]):0; if(!price&&cS>=0&&qty>0)price=Math.round(num(a[cS])/qty*100)/100;
    var cat=cC>=0?String(a[cC]==null?'':a[cC]).trim():'';
    rows.push([stn,ds,ord,item,cat,qty,price]);orders[ord]=1;
    if(!dmin||ds<dmin)dmin=ds; if(!dmax||ds>dmax)dmax=ds;}
  return {rows:rows,orders:Object.keys(orders).length,dmin:dmin,dmax:dmax,cancelled:cancelled,unmapped:Object.keys(unmapped)};}
function shCellDate(v){
  if(v instanceof Date)return isNaN(v)?null:v;
  if(typeof v==='number'){var d=new Date(Math.round((v-25569)*86400*1000));return isNaN(d)?null:new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());}   /* Excel 序號 */
  var s=String(v==null?'':v).trim(); if(!s)return null;
  var m=s.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/); if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  return gvDate(s);}
function shUploadFile(file){
  SHUP={stage:"parsing"};render();
  shLoadXlsx().then(function(X){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){try{var wb=X.read(fr.result,{type:'array',cellDates:true});var sn=wb.SheetNames.indexOf('Sales')>=0?'Sales':wb.SheetNames[0];res(X.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''}));}catch(e){rej(e);}};fr.onerror=function(){rej(new Error('讀檔失敗'));};fr.readAsArrayBuffer(file);});})
  .then(function(aoa){var p=shParseAoa(aoa);if(!p.rows.length)throw new Error('沒有可上傳的列（歸不了戶或日期讀不到）');SHUP={stage:"preview",rows:p.rows,orders:p.orders,dmin:p.dmin,dmax:p.dmax,cancelled:p.cancelled,unmapped:p.unmapped};render();})
  .catch(function(e){SHUP={stage:"",err:String(e&&e.message||e)};render();});}
function shUploadGo(){
  var u=SHUP;if(!u||u.stage!=="preview")return;
  var chunks=[],cur=[],curOrd=null;   /* 依訂單號碼切塊：同一張訂單不跨塊，GAS 覆蓋才乾淨 */
  u.rows.forEach(function(r){if(cur.length>=SHUP_CHUNK&&r[2]!==curOrd){chunks.push(cur);cur=[];}cur.push(r);curOrd=r[2];});
  if(cur.length)chunks.push(cur);
  SHUP={stage:"uploading",done:0,total:u.rows.length,orders:u.orders,first:u.rows[0][2]};render();
  (function next(i){if(i>=chunks.length){shUploadVerify();return;}
    post({type:"shopline",rows:chunks[i]},true).then(function(){SHUP.done+=chunks[i].length;render();next(i+1);});})(0);}
function shUploadVerify(){
  var first=SHUP.first;
  setTimeout(function(){

      render();

  },3000);}
