<!-- 2026-07-25 全站字級下限修正：9 處 11px→12px（.badge/.pill/.tagnew/.lock/.own/header 更新時間/兩個檔期徽章/建議採購表副行）。無其他改動。 -->
<!-- 2026-07-27 盤點體驗改版（純前端）：①移除 需關注/接近/久未盤 快篩與燈號/推估/未盤點估算標籤（estOnHand/invLight/invTag 保留備用）②搜尋拆二：品項 datalist 可點選＋廠商下拉，AND 疊加 ③盤點 session：延續/新的一週彈窗、localStorage invSession_/invDraft_（草稿防遺失，不動 Sheet 歷史）、進度條、本次未盤快篩、下一個未盤浮動鈕 ④分區可收合(invZC_)、控制列 sticky、輸入框 42px/16px 防 iOS 縮放 ⑤儲存盤點後清草稿並跳訂貨單。 -->
<!-- 2026-07-27 店長自助調整基準值：盤點頁/訂貨單頁每列「⚙ 調整」→ 對話框輸入本店實際週用量（採購單位），永久寫回 dim_store_par。寫哪欄依品項型態自動判定：POS推算品項→權數(=目標÷POS推算)、備品→手動週用量、器具模具→標配數量。同時 post type:'plog' 寫軌跡（需 GAS 端 handler，未部署時靜默忽略）。新增總部/經營者「🧾 參數軌跡」分頁讀 fact_param_log，變動≥20%橘、≥50%紅。依經營者決策：不設上下限護欄。 -->
<!-- 2026-07-27 寫入回讀驗證（修 Cowork 驗收發現之資料遺失風險）：post 為 no-cors，opaque response 一律 resolve，原本送出即 clearDraft，GAS 失敗時店長草稿會靜默消失。改為送出後回讀 fact_inventory（cache-bust，2/4/6 秒三次重試），比對「Sheet 現有量＝送出值」相符才清草稿並跳訂貨單；不符或連線失敗則保留草稿、不跳頁、顯示紅色警示要求重按。判準用值不用時間戳以避開時鐘偏差。同批：onHand placeholder 0→未填。 -->
<!-- 2026-07-27 店別參數頁調整：①「啟用」核取方塊改為勾選即 post 存檔（原本只改本機狀態，未按「存」會靜默丟失，且該品項已從盤點頁消失造成誤判）②店品名／順序兩欄改為僅總部可見（店長端隱藏，資料與邏輯保留）③店廠商欄加 placeholder 顯示總部主檔廠商，店長只在改用別家盤商時才需填寫。 -->
<!-- 2026-07-27 盤點/訂貨單兩項修正：①「儲存盤點」改為固定底部操作列（.savebar），隨時可按，並即時顯示待送出筆數與本次進度；原畫面最底 toolbar 移除，加 .padbot 佔位避免遮擋。②訂貨單只列「本輪已盤點」的品項（countedForOrder：無盤點紀錄→排除；已開啟盤點輪次→需本輪盤過），未盤不再被當成庫存 0 而全數建議採購；頁首顯示「N 項本輪未盤點，未列入」提示，orderText 同步過濾。 -->
<!-- 2026-07-27 參數寫入回讀驗證（修 Cowork 二次驗收發現：同一靜默失敗缺陷存在於 param 寫入路徑）：新增 postParam() 為寫參數唯一入口，送出後回讀 dim_store_par 逐欄比對（2/4/6 秒三次重試），不符即推進 ST.writeWarn，由 render() 於所有分頁頂端顯示紅色橫幅提示「數值是暫時的，重新整理會恢復原值，請重做一次」。涵蓋 ⚙調整基準值、店別參數「存」、啟用勾選三處。fetchInvRows 一般化為 fetchFresh(sheetName)。註：post() 全域改為可讀回應需 GAS 端配合重新部署，未納入本批。 -->
<!-- 2026-07-27 寫入狀態回饋：原本只有失敗會提示、成功靜默，且 post() 的「已送出」語意誤導。改為 postParam 改用 silent post，並以 PSTATE 追蹤逐欄確認結果；店別參數「存」鈕三段式（存／確認中…／✓已存綠／⚠重試紅），完成時 toast 明確報「已確認寫入」或「有 N 項未寫入」；⚙調整與啟用勾選同樣給成功回饋；編輯欄位即清除舊狀態。 -->
<!-- 2026-07-27 UI 即時性修正：savePRow 抽為具名函式並以 refreshPstBtn 做 targeted DOM 更新（按下「存」立即顯示「確認中…」、改值立即回到「存」），避免整頁重繪；render() 加入捲動位置保留，解決 439 列參數頁重繪跳回頂端。 -->
<!-- 2026-07-27 內容量規格顯示：盤點頁列(📦 970 g／罐)、輸入框下方(1 罐=970g)、建議採購頁列、調整對話框 四處標示 packQty，供店長換算參考；packQty<=0 或器具模具不顯示。 -->
<!-- 2026-07-27 用量對帳分頁（唯讀診斷，總部/經營者）：新增「🔍 用量對帳」分頁，比對 AGG.avg4（系統近4週均）與 dim_store_par.手動週用量（門市基準），為 BOM 單層展開偏差建立基準線。純前端唯讀：不寫任何 Sheet、不新增網路請求、不改引擎。含四段判讀分類、差異比中位數、0.45–0.55 集中度、廠商中位數表、模式B 貼上 TSV 覆蓋基準、匯出 TSV（含 BOM 頭）。既有函式零改動，僅 TABS_BY_ROLE/tabLabel/render 分派/wire() 末端四處掛載。 -->

<script>
/* 2026-07-30 儀表板權限閘門 v1：密碼由「權限中心」GAS 集中管理（Sheet dim_auth），每頁獨立密碼＋TTL */
(function(){
  var DASH_ID = 'purchase';
  var DASH_NAME = '採購系統';   /* 與 dim_auth 的 name 欄一致 */
  var AUTH_API = 'https://script.google.com/macros/s/AKfycbyQ9LWY74Ix8VBe1gDoMdSF5eH74ratL7_f0EUUHi37IH3bXhkIJMx4WB2I-c-MLsWtLQ/exec';
  var KEY = 'dash_auth_' + DASH_ID;
  try {
    var o = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (o && o.exp && Date.now() < o.exp) return;      /* 效期內 → 放行 */
    localStorage.removeItem(KEY);
  } catch(_){}
  document.documentElement.style.visibility = 'hidden';
  /* 2026-08-05 效能：閘門顯示的同時先 ping 預熱權限中心 GAS，使用者輸完密碼時引擎已暖機，verify 由 3-8 秒降到 <1 秒 */
  (function warmup(){
    var pn = '__agwarm' + Date.now();
    var ps = document.createElement('script');
    window[pn] = function(){ try { delete window[pn]; } catch(_){} if (ps.parentNode) ps.parentNode.removeChild(ps); };
    ps.onerror = window[pn];
    ps.src = AUTH_API + '?action=ping&callback=' + pn;
    document.head.appendChild(ps);
  })();
  function verify(pwd, cb){
    var name = '__agcb' + Date.now();
    var s = document.createElement('script');
    var to = setTimeout(function(){ done({ok:false, error:'連線逾時，請重試（GAS 冷啟動可能較慢）'}); }, 30000);
    function done(d){ clearTimeout(to); delete window[name]; if (s.parentNode) s.parentNode.removeChild(s); cb(d); }
    window[name] = done;
    s.onerror = function(){ done({ok:false, error:'連線失敗，請重試'}); };
    s.src = AUTH_API + '?action=verify&callback=' + name + '&dashboard=' + encodeURIComponent(DASH_ID) + '&pwd=' + encodeURIComponent(pwd);
    document.head.appendChild(s);
  }
  function show(){
    var d = document.createElement('div');
    d.id = 'authGate';
    d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#4A3228;display:flex;align-items:center;justify-content:center;visibility:visible';
    d.innerHTML = '<div style="background:#fff;border-radius:14px;padding:28px 26px;width:min(320px,86vw);text-align:center;font-family:system-ui">'

var VERIFY_DELAYS=[2000,4000,6000];

function verifyParam(store,skuId,label,expected,attempt,cb){
  var d=VERIFY_DELAYS[Math.min(attempt,VERIFY_DELAYS.length-1)];
  setTimeout(function(){
    fetchFresh('dim_store_par').then(function(rows){
      var hit=null;
      rows.forEach(function(r){if(String(r["店號"])===String(store)&&String(r["sku_id"])===String(skuId))hit=r;});
      var ok=false;
      if(hit){var cur=hit[label];
        if(label==="使用中")ok=(toBool(cur)===toBool(expected));
        else if(label==="盤點分區"||label==="店品名"||label==="店廠商")ok=(String(cur==null?"":cur).trim()===String(expected==null?"":expected).trim());
        else ok=(Math.abs(num(cur)-num(expected))<1e-6);}
      if(ok){pruneWarn(store,skuId,label);if(cb)cb(true);render();return;}
      if(attempt<VERIFY_DELAYS.length-1){verifyParam(store,skuId,label,expected,attempt+1,cb);return;}
      pushWarn(store,skuId,label,expected);if(cb)cb(false);render();
    }).catch(function(){
      if(attempt<VERIFY_DELAYS.length-1){verifyParam(store,skuId,label,expected,attempt+1,cb);return;}
      pushWarn(store,skuId,label,expected);if(cb)cb(false);render();});
  },d);}
function warnKey(store,skuId,label){return store+"|"+skuId+"|"+label;}
function pushWarn(store,skuId,label,expected){

  if(ST.writeWarn.some(function(w){return w.k===k;}))return;
  ST.writeWarn.push({k:k,store:store,id:skuId,name:(SKU[skuId]?SKU[skuId].name:skuId),label:label,val:expected});}
function pruneWarn(store,skuId,label){
  if(!ST.writeWarn||!ST.writeWarn.length)return;var k=warnKey(store,skuId,label);
  ST.writeWarn=ST.writeWarn.filter(function(w){return w.k!==k;});}

function postParam(store,skuId,fields,cb){     // 寫參數的唯一入口：送出＋逐欄回讀驗證
  var keys=Object.keys(fields);if(!keys.length)return;

  PSTATE[skuId]={pending:keys.length,fail:0,done:false};
  keys.forEach(function(lb){verifyParam(store,skuId,lb,fields[lb],0,function(ok){
    var st=PSTATE[skuId];if(!st)return;
    st.pending--;if(!ok)st.fail++;

  });});}

function verifySave(store,expect,attempt,btn){

  if(f.key==="par")return {key:"par",label:"標配數量",from:num(pOf(st,s).par),to:x};
  if(f.key==="weight")return {key:"weight",label:"權數",from:(num(pOf(st,s).weight)||1),to:Math.round(x*1000)/1000};
  return {key:"manualWeekly",label:"手動週用量",from:manualOf(st,s),to:Math.round(x*cv*1000)/1000};}

    +'<input class="tx" id="adjNote" type="text" style="width:100%" placeholder="例：常缺料 / 報廢較多 / 有教學用途" value="'+escA(ST.adjNote||"")+'"></div>'

function adjBreak(st,s,fv){ // 訂貨點拆解表；fv 為 null 時用現值
  var f=adjField(st,s),pq=pqOf(st,s),cv=(pqEff(st,s)>0?pq:1),u=(pqEff(st,s)>0?s.buyUnit:s.useUnit);
  var val=(fv===null||fv===""||isNaN(+fv))?f.cur:+fv;
  var iv='<input class="sm" id="adjVal" type="text" inputmode="decimal" style="width:78px" value="'+
         (ST.adjVal===""?dec(f.cur):ST.adjVal)+'">';
  var rows='';
  if(f.key==="par"){
    rows+='<tr><td class="k">標配</td><td class="v">'+iv+' '+s.useUnit+'</td><td class="n">'+f.hint+'</td></tr>';
  }else{
    var sp=pOf(st,s), base=posBase(st,s), da=demandAdj(st,s), sf=num(sp.safety);
    var lead=(sp.leadDays==null?DEFAULT_LEAD:num(sp.leadDays)), ocw=(num(sp.orderCycleWeeks)||1);

      rows+='<tr><td class="k">× 權數</td><td class="v">'+iv+'</td><td class="n">'+f.hint+'</td></tr>';
    }else{
      rows+='<tr><td class="k">週用量</td><td class="v">'+iv+' '+u+'</td><td class="n">'+f.hint+'</td></tr>';
    }

      rows+='<tr><td class="k">× 季節</td><td class="v">'+da.adj.toFixed(2)+'</td><td class="n">'+
            (da.hit&&da.hit.ev&&da.hit.ev.name?('檔期：'+da.hit.ev.name):'系統自動（季節指數）')+'</td></tr>';
    rows+='<tr><td class="k">× 覆蓋</td><td class="v">'+cw.toFixed(2)+' 週</td><td class="n">訂貨週期 '+
          dec(ocw)+' 週 ＋ 交期 '+dec(lead)+' 天</td></tr>';
    if(sf>0)rows+='<tr><td class="k">＋ 安全</td><td class="v">'+dec(sf/cv)+' '+u+'</td><td class="n">額外緩衝</td></tr>';
  }

function adjPrevTxt(store,s,fv){
  var f=adjField(store,s),cv=(pqEff(store,s)>0?pqOf(store,s):1),u=(pqEff(store,s)>0?s.buyUnit:s.useUnit);
  var r0=rowFor(store,s),b0=bundle(store,s),oh=num(b0.onHand)/cv;
  if(fv===""||isNaN(+fv))return '<span class="muted">請輸入數字</span>';

  var t='<table class="abk"><tr class="sum"><td class="k">訂貨點</td><td class="v">'+
        (isDur(s)?dec(pv.suggested+oh)+' '+s.useUnit:dec(pv.rp/cv)+' '+u)+
        '</td><td class="n">− 現有 '+dec(oh)+' '+(isDur(s)?s.useUnit:u)+'</td></tr>'+
        '<tr><td class="k">建議</td><td class="v" style="color:#C0392B;font-size:16px">'+pv.packs+' '+(isDur(s)?s.useUnit:s.buyUnit)+'</td>'+

function adjLink(id){return '<span class="why" data-adj="'+id+'" style="margin-left:6px">⚙ 調整</span>';}
function matchQ(s){var st=ST.storeId;
  if(ST.vq&&String(vendorOf(st,s)||"").trim()!==ST.vq)return false;
  if(!ST.q)return true;var q=ST.q.trim();if(!q)return true;
  return s.name.indexOf(q)>=0||dispName(st,s).indexOf(q)>=0;}
function isManual(st,s){return !isDur(s)&&!periodWeekly(st,s)&&manualOf(st,s)>0;}
function forecastWeekly(st,s){if(statusOf(st,s)==="已停售")return 0;var w=periodWeekly(st,s);if(!w&&!isDur(s)&&manualOf(st,s)>0)w=manualOf(st,s);return w*demandAdj(st,s).adj;}
function bundle(st,s){var sp=pOf(st,s),iv=ivOf(st,s);return {forecastWeekly:forecastWeekly(st,s),manual:isManual(st,s),weight:sp.weight,leadDays:(sp.leadDays==null?DEFAULT_LEAD:sp.leadDays),orderCycleWeeks:sp.orderCycleWeeks,safety:sp.safety,par:sp.par,onHand:num(iv.onHand)*pqOf(st,s),breakage:num(iv.breakage),booking:bookOf(st,s),newitem:newOf(st,s),packQty:pqEff(st,s)};}
function rowFor(st,s){return computeRow(s,bundle(st,s));}
function liveItems(st){return SKUS.filter(function(s){return usedOf(st,s)&&statusOf(st,s)!=="已停售";});}
function exclItems(st){return SKUS.filter(function(s){return usedOf(st,s)&&statusOf(st,s)==="已停售"&&aggOf(st,s).week>0;});}
function upInfo(st,s){var a=aggOf(st,s);if(!a.launch)return null;var d=new Date(String(a.launch).replace(/\//g,"-"));return {days:Math.max(0,Math.ceil((d-TODAY)/864e5))};}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on");},1500);}
function post(payload,silent){ if(!GAS_URL||GAS_URL.indexOf("__")===0){if(!silent)toast("（試用：未接 GAS，僅本機）");return Promise.resolve();}
  payload.token=API_TOKEN;return fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).then(function(){if(!silent)toast("已送出");}).catch(function(){if(!silent)toast("送出失敗");}); }

  html+='</div>';

  return html;}
function suggestRow(s,r){var store=ST.storeId,z=r.packs<=0,dur=isDur(s),iv=ivOf(store,s),up=statusOf(store,s)==="即將上市";

  var upTag=up?(function(){var u=upInfo(store,s);return '<span class="tagnew">🆕 '+(u?u.days+'天後上市':'即將上市')+'</span>';})():'';
  var h='<div class="row"><div class="nm"><span class="badge b-'+s.cat+'">'+s.cat+'</span><b>'+dispName(store,s)+'</b>'+newBadge(store,s)+upTag+'<div class="sub">現有 '+dec(num(iv.onHand))+' '+(dur?s.useUnit:s.buyUnit)+(packSpec(store,s)?'　📦 '+packSpec(store,s):'')+'　·　'+usageTxt+'</div></div>'

  if(ST.exp[s.id])h+=reasonBox(s,r,up);return h;}
function reasonBox(s,r,up){var b=r.basis,pq=pqOf(ST.storeId,s);
  if(b.mode==="par"){var niLine=(num(b.newitem)>num(b.parBase))?('<br>🆕 檔期需求 <b>'+fmt(b.newitem)+'</b> 高於標配 '+fmt(b.parBase)+'，以檔期需求為準（檔期結束自動回歸標配）'):'';
    return '<div class="reason"><b>'+s.name+'</b>（補到標配）<br>標配數量 <b>'+fmt(b.par)+'</b> − 現有 '+fmt(b.onHand)+(b.breakage?' ＋破損 '+fmt(b.breakage):'')+' = 建議補 <b>'+fmt(r.suggested)+' '+s.useUnit+'</b>'+niLine+'</div>';}
  var adj=up?1:demandAdj(ST.storeId,s).adj,raw=adj?(b.forecastWeekly/adj):b.forecastWeekly;
  var bline=(b.booking>0)?('<br>＋ 未來14天預約/包館需求 <b>'+dec(b.booking/pq)+' '+s.buyUnit+'</b>'):'';

function rcVerdict(ratio){
  if(ratio<0.60)return {k:"疑漏算",bg:"#FDECEA",fg:"#C0392B",bd:"#f5b5ae"};
  if(ratio<0.85)return {k:"偏低",bg:"#FFF7E6",fg:"#B45309",bd:"#e8b96a"};
  if(ratio<=1.15)return {k:"相符",bg:"#EAF7EE",fg:"#1B6B3A",bd:"#b6e3c6"};
  return {k:"偏高",bg:"#EEF4FF",fg:"#1E4E8C",bd:"#cfe3ff"};}
function rcMedian(a){
  if(!a||!a.length)return null;
  var b=a.slice().sort(function(x,y){return x-y;}),n=b.length,m=Math.floor(n/2);
  return n%2?b[m]:(b[m-1]+b[m])/2;}
function rcTrim(x){return String(x==null?"":x).replace(/^[\s\u3000]+|[\s\u3000]+$/g,"");}
function rcNum(x){var v=rcTrim(x).replace(/[,\s\u3000]/g,"");return (v===""||isNaN(+v))?NaN:+v;}
/* 模式B 解析：兩欄「品名 TAB 週用量」，UTF-8，表頭自動跳過。
   純函式（skus 可注入，便於獨立測試）；品名比對序：dim_sku 品名 → BOM 別名；對不上者回傳於 unmatched，不靜默丟棄。 */
function parseReconTsv(text,skus){
  var list=skus||SKUS,t=String(text==null?"":text).replace(/^\uFEFF/,""),raw=[],header=false;
  t.split(/\r?\n/).forEach(function(ln){
    if(rcTrim(ln)==="")return;                       // 空行略過
    var c=ln.split(/\t/);
    raw.push({name:rcTrim(c[0]),weekly:rcNum(c[1])});});
  if(raw.length&&isNaN(raw[0].weekly)){raw.shift();header=true;}   // 表頭自動跳過
  var idx={};
  list.forEach(function(s){if(s&&s.name&&idx[s.name]===undefined)idx[s.name]=s;});
  list.forEach(function(s){if(s)(s.aliases||[]).forEach(function(a){if(a&&idx[a]===undefined)idx[a]=s;});});
  var rows=[],unmatched=[],map={};
  raw.forEach(function(r){
    if(!r.name){unmatched.push({name:r.name||"",weekly:r.weekly,why:"無品名"});return;}
    if(isNaN(r.weekly)){unmatched.push({name:r.name,weekly:null,why:"週用量非數字"});return;}
    var s=idx[r.name];
    if(!s){unmatched.push({name:r.name,weekly:r.weekly,why:"對不上主檔品名／BOM別名"});return;}
    rows.push({name:r.name,weekly:r.weekly,id:s.id,sku:s});
    map[s.id]=num(map[s.id])+r.weekly;});
  return {header:header,rows:rows,unmatched:unmatched,map:map,n:raw.length};}
/* 全店合計＝Σ各店系統值 ÷ Σ各店基準值（不得用各店比值取平均）。
   單一門市貢獻僅在該店「系統>0 且 基準>0」時才計入分子分母，避免單邊灌水。 */
function rcRowsAll(){
  rcInit();
  var sts=rcStores(),one=(sts.length===1),rows=[];
  SKUS.forEach(function(s){
    if(RC_CATS.indexOf(s.cat)<0)return;
    var sys=0,base=0,hit=0,ws=[];
    sts.forEach(function(st){
      var sv=rcSysOf(st,s),bv=rcBaseOf(st,s);
      if(!(sv>0)||!(bv>0))return;
      sys+=sv;base+=bv;hit++;
      var w=num(pOf(st,s).weight);ws.push(w||1);});
    if(!hit||!(sys>0)||!(base>0))return;
    var nw=0;ws.forEach(function(w){if(Math.abs(w-1)>1e-9)nw++;});
    rows.push({s:s,id:s.id,cat:s.cat,sys:sys,base:base,ratio:sys/base,stores:hit,
      wOne:(ws.length===1?ws[0]:null),wWarn:nw,
      pq:(one?pqEff(sts[0],s):num(s.packQty)),pqCust:(one?pqCust(sts[0],s):false),
      name:(one?dispName(sts[0],s):s.name),
      vendor:(one?(vendorOf(sts[0],s)||"未指定"):(s.vendor||"未指定"))});});
  rows.sort(function(a,b){return a.ratio-b.ratio||(a.name<b.name?-1:1);});   // 預設差異比升冪
  return rows;}
function rcRows(){
  return rcRowsAll().filter(function(r){
    if(ST.rcCat!=="全部"&&r.cat!==ST.rcCat)return false;
    if(ST.rcV&&r.vendor!==ST.rcV)return false;
    var q=rcTrim(ST.rcQ);if(!q)return true;
    return r.name.indexOf(q)>=0||String(r.s.name||"").indexOf(q)>=0;});}
function rcWeightTxt(r){
  if(r.wOne!=null)return (Math.abs(r.wOne-1)>1e-9?("⚠️ "+dec(r.wOne)):dec(r.wOne));
  return r.wWarn?("⚠️ "+r.wWarn+" 店≠1"):"1";}
function rcConvTxt(r){
  var pq=num(r.pq==null?r.s.packQty:r.pq);   // 單店＝該店生效內容量；全店合計＝總部主檔（各店規格不同無法選一）
  if(!(pq>0))return "—";
  return dec(r.sys/pq)+" / "+dec(r.base/pq)+" "+r.s.buyUnit+(r.pqCust?"（本店）":"");}
function rcVendorMed(rows){
  var g={};rows.forEach(function(r){(g[r.vendor]=g[r.vendor]||[]).push(r.ratio);});
  return Object.keys(g).filter(function(v){return g[v].length>=3;})
    .map(function(v){return {vendor:v,n:g[v].length,med:rcMedian(g[v])};})
    .sort(function(a,b){return a.med-b.med;});}
/* 白話判讀（規則寫死）：
   ① 0.45–0.55 佔比 ≥30% → 偏差集中在 2 倍 → 指向 BOM 單層展開
   ② 否則 紅/橘 散佈於 ≥4 個廠商 且 比值散亂（母體標準差 ≥0.12）→ 指向 BOM 覆蓋或單位換算問題
   ③ 否則 → 無明顯集中模式，需個案追查 */
function rcReadout(rows){
  var n=rows.length;if(!n)return "";
  var band=rows.filter(function(r){return r.ratio>=0.45&&r.ratio<=0.55;}).length;
  if(band/n>=0.30)return "偏差集中在 2 倍 → 指向 BOM 單層展開";
  var ro=rows.filter(function(r){var k=rcVerdict(r.ratio).k;return k==="疑漏算"||k==="偏低";});
  var vs={};ro.forEach(function(r){vs[r.vendor]=1;});
  var sd=0;
  if(ro.length>1){var m=0;ro.forEach(function(r){m+=r.ratio;});m/=ro.length;
    var v2=0;ro.forEach(function(r){v2+=(r.ratio-m)*(r.ratio-m);});sd=Math.sqrt(v2/ro.length);}
  if(Object.keys(vs).length>=4&&sd>=0.12)return "偏差分散 → 指向 BOM 覆蓋或單位換算問題";
  return "無明顯集中模式，需個案追查";}
function rcTsvText(){
  var rows=rcRows(),lines=["品名\t廠商\t品類別\t系統近4週均\t基準週用量\t差異比\t判讀\t權數\t採購單位換算(系統/基準)"];
  rows.forEach(function(r){
    lines.push([r.name,r.vendor,r.cat,Math.round(r.sys*10)/10,Math.round(r.base*10)/10,
      Math.round(r.ratio*1000)/1000,rcVerdict(r.ratio).k,rcWeightTxt(r),rcConvTxt(r)].join("\t"));});
  return "\uFEFF"+lines.join("\r\n");}

  var med=rcMedian(rs),band=rows.filter(function(r){return r.ratio>=0.45&&r.ratio<=0.55;}).length;

  ["疑漏算","偏低","相符","偏高"].forEach(function(k){

    h+='<tr><td><span class="badge" style="background:'+v.fg+'">'+k+'</span></td>'

  h+='</table></div>';

    vm.forEach(function(x){var v=rcVerdict(x.med);
      h+='<tr><td><b>'+x.vendor+'</b></td><td class="right">'+x.n+'</td>'
        +'<td class="right" style="color:'+v.fg+';font-weight:700">'+x.med.toFixed(2)+'</td></tr>';});
