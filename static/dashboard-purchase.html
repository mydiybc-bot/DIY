<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#2E7D32">
<link rel="manifest" href="purchase-manifest.json">
<title>自己做 · 採購系統</title>
<style>
  :root{--blue:#2E7D32;--blue2:#3a8f3f;--bg:#f4f6f9;--card:#fff;--line:#e3e8ef;--ink:#1f2937;--mut:#6b7280;
        --food:#2e7d32;--cons:#b8860b;--tool:#6a1b9a;--mold:#c62828;--new:#0d6e6e;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  .wrap{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:24px}
  header{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;padding:10px 14px}
  .h-top{display:flex;align-items:center;gap:8px}.h-top .logo{font-size:20px}.h-top h1{font-size:16px;margin:0;font-weight:700;flex:1}
  .selrow{display:flex;gap:8px;margin-top:8px}
  select{flex:1;padding:7px 8px;border-radius:8px;border:1px solid #cbd5e1;font-size:14px;background:#fff;color:var(--ink)}
  .tabs{display:flex;gap:4px;overflow-x:auto;background:#1e5a22;padding:6px 8px;position:sticky;top:84px;z-index:19}
  .tab{flex:0 0 auto;padding:7px 11px;border-radius:18px;color:#cfeacd;font-size:13px;white-space:nowrap;cursor:pointer;border:1px solid transparent}
  .tab.on{background:#fff;color:var(--blue);font-weight:700}
  main{padding:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .muted{color:var(--mut);font-size:13px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{padding:5px 11px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer}
  .chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
  .seg div{padding:5px 9px;font-size:12.5px;cursor:pointer;color:var(--blue);white-space:nowrap}.seg div.on{background:var(--blue);color:#fff}
  .vh{display:flex;align-items:center;gap:8px;margin:14px 2px 6px}.vh .vn{font-weight:700;color:var(--blue)}.vh .vl{flex:1;height:1px;background:var(--line)}
  .row{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:none}
  .nm{flex:1;min-width:0}.nm b{font-weight:600}
  .badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;color:#fff;margin-right:5px;vertical-align:1px}
  .b-食材{background:var(--food)} .b-耗材{background:var(--cons)} .b-器具{background:var(--tool)} .b-模具{background:var(--mold)}
  .sub{font-size:12px;color:var(--mut);margin-top:2px}
  .sug{text-align:right;min-width:92px}.sug .big{font-weight:800;font-size:17px}.sug .big.zero{color:var(--mut);font-weight:600}.sug .u{font-size:12px;color:var(--mut)}
  .why{cursor:pointer;color:var(--blue2);font-size:12px;margin-top:2px;user-select:none}
  .reason{background:#f3faf3;border:1px dashed #bfe0bf;border-radius:8px;padding:8px;margin:6px 0 2px;font-size:12.5px;line-height:1.75;color:#2c3b2c}.reason b{color:var(--blue)}
  .banner{background:#eef7ef;border:1px solid #bfe0c0;border-radius:10px;padding:8px 10px;font-size:12.5px;color:#1e4d22;margin-bottom:10px;line-height:1.6}
  input[type=number],input[type=text]{padding:7px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  input[type=number]{width:84px;text-align:right}input.sm{width:62px}input.tx{width:96px;text-align:left}
  .ipt-lbl{font-size:12px;color:var(--mut);margin-right:2px}
  table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{color:var(--mut);font-weight:600;font-size:12px;white-space:nowrap}td input,td select{font-size:13px}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}.btn.sm{padding:5px 10px;font-size:13px}
  .btn.del{background:#fff;color:var(--mold);border:1px solid #f0c2c2;padding:4px 9px;font-size:12px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .summary{display:flex;gap:10px;flex-wrap:wrap}
  .stat{flex:1;min-width:110px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .stat .n{font-size:22px;font-weight:800;color:var(--blue)}.stat .l{font-size:12px;color:var(--mut)}
  .pill{font-size:11px;padding:2px 8px;border-radius:10px;background:#eef6ef;color:var(--blue);border:1px solid #cfe6cf}
  .tagnew{font-size:11px;background:#e3f4f4;color:var(--new);border:1px solid #b9e2e2;border-radius:8px;padding:1px 7px;margin-left:4px}
  .lock{font-size:11px;color:#b26a00;background:#fff7e6;border:1px solid #ffe1a8;border-radius:8px;padding:2px 7px}
  .own{font-size:11px;color:#1b6b3a;background:#eaf7ee;border:1px solid #b6e3c6;border-radius:8px;padding:2px 7px}
  .barbg{background:#eef1f5;border-radius:6px;overflow:hidden;flex:1;height:10px}.bar{height:10px;border-radius:6px;background:var(--blue)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;z-index:50}.toast.on{opacity:.95}
  .note{font-size:12px;color:var(--mut);margin:2px 0 10px;line-height:1.6}.right{text-align:right}.ck{width:18px;height:18px}.excl{opacity:.85}
  .loading{padding:40px;text-align:center;color:var(--mut)}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
  /* ===== 響應式：手機單欄；平板/桌機加寬＋多欄 ===== */
  .groups{}
  @media (min-width:760px){
    .wrap{max-width:1080px;padding-left:6px;padding-right:6px}
    main{padding:14px 10px}
    .group .card{column-count:2;column-gap:16px}
    .group .card .row{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid}
    .tabs{top:90px}
    .reason{font-size:13px}
  }
  @media (min-width:1280px){
    .wrap{max-width:1260px}
    .group .card{column-count:3}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="h-top"><span class="logo">🛒</span><h1>採購系統</h1><span id="upd" class="muted" style="color:#cfeacd;font-size:11px"></span></div>
    <div class="selrow">
      <select id="roleSel"><option value="店長">店長</option><option value="總部">總部</option><option value="經營者">經營者</option></select>
      <select id="storeSel"></select>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"><div class="loading"><div class="spin"></div><div style="margin-top:12px">讀取資料中…</div></div></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== 設定 ===== */
var SHEET_ID='1EyDihj4LPok_dvv3ZkAzDhsHqs7kDi5RTCXPF5Lt1ao';
var GAS_URL='https://script.google.com/macros/s/AKfycbzOzNZ3L9cYrdFyHkopMQ_5HecXKxyo8_fL9prmSjxuOEmXqJT3aMsLHcyA4vjcO-oX/exec';var DEFAULT_LEAD=3, API_TOKEN='dbc-p-Xq7mKe2Ta9Rw';   // 已填入
var FWD_DAYS=14, TODAY=(typeof window!=="undefined"&&window.__TODAY__)?new Date(window.__TODAY__):new Date();

/* ===== 引擎（與試用版同，已驗證） ===== */
function ceilDiv(a,b){return b>0?Math.ceil(a/b-1e-9):0;}
function num(x){return (x===null||x===undefined||x===""||isNaN(+x))?0:+x;}
function reorderPoint(f,w,cyc,lead,safe){return num(f)*(w||1)*((cyc||1)+num(lead)/7)+num(safe);}
function computeRow(sku,p){p=p||{};var onHand=num(p.onHand),dur=sku.cat==="器具"||sku.cat==="模具",suggested,rp=null,basis;
  if(dur){var par=num(p.par),br=num(p.breakage);suggested=Math.max(0,par+br-onHand);basis={mode:"par",par:par,breakage:br,onHand:onHand};}
  else{rp=reorderPoint(p.forecastWeekly,p.weight,p.orderCycleWeeks,p.leadDays,p.safety);suggested=Math.max(0,rp-onHand);
    basis={mode:"forecast",manual:!!p.manual,forecastWeekly:num(p.forecastWeekly),weight:(p.weight||1),coverageWeeks:(p.orderCycleWeeks||1)+num(p.leadDays)/7,safety:num(p.safety),reorderPoint:rp,onHand:onHand};}
  var pq=num(sku.packQty);var packs=pq>0?ceilDiv(suggested,pq):Math.round(suggested);
  return{suggested:Math.round(suggested),reorderPoint:rp==null?null:Math.round(rp),packs:packs,isDurable:dur,basis:basis};}

/* ===== 資料（bootstrap 由 gviz 載入） ===== */
var SKUS=[],STORES=[],AGG={},PARAM={},INV={},SIDX={},UNITCONV=[],CONTAINER={},DIRTY={};
var SKU={}; // sku_id -> sku
var PLABEL={"上週":"上週週平均","近4週":"近4週週平均","近8週":"近8週週平均"};
var ST={role:"店長",storeId:"",tab:"建議",cat:"全部",period:"近4週",season:true,needOnly:true,qmode:"品項用量",qperiod:"近4週",exp:{},showExcl:false,orderEdit:{},orderOff:{}};

function gviz(sheetName){
  var url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json&headers=1&sheet='+encodeURIComponent(sheetName);
  var p=fetch(url).then(function(r){return r.text();}).then(function(t){
    var j=JSON.parse(t.substring(t.indexOf('{'),t.lastIndexOf('}')+1));
    var cols=((j.table&&j.table.cols)||[]).map(function(c){return (c.label||c.id);});
    return ((j.table&&j.table.rows)||[]).map(function(r){var o={};(r.c||[]).forEach(function(c,i){o[cols[i]]=c?c.v:null;});return o;});
  }).catch(function(e){console.warn('gviz '+sheetName+' 失敗',e);return [];});
  return Promise.race([p, new Promise(function(res){setTimeout(function(){res([]);},20000);})]);
}
function toBool(x){return x===true||x==="TRUE"||x==="true"||x===1||x==="1";}

async function bootstrap(){ try {
  var res=await Promise.all([gviz('dim_sku'),gviz('dim_store_par'),gviz('agg_purchase'),gviz('agg_container'),gviz('dim_season'),gviz('dim_unitconv'),gviz('fact_inventory')]);
  var dSku=res[0],dPar=res[1],aP=res[2],aC=res[3],dS=res[4],dU=res[5],fInv=res[6];
  SKUS=dSku.map(function(r){return {id:r["sku_id"],name:r["品名"],cat:r["品類別"]||"食材",vendor:r["廠商"]||"",useUnit:r["使用單位"]||"g",buyUnit:r["採購單位"]||"包",packQty:num(r["每採購單位內容量"])||1,price:num(r["單價"])};}).filter(function(s){return s.id&&s.name;});
  SKU={};SKUS.forEach(function(s){SKU[s.id]=s;});
  AGG={};var storeSet={};
  aP.forEach(function(r){var st=String(r["店號"]);storeSet[st]=1;((AGG[st]=AGG[st]||{})[r["sku_id"]]={week:num(r["上週用量"]),avg4:num(r["近4週均"]),status:r["狀態"]||"販售中",launch:r["上市日"]||""});});
  PARAM={};dPar.forEach(function(r){var st=String(r["店號"]);storeSet[st]=1;((PARAM[st]=PARAM[st]||{})[r["sku_id"]]={par:num(r["標配數量"]),weight:r["權數"]!=null&&r["權數"]!==""?num(r["權數"]):1,orderCycleWeeks:r["訂貨週期天"]?num(r["訂貨週期天"])/7:1,leadDays:(r["交期天"]!=null&&r["交期天"]!==""?num(r["交期天"]):null),manualWeekly:num(r["手動週用量"]),safety:num(r["安全庫存"]),zone:r["盤點分區"]||"未分區",ord:num(r["盤點順序"]),used:r["使用中"]==null?true:toBool(r["使用中"])});});
  CONTAINER={};aC.forEach(function(r){var st=String(r["店號"]);((CONTAINER[st]=CONTAINER[st]||{})[r["容器"]]={week:num(r["上週次數"]),avg4:num(r["近4週均"])});});
  SIDX={};dS.forEach(function(r){SIDX[num(r["月份"])]=num(r["季節指數"])||1;});for(var m=1;m<=12;m++)if(!SIDX[m])SIDX[m]=1;
  UNITCONV=dU.map(function(r){return {item:r["適用品項"],unit:r["單位"],base:r["基準單位"],amt:num(r["換算量"])};});
  // fact_inventory：取每店每料最新一筆
  INV={};var ts={};fInv.forEach(function(r){var st=String(r["店號"]),id=r["sku_id"],t=new Date(r["時間戳"]||r["盤點日"]||0).getTime();var k=st+"|"+id;if(!(k in ts)||t>=ts[k]){ts[k]=t;((INV[st]=INV[st]||{})[id]={onHand:num(r["現有量"]),breakage:num(r["破損量"])});}});
  STORES=Object.keys(storeSet).sort(function(a,b){var na=+a,nb=+b;if(!isNaN(na)&&!isNaN(nb))return na-nb;return String(a).localeCompare(String(b));}).map(function(id){return {id:id,name:id+"號店"};});
  if(!STORES.length)STORES=[{id:"1",name:"1號店"}];
  ST.storeId=STORES[0].id;
  $("#storeSel").innerHTML=STORES.map(function(s){return '<option value="'+s.id+'">'+s.name+'</option>';}).join("");
  $("#upd").textContent="已更新";
  } catch(e){ console.warn("bootstrap 發生問題",e); }
  if(!STORES.length){STORES=[{id:"1",name:"1號店"}];}
  if(!ST.storeId)ST.storeId=STORES[0].id;
  if(!$("#storeSel").options.length)$("#storeSel").innerHTML=STORES.map(function(s){return '<option value="'+s.id+'">'+s.name+'</option>';}).join("");
  try{ render(); }catch(e2){ console.warn(e2); $("#view").innerHTML='<div class="card">載入發生問題，請重新整理頁面；若持續，回報我。</div>'; }
}

/* ===== 工具 ===== */
function $(s){return document.querySelector(s);}
function fmt(n){return (Math.round(n)).toLocaleString("en-US");}
function dec(n){return (Math.round(n*10)/10).toLocaleString("en-US");}
function isDur(s){return s.cat==="器具"||s.cat==="模具";}
function pOf(st,s){return (PARAM[st]||{})[s.id]||{};}
function parOf(st,s){return num(pOf(st,s).par);}
function usedOf(st,s){return pOf(st,s).used!==false;}
function ivOf(st,s){return (INV[st]||{})[s.id]||{};}
function aggOf(st,s){return (AGG[st]||{})[s.id]||{week:0,avg4:0,status:"販售中",launch:""};}
function statusOf(st,s){return aggOf(st,s).status||"販售中";}
function storeName(id){for(var i=0;i<STORES.length;i++)if(STORES[i].id==id)return STORES[i].name;return id;}
function srcMonth(){return TODAY.getMonth()+1;}
function tgtMonth(){return new Date(TODAY.getTime()+10*864e5).getMonth()+1;}
function seasonAdj(){return ST.season?((SIDX[tgtMonth()]||1)/(SIDX[srcMonth()]||1)):1;}
function periodLabel(){return PLABEL[ST.period]||ST.period;}
function periodWeekly(st,s){var a=aggOf(st,s);return ST.period==="上週"?a.week:a.avg4;}
function manualOf(st,s){return num(pOf(st,s).manualWeekly);}
function isManual(st,s){return !isDur(s)&&!periodWeekly(st,s)&&manualOf(st,s)>0;}
function forecastWeekly(st,s){if(statusOf(st,s)==="已停售")return 0;var w=periodWeekly(st,s);if(!w&&!isDur(s)&&manualOf(st,s)>0)w=manualOf(st,s);return w*seasonAdj();}
function bundle(st,s){var sp=pOf(st,s),iv=ivOf(st,s);return {forecastWeekly:forecastWeekly(st,s),manual:isManual(st,s),weight:sp.weight,leadDays:(sp.leadDays==null?DEFAULT_LEAD:sp.leadDays),orderCycleWeeks:sp.orderCycleWeeks,safety:sp.safety,par:sp.par,onHand:num(iv.onHand)*s.packQty,breakage:num(iv.breakage)};}
function rowFor(st,s){return computeRow(s,bundle(st,s));}
function liveItems(st){return SKUS.filter(function(s){return usedOf(st,s)&&statusOf(st,s)!=="已停售";});}
function exclItems(st){return SKUS.filter(function(s){return usedOf(st,s)&&statusOf(st,s)==="已停售"&&aggOf(st,s).week>0;});}
function upInfo(st,s){var a=aggOf(st,s);if(!a.launch)return null;var d=new Date(String(a.launch).replace(/\//g,"-"));return {days:Math.max(0,Math.ceil((d-TODAY)/864e5))};}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on");},1500);}
function post(payload,silent){ if(!GAS_URL||GAS_URL.indexOf("__")===0){if(!silent)toast("（試用：未接 GAS，僅本機）");return Promise.resolve();}
  payload.token=API_TOKEN;return fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).then(function(){if(!silent)toast("已送出");}).catch(function(){if(!silent)toast("送出失敗");}); }

/* ===== 框架 ===== */
var TABS_BY_ROLE={"店長":["建議","盤點","查詢","訂貨單","店別參數"],"總部":["建議","季節","單位對照","主檔","店別參數","總覽"],"經營者":["總覽","查詢","建議"]};
function tabLabel(t){return {"建議":"🛒 建議採購","盤點":"📋 盤點","查詢":"🔎 查詢","訂貨單":"📑 訂貨單","主檔":"🗂 主檔","季節":"📈 季節","單位對照":"📐 單位對照","店別參數":"⚙️ 店別參數","總覽":"📊 總覽"}[t];}
function renderTabs(){var list=TABS_BY_ROLE[ST.role];if(list.indexOf(ST.tab)<0)ST.tab=list[0];
  $("#tabs").innerHTML=list.map(function(t){return '<div class="tab '+(t==ST.tab?"on":"")+'" data-tab="'+t+'">'+tabLabel(t)+'</div>';}).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(el){el.onclick=function(){ST.tab=el.dataset.tab;render();};});}
function render(){renderTabs();
  $("#storeSel").style.display=(ST.tab==="總覽"||ST.tab==="主檔"||ST.tab==="單位對照"||ST.tab==="季節")?"none":"block";
  $("#view").innerHTML=({"建議":viewSuggest,"盤點":viewCount,"查詢":viewQuery,"訂貨單":viewOrder,"主檔":viewMaster,"季節":viewSeason,"單位對照":viewUnitConv,"店別參數":viewParams,"總覽":viewOverview}[ST.tab])();wire();}
function catChips(){return '<div class="chips">'+["全部","食材","耗材","器具","模具"].map(function(c){return '<div class="chip '+(c==ST.cat?"on":"")+'" data-cat="'+c+'">'+c+'</div>';}).join("")+'</div>';}
function periodSeg(){return '<div style="margin-bottom:8px"><span class="ipt-lbl">用量基準：</span><span class="seg">'+["上週","近4週"].map(function(p){return '<div class="'+(p==ST.period?"on":"")+'" data-period="'+p+'">'+PLABEL[p]+'</div>';}).join("")+'</span></div>';}
function needSeg(){return '<span class="seg">'+[["1","只看需採購"],["0","全部"]].map(function(p){return '<div class="'+((ST.needOnly?"1":"0")===p[0]?"on":"")+'" data-need="'+p[0]+'">'+p[1]+'</div>';}).join("")+'</span>';}
function seasonBar(){var adj=seasonAdj(),pct=Math.round((adj-1)*100);
  var msg=!ST.season?'📈 季節調整：已關閉。':(Math.abs(pct)>=5?('📈 季節調整：本月 '+srcMonth()+' 月（'+(SIDX[srcMonth()]||1)+'）→ 備貨期 '+tgtMonth()+' 月（'+(SIDX[tgtMonth()]||1)+'），建議量自動'+(pct>0?'上調 +'+pct+'%（旺季將至）':(pct+'%（淡季將至）'))):'📈 季節調整：本月與備貨期相近，未調整。');
  return '<div class="banner" style="background:#fff7e6;border-color:#ffe1a8;color:#7a5b00">'+msg+'　<span class="why" data-season="1" style="color:#7a5b00;font-weight:600">'+(ST.season?'關閉':'開啟')+'</span></div>';}

/* ===== 建議採購 ===== */

  html+='<div class="banner">📅 已依甜點販售期間自動調整：'+(exN?'移除停售 <b>'+exN+'</b> 項；':'')+(upN?'納入新品備料 <b>'+upN+'</b> 項；':'')+'其餘照常。</div>';
  html+=seasonBar()+periodSeg()+'<div style="margin:-2px 0 8px"><span class="ipt-lbl">顯示：</span>'+needSeg()+'</div>'+catChips();
  html+='<div class="groups">';
  Object.keys(byV).sort().forEach(function(vd){html+='<div class="group"><div class="vh"><span class="vn">'+(vd||"未指定廠商")+'</span><span class="vl"></span><span class="muted">'+byV[vd].length+' 項</span></div><div class="card" style="padding:4px 12px">';byV[vd].forEach(function(x){html+=suggestRow(x.s,x.r);});html+='</div></div>';});
  html+='</div>';
  if(!rows.length)html+='<div class="card muted">本店尚無品項資料（請確認 dim_sku／dim_store_par 已建立）。</div>';
  else if(!disp.length)html+='<div class="card muted">本週都不需採購 🎉　可切換「全部」查看所有品項。</div>';
  if(exN){html+='<div class="vh"><span class="vn" style="color:var(--mut)">🗑 已停售・不需採購（'+exN+'）</span><span class="vl"></span><span class="why" data-toggleexcl="1">'+(ST.showExcl?"收合 ▲":"展開 ▾")+'</span></div>';
    if(ST.showExcl){html+='<div class="card excl" style="padding:4px 12px">';exclItems(store).forEach(function(s){html+='<div class="row"><div class="nm"><span class="badge b-'+s.cat+'">'+s.cat+'</span><b>'+s.name+'</b><div class="sub">'+periodLabel()+' '+dec(periodWeekly(store,s)/s.packQty)+' '+s.buyUnit+' → 已停售</div></div><div class="sug"><div class="big zero">—</div></div></div>';});html+='</div>';}}
  return html;}
function suggestRow(s,r){var store=ST.storeId,z=r.packs<=0,dur=isDur(s),iv=ivOf(store,s),up=statusOf(store,s)==="即將上市";
  var big=dur?r.suggested:r.packs,unit=dur?s.useUnit:s.buyUnit;
  var usageTxt=dur?('標配 '+fmt(parOf(store,s))):(up?'新品（無歷史）':(isManual(store,s)?('手動週用量 '+dec(manualOf(store,s))+' '+s.useUnit):(periodLabel()+' '+dec(periodWeekly(store,s)/s.packQty)+' '+s.buyUnit)));
  var upTag=up?(function(){var u=upInfo(store,s);return '<span class="tagnew">🆕 '+(u?u.days+'天後上市':'即將上市')+'</span>';})():'';
  var h='<div class="row"><div class="nm"><span class="badge b-'+s.cat+'">'+s.cat+'</span><b>'+s.name+'</b>'+upTag+'<div class="sub">現有 '+dec(num(iv.onHand))+' '+(dur?s.useUnit:s.buyUnit)+'　·　'+usageTxt+'</div></div>'
    +'<div class="sug"><div class="big'+(z?' zero':'')+'">'+(z?'—':big)+'</div><div class="u">'+(z?'庫存足':('建議 '+unit))+'</div><div class="why" data-why="'+s.id+'">'+(ST.exp[s.id]?'收合 ▲':'為什麼 ▾')+'</div></div></div>';
  if(ST.exp[s.id])h+=reasonBox(s,r,up);return h;}
function reasonBox(s,r,up){var b=r.basis,pq=s.packQty;
  if(b.mode==="par")return '<div class="reason"><b>'+s.name+'</b>（補到標配）<br>標配數量 <b>'+fmt(b.par)+'</b> − 現有 '+fmt(b.onHand)+(b.breakage?' ＋破損 '+fmt(b.breakage):'')+' = 建議補 <b>'+fmt(r.suggested)+' '+s.useUnit+'</b></div>';
  var adj=up?1:seasonAdj(),raw=adj?(b.forecastWeekly/adj):b.forecastWeekly;
  var fline=up?('預測週用量 <b>'+dec(b.forecastWeekly/pq)+' '+s.buyUnit+'</b>（依新品預估）'):(b.manual?('手動週用量 <b>'+dec(raw)+' '+s.useUnit+'</b>'+(adj!=1?' × 季節 '+adj.toFixed(2)+'（'+srcMonth()+'月→'+tgtMonth()+'月）':'')+' = 預測 <b>'+dec(b.forecastWeekly/pq)+' '+s.buyUnit+'</b>'):(periodLabel()+' <b>'+dec(raw/pq)+' '+s.buyUnit+'</b>'+(adj!=1?' × 季節 '+adj.toFixed(2)+'（'+srcMonth()+'月→'+tgtMonth()+'月）':'')+' = 預測 <b>'+dec(b.forecastWeekly/pq)+' '+s.buyUnit+'</b>'));
  return '<div class="reason"><b>'+s.name+'</b><br>'+fline+(b.weight!=1?' × 權數 '+b.weight:'')+' × 涵蓋 '+(Math.round(b.coverageWeeks*100)/100)+' 週 = 訂貨點 <b>'+dec(r.reorderPoint/pq)+' '+s.buyUnit+'</b><br>訂貨點 − 現有 '+dec(b.onHand/pq)+' = 進位 <b>'+r.packs+' '+s.buyUnit+'</b>（每'+s.buyUnit+' '+fmt(pq)+' '+s.useUnit+'）</div>';}

  var tg=$('[data-toggleexcl]');if(tg)tg.onclick=function(){ST.showExcl=!ST.showExcl;render();};
  var sb=$('[data-season]');if(sb)sb.onclick=function(){ST.season=!ST.season;render();};
  Array.prototype.forEach.call(document.querySelectorAll("[data-inv]"),function(el){el.onchange=function(){var id=el.dataset.inv,f=el.dataset.f;INV[ST.storeId]=INV[ST.storeId]||{};INV[ST.storeId][id]=INV[ST.storeId][id]||{};INV[ST.storeId][id][f]=el.value===""?null:+el.value;DIRTY[ST.storeId]=DIRTY[ST.storeId]||{};DIRTY[ST.storeId][id]=true;};});
  var sc=$("#saveCount");if(sc)sc.onclick=function(){var store=ST.storeId,iv=INV[store]||{},dirty=DIRTY[store]||{},ids=Object.keys(dirty);
    if(!ids.length){toast("沒有變更的盤點");return;}
    sc.disabled=true;var done=0;toast("送出中… 0/"+ids.length);
    (function chunk(i){ if(i>=ids.length){DIRTY[store]={};sc.disabled=false;toast("已送出 "+ids.length+" 筆盤點");ST.tab="建議";render();return;}
      var batch=ids.slice(i,i+5);
      Promise.all(batch.map(function(id){return post({type:"inv",store:store,sku_id:id,onHand:iv[id]?iv[id].onHand:null,breakage:iv[id]?iv[id].breakage:null,user:ST.role},true);})).then(function(){done+=batch.length;toast("送出中… "+done+"/"+ids.length);chunk(i+5);});
    })(0);};
  // 店別參數
  Array.prototype.forEach.call(document.querySelectorAll("[data-p]"),function(el){el.onchange=function(){var id=el.dataset.p,f=el.dataset.f;EDIT[id]=EDIT[id]||{};EDIT[id][f]=(f==="zone")?el.value:+el.value;PARAM[ST.storeId]=PARAM[ST.storeId]||{};PARAM[ST.storeId][id]=PARAM[ST.storeId][id]||{};PARAM[ST.storeId][id][f]=EDIT[id][f];};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-puse]"),function(el){el.onchange=function(){var id=el.dataset.puse;EDIT[id]=EDIT[id]||{};EDIT[id]["使用中"]=el.checked?"TRUE":"FALSE";PARAM[ST.storeId]=PARAM[ST.storeId]||{};PARAM[ST.storeId][id]=PARAM[ST.storeId][id]||{};PARAM[ST.storeId][id].used=el.checked;};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-psave]"),function(el){el.onclick=function(){var id=el.dataset.psave,e=EDIT[id]||{};var fields={};if("zone"in e)fields["盤點分區"]=e.zone;if("ord"in e)fields["盤點順序"]=e.ord;if("par"in e)fields["標配數量"]=e.par;if("weight"in e)fields["權數"]=e.weight;if("leadDays"in e)fields["交期天"]=e.leadDays;if("manualWeekly"in e)fields["手動週用量"]=e.manualWeekly;if("safety"in e)fields["安全庫存"]=e.safety;if("使用中"in e)fields["使用中"]=e["使用中"];post({type:"param",store:ST.storeId,sku_id:id,fields:fields});};});
  // 季節
  Array.prototype.forEach.call(document.querySelectorAll("[data-si]"),function(el){el.onchange=function(){SIDX[+el.dataset.si]=+el.value;};});
  var ss=$("#saveSeason");if(ss)ss.onclick=function(){for(var m=1;m<=12;m++)post({type:"season",month:m,idx:SIDX[m]});toast("已送出季節指數");};
  // 訂貨單
  Array.prototype.forEach.call(document.querySelectorAll("[data-off]"),function(el){el.onchange=function(){ST.orderOff[el.dataset.off]=!el.checked;render();};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-oq]"),function(el){el.onchange=function(){ST.orderEdit[el.dataset.oq]=+el.value;render();};});
  var cp=$("#copyOrder");if(cp)cp.onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(orderText(ST.storeId));toast("已複製");};
}

/* ===== 啟動 ===== */
$("#roleSel").onchange=function(){ST.role=this.value;ST.exp={};render();};
$("#storeSel").onchange=function(){ST.storeId=this.value;ST.exp={};ST.orderEdit={};ST.orderOff={};render();};
if(typeof window!=="undefined"&&!window.__TEST__) bootstrap();
</script>
</body>
</html>
