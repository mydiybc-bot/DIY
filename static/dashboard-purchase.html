  .barbg{background:#eef1f5;border-radius:6px;overflow:hidden;flex:1;height:10px}.bar{height:10px;border-radius:6px;background:var(--blue)}

  }

    .wrap{max-width:1260px}
    .group .card{column-count:3}
  }
</style>

/* ===== 引擎（與試用版同，已驗證） ===== */
function ceilDiv(a,b){return b>0?Math.ceil(a/b-1e-9):0;}
function num(x){return (x===null||x===undefined||x===""||isNaN(+x))?0:+x;}
function reorderPoint(f,w,cyc,lead,safe){return num(f)*(w||1)*((cyc||1)+num(lead)/7)+num(safe);}
function computeRow(sku,p){p=p||{};var onHand=num(p.onHand),dur=sku.cat==="器具"||sku.cat==="模具",suggested,rp=null,basis;

var SKUS=[],STORES=[],AGG={},PARAM={},INV={},SIDX={},SFACT={low:0.8,high:1.2},UNITCONV=[],CONTAINER={},DIRTY={},BOOKAGG={},DESSERTS=[],BOOKINGS=[],USAGED={},ORDERS=[],FLOWST="",EVENTS=[],NEWAGG={};

function gviz(sheetName){
  var url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json&headers=1&sheet='+encodeURIComponent(sheetName);
  var p=fetch(url).then(function(r){return r.text();}).then(function(t){

function isoWeekOf(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);var ys=new Date(Date.UTC(t.getUTCFullYear(),0,1));var wk=Math.ceil((((t-ys)/86400000)+1)/7);return t.getUTCFullYear()+'-W'+(wk<10?'0':'')+wk;}

  if(typeof v==="number"){var d2=new Date(v);return isNaN(d2)?null:d2;}return null;}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

async function bootstrap(){ try {
  var res=await Promise.all([gviz('dim_sku'),gviz('dim_store_par'),gviz('agg_purchase'),gviz('agg_container'),gviz('dim_season'),gviz('dim_unitconv'),gviz('fact_inventory'),gviz('agg_booking'),gviz('dim_dessert'),gviz('fact_booking'),gviz('dim_event'),gviz('agg_newitem')]);
  var dSku=res[0],dPar=res[1],aP=res[2],aC=res[3],dS=res[4],dU=res[5],fInv=res[6],aB=res[7],dD=res[8],fB=res[9],dEv=res[10]||[],dNi=res[11]||[];

  SIDX={};SFACT={low:0.8,high:1.2};dS.forEach(function(r){var mk=r["月份"],v=num(r["季節指數"]);if(String(mk)==="淡季係數"){if(v)SFACT.low=v;return;}if(String(mk)==="旺季係數"){if(v)SFACT.high=v;return;}var mm=num(mk);if(mm>=1&&mm<=12)SIDX[mm]=v||1;});for(var m=1;m<=12;m++)if(!SIDX[m])SIDX[m]=1;

}

function $(s){return document.querySelector(s);}

function srcMonth(){return TODAY.getMonth()+1;}
function tgtMonth(){return new Date(TODAY.getTime()+10*864e5).getMonth()+1;}
function seasonAdj(){var m=ST.seasonMode;if(m==="關")return 1;if(m==="淡季")return SFACT.low;if(m==="旺季")return SFACT.high;return (SIDX[tgtMonth()]||1)/(SIDX[srcMonth()]||1);}
function seasonLabel(){var m=ST.seasonMode;if(m==="淡季")return "淡季手動 ×"+SFACT.low;if(m==="旺季")return "旺季手動 ×"+SFACT.high;return "季節 "+seasonAdj().toFixed(2)+"（"+srcMonth()+"月→"+tgtMonth()+"月）";}
/* ===== 節慶事件層（dim_event）：以備貨覆蓋窗重疊比例攤入，逾期自動失效 ===== */
function ymdShort(d){return (d.getMonth()+1)+"/"+d.getDate();}
function coverWin(st,s){var sp=pOf(st,s),lead=(sp.leadDays==null?DEFAULT_LEAD:sp.leadDays),days=Math.max(1,Math.round((sp.orderCycleWeeks||1)*7));
  var t0=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()+Math.round(num(lead)));
  var t1=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()+days-1);return {t0:t0,t1:t1,days:days};}
function eventHit(st,s){if(!EVENTS.length)return null;var w=coverWin(st,s),best=null,bestEff=0;
  EVENTS.forEach(function(ev){if(!ev.on)return;if(ev.scope&&ev.scope!=="全部"&&ev.scope!==s.cat)return;
    var a=Math.max(w.t0.getTime(),ev.from.getTime()),b=Math.min(w.t1.getTime(),ev.to.getTime());if(b<a)return;
    var ovd=Math.floor((b-a)/864e5)+1,ov=Math.min(1,ovd/w.days),eff=Math.abs((ev.coef-1)*ov);
    if(!best||eff>bestEff){bestEff=eff;best={ev:ev,ovDays:ovd,days:w.days,ov:ov};}});
  return best;}
function demandAdj(st,s){var sea=seasonAdj(),hit=eventHit(st,s);if(!hit)return {adj:sea,sea:sea,hit:null};
  return {adj:sea*(1-hit.ov)+hit.ev.coef*hit.ov,sea:sea,hit:hit};}
function demandLabel(st,s){var da=demandAdj(st,s);if(!da.hit)return seasonLabel();
  return seasonLabel()+"，🎉"+da.hit.ev.name+" ×"+da.hit.ev.coef+"（重疊 "+da.hit.ovDays+"/"+da.hit.days+" 天）→ 綜合 ×"+da.adj.toFixed(2);}
function activeEvents(){var lim=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()+30);
  return EVENTS.filter(function(ev){return ev.on&&ev.to>=TODAY&&ev.from<=lim;});}
function seasonStrip(){var m=ST.seasonMode,txt;
  if(m==="淡季")txt="🍃 手動淡季 ×"+SFACT.low;else if(m==="旺季")txt="🔥 手動旺季 ×"+SFACT.high;else if(m==="關")txt="季節調整已關閉";
  else txt="季節（自動）×"+seasonAdj().toFixed(2)+"（"+srcMonth()+"月→"+tgtMonth()+"月）";
  var evs=activeEvents().map(function(ev){return "🎉 "+ev.name+" "+ymdShort(ev.from)+"–"+ymdShort(ev.to)+" ×"+ev.coef+(ev.scope&&ev.scope!=="全部"?"（"+ev.scope+"）":"");});
  var ni=newActive(ST.storeId);var niTxt=ni?'　｜　🆕 檔期新品備料生效中（'+ni+'）':'';
  return '<div class="banner" style="background:#f0f7ff;border-color:#cfe3ff;color:#1e4e8c">📈 需求調整：'+txt+(evs.length?'　｜　'+evs.join('　'):'')+niTxt+'</div>';}
function newOf(st,s){var m=(NEWAGG[st]||{})[s.id];return m?m.qty:0;}
function markOf(st,s){return (NEWAGG[st]||{})[s.id]||null;}
function newBadge(st,s){var m=markOf(st,s);if(!m)return '';
  return m.excl?'<span style="display:inline-block;margin-left:4px;padding:1px 7px;border-radius:10px;background:#fdecea;color:#c62828;border:1px solid #c62828;font-size:11px;font-weight:700" title="'+(m.who||'')+'">🎉'+(m.ev||'檔期')+'·專屬</span>':'<span style="display:inline-block;margin-left:4px;padding:1px 7px;border-radius:10px;background:#fff7e6;color:#b45309;border:1px solid #e8b96a;font-size:11px;font-weight:700" title="'+(m.who||'')+'">🎉'+(m.ev||'檔期')+'</span>';}
function newActive(st){var g=NEWAGG[st]||{};for(var k in g){if(g[k].qty>0)return g[k].ev||'檔期';}return null;}
function periodLabel(){return PLABEL[ST.period]||ST.period;}
function periodWeekly(st,s){var a=aggOf(st,s);return ST.period==="上週"?a.week:a.avg4;}
function manualOf(st,s){return num(pOf(st,s).manualWeekly);}
var ZONE_ORDER=["冰箱區","洞洞牆區","烘烤區","包材耗材區","器具區","模具區","員工區","凍庫區","其他"];
function autoZone(s){var n=s.name;
  if(s.cat==="模具")return"模具區";
  if(s.cat==="器具")return"器具區";
  if(s.cat==="耗材")return"包材耗材區";
  if(s.vendor==="半成品"||/牛奶|鮮奶油|奶油|乳酪|起司|優格|蛋白液|蛋黃液|布丁|奶凍|果泥|新鮮|草莓|藍莓|檸檬|芒果|荔枝|葡萄|水蜜桃|奇異果|凍$|餡|麻糬|可爾必思|培根|地瓜|蛋$/.test(n))return"冰箱區";
  return"洞洞牆區";}
function zoneOf(st,s){var z=pOf(st,s).zone;if(z&&z!=="未分區")return z;if(s.defZone)return s.defZone;return autoZone(s);}
function bookOf(st,s){return num((BOOKAGG[st]||{})[s.id]);}
function estOnHand(st,s){var iv=ivOf(st,s);if(iv.t==null||iv.onHand==null)return null;
  var units=num(iv.onHand)*s.packQty, t0=iv.t, days=(TODAY.getTime()-t0)/864e5;
  var used=0, ud=USAGED[s.id]||{}, hasD=false;
  Object.keys(ud).forEach(function(d){hasD=true;if(new Date(d).getTime()>t0)used+=ud[d];});
  if(!hasD&&manualOf(st,s)>0)used=manualOf(st,s)*days/7;
  var arr=0;ORDERS.forEach(function(o){if(o.sku_id!==s.id)return;
    var ld=(pOf(st,s).leadDays==null?DEFAULT_LEAD:num(pOf(st,s).leadDays)),ldMs=ld*864e5;
    if(o.t+ldMs<=t0)return;                      // 盤點前已到貨→已含在盤點值
    if(TODAY.getTime()-o.t<ldMs)return;          // 尚未到貨
    arr+=o.qty*s.packQty;});
  return Math.max(0,units+arr-used);}
function invLight(st,s){var r=rowFor(st,s),rp=r.reorderPoint||0;
  if(isDur(s)){var oh=num(ivOf(st,s).onHand);return oh<parOf(st,s)?"r":"w";}
  var est=estOnHand(st,s);
  if(est==null)return ((r.basis&&r.basis.forecastWeekly>0)||manualOf(st,s)>0||(r.basis&&r.basis.newitem>0))?"r":"w";
  if(est<rp)return"r";if(est<rp*1.3)return"y";return"w";}
function invAge(st,s){var t=ivOf(st,s).t;if(!t)return null;return Math.max(0,Math.floor((TODAY.getTime()-t)/864e5));}
function invTag(st,s){var a=invAge(st,s);if(a==null)return '<span style="color:#C0392B">（未盤點估算）</span>';if(a>7)return '<span style="color:#B45309">（盤點 '+a+' 天前）</span>';return "";}
function upcomingBk(st){var t=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()),e=new Date(t.getTime()+14*864e5);return BOOKINGS.filter(function(b){if(b.status==="取消"||b.store!==String(st))return false;var d=new Date(b.date);return d>=t&&d<=e;});}
function dispName(st,s){var n=pOf(st,s).custName;return n||s.name;}
function vendorOf(st,s){var v=pOf(st,s).custVendor;return v||s.vendor;}
function origSub(st,s){return pOf(st,s).custName?('　<span style="color:#94a3b8">原名:'+s.name+'</span>'):'';}
function matchQ(s){if(!ST.q)return true;var q=ST.q.trim();if(!q)return true;
  return s.name.indexOf(q)>=0||String(s.vendor||"").indexOf(q)>=0||dispName(ST.storeId,s).indexOf(q)>=0||String(vendorOf(ST.storeId,s)||"").indexOf(q)>=0;}
function isManual(st,s){return !isDur(s)&&!periodWeekly(st,s)&&manualOf(st,s)>0;}
function forecastWeekly(st,s){if(statusOf(st,s)==="已停售")return 0;var w=periodWeekly(st,s);if(!w&&!isDur(s)&&manualOf(st,s)>0)w=manualOf(st,s);return w*demandAdj(st,s).adj;}
function bundle(st,s){var sp=pOf(st,s),iv=ivOf(st,s);return {forecastWeekly:forecastWeekly(st,s),manual:isManual(st,s),weight:sp.weight,leadDays:(sp.leadDays==null?DEFAULT_LEAD:sp.leadDays),orderCycleWeeks:sp.orderCycleWeeks,safety:sp.safety,par:sp.par,onHand:num(iv.onHand)*s.packQty,breakage:num(iv.breakage),booking:bookOf(st,s),newitem:newOf(st,s)};}
function rowFor(st,s){return computeRow(s,bundle(st,s));}
function liveItems(st){return SKUS.filter(function(s){return usedOf(st,s)&&statusOf(st,s)!=="已停售";});}
function exclItems(st){return SKUS.filter(function(s){return usedOf(st,s)&&statusOf(st,s)==="已停售"&&aggOf(st,s).week>0;});}
function upInfo(st,s){var a=aggOf(st,s);if(!a.launch)return null;var d=new Date(String(a.launch).replace(/\//g,"-"));return {days:Math.max(0,Math.ceil((d-TODAY)/864e5))};}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on");},1500);}
function post(payload,silent){ if(!GAS_URL||GAS_URL.indexOf("__")===0){if(!silent)toast("（試用：未接 GAS，僅本機）");return Promise.resolve();}
  payload.token=API_TOKEN;return fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload)}).then(function(){if(!silent)toast("已送出");}).catch(function(){if(!silent)toast("送出失敗");}); }

/* ===== 框架 ===== */
var TABS_BY_ROLE={"店長":["盤點","訂貨單","查詢","預約","店別參數"],"總部":["建議","季節","單位對照","主檔","店別參數","預約","總覽"],"經營者":["總覽","查詢","建議"]};
function tabLabel(t){return {"建議":"🛒 建議採購","盤點":"📋 盤點","查詢":"🔎 查詢","訂貨單":"📑 訂貨單","主檔":"🗂 主檔","季節":"📈 季節","單位對照":"📐 單位對照","店別參數":"⚙️ 店別參數","預約":"🎉 預約包館","總覽":"📊 總覽"}[t];}
function renderTabs(){var list=TABS_BY_ROLE[ST.role];if(list.indexOf(ST.tab)<0)ST.tab=list[0];
  $("#tabs").innerHTML=list.map(function(t){return '<div class="tab '+(t==ST.tab?"on":"")+'" data-tab="'+t+'">'+tabLabel(t)+'</div>';}).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(el){el.onclick=function(){ST.tab=el.dataset.tab;render();};});}
function render(){renderTabs();
  $("#storeSel").style.display=(ST.tab==="總覽"||ST.tab==="主檔"||ST.tab==="單位對照"||ST.tab==="季節")?"none":"block";
  $("#view").innerHTML=({"建議":viewSuggest,"盤點":viewCount,"查詢":viewQuery,"訂貨單":viewOrder,"主檔":viewMaster,"季節":viewSeason,"單位對照":viewUnitConv,"店別參數":viewParams,"預約":viewBooking,"總覽":viewOverview}[ST.tab])();wire();}
function catChips(){return '<div class="chips">'+["全部","食材","耗材","器具","模具"].map(function(c){return '<div class="chip '+(c==ST.cat?"on":"")+'" data-cat="'+c+'">'+c+'</div>';}).join("")+'</div>';}
function periodSeg(){return '<div style="margin-bottom:8px"><span class="ipt-lbl">用量基準：</span><span class="seg">'+["上週","近4週"].map(function(p){return '<div class="'+(p==ST.period?"on":"")+'" data-period="'+p+'">'+PLABEL[p]+'</div>';}).join("")+'</span></div>';}
function needSeg(){return '<span class="seg">'+[["1","只看需採購"],["0","全部"]].map(function(p){return '<div class="'+((ST.needOnly?"1":"0")===p[0]?"on":"")+'" data-need="'+p[0]+'">'+p[1]+'</div>';}).join("")+'</span>';}
function seasonBar(){var adj=seasonAdj(),pct=Math.round((adj-1)*100);
  var m=ST.seasonMode,msg;
  if(m==="關")msg='📈 季節調整：已關閉（不建議長期關閉）。';
  else if(m==="淡季")msg='🍃 手動淡季檔：建議量一律 ×'+SFACT.low+'（覆蓋月指數）。';
  else if(m==="旺季")msg='🔥 手動旺季檔：建議量一律 ×'+SFACT.high+'（覆蓋月指數）。';
  else msg=(Math.abs(pct)>=5?('📈 季節（自動）：本月 '+srcMonth()+' 月（'+(SIDX[srcMonth()]||1)+'）→ 備貨期 '+tgtMonth()+' 月（'+(SIDX[tgtMonth()]||1)+'），建議量'+(pct>0?'上調 +'+pct+'%（旺季將至）':(pct+'%（淡季將至）'))):'📈 季節（自動）：本月與備貨期相近，未調整。');
  var evs=activeEvents();if(evs.length)msg+='<br>🎉 節慶檔期：'+evs.map(function(ev){return ev.name+' '+ymdShort(ev.from)+'–'+ymdShort(ev.to)+' ×'+ev.coef+(ev.scope&&ev.scope!=="全部"?'（'+ev.scope+'）':'');}).join('、')+'（依重疊天數自動攤入，逾期自動失效）';
  var pal={"自動":["#e8f5e9","#2E7D32"],"淡季":["#e3f2fd","#1565c0"],"旺季":["#fdecea","#c62828"],"關":["#f1f1f1","#555"]};
  var seg=["自動","淡季","旺季","關"].map(function(x){var on=ST.seasonMode===x,c=pal[x];return '<span class="why" data-smode="'+x+'" style="display:inline-block;padding:2px 10px;border-radius:12px;margin:2px 4px 2px 0;background:'+(on?c[0]:'#fff')+';color:'+(on?c[1]:'#7a5b00')+';border:1px solid '+(on?c[1]:'#e8ddb8')+';font-weight:'+(on?'800':'400')+'">'+(x==="淡季"?"🌱 ":(x==="旺季"?"🔥 ":""))+x+'</span>';}).join('');
  return '<div class="banner" style="background:#fff7e6;border-color:#ffe1a8;color:#7a5b00">'+msg+'<div style="margin-top:4px">'+seg+'</div></div>';}

/* ===== 建議採購 ===== */
function viewSuggest(){var store=ST.storeId,items=liveItems(store).filter(function(s){return (ST.cat==="全部"||s.cat===ST.cat)&&matchQ(s);});
  var rows=items.map(function(s){return {s:s,r:rowFor(store,s)};});var need=rows.filter(function(x){return x.r.packs>0;});
  var value=need.reduce(function(a,x){return a+x.r.packs*x.s.price;},0);
  var upN=items.filter(function(s){return statusOf(store,s)==="即將上市";}).length,exN=exclItems(store).length;
  var disp=ST.needOnly?rows.filter(function(x){return x.r.packs>0||statusOf(store,x.s)==="即將上市";}):rows;
  var byV={};disp.forEach(function(x){var vd=vendorOf(store,x.s);(byV[vd]=byV[vd]||[]).push(x);});
  var html='<div class="summary"><div class="stat"><div class="n">'+need.length+'</div><div class="l">需採購品項</div></div><div class="stat"><div class="n">$'+fmt(value)+'</div><div class="l">預估採購金額</div></div></div>';
  var bk=upcomingBk(store);if(bk.length){var bq=0;bk.forEach(function(b){bq+=b.qty;});html+='<div class="banner">🎉 未來14天有 <b>'+bk.length+'</b> 筆預約/包館（共 '+fmt(bq)+' 個甜點），需求已加入建議量。</div>';}
  html+='<div style="margin-bottom:8px"><input class="sm" id="qbox" style="width:100%;max-width:340px" placeholder="🔍 搜尋品項或廠商…" value="'+(ST.q||'').replace(/"/g,'&quot;')+'"></div>';
  html+='<div class="banner">📅 已依甜點販售期間自動調整：'+(exN?'移除停售 <b>'+exN+'</b> 項；':'')+(upN?'納入新品備料 <b>'+upN+'</b> 項；':'')+'其餘照常。</div>';
  html+=seasonBar()+periodSeg()+'<div style="margin:-2px 0 8px"><span class="ipt-lbl">顯示：</span>'+needSeg()+'</div>'+catChips();
  html+='<div class="groups">';
  Object.keys(byV).sort().forEach(function(vd){html+='<div class="group"><div class="vh"><span class="vn">'+(vd||"未指定廠商")+'</span><span class="vl"></span><span class="muted">'+byV[vd].length+' 項</span></div><div class="card" style="padding:4px 12px">';byV[vd].forEach(function(x){html+=suggestRow(x.s,x.r);});html+='</div></div>';});
  html+='</div>';
  if(!rows.length)html+='<div class="card muted">本店尚無品項資料（請確認 dim_sku／dim_store_par 已建立）。</div>';
  else if(!disp.length)html+='<div class="card muted">本週都不需採購 🎉　可切換「全部」查看所有品項。</div>';
  if(exN){html+='<div class="vh"><span class="vn" style="color:var(--mut)">🗑 已停售・不需採購（'+exN+'）</span><span class="vl"></span><span class="why" data-toggleexcl="1">'+(ST.showExcl?"收合 ▲":"展開 ▾")+'</span></div>';
    if(ST.showExcl){html+='<div class="card excl" style="padding:4px 12px">';exclItems(store).forEach(function(s){html+='<div class="row"><div class="nm"><span class="badge b-'+s.cat+'">'+s.cat+'</span><b>'+s.name+'</b><div class="sub">'+periodLabel()+' '+dec(periodWeekly(store,s)/s.packQty)+' '+s.buyUnit+' → 已停售</div></div><div class="sug"><div class="big zero">—</div></div></div>';});html+='</div>';}}
  return html;}
function suggestRow(s,r){var store=ST.storeId,z=r.packs<=0,dur=isDur(s),iv=ivOf(store,s),up=statusOf(store,s)==="即將上市";
  var big=dur?r.suggested:r.packs,unit=dur?s.useUnit:s.buyUnit;
  var usageTxt=dur?('標配 '+fmt(parOf(store,s))):(up?'新品（無歷史）':(isManual(store,s)?('手動週用量 '+dec(manualOf(store,s))+' '+s.useUnit):(periodLabel()+' '+dec(periodWeekly(store,s)/s.packQty)+' '+s.buyUnit)));
  var upTag=up?(function(){var u=upInfo(store,s);return '<span class="tagnew">🆕 '+(u?u.days+'天後上市':'即將上市')+'</span>';})():'';
  var h='<div class="row"><div class="nm"><span class="badge b-'+s.cat+'">'+s.cat+'</span><b>'+dispName(store,s)+'</b>'+newBadge(store,s)+upTag+'<div class="sub">現有 '+dec(num(iv.onHand))+' '+(dur?s.useUnit:s.buyUnit)+''+invTag(store,s)+'　·　'+usageTxt+'</div></div>'
    +'<div class="sug"><div class="big'+(z?' zero':'')+'">'+(z?'—':big)+'</div><div class="u">'+(z?'庫存足':('建議 '+unit))+'</div><div class="why" data-why="'+s.id+'">'+(ST.exp[s.id]?'收合 ▲':'為什麼 ▾')+'</div></div></div>';
  if(ST.exp[s.id])h+=reasonBox(s,r,up);return h;}
function reasonBox(s,r,up){var b=r.basis,pq=s.packQty;
  if(b.mode==="par")return '<div class="reason"><b>'+s.name+'</b>（補到標配）<br>標配數量 <b>'+fmt(b.par)+'</b> − 現有 '+fmt(b.onHand)+(b.breakage?' ＋破損 '+fmt(b.breakage):'')+' = 建議補 <b>'+fmt(r.suggested)+' '+s.useUnit+'</b></div>';
  var adj=up?1:demandAdj(ST.storeId,s).adj,raw=adj?(b.forecastWeekly/adj):b.forecastWeekly;
  var bline=(b.booking>0)?('<br>＋ 未來14天預約/包館需求 <b>'+dec(b.booking/pq)+' '+s.buyUnit+'</b>'):'';

function viewOverview(){var rowsByStore=STORES.map(function(st){var need=liveItems(st.id).map(function(s){return {s:s,r:rowFor(st.id,s)};}).filter(function(x){return x.r.packs>0;});return {st:st,need:need.length,val:need.reduce(function(a,x){return a+x.r.packs*x.s.price;},0)};});
  var maxv=Math.max.apply(null,rowsByStore.map(function(r){return r.val;}).concat([1])),totV=rowsByStore.reduce(function(a,r){return a+r.val;},0);
  var html='<div class="summary"><div class="stat"><div class="n">$'+fmt(totV)+'</div><div class="l">本週全店預估採購</div></div><div class="stat"><div class="n">'+STORES.length+'</div><div class="l">門市</div></div></div><div class="card"><div class="muted" style="margin-bottom:6px">各店預估採購金額</div>';
  rowsByStore.forEach(function(r){html+='<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><b>'+r.st.name+'</b><span>$'+fmt(r.val)+'　·　'+r.need+' 項</span></div><div class="barbg" style="margin-top:4px"><div class="bar" style="width:'+(r.val/maxv*100)+'%"></div></div></div>';});
  var ovr=[];Object.keys(PARAM).sort(function(a,b){return (+a)-(+b);}).forEach(function(st){var g=PARAM[st],n=0,ex=[];
    Object.keys(g).forEach(function(id){var pp=g[id];if(pp.custName||pp.custVendor){n++;if(ex.length<3){var sk=SKU[id];ex.push((sk?sk.name:id)+(pp.custVendor?'→'+pp.custVendor:''));}}});
    if(n)ovr.push({st:st,n:n,ex:ex});});
  if(ovr.length){html+='<div class="card"><div class="muted" style="margin-bottom:6px">🏷️ 店別覆寫（品名/廠商，主檔以外的在地設定）</div>'+ovr.map(function(o){return '<div style="font-size:13px;margin:4px 0"><b>'+storeName(o.st)+'</b>：'+o.n+' 項（'+o.ex.join('、')+(o.n>3?'…':'')+'）</div>';}).join('')+'</div>';}
  html+='</div>';return html;}

/* ===== 元件 ===== */
function inN(sc,id,f,v,w){return '<input class="sm" style="width:'+(w||56)+'px" type="number" step="0.1" data-'+sc+'="'+id+'" data-f="'+f+'" value="'+v+'">';}
function inT(sc,id,f,v,w){return '<input class="tx" style="width:'+(w||80)+'px" type="text" data-'+sc+'="'+id+'" data-f="'+f+'" value="'+v+'">';}

/* ===== 事件 ===== */
var EDIT={}; // 暫存店別參數編輯
function wire(){
  Array.prototype.forEach.call(document.querySelectorAll(".chip"),function(el){el.onclick=function(){ST.cat=el.dataset.cat;render();};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-period]"),function(el){el.onclick=function(){ST.period=el.dataset.period;render();};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-need]"),function(el){el.onclick=function(){ST.needOnly=el.dataset.need==="1";render();};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-invf]"),function(el){el.onclick=function(){ST.invFilter=el.dataset.invf;render();};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-qmode]"),function(el){el.onclick=function(){ST.qmode=el.dataset.qmode;render();};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-qperiod]"),function(el){el.onclick=function(){ST.qperiod=el.dataset.qperiod;render();};});
  var cs=$("#cmpSku");if(cs)cs.onchange=function(){ST.cmpSku=cs.value;};
  var cf=$("#cmpFrom");if(cf)cf.onchange=function(){ST.cmpFrom=cf.value;};
  var ct=$("#cmpTo");if(ct)ct.onchange=function(){ST.cmpTo=ct.value;};
  var cr=$("#cmpRun");if(cr)cr.onclick=runCompare;
  var tf=$("#totFrom");if(tf)tf.onchange=function(){ST.totFrom=tf.value;};
  var tt=$("#totTo");if(tt)tt.onchange=function(){ST.totTo=tt.value;};
  var tr=$("#totRun");if(tr)tr.onclick=runRank;
  Array.prototype.forEach.call(document.querySelectorAll('[data-totscope]'),function(el){el.onclick=function(){ST.totScope=el.dataset.totscope;render();};});
  Array.prototype.forEach.call(document.querySelectorAll('[data-totcat]'),function(el){el.onclick=function(){ST.totCat=el.dataset.totcat;render();};});
  var tq2=$("#totQ");if(tq2){tq2.oninput=function(){ST.totQ=tq2.value;ST.totQF=true;render();};if(ST.totQF){tq2.focus();var L2=tq2.value.length;try{tq2.setSelectionRange(L2,L2);}catch(e){}ST.totQF=false;}}
  var ta=$("#totAll");if(ta)ta.onclick=function(){ST.totAll=true;render();};
  var psr=$("#psRun");if(psr)psr.onclick=runPeriod;
  var sqx=$("#salesQ");if(sqx){sqx.oninput=function(){ST.salesQ=sqx.value;ST.salesQF=true;render();};if(ST.salesQF){sqx.focus();var Ls=sqx.value.length;try{sqx.setSelectionRange(Ls,Ls);}catch(e){}ST.salesQF=false;}}
  var sal=$("#salesAll");if(sal)sal.onclick=function(){ST.salesAll=true;render();};
  var pk=$("#pickSku");if(pk)pk.onchange=function(){ST.totSku=pk.value;if(pk.value)runTotal(pk.value);else render();};
  Array.prototype.forEach.call(document.querySelectorAll('[data-drill]'),function(el){el.onclick=function(){ST.totSku=el.dataset.drill;runTotal(el.dataset.drill);};});
  var qb=$("#qbox");if(qb){qb.oninput=function(){ST.q=qb.value;ST.qFocus=true;render();};if(ST.qFocus){qb.focus();var L=qb.value.length;try{qb.setSelectionRange(L,L);}catch(e){}ST.qFocus=false;}}
  var ba=$("#bkAdd");if(ba)ba.onclick=function(){var d=$("#bkDate").value,ds=$("#bkDessert").value,q=+$("#bkQty").value,no=$("#bkNote").value||"";
    if(!d||!ds||!(q>0)){toast("請填日期、甜點、數量");return;}
    var id="BK"+Date.now();
    post({type:"booking",id:id,store:ST.storeId,date:d,dessert:ds,qty:q,note:no});
    BOOKINGS.push({id:id,store:String(ST.storeId),date:d,dessert:ds,qty:q,note:no,status:""});
    toast("已登記，建議量每日重算後生效");render();};
  Array.prototype.forEach.call(document.querySelectorAll("[data-bkdel]"),function(el){el.onclick=function(){var id=el.dataset.bkdel;
    post({type:"bookingDel",id:id});BOOKINGS.forEach(function(b){if(b.id===id)b.status="取消";});toast("已取消預約");render();};});
  Array.prototype.forEach.call(document.querySelectorAll(".why[data-why]"),function(el){el.onclick=function(){ST.exp[el.dataset.why]=!ST.exp[el.dataset.why];render();};});
  var tg=$('[data-toggleexcl]');if(tg)tg.onclick=function(){ST.showExcl=!ST.showExcl;render();};
  Array.prototype.forEach.call(document.querySelectorAll('[data-smode]'),function(el){el.onclick=function(){ST.seasonMode=el.dataset.smode;ST.season=(ST.seasonMode!=='關');render();};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-inv]"),function(el){el.onchange=function(){var id=el.dataset.inv,f=el.dataset.f;INV[ST.storeId]=INV[ST.storeId]||{};INV[ST.storeId][id]=INV[ST.storeId][id]||{};INV[ST.storeId][id][f]=el.value===""?null:+el.value;DIRTY[ST.storeId]=DIRTY[ST.storeId]||{};DIRTY[ST.storeId][id]=true;if(ST.tab==="盤點")render();};});
  var sc=$("#saveCount");if(sc)sc.onclick=function(){var store=ST.storeId,iv=INV[store]||{},dirty=DIRTY[store]||{},ids=Object.keys(dirty);
    if(!ids.length){toast("沒有變更的盤點");return;}
    sc.disabled=true;var done=0;toast("送出中… 0/"+ids.length);
    (function chunk(i){ if(i>=ids.length){DIRTY[store]={};sc.disabled=false;toast("已送出 "+ids.length+" 筆盤點");ST.tab="建議";render();return;}
      var batch=ids.slice(i,i+5);
      Promise.all(batch.map(function(id){return post({type:"inv",store:store,sku_id:id,onHand:iv[id]?iv[id].onHand:null,breakage:iv[id]?iv[id].breakage:null,user:ST.role},true);})).then(function(){done+=batch.length;toast("送出中… "+done+"/"+ids.length);chunk(i+5);});
    })(0);};
  // 店別參數
  Array.prototype.forEach.call(document.querySelectorAll("[data-p]"),function(el){el.onchange=function(){var id=el.dataset.p,f=el.dataset.f;var isTxt=(f==="zone"||f==="custName"||f==="custVendor");var v=isTxt?el.value:(el.value===""?"":+el.value);EDIT[id]=EDIT[id]||{};EDIT[id][f]=v;PARAM[ST.storeId]=PARAM[ST.storeId]||{};PARAM[ST.storeId][id]=PARAM[ST.storeId][id]||{};PARAM[ST.storeId][id][f]=(v===""?null:v);};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-puse]"),function(el){el.onchange=function(){var id=el.dataset.puse;EDIT[id]=EDIT[id]||{};EDIT[id]["使用中"]=el.checked?"TRUE":"FALSE";PARAM[ST.storeId]=PARAM[ST.storeId]||{};PARAM[ST.storeId][id]=PARAM[ST.storeId][id]||{};PARAM[ST.storeId][id].used=el.checked;};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-psave]"),function(el){el.onclick=function(){var id=el.dataset.psave,e=EDIT[id]||{};var fields={};if("zone"in e)fields["盤點分區"]=e.zone;if("ord"in e)fields["盤點順序"]=e.ord;if("par"in e)fields["標配數量"]=e.par;if("weight"in e)fields["權數"]=e.weight;if("leadDays"in e)fields["交期天"]=e.leadDays;if("manualWeekly"in e)fields["手動週用量"]=e.manualWeekly;if("safety"in e)fields["安全庫存"]=e.safety;if("使用中"in e)fields["使用中"]=e["使用中"];if("custName"in e)fields["店品名"]=e.custName;if("custVendor"in e)fields["店廠商"]=e.custVendor;post({type:"param",store:ST.storeId,sku_id:id,fields:fields});var pp=(PARAM[ST.storeId]=PARAM[ST.storeId]||{});pp[id]=pp[id]||{};if("custName"in e)pp[id].custName=String(e.custName||"").trim();if("custVendor"in e)pp[id].custVendor=String(e.custVendor||"").trim();};});
  // 季節
  Array.prototype.forEach.call(document.querySelectorAll("[data-si]"),function(el){el.onchange=function(){SIDX[+el.dataset.si]=+el.value;};});
  var ss=$("#saveSeason");if(ss)ss.onclick=function(){for(var m=1;m<=12;m++)post({type:"season",month:m,idx:SIDX[m]});var lo=$("#sfLow"),hi=$("#sfHigh");if(lo&&+lo.value>0){SFACT.low=+lo.value;post({type:"season",month:"淡季係數",idx:SFACT.low});}if(hi&&+hi.value>0){SFACT.high=+hi.value;post({type:"season",month:"旺季係數",idx:SFACT.high});}toast("已送出季節指數與淡旺季係數");};
  // 單位對照
  Array.prototype.forEach.call(document.querySelectorAll("[data-cvi]"),function(el){el.onchange=function(){var u=UNITCONV[+el.dataset.cvi];u.amt=+el.value;u._dirty=1;};});
  var sc=$("#saveConv");if(sc)sc.onclick=function(){var n=0;UNITCONV.forEach(function(u){if(u._dirty){post({type:"conv",item:u.item,unit:u.unit,base:u.base,amt:u.amt},true);delete u._dirty;n++;}});
    var it=($("#cvItem").value||"").trim(),un=($("#cvUnit").value||"").trim(),am=+$("#cvAmt").value,ba=($("#cvBase").value||"g").trim();
    if(it&&un&&am>0){post({type:"conv",item:it,unit:un,base:ba,amt:am},true);UNITCONV.push({item:it,unit:un,base:ba,amt:am});n++;}
    toast(n?("已送出 "+n+" 筆換算"):"沒有變更");render();};
  // 訂貨單
  Array.prototype.forEach.call(document.querySelectorAll("[data-off]"),function(el){el.onchange=function(){ST.orderOff[el.dataset.off]=!el.checked;render();};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-oq]"),function(el){el.onchange=function(){ST.orderEdit[el.dataset.oq]=+el.value;render();};});
  var cp=$("#copyOrder");if(cp)cp.onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(orderText(ST.storeId));
    var st=ST.storeId,items=liveItems(st).map(function(s){return {s:s,r:rowFor(st,s)};})
      .filter(function(x){return x.r.packs>0&&!ST.orderOff[x.s.id]&&!isDur(x.s);})
      .map(function(x){return {sku_id:x.s.id,qty:(ST.orderEdit[x.s.id]!=null?ST.orderEdit[x.s.id]:x.r.packs)};})
      .filter(function(it){return it.qty>0;});
    if(items.length){post({type:"order",store:st,items:items},true);
      var nowT=Date.now();items.forEach(function(it){ORDERS.push({sku_id:it.sku_id,qty:it.qty,t:nowT});});}
    toast("已複製，並記錄訂貨（供推估現有）");};
}

/* ===== 啟動 ===== */
$("#roleSel").onchange=function(){ST.role=this.value;ST.exp={};render();};
$("#storeSel").onchange=function(){ST.storeId=this.value;ST.exp={};ST.orderEdit={};ST.orderOff={};render();loadStoreFlow(ST.storeId).then(function(){render();});};
if(typeof window!=="undefined"&&!window.__TEST__) bootstrap();
</script>
</body>
</html>
