services:
  - type: web
    name: diybc-training
    runtime: python
    plan: starter
    # 2026-11-09：裝無頭瀏覽器（每天 06:05 伺服器自己登入 104 讀班表；瀏覽器放專案資料夾才會跟著部署）
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: python3 server.py
    # 2026-11-08：儀表板網頁改由 diybc-dash 靜態網站提供，只改儀表板網頁時本伺服器不重開。
    # 只有下列後端相關檔案有改動時才自動重新部署（訓練站自己的網頁 index／app.js／styles.css 等也在內）。
    buildFilter:
      paths:
        - "*.py"
        - tools/sync104/*.py        # 雲端每天登入 104 用的程式（fetch104／push），改了要重開才會生效
        - tools/sync104/extract.js
        - requirements.txt
        - render.yaml
        - training_content.json
        - schedule_rules.md
        - data/**
        - static/index.html
        - static/app.js
        - static/styles.css
        - static/dashboard.html
        - static/dashboard.js
        - static/dashboard.css
        - static/self-dashboard.html
        - static/self-dashboard.js
        - static/self-dashboard.css
        - static/dash-handoff.html
    disk:
      name: training-data
      mountPath: /var/data/employee-training
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: TRAINING_DATA_DIR
        value: /var/data/employee-training
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.playwright
      - key: OPENAI_API_KEY
        sync: false
      # 儀表板靜態網站網址：設了才把舊網址轉到新網站（經交接頁帶過瀏覽器記憶）；拿掉這兩行（或值留空）就恢復由本伺服器提供儀表板。
      - key: DASH_ORIGIN
        value: https://diybc-dash.onrender.com

  # 2026-11-08：儀表板靜態網站。換版時舊版持續服務、新版好了才切換，不會停。
  - type: web
    name: diybc-dash
    runtime: static
    buildCommand: bash tools/build_dash_site.sh
    staticPublishPath: ./_site
    buildFilter:
      paths:
        - static/**
        - tools/build_dash_site.sh
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: redirect
        source: /
        destination: /static/hub.html
      - type: redirect
        source: /r
        destination: /static/tablet-recipe.html
      - type: redirect
        source: /pnl
        destination: /static/dashboard-pnl.html
      - type: redirect
        source: /google-reviews
        destination: /static/google-reviews.html
      - type: rewrite
        source: /api/*
        destination: https://diybc-training.onrender.com/api/*
